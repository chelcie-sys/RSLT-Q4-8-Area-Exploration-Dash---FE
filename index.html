y.com/safety-quality/pet-food-regulations/article/15749196/31-laws-and-rules-for-pet-food-production-in-europe", "url": "https://www.petfoodindustry.com/safety-quality/pet-food-regulations/article/15749196/31-laws-and-rules-for-pet-food-production-in-europe"}, {"n": 46, "text": "FEDIAF publishes 2025 Facts and Figures, FEDIAF, 12 Jun 2025, https://europeanpetfood.org/_/news/fediaf-publishes-2025-facts-and-figures/", "url": "https://europeanpetfood.org/_/news/fediaf-publishes-2025-facts-and-figures/"}, {"n": 47, "text": "FEDIAF: Thriving pet ownership fuels $33.7 billion European pet food industry, Petfood Processing, 20 Jun 2025, https://www.petfoodprocessing.net/articles/19391-fediaf-thriving-pet-ownership-fuels-337-billion-european-pet-food-industry", "url": "https://www.petfoodprocessing.net/articles/19391-fediaf-thriving-pet-ownership-fuels-337-billion-european-pet-food-industry"}, {"n": 48, "text": "Advance Veterinary Diets Articular Care (Affinity Petcare), zooplus, accessed 1 Oct 2026, https://www.zooplus.com/shop/dogs/dry_dog_food/advance_vet_diets/1583029", "url": "https://www.zooplus.com/shop/dogs/dry_dog_food/advance_vet_diets/1583029"}, {"n": 49, "text": "Eckert et al., Efficacy of Chondroprotective Food Supplements Based on Collagen Hydrolysate and Compounds Isolated from Marine Organisms (52 dogs), DOAJ record, https://doaj.org/article/d549ced133a64ebd91a0bdeda3e263e3 (used as background only: journal and funding not retrievable)", "url": "https://doaj.org/article/d549ced133a64ebd91a0bdeda3e263e3"}, {"n": 50, "text": "Darling Ingredients expanding collagen peptide production in Belgium, Brazil, Petfood Processing, 21 Jul 2020, https://www.petfoodprocessing.net/articles/13995-darling-ingredients-expanding-collagen-peptide-production-in-belgium-brazil", "url": "https://www.petfoodprocessing.net/articles/13995-darling-ingredients-expanding-collagen-peptide-production-in-belgium-brazil"}]}, {"code": "R6", "engine": "Add more", "engine_long": "Build what pays tomorrow", "extras": [], "internal": "<ol>\n<li>Praneeth's sizing: Nextida GC volumes and customer list (Pura, Byon, others), and Peptan sales by channel, to test whether the A1 seal has any non-customer market. Holder: Praneeth, commercial finance.<\/li>\n<li>Nextida GC regulatory file: has an Article 13(5) or FDA notification ever been scoped, and what did it cost? Holder: Catarina Ferreira da Silva (Science Integration) and regulatory affairs.<\/li>\n<li>Darling corporate development: does the Tessenderlo joint venture perimeter permit a consumer acquisition or minority stake, and who signs it off? Holder: Jeroen Colpaert and Darling M&amp;A.<\/li>\n<li>Saige: what consumer data it already captures and whether it could host a measurement loop; this is an internal Rousselot asset and was not researched externally. Holder: Elke and the Saige team.<\/li>\n<li>Matt's work on brand licensing: whether any Peptan on-pack logo agreements exist and what they charge, since no public programme was found. Holder: Matt, marketing.<\/li>\n<li>Category data: Rousselot's SPINS, Circana or Euromonitor subscriptions for collagen consumer sales 2024 to 2026 and GLP-1 user purchase shifts; none could be opened in this scan. Holder: market intelligence.<\/li>\n<li>Elien Gevaert's account of the Peptan acquisition and what Rousselot learned about owning a brand name. Holder: Elien Gevaert.<\/li>\n<\/ol>", "name": "Owning the outcome and the consumer", "oneLine": "<p>This area asks two questions that the prior portfolio (A1 GC Outcomes, D1 longevity subscription, X3 outcome verification, D2 formulation studio) tended to blur: should Rousselot own a consumer relationship, and should Rousselot own the proof that an outcome happened. The scan finds that owning the proof is the better-evidenced and cheaper threshold to cross: ingredient makers already run paid trust marks (Kaneka, Lonza via SGS, Gelita licensing), regulators on both sides of the Atlantic now demand product-level human trials, and at-home biomarker testing has become a mass consumer product. Owning a consumer brand, by contrast, is being priced at 4 to 8 times revenue by strategics, and the one ingredient maker that built its own brand organically (ChromaDex, now Niagen Bioscience) only passed USD 100m of consumer sales in 2025.<\/p>", "options": [], "order": 6, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Three shifts matter. First, consumer-facing proof has moved from \"third-party tested\" (purity, banned substances) toward \"measured outcome\" (a biomarker or an image). Function Health had run more than 50 million lab tests since 2023 by November 2025 and raised USD 298m at a USD 2.5bn valuation <a class=\"cite\" href=\"https://techcrunch.com/2025/11/19/function-health-closes-298m-series-b-at-a-2-5b-valuation-launches-medical-intelligence/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a>; SiPhox launched a USD 199 at-home panel for GLP-1 users on 3 June 2026 <a class=\"cite\" href=\"https://www.ycombinator.com/launches/Qel-siphox-health-glp-monitoring\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>; Tally Health bundles a cheek-swab epigenetic age test with monthly supplements and tells prospects that \"over 62% of Tally Health members lowered their epigenetic age by an average of 2+ years\" within 12 months <a class=\"cite\" href=\"https://www.tallyhealth.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>. Second, ingredient suppliers are formalising seals: Kaneka's \"Ubiquinol Verified Program\" with Eurofins QKEN (September 2025) gives passing products a sticker with a unique ID linking to published results, valid two years <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>; Lonza's UC-II took SGS Nutrasource's \"NutraStrong Collagen Verified\" mark in September 2025 <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/lonza-s-uc-ii-collagen-earns-nutrastrong-certification-backed-by-clinical-evidence-on-knee-flexibility\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>; Lancôme launched a co-branded \"Mitopure by Timeline\" range in February 2026 <a class=\"cite\" href=\"https://www.timeline.com/blog/timeline-s-mitopure-r-technology-is-launching-globally\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>. Third, strategics buy rather than build: Unilever bought Grüns (founded August 2023) for a reported USD 1.2bn in April 2026 <a class=\"cite\" href=\"https://www.unilever.com/news/press-and-media/press-releases/2026/unilever-to-acquire-us-greens-supplement-company-gruns/\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.forbes.com/sites/chloesorvino/2026/04/10/with-a-12-billion-sale-to-unilever-grns-founder-mints-a-fortune/\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>, and P&amp;G agreed to buy Thorne for USD 3.8bn in August 2026, under three years after L Catterton paid USD 680m <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2023/09/05/Thorne-HealthTech-acquired-by-L-Catterton-for-680M/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/procter-gamble-to-acquire-thorne-f3-8-billion\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://www.jonesday.com/en/practices/experience/2026/08/the-procter-amp-gamble-company-acquires-thorne-from-l-catterton-for-38-billion\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>.<\/p>\n<p>Against this, collagen's headline beauty claim is under public attack. A Tufts dermatologist told ScienceDaily on 29 January 2026 that \"Oral collagen supplements are not currently recommended to treat skin aging\", citing a meta-analysis of 23 RCTs in which industry-funded trials were positive and independent ones were not <a class=\"cite\" href=\"https://www.sciencedaily.com/releases/2026/01/260129080443.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>. Nestlé Health Science, owner of Vital Proteins, reported 2025 sales of CHF 6.551bn, down 2.8% reported, and is being folded into a Nutrition business from 28 February 2026 <a class=\"cite\" href=\"https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a>; Unilever said Wellbeing \"continued to outperform its market, despite growth moderating as category conditions softened\" <a class=\"cite\" href=\"https://www.unilever.com/files/ir-q4-2025-full-announcement.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<p>No reliable public figure was found for the collagen consumer category (SPINS, Circana and NielsenIQ releases could not be opened; see Internal inputs). Verifiable anchors: Darling's Food Ingredients segment, principally Rousselot and Gelnex collagen, reported net sales of USD 1,545m in fiscal 2025 (USD 1,489m in 2024) <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a> and USD 408.5m with adjusted EBITDA of USD 108.5m in Q2 2026 (USD 69.9m a year earlier) <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 62\">62<\/a>. Niagen Bioscience (formerly ChromaDex) reported FY2025 net sales of USD 129.4m, of which the consumer brand Tru Niagen was USD 97.7m (+27%) and ingredient sales USD 27.9m (+45%) <a class=\"cite\" href=\"https://www.stocktitan.net/news/NAGE/niagen-bioscience-reports-30-year-over-year-net-sales-increase-to-84tajp7eyahp.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. Deal anchors: Thorne, revenue above USD 500m in 2025, sold for USD 3.8bn (roughly 7.6 times) <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/procter-gamble-to-acquire-thorne-f3-8-billion\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>; Grüns at an estimated 4 times trailing revenue on a USD 300m+ run rate <a class=\"cite\" href=\"https://www.forbes.com/sites/chloesorvino/2026/04/10/with-a-12-billion-sale-to-unilever-grns-founder-mints-a-fortune/\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; Zesty Paws for USD 610m on \"over USD 100 million\" of revenue in 2021 <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/maxim-partners-sells-zesty-paws-301366980.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; AG1 around USD 600m revenue in 2024 at a USD 1.2bn valuation (secondary, low trust) <a class=\"cite\" href=\"https://en.wikipedia.org/wiki/AG1_(company\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>; Function Health near a USD 100m run rate on a USD 499 membership (Sacra estimate, low trust) <a class=\"cite\" href=\"https://sacra.com/c/function-health/\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>.<\/p>", "title": "Size and growth"}, {"full": "Players", "html": "<p>Ingredient seals: Gelita offers a \"VERISOL trademark license agreement\" <a class=\"cite\" href=\"https://www.gelita.com/en/products-brands/collagen-peptides/verisolr\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>; BioCell has required its logo on pack since at least 2009 <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/benefits-co-branding\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; Kaneka lists ten \"trusted brands\" that must contain its ubiquinol, pass independent potency testing and meet GMP <a class=\"cite\" href=\"https://ubiquinol.org/kaneka-seal\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>; Lonza UC-II cites 20+ studies, 11 human <a class=\"cite\" href=\"https://www.capsugel.com/news/capsugel-celebrates-uc-ii-25-years\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>; Nitta Gelatin's Wellnex carries a consumer-facing \"Replenwell\" mark but sells only B2B <a class=\"cite\" href=\"https://wellnex-collagen.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>. Independent marks: Informed Sport (LGC) tests every batch before release and says LGC tests over 25,000 samples a year for 900+ companies <a class=\"cite\" href=\"https://sport.wetestyoutrust.com/about/certification-process\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a><a class=\"cite\" href=\"https://sport.wetestyoutrust.com/about/frequently-asked-questions\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>; NSF Certified for Sport requires NSF/ANSI 173 plus banned-substance screening and twice-yearly audits <a class=\"cite\" href=\"https://www.nsf.org/nutrition-wellness/product-and-ingredient-certification\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>, at an industry-quoted USD 15,000 to 50,000+ per product line per year (blog estimate, low trust) <a class=\"cite\" href=\"https://nutraaeon.com/nsf-certified-for-sport-what-every-sports-brand-must-know-before-applying/\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a>; USP Verified has appeared on 700m+ labels <a class=\"cite\" href=\"https://www.usp.org/verification-services/verified-mark\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>; ConsumerLab is funded by 300,000+ subscribers and separately sells certification and a CL Seal licence <a class=\"cite\" href=\"https://www.consumerlab.com/about/\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>; Clean Label Project's January 2025 protein report (47% of 160 powders over Proposition 65 lead thresholds) was attacked by CRN, CHPA and NPA for lack of peer review <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/01/10/clean-label-project-releases-controversial-protein-powder-report/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. Verification infrastructure: Canfield VISIA-CR for skin imaging <a class=\"cite\" href=\"https://www.canfieldsci.com/imaging-systems/visia-cr/\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>; Haut.AI, selling skin-analysis APIs to Beiersdorf, Givaudan and Evonik <a class=\"cite\" href=\"https://haut.ai/\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>; Function, SiPhox, Hone (USD 65 entry test, USD 25 or 155 monthly tiers) and Viome (USD 279 to 399 tests plus supplement subscription) selling biomarker loops direct to consumers <a class=\"cite\" href=\"https://techcrunch.com/2025/11/19/function-health-closes-298m-series-b-at-a-2-5b-valuation-launches-medical-intelligence/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><a class=\"cite\" href=\"https://www.ycombinator.com/launches/Qel-siphox-health-glp-monitoring\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://www.honehealth.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><a class=\"cite\" href=\"https://www.viome.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. Longevity brands: Timeline (25 human trials, Nestlé and L'Oréal investors) <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2024/01/19/Timeline-raises-CHF-56M-from-L-Oreal-and-Nestle/\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><a class=\"cite\" href=\"https://www.timeline.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>, Elysium <a class=\"cite\" href=\"https://www.elysiumhealth.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>, Novos (USD 349 biological age kit) <a class=\"cite\" href=\"https://www.novoslabs.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>, Tally <a class=\"cite\" href=\"https://www.tallyhealth.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>, Momentous (collagen USD 54.99, 25% off on subscription) <a class=\"cite\" href=\"https://www.livemomentous.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>, and Avea Life, whose \"Collagen Activator\" (a 3:1:1 glycine, proline, hydroxyproline composition) was reported in npj Aging on 20 November 2025 to cut epigenetic age by 1.4 years in 45 completers over six months, in an observational trial <a class=\"cite\" href=\"https://www.nature.com/articles/s41514-025-00280-7\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/11/26/collagen-activator-supplement-improves-skin-features-and-reduces-biological-age/\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a>. Rousselot's own position: Nextida GC, launched May 2024 <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/rousselot-launches-nextida-a-collagen-peptide-platform-for-targeted-health-benefits\" target=\"_blank\" rel=\"noopener\" title=\"Source 59\">59<\/a>, a 16-person crossover trial showing a 42% average reduction in post-meal glucose spike <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 58\">58<\/a>, a US patent granted 3 June 2026 <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260602-darling-ingredients-health-brand-rousselot-receives-us-patent-for-nextida-gc\" target=\"_blank\" rel=\"noopener\" title=\"Source 60\">60<\/a>, and at least one UK retail product, Pura Collagen's GLPure+ at GBP 50 with 5,000 mg Nextida GC per sachet <a class=\"cite\" href=\"https://puracollagen.co.uk/\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>.<\/p>", "title": "Players"}, {"full": "Regulation", "html": "<p>EU: Regulation (EC) 1924/2006 routes proprietary-data claims through Article 13(5) and disease-risk claims through Article 14, with an EFSA opinion due within five months and five-year data protection under Article 21 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02006R1924-20141213\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a>. EFSA rejected Gelita's collagen hydrolysate joint claim in 2011 (\"a cause and effect relationship has not been established\") <a class=\"cite\" href=\"https://www.efsa.europa.eu/en/efsajournal/pub/2291\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a> and in 2013 held that wrinkle reduction and elasticity are not health functions <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/skin-elasticity-wrinkle-reduction-are-not-health-claims-efsa-says\" target=\"_blank\" rel=\"noopener\" title=\"Source 49\">49<\/a>, so collagen beauty marketing in Europe rests on cosmetic-style claims. UK: the ASA upheld complaints against Dermacoll (2019) and Kollo Health (22 November 2023), in the latter rejecting five Naticol supplier studies as too small and unrepresentative <a class=\"cite\" href=\"https://www.asa.org.uk/rulings/kollo-health-ltd-a23-1196136-kollo-health-ltd.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2023/12/18/misleading-claims-lead-to-asa-ruling-against-kollo-health-collagen/\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a><a class=\"cite\" href=\"https://aestheticsjournal.com/news/asa-rules-on-collagen-skincare-supplement-brand/\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a>. US: the FTC's Health Products Compliance Guidance (20 December 2022) expects \"randomized, controlled human clinical testing\" <a class=\"cite\" href=\"https://www.mcdermottlaw.com/insights/after-almost-25-years-ftc-issues-new-health-products-compliance-guidance/\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a>; NAD told Vital Proteins in January 2020 that \"Product performance claims must be supported by reliable testing conducted on the product itself\" <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/national-advertising-division-recommends-discontinuation-of-product-performance-and-health-related-on-the-go-claims-for-vital-proteins-collagen-peptide-single-use-dietary-supplement-stick-packs-300992264.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a>; NAD's 2025 decisions (including Amazentis's Mitopure) held that imagery is part of the claim and named \"beauty-from-within ingestibles\" a 2026 monitoring priority <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/11/25/what-stakeholders-can-learn-from-nads-national-2025-dietary-supplement-case-decisions/\" target=\"_blank\" rel=\"noopener\" title=\"Source 56\">56<\/a><a class=\"cite\" href=\"https://www.supplysidesj.com/branding-marketing/supplement-claims-lessons-national-advertising-division-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 57\">57<\/a>.<\/p>", "title": "Regulation"}, {"full": "Signals", "html": "<ol>\n<li>10 December 2025: Darling and Tessenderlo agree to pool their collagen and gelatin businesses into NewCo Collagen LLC, 85% Darling, 15% Tessenderlo, subject to approvals <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a>.<\/li>\n<li>20 November 2025: npj Aging publishes the Avea Life collagen-composition study claiming a 1.4-year epigenetic age reduction <a class=\"cite\" href=\"https://www.nature.com/articles/s41514-025-00280-7\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a>.<\/li>\n<li>15 September 2025: Kaneka launches Ubiquinol Verified with Eurofins, the first ingredient-maker seal with public per-product results <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>.<\/li>\n<li>19 November 2025: Function Health raises USD 298m at USD 2.5bn <a class=\"cite\" href=\"https://techcrunch.com/2025/11/19/function-health-closes-298m-series-b-at-a-2-5b-valuation-launches-medical-intelligence/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a>.<\/li>\n<li>19 February 2026: Lancôme announces \"Mitopure by Timeline\" co-branded skincare <a class=\"cite\" href=\"https://www.timeline.com/blog/timeline-s-mitopure-r-technology-is-launching-globally\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>.<\/li>\n<li>10 April 2026: Unilever buys Grüns for a reported USD 1.2bn, about 4 times revenue <a class=\"cite\" href=\"https://www.forbes.com/sites/chloesorvino/2026/04/10/with-a-12-billion-sale-to-unilever-grns-founder-mints-a-fortune/\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>.<\/li>\n<li>3 June 2026: SiPhox launches a USD 199 GLP-1 monitoring panel; same day Darling announces the Nextida GC US patent <a class=\"cite\" href=\"https://www.ycombinator.com/launches/Qel-siphox-health-glp-monitoring\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260602-darling-ingredients-health-brand-rousselot-receives-us-patent-for-nextida-gc\" target=\"_blank\" rel=\"noopener\" title=\"Source 60\">60<\/a>.<\/li>\n<li>4 August 2026: P&amp;G agrees to buy Thorne for USD 3.8bn <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/procter-gamble-to-acquire-thorne-f3-8-billion\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>.<\/li>\n<\/ol>", "title": "Signals"}], "soWhat": {"forRousselot": "Decide two questions separately and in order: first whether to own the proof, then whether to own the consumer. Nextida GC, with its patented glucose result, is where both meet.", "forRousselotLinks": [{"anchor": "r6-s5", "go": "r6", "label": "Space 5: Formulation studio for young indie brands"}, {"anchor": "r6-scan-3", "go": "r6", "label": "Scan: Players"}, {"label": "[58] foodingredientsfirst.com", "title": "SupplySide West 2024 live: Rousselot's Nextida GC lowers post-meal glucose spikes, Food Ingredients First, 31 October 2024, https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html", "url": "https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html"}, {"label": "[59] nutritionaloutlook.com", "title": "Rousselot launches Nextida, a collagen peptide platform for targeted health benefits, Nutritional Outlook, 14 May 2024, https://www.nutritionaloutlook.com/view/rousselot-launches-nextida-a-collagen-peptide-platform-for-targeted-health-benefits", "url": "https://www.nutritionaloutlook.com/view/rousselot-launches-nextida-a-collagen-peptide-platform-for-targeted-health-benefits"}], "headline": "Owning the proof of outcomes looks cheaper and better evidenced than owning a consumer brand, which strategics price at 4 to 8 times revenue.", "next": "Compare SGS Nutrasource's collagen seal criteria with the Nextida GC dossier, and price an evidence licence to two non-customer brands.", "nextLinks": [{"anchor": "r6-s1", "go": "r6", "label": "Space 1: Collagen proof and seal sold across brands"}], "takeaways": [{"links": [{"anchor": "r6-s1", "go": "r6", "label": "Space 1: Collagen proof and seal sold across brands"}, {"anchor": "r6-scan-1", "go": "r6", "label": "Scan: Trends"}, {"label": "[4] ubiquinol.org", "title": "Trusted Brands, Kaneka Ubiquinol, undated, https://ubiquinol.org/kaneka-seal", "url": "https://ubiquinol.org/kaneka-seal"}, {"label": "[5] prnewswire.com", "title": "Protecting the Integrity of Ubiquinol: Launch of \"Ubiquinol Verified Program\", Kaneka Nutrients via PR Newswire, September 2025, https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html", "url": "https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html"}, {"label": "[2] gelita.com", "title": "VERISOL, Gelita, undated, https://www.gelita.com/en/products-brands/collagen-peptides/verisolr", "url": "https://www.gelita.com/en/products-brands/collagen-peptides/verisolr"}, {"label": "[7] nutritionaloutlook.com", "title": "Lonza's UC-II Collagen earns NutraStrong certification, Nutritional Outlook, 12 September 2025, https://www.nutritionaloutlook.com/view/lonza-s-uc-ii-collagen-earns-nutrastrong-certification-backed-by-clinical-evidence-on-knee-flexibility", "url": "https://www.nutritionaloutlook.com/view/lonza-s-uc-ii-collagen-earns-nutrastrong-certification-backed-by-clinical-evidence-on-knee-flexibility"}], "text": "Ingredient makers already sell trust marks: Kaneka with Eurofins, Lonza's UC-II through SGS, Gelita's Verisol licence."}, {"links": [{"anchor": "r6-scan-4", "go": "r6", "label": "Scan: Regulation"}, {"anchor": "r6-s1", "go": "r6", "label": "Space 1: Collagen proof and seal sold across brands"}, {"label": "[54] mcdermottlaw.com", "title": "After Almost 25 Years, FTC Issues New Health Products Compliance Guidance, McDermott Will & Emery, January 2023, https://www.mcdermottlaw.com/insights/after-almost-25-years-ftc-issues-new-health-products-compliance-guidance/", "url": "https://www.mcdermottlaw.com/insights/after-almost-25-years-ftc-issues-new-health-products-compliance-guidance/"}, {"label": "[55] prnewswire.com", "title": "NAD Recommends Discontinuation of \"On The Go\" Claims for Vital Proteins Collagen Peptide Stick Packs, BBB National Programs via PR Newswire, 23 January 2020, https://www.prnewswire.com/news-releases/national-advertising-division-recommends-discontinuation-of-product-performance-and-health-related-on", "url": "https://www.prnewswire.com/news-releases/national-advertising-division-recommends-discontinuation-of-product-performance-and-health-related-on-the-go-claims-for-vital-proteins-collagen-peptide-single-use-dietary-supplement-stick-packs-300992264.html"}, {"label": "[56] nutraingredients.com", "title": "What stakeholders can learn from NAD's 2025 dietary supplement case decisions, NutraIngredients, 25 November 2025, https://www.nutraingredients.com/Article/2025/11/25/what-stakeholders-can-learn-from-nads-national-2025-dietary-supplement-case-decisions/", "url": "https://www.nutraingredients.com/Article/2025/11/25/what-stakeholders-can-learn-from-nads-national-2025-dietary-supplement-case-decisions/"}, {"label": "[57] supplysidesj.com", "title": "5 NAD decisions shape supplement claim standards, SupplySide Supplement Journal, 16 December 2025, https://www.supplysidesj.com/branding-marketing/supplement-claims-lessons-national-advertising-division-decisions", "url": "https://www.supplysidesj.com/branding-marketing/supplement-claims-lessons-national-advertising-division-decisions"}], "text": "Regulators in Europe, the UK and US now expect trials on the product itself, not borrowed ingredient studies."}, {"links": [{"anchor": "r6-s3", "go": "r6", "label": "Space 3: Buying a consumer brand"}, {"anchor": "r6-scan-1", "go": "r6", "label": "Scan: Trends"}, {"label": "[26] nutritionaloutlook.com", "title": "Procter & Gamble to Acquire Thorne for USD 3.8 Billion, Nutritional Outlook, 4 August 2026, https://www.nutritionaloutlook.com/view/procter-gamble-to-acquire-thorne-f3-8-billion", "url": "https://www.nutritionaloutlook.com/view/procter-gamble-to-acquire-thorne-f3-8-billion"}, {"label": "[8] stocktitan.net", "title": "Niagen Bioscience reports 30% year-over-year net sales increase (FY2025), Stock Titan, 4 March 2026, https://www.stocktitan.net/news/NAGE/niagen-bioscience-reports-30-year-over-year-net-sales-increase-to-84tajp7eyahp.html", "url": "https://www.stocktitan.net/news/NAGE/niagen-bioscience-reports-30-year-over-year-net-sales-increase-to-84tajp7eyahp.html"}], "text": "Recent brand moves have been acquisitions rather than builds: P&G is buying Thorne for USD 3.8bn; Niagen's own brand reached USD 97.7m in 2025."}], "watchOut": "Collagen's beauty claim is under public scrutiny: in a meta-analysis of 23 trials, only industry-funded ones were positive.", "watchOutLinks": [{"anchor": "r6-scan-1", "go": "r6", "label": "Scan: Trends"}, {"anchor": "r6-s3", "go": "r6", "label": "Space 3: Buying a consumer brand"}, {"label": "[47] sciencedaily.com", "title": "Dermatologists say collagen supplements aren't the skin fix people expect, ScienceDaily (Tufts University), 29 January 2026, https://www.sciencedaily.com/releases/2026/01/260129080443.htm", "url": "https://www.sciencedaily.com/releases/2026/01/260129080443.htm"}]}, "sourceNote": "", "updatedAt": "2026-10-01", "spaces": [{"area": "R6", "arena": "Beauty and consumer", "cell": "Ingredients to Ecosystems x Beauty and consumer", "fields": {"evidence": "<p>Kaneka's Verified Program and seal (ten listed brands, mandatory independent potency testing, two-year validity) <a class=\"cite\" href=\"https://ubiquinol.org/kaneka-seal\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>; Gelita's Verisol trademark licence <a class=\"cite\" href=\"https://www.gelita.com/en/products-brands/collagen-peptides/verisolr\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>; SGS Nutrasource's NutraStrong Collagen Verified with the Collagen Stewardship Alliance, which shows a third party is already building the collagen category seal Rousselot could have owned <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/lonza-s-uc-ii-collagen-earns-nutrastrong-certification-backed-by-clinical-evidence-on-knee-flexibility\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>; NAD's Vital Proteins ruling and 2025 decisions requiring product-specific trials <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/national-advertising-division-recommends-discontinuation-of-product-performance-and-health-related-on-the-go-claims-for-vital-proteins-collagen-peptide-single-use-dietary-supplement-stick-packs-300992264.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/11/25/what-stakeholders-can-learn-from-nads-national-2025-dietary-supplement-case-decisions/\" target=\"_blank\" rel=\"noopener\" title=\"Source 56\">56<\/a>; the ASA's Kollo ruling rejecting a supplier's own five studies <a class=\"cite\" href=\"https://www.asa.org.uk/rulings/kollo-health-ltd-a23-1196136-kollo-health-ltd.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2023/12/18/misleading-claims-lead-to-asa-ruling-against-kollo-health-collagen/\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a>; ConsumerLab's model of a paid certification plus seal licence <a class=\"cite\" href=\"https://www.consumerlab.com/about/\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>.<\/p>", "first": "<p>Commission a comparison of NutraStrong's criteria against Nextida GC's dossier and ask SGS Nutrasource what a co-developed outcome tier would cost; price a standalone \"evidence licence\" (protocol, dossier, claim wording, audit) to two non-customer brands as the A1 test already specifies.<\/p>", "magnitude": "<p>Not sizeable from public data for a collagen seal. Reference points: NSF-type programmes are quoted at USD 15,000 to 50,000+ per product line per year (low trust) <a class=\"cite\" href=\"https://nutraaeon.com/nsf-certified-for-sport-what-every-sports-brand-must-know-before-applying/\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a>; LGC runs 25,000 samples a year for 900+ companies <a class=\"cite\" href=\"https://sport.wetestyoutrust.com/about/frequently-asked-questions\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>; USP has placed its mark on 700m+ labels <a class=\"cite\" href=\"https://www.usp.org/verification-services/verified-mark\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. The economic prize is less the fee than the pull-through: Niagen's ingredient line grew 45% in 2025 alongside its consumer brand <a class=\"cite\" href=\"https://www.stocktitan.net/news/NAGE/niagen-bioscience-reports-30-year-over-year-net-sales-increase-to-84tajp7eyahp.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>.<\/p>", "tension": "<p>The loser believes a clinical dossier is a sales aid that travels with the ingredient invoice. The winner sees that the dossier, the testing protocol and the seal are a product in their own right, saleable to brands that do not buy the ingredient, because regulators now punish brands that borrow ingredient studies without product-level evidence.<\/p>", "uncertainties": "<p>Whether a brand that uses a competitor's collagen will pay for a Rousselot-run seal (the A1 crux, unchanged); whether the NutraStrong mark already occupies the \"collagen verified\" position; whether EFSA's refusal of skin and joint claims leaves any claim to certify in Europe beyond purity and identity; whether Darling's governance will allow a standards office that certifies rivals' products.<\/p>"}, "name": "the proof office (standards sold across brands)", "other": [], "rank": 1, "shortName": "Collagen proof and seal sold across brands", "soWhat": "Regulators increasingly act against brands that borrow ingredient studies, so a dossier, test protocol and seal could be sold even to non-customers. SGS Nutrasource is already building a collagen seal.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-01", "verdict": "Lead"}, {"area": "R6", "arena": "Personalised / digital", "cell": "Personalised and digital x Products to Outcomes", "fields": {"evidence": "<p>Function's 50m tests and USD 2.5bn valuation <a class=\"cite\" href=\"https://techcrunch.com/2025/11/19/function-health-closes-298m-series-b-at-a-2-5b-valuation-launches-medical-intelligence/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a>; SiPhox's USD 199 GLP-1 panel with a B2B white-label option <a class=\"cite\" href=\"https://www.ycombinator.com/launches/Qel-siphox-health-glp-monitoring\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>; Hone's USD 65 entry test and tiered membership <a class=\"cite\" href=\"https://www.honehealth.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a>; Viome's test-then-subscribe model <a class=\"cite\" href=\"https://www.viome.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>; Avea's use of a commercial DNA-methylation clock as a trial endpoint for a collagen composition <a class=\"cite\" href=\"https://www.nature.com/articles/s41514-025-00280-7\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a>; Haut.AI selling skin-measurement to ingredient makers Givaudan and Evonik <a class=\"cite\" href=\"https://haut.ai/\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>; VISIA-CR as the accepted imaging standard <a class=\"cite\" href=\"https://www.canfieldsci.com/imaging-systems/visia-cr/\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>.<\/p>", "first": "<p>Run a costed desk design of a 100-person, 12-week post-meal glucose verification using an off-the-shelf CGM or SiPhox-type panel on GLPure+ buyers, and compare it with the 16-person crossover already published <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 58\">58<\/a>; approach one skin-imaging vendor (Canfield or Haut.AI) for a quote on a remote collagen skin study protocol that would satisfy an ASA or NAD challenge.<\/p>", "magnitude": "<p>Function is estimated near a USD 100m run rate on USD 499 memberships (low trust) <a class=\"cite\" href=\"https://sacra.com/c/function-health/\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>; Viome tests retail at USD 279 to 399 <a class=\"cite\" href=\"https://www.viome.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. No figure found for B2B verification services sold to supplement brands.<\/p>", "tension": "<p>The loser believes outcome verification is a clinical-trial cost centre. The winner sees that consumers now pay for measurement itself (Function, Viome, Novos, Tally) and that a cheap, repeatable, product-agnostic measurement loop is worth more than any single brand because every brand needs one.<\/p>", "uncertainties": "<p>Attribution noise (the X3 crux): whether a glucose, skin or epigenetic endpoint can be tied to a 5 g collagen dose in free-living consumers at acceptable cost; whether EU data-protection rules and the medical-device line permit a supplier-run consumer measurement loop; no supplement brand was found offering a money-back-on-biomarker guarantee, so demand for a guaranteed outcome is unproven.<\/p>"}, "name": "verification as a product (prove the result, do not own the brand)", "other": [], "rank": 2, "shortName": "Selling outcome measurement, not brands", "soWhat": "Consumers now pay for at-home biomarker tests. A cheap, repeatable measurement service every brand needs could be worth more than one brand, but linking results to a 5 g dose is unproven.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-01", "verdict": "Promising"}, {"area": "R6", "arena": "Beauty and consumer", "cell": "Beauty and consumer x Products to Outcomes", "fields": {"evidence": "<p>Thorne: USD 680m (2023) to USD 3.8bn (2026) on USD 500m+ revenue <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2023/09/05/Thorne-HealthTech-acquired-by-L-Catterton-for-680M/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/procter-gamble-to-acquire-thorne-f3-8-billion\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>; Grüns USD 1.2bn at about 4 times revenue after under three years <a class=\"cite\" href=\"https://www.forbes.com/sites/chloesorvino/2026/04/10/with-a-12-billion-sale-to-unilever-grns-founder-mints-a-fortune/\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; Zesty Paws USD 610m on USD 100m+ <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/maxim-partners-sells-zesty-paws-301366980.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; Nutrafol doubled turnover after Unilever's 2022 purchase with 80% of DTC revenue from repeat buyers <a class=\"cite\" href=\"https://www.unileverusa.com/news/2025/the-science-tech-and-trends-growing-unilevers-nutrafol-hairhealth-brand/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a>; Nestlé bought Vital Proteins in stages, 2020 to 2022 <a class=\"cite\" href=\"https://www.nestlehealthscience.com/newsroom/press-releases/nhs-completes-acquisition-of-vp\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; Rousselot's own Peptan was acquired from BHJ in 2008 <a class=\"cite\" href=\"https://www.peptan.com/our-story/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. The one organic counter-example, Tru Niagen, reached USD 97.7m in 2025 and now outweighs ChromaDex's ingredient line more than three to one <a class=\"cite\" href=\"https://www.stocktitan.net/news/NAGE/niagen-bioscience-reports-30-year-over-year-net-sales-increase-to-84tajp7eyahp.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. At the other end of the range, Nestle agreed on 1 September 2026 to sell its mainstream VMS brands (Nature's Bounty, Osteo Bi-Flex, Nuun and others) for USD 1.0bn on 2025 sales of USD 1.2bn, keeping its premium Solgar and Pure Encapsulations <a href=\"https://www.nestlehealthscience.us/stories/nestle-reaches-agreement-divest-its-mainstream-vitamins-minerals-and-supplements-business\" target=\"_blank\" rel=\"noopener\">Nestle Health Science, 1 September 2026<\/a>.<\/p>", "first": "<p>Build a target list of sub-USD 30m revenue European collagen or longevity DTC brands already using Rousselot ingredients and ask two of them for retention data under NDA; ask Darling corporate development whether a minority stake with a call option (the Nestlé Orgain structure <a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2022-02/nestle-health-science-to-acquire-majority-stake-orgain-pr-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>) is permissible inside the JV perimeter.<\/p>", "magnitude": "<p>Deal values above are the stakes. No reliable public figure for collagen DTC brand sales or churn; Momentous prices collagen at USD 54.99 with a 25% subscription discount <a class=\"cite\" href=\"https://www.livemomentous.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>; Pura Collagen at GBP 50 with 50% off on subscription <a class=\"cite\" href=\"https://puracollagen.co.uk/\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>. Subscription churn benchmarks for supplement DTC were not found in open sources.<\/p>", "tension": "<p>The loser believes a B2B ingredient company can learn consumer brand-building organically. The winner sees that every recent success in this space was bought, not built, and that strategics pay 4 to 8 times revenue for brands with proven repeat purchase, which means the entry price for learning is high and rising.<\/p>", "uncertainties": "<p>Whether Darling, which is simultaneously folding collagen into an 85/15 joint venture with Tessenderlo <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a>, has appetite for a consumer acquisition; whether a Rousselot-owned brand would alienate the brands that buy Peptan; whether the collagen beauty claim survives the current scientific pushback <a class=\"cite\" href=\"https://www.sciencedaily.com/releases/2026/01/260129080443.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a> well enough to justify a brand built on it rather than on metabolic or longevity outcomes.<\/p>"}, "lastChange": "R6-3: add Nestle's sub-1x mainstream VMS sale as the low end of the multiple range (accepted 2026-10-07)", "name": "owning a consumer relationship through acquisition", "other": [], "rank": 3, "shortName": "Buying a consumer brand", "soWhat": "Recent winners we found were bought rather than built, at 4 to 8 times revenue, so the price of learning is high. Darling's appetite while forming the Tessenderlo joint venture is unknown.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-07", "verdict": "Test first"}, {"area": "R6", "arena": "Metabolic health / GLP-1", "cell": "Metabolic health x Products to Outcomes", "fields": {"evidence": "<p>Nextida GC trial (42% average reduction in glucose spike, n=16) <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 58\">58<\/a>; US and international patents granted 2026 <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260602-darling-ingredients-health-brand-rousselot-receives-us-patent-for-nextida-gc\" target=\"_blank\" rel=\"noopener\" title=\"Source 60\">60<\/a>; GLPure+ on the UK market at GBP 50 <a class=\"cite\" href=\"https://puracollagen.co.uk/\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>; SiPhox's GLP-1 panel aimed at \"30 million Americans\" on GLP therapy <a class=\"cite\" href=\"https://www.ycombinator.com/launches/Qel-siphox-health-glp-monitoring\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>; EU Article 13(5) route with five-year data exclusivity for proprietary studies <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02006R1924-20141213\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a>.<\/p>", "first": "<p>Scope the cost and timeline of an Article 13(5) application for Nextida GC with a regulatory consultant; combine with liminal space 2's measurement design so the same trial serves both.<\/p>", "magnitude": "<p>Not sizeable from public data for the companion-nutrition niche; the glucose claim is the only Rousselot outcome with a plausible Article 13(5) pathway, which is a regulatory asset rather than a market figure.<\/p>", "tension": "<p>The loser believes collagen's consumer story is beauty. The winner sees that post-meal glucose is the one Rousselot outcome that is cheap to measure, patent-protected and sits in the fastest-moving consumer category, and that proof sold here can later be ported to skin and joints.<\/p>", "uncertainties": "<p>Whether a 16-person crossover will satisfy EFSA or NAD (both bodies have rejected larger collagen trials <a class=\"cite\" href=\"https://www.efsa.europa.eu/en/efsajournal/pub/2291\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/national-advertising-division-recommends-discontinuation-of-product-performance-and-health-related-on-the-go-claims-for-vital-proteins-collagen-peptide-single-use-dietary-supplement-stick-packs-300992264.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a>); whether GLP-1 users want a glucose benefit or a muscle and skin-laxity benefit, for which no public demand data was found.<\/p>"}, "name": "the GLP-1 companion outcome (the one claim Rousselot can measure)", "other": [], "rank": 4, "shortName": "Nextida GC glucose benefit for GLP-1 users", "soWhat": "Post-meal glucose is the one Rousselot outcome that is cheap to measure and patent-protected: a 42% average spike reduction in 16 people. Whether so small a trial satisfies regulators is open.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-01", "verdict": "Test first"}, {"area": "R6", "arena": "Beauty and consumer", "cell": "Ingredients to Ecosystems x Beauty and consumer", "fields": {"tension": "<p>The loser sells to the top 50 accounts; the winner sees the long tail of brands founded in the last three years (Grüns, Avea, Tally) that need formulation, evidence and compliance as a service. Evidence from this scan is indirect (Haut.AI and SGS sell to this tail <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/lonza-s-uc-ii-collagen-earns-nutrastrong-certification-backed-by-clinical-evidence-on-knee-flexibility\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a><a class=\"cite\" href=\"https://haut.ai/\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>); no figure found. First move: count how many of Rousselot's new accounts since 2023 are brands under three years old.<\/p>\n<p>Ranking logic: spaces 1 and 2 ask Rousselot to own the proof, which the regulatory record rewards and which, on the certification fee benchmarks above (low trust), costs tens of thousands rather than the hundreds of millions of a brand acquisition. Space 3 asks it to own the consumer, which the deal record prices at 4 to 8 times revenue and which the science record makes riskier for beauty than for metabolic claims. Space 4 is where proof and consumer meet on Rousselot's own patented asset. The two questions should be decided separately and in that order.<\/p>"}, "name": "the formulation studio for indie brands (D2, carried but unranked)", "other": [], "rank": 5, "shortName": "Formulation studio for young indie brands", "soWhat": "Brands founded in the last three years often need formulation, evidence and compliance as a service. Evidence is indirect and no market figure was found.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-01", "verdict": "Watch"}], "sources": [{"n": 1, "text": "Our Story, Peptan (Rousselot), undated, https://www.peptan.com/our-story/", "url": "https://www.peptan.com/our-story/"}, {"n": 2, "text": "VERISOL, Gelita, undated, https://www.gelita.com/en/products-brands/collagen-peptides/verisolr", "url": "https://www.gelita.com/en/products-brands/collagen-peptides/verisolr"}, {"n": 3, "text": "The Benefits of Co-Branding, Nutritional Outlook, 21 May 2009, https://www.nutritionaloutlook.com/view/benefits-co-branding", "url": "https://www.nutritionaloutlook.com/view/benefits-co-branding"}, {"n": 4, "text": "Trusted Brands, Kaneka Ubiquinol, undated, https://ubiquinol.org/kaneka-seal", "url": "https://ubiquinol.org/kaneka-seal"}, {"n": 5, "text": "Protecting the Integrity of Ubiquinol: Launch of \"Ubiquinol Verified Program\", Kaneka Nutrients via PR Newswire, September 2025, https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html", "url": "https://www.prnewswire.com/news-releases/protecting-the-integrity-of-ubiquinol-launch-of-ubiquinol-verified-program-302556864.html"}, {"n": 6, "text": "Lonza Capsugel celebrates 25 years of UC-II, Capsugel, 16 July 2026, https://www.capsugel.com/news/capsugel-celebrates-uc-ii-25-years", "url": "https://www.capsugel.com/news/capsugel-celebrates-uc-ii-25-years"}, {"n": 7, "text": "Lonza's UC-II Colla
