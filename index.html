otype space is the moment a doctor says \"not bad enough to treat\": who the person turns to next (pharmacist, health store, physiotherapist) and what that adviser may say. That moment, more than population size, should drive ranking. (3) No re-ranking today; spaces 8 and 9 are added as provisional and will be scored with spaces 3 and 5 by 16 Oct.<\/p>", "title": "6 Oct: feedback received and how the map changed"}], "internal": "<ol>\n<li>Praneeth (introduced on 5 Oct; first conversation Tue 13 Oct): which disease did \"lime disease\" denote (Lyme or liver)? What is the data behind 1.8 m patients and the USD 27 to 38 m pathway figure? Does he know of any patient trial with a matched comparator?<\/li>\n<li>Rousselot Regulatory: on what basis (GRAS notice with \"no questions\" letter, or self-affirmed GRAS) are Peptan and Nextida sold in the US? If self-affirmed, the proposed rule's one-year streamlined window and the 9 Dec 2026 comment deadline apply <a class=\"cite\" href=\"https://www.federalregister.gov/documents/2026/08/11/2026-16296/substances-generally-recognized-as-safe\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.gibsondunn.com/fda-proposes-mandatory-gras-notification-for-food-substances-with-a-time-limited-streamlined-path/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>.<\/li>\n<li>Rousselot sales (gelatin and Peptan): which clinical nutrition or dysphagia manufacturers already buy, at what volumes, and under what specification? Is Rousselot already the collagen hydrolysate in Fresubin 3.2 kcal or Pro-Stat?<\/li>\n<li>Rousselot: is a patient-facing brand ruled out in principle, or only for now?<\/li>\n<li>Kathleen (from January): appetite for a trial-funding model where Rousselot co-funds a partner's RCT in return for specification lock-in.<\/li>\n<li>Matt or Praneeth: amino-acid balancing data for collagen fractions at 40 to 60 percent of total protein in a 3.2 kcal/ml matrix.<\/li>\n<li>Rousselot (6 Oct catch-up, data by 16 Oct): Rousselot's unpublished human data on Nextida GC and Peptan (n, comparators, any participants on GLP-1 drugs); whether the deep dive tests the carrier lane, the active lane or one trial across both; how far the core's GLP-1 companion programme intends to go.<\/li>\n<li>Praneeth: any data on glycine status or need in pressure ulcers, burns or after major surgery (tests the bridge into FSMP).<\/li>\n<li>Rousselot R&amp;D (asked 2 Oct, by 16 Oct): Peptan viscosity at 10 to 15 g per 100 ml against micellar casein and whey isolate; without it the carrier lane's core claim stays desk-only.<\/li><li>Rousselot (asked 2 Oct, by end of October): one introduction to a brand owner's medical-nutrition formulation team, if the relationship exists, so the five formulator conversations do not start cold.<\/li><li>Rousselot Regulatory (new, 6 Oct): has the Nextida GC wording \"boost the body's production of GLP-1\" been checked against the UK ASA rulings that treat such claims as medicinal <a class=\"cite\" href=\"https://www.asa.org.uk/rulings/evolution-slimming-ltd-a25-1281271-evolution-slimming-ltd.html\" target=\"_blank\" rel=\"noopener\">ASA, Aug 2025<\/a>? Any EU national guidance on companion claims?<\/li><li>Rousselot science (new, 6 Oct): design, population and endpoints of the recruiting Nextida GC-B trial <a class=\"cite\" href=\"https://clinicaltrials.gov/study/NCT07149064\" target=\"_blank\" rel=\"noopener\">NCT07149064<\/a>, and whether hair and skin endpoints could be added; any internal data on steroid-exposed skin or muscle.<\/li><li>Rousselot commercial (new, 6 Oct): what the commercial team has been asked to do on the collagen-first reversal; status of the Danone conversation; the price data behind \"whey above collagen\" (spread, regions, since when).<\/li><li>Praneeth (13 Oct, added 6 Oct): the CRO protocols under discussion (indication, population, comparator, budget); the fatty-liver data held; the fertility protocol (cohorts, research group, cost) and whether a blend-versus-protein arm could be added.<\/li><li>Rousselot R&amp;D (new, 6 Oct): the Nextida candidate in development for cholesterol (target claim, stage, timing of data).<\/li><li>Rousselot (new, 6 Oct): appetite to sell blends under its own specification rather than advise customers on them; any existing blend data with whey, vitamin C or chromium.<\/li><\/ol>", "mapIntro": "<p>Re-ranked 5 Oct 2026 after the 5 Oct feedback and routes map. Protein-dense ONS keeps first place on readiness; the GLP-1 companion moves into the active lane, second and rising. Two provisional active spaces are added (early glucose dysregulation; connective-tissue recovery, which absorbs surgery recovery at home), to be scored by 16 Oct. Wound care becomes the bridge space. Liver splits off as a watch item.<\/p><p>Updated 6 Oct after feedback received that day: two provisional spaces added (8, collagen-led blends that carry an authorised claim; 9, fertility as a companion moment, watch). Spaces 1, 2, 3, 5, 6 and 7 carry new context. No re-ranking until scoring on 16 Oct.<\/p><p><strong>Base report:<\/strong> Clinical Nutrition Base Report<\/p>", "name": "Clinical and medical nutrition", "oneLine": "<p>Clinical nutrition is where protein is bought on prescription or tender, and where collagen already sits quietly inside leading products (Pro-Stat, Fresubin 3.2 kcal, V CRESC CP10). Since the feedback received on 5 Oct the area runs two lanes. The carrier lane is collagen as protein: a B2B medical-grade fraction plus the first matched-protein patient trial, sold into brand owners' FSMP dossiers. The active lane is collagen's health effects sold as companions to drugs (GLP-1 first) and to pre-disease states, which EU law only allows in phenotype language <a class=\"cite\" href=\"https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>. A possible bridge between them is a glycine requirement in high collagen-turnover states <a class=\"cite\" href=\"https://link.springer.com/article/10.1007/s12038-009-0100-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>. Both lanes lack the same thing: evidence in the people the product is for. Feedback received on 6 Oct adds a nutrition direction (collagen-led blends that carry authorised claims) and widens the phenotype list (visceral fat, borderline cholesterol, fertility).<\/p>", "options": [], "order": 3, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Three shifts matter. First, protein density is the formulation frontier: ONS leaders sell 16 g protein per 100 ml at 3.2 kcal/ml (Fresubin 3.2 kcal DRINK, protein sources \"collagen hydrolysate, milk protein\") <a class=\"cite\" href=\"https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a> and 15 g protein per 30 ml (Pro-Stat, \"Hydrolyzed Collagen Protein\") <a class=\"cite\" href=\"https://www.specializedadultnutrition.com/en/pro-stat\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>. Second, the evidence bar has moved to matched comparators: the two best recent trials in older adults show collagen alone does not raise muscle protein synthesis where whey (and pea) do [6][7], while a 50 percent collagen blend matched for energy and protein performed equivalently to milk protein in older men <a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S0261561421000066\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>, and a 5:1 whey:collagen blend raised myofibrillar and connective-tissue synthesis against placebo in young men (2025) [9]. The question has split into \"collagen as sole protein\" (loses) and \"collagen as the density-enabling fraction of a blend\" (holds). Third, the GLP-1 wave has pulled every medical nutrition house into consumer \"companion\" ranges: Abbott Protality (31 Jan 2024, 30 g protein) <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>, Nestlé Vital Pursuit (21 May 2024) and the Nestlé Health Science GLP-1 platform (25 Jun 2024) <a class=\"cite\" href=\"https://www.nestlehealthscience.us/stories/nestle-health-science-launches-comprehensive-glp-1nutrition-support-platform\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://www.nestle.com/media/news/vital-pursuit-brand-glp-1-weight-support\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>, Danone Oikos Fusion (2025, 23 g protein, whey and leucine) and Kate Farms <a class=\"cite\" href=\"https://www.dairyreporter.com/Article/2026/09/02/healthy-aging-glp-1-products-and-beyond/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>. None names collagen <a class=\"cite\" href=\"https://www.dairyreporter.com/Article/2026/09/02/healthy-aging-glp-1-products-and-beyond/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.nestlehealthscience.us/stories/nestle-health-science-launches-comprehensive-glp-1nutrition-support-platform\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><a class=\"cite\" href=\"https://www.nestle.com/media/news/vital-pursuit-brand-glp-1-weight-support\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<p>No trade body publishes a current market size for prescribed ONS or FSMP; the MNI dossier (2012) gives the cost of disease-related malnutrition in Europe as \"€170 billion\" a year and \"33 million people are at risk\", with 93 percent of those at risk living in the community <a class=\"cite\" href=\"https://www.medicalnutritionindustry.org/content/uploads/2023/10/mnibookletfinal2911-3.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>. Company filings give the firmest floor. Nestlé Health Science: CHF 6.551 bn sales in 2025, 3.2 percent organic growth; \"Medical Nutrition delivered mid single-digit growth across all segments, with strong contributions from Resource and Compleat\" <a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>. Danone Specialized Nutrition (infant plus medical): EUR 9,277 m in 2025, 7.4 percent like-for-like, with Adult Medical Nutrition in Europe described as a strong performer in Q4 <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. Fresenius Kabi Nutrition (enteral plus parenteral): \"Revenue in the Nutrition business remained almost stable (5% growth in constant currency) at €2,396 million (2024: €2,399 million)\" <a class=\"cite\" href=\"https://report.fresenius.com/2025/annual-report/management-report/economic-report/results-of-operations.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>. Abbott Adult Nutrition: USD 4.477 bn in 2025, 3.0 percent organic <a class=\"cite\" href=\"https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>. These segments include infant, parenteral and consumer lines, so the pure medical ONS total cannot be isolated from public filings. The base report's \"medical nutrition $32 to 40 bn global, $9 to 13 bn Europe; prescribed ONS $12 to 18 bn\" and an internal \"$18 to 33 bn global oral clinical nutrition\" figure derive from research-firm estimates and are low-trust. Mid single-digit real growth is consistent with all four filings <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://report.fresenius.com/2025/annual-report/management-report/economic-report/results-of-operations.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><a class=\"cite\" href=\"https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>.<\/p>", "title": "Size and growth"}, {"full": "Players", "html": "<p>Incumbents: Nestlé Health Science (Resource, Compleat; GLP-1 platform under Boost and others) <a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://www.nestlehealthscience.us/stories/nestle-health-science-launches-comprehensive-glp-1nutrition-support-platform\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>; Danone/Nutricia (Fortimel in Europe; Pro-Stat in North America via Nutricia North America, indicated for pressure injuries, wounds, sarcopenia, dialysis) <a class=\"cite\" href=\"https://www.specializedadultnutrition.com/en/pro-stat\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a><a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>; Fresenius Kabi (Fresubin; \"Five new enteral nutrition products were launched in 2025\") <a class=\"cite\" href=\"https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a><a class=\"cite\" href=\"https://report.fresenius.com/2025/annual-report/stories/story1.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>; Abbott (Ensure, Glucerna, Protality) <a class=\"cite\" href=\"https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>. Challengers: Kate Farms (plant-based, GLP-1 positioned) <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>; Nutri Co., Ltd. (Japan), whose V CRESC CP10 (10,000 mg collagen peptide per 125 ml) holds Japan's Consumer Affairs Agency permission as a food for special dietary use with the claim \"本品は褥瘡を有する方の食事療法として使用できる食品です\" (this product is a food that can be used in the dietary therapy of people with pressure ulcers), first flavour approved 26 Aug 2021, second 27 Mar 2024 <a class=\"cite\" href=\"https://www.nutri.co.jp/news/detail/0002677.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a><a class=\"cite\" href=\"https://prtimes.jp/main/html/rd/p/000000008.000073095.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. Collagen suppliers: Rousselot's public 2025 to 2026 news is biomedical (COMPAMED gelatin prototypes, Colartix patents, Cellbricks) and Nextida GC (US patent, 3 Jun 2026), with no clinical nutrition item <a class=\"cite\" href=\"https://www.darlingii.com/investors\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.darlingii.com/rousselot\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>; Gelita's 2026 news is sports nutrition, bioink and skin, with no clinical nutrition item <a class=\"cite\" href=\"https://www.gelita.com/en/news\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. No collagen supplier currently presents itself as a clinical nutrition partner.<\/p>", "title": "Players"}, {"full": "Regulation", "html": "<p>EU: FSMP is defined in Regulation (EU) No 609/2013, Article 2(2)(g), as food \"for the dietary management of patients ... with other medically-determined nutrient requirements, whose dietary management cannot be achieved by modification of the normal diet alone\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32013R0609\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Delegated Regulation (EU) 2016/128 (applied from 22 Feb 2019) requires formulation \"based on sound medical and nutritional principles\" and \"safe, beneficial and effective ... as demonstrated by generally accepted scientific data\"; market access is by notification of the label to each Member State under Article 9 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0128\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>. The Commission Notice 2017/C 401/01, paragraph 55, lists as a qualifying need \"increased requirements for protein or other specific nutrients (e.g. glutamine) in patients pre or post-surgery, with severe wounds, burns or pressure sores\"; paragraph 61 states that modification of the normal diet \"includes use of food supplements or fortified foods\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>. The CJEU in C-418/21 Orthomol (27 Oct 2022) ruled that a product is an FSMP only \"if the disease results in increased or specific nutritional requirements which the food is intended to cover\", and that it \"is not sufficient ... that the patient derives a general benefit from the intake of that food\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62021CJ0418\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. Germany (reimbursement): the G-BA Arzneimittel-Richtlinie, in force 1 Oct 2026, section 24 excludes disease-adapted special products offered specifically for \"chronische Herz-Kreislauf- oder Ateminsuffizienz, Dekubitusprophylaxe oder -behandlung, Diabetes mellitus, Geriatrie, Stützung des Immunsystems, Tumorpatienten\", while section 23 keeps normo- and high-calorie standard products reimbursable <a class=\"cite\" href=\"https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>. US: the FDA proposed rule \"Substances Generally Recognized as Safe\" (Federal Register, 11 Aug 2026, docket FDA-2025-N-3262) would make GRAS notification mandatory, with a one-year streamlined window for substances already in commerce; \"Either electronic or written comments on the proposed rule must be submitted by December 9, 2026\" <a class=\"cite\" href=\"https://www.federalregister.gov/documents/2026/08/11/2026-16296/substances-generally-recognized-as-safe\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.gibsondunn.com/fda-proposes-mandatory-gras-notification-for-food-substances-with-a-time-limited-streamlined-path/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>.<\/p>", "title": "Regulation"}, {"full": "Signals", "html": "<ol>\n<li>3 Sep 2025: ESPEN publishes \"ESPEN guideline on clinical nutrition in surgery - Update 2025\" (Weimann et al., Clinical Nutrition), restating early oral feeding and early nutritional therapy for any surgical patient at risk [22].<\/li>\n<li>20 Feb 2026 and 19 Feb 2026: Danone and Nestlé FY2025 results both report mid to high single-digit medical nutrition growth <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>.<\/li>\n<li>3 Jun 2026: Darling Ingredients announces a US patent for Nextida GC, described as a collagen peptide \"to help support healthy after-meal blood sugar levels\" <a class=\"cite\" href=\"https://www.darlingii.com/investors\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>.<\/li>\n<li>11 Aug 2026: FDA proposes mandatory GRAS notification; comments due 9 Dec 2026 <a class=\"cite\" href=\"https://www.federalregister.gov/documents/2026/08/11/2026-16296/substances-generally-recognized-as-safe\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a>.<\/li>\n<li>2 Sep 2026: trade press lists the latest GLP-1 companion launches (Danone Oikos Fusion, Kate Farms, PepsiCo Propel Clear Protein, Mission tortillas); none use collagen <a class=\"cite\" href=\"https://www.dairyreporter.com/Article/2026/09/02/healthy-aging-glp-1-products-and-beyond/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a>.<\/li>\n<li>1 Oct 2026: new consolidated G-BA Arzneimittel-Richtlinie in force; section 24 exclusions unchanged <a class=\"cite\" href=\"https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>.<\/li>\n<li>2024 to 2025 (evidence): McKendry 2024 and Aussieker 2025 bracket the collagen question (sole protein fails; blend works) [7][9].<\/li>\n<li>2021 to 2024 (Japan): two V CRESC CP10 flavours gain a pressure-ulcer dietary-therapy permission, the only collagen-specific clinical claim found anywhere <a class=\"cite\" href=\"https://www.nutri.co.jp/news/detail/0002677.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a><a class=\"cite\" href=\"https://prtimes.jp/main/html/rd/p/000000008.000073095.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/li>\n<\/ol>", "title": "Signals"}], "soWhat": {"forRousselot": "Both routes, collagen as protein and collagen as health companion, need one asset: a trial of a collagen-led blend against protein alone in target users. The core already sells GLP-1 companions, so a venture would likely need to own new evidence.", "forRousselotLinks": [{"anchor": "r3-x5", "go": "r3", "label": "6 Oct: feedback received and how the map changed"}, {"anchor": "r3-x4", "go": "r3", "label": "Cross-cutting: the in-phenotype gap (added 5 Oct)"}], "headline": "Collagen is unlikely to beat whey as a protein but could win inside patient drinks and beside drugs, if Rousselot builds its own evidence in real patients.", "next": "Get Rousselot's unpublished human data on Peptan and Nextida GC, including any GLP-1 users, before scoring the provisional spaces on 16 October.", "nextLinks": [{"anchor": "r3-s2", "go": "r3", "label": "Space 2: Collagen alongside GLP-1 weight-loss drugs"}, {"anchor": "r3-inputs", "go": "r3", "label": "What we still need"}], "takeaways": [{"links": [{"anchor": "r3-s1", "go": "r3", "label": "Space 1: Collagen for denser patient nutrition drinks"}, {"anchor": "r3-scan-1", "go": "r3", "label": "Scan: Trends"}, {"label": "[11] fresenius-kabi.com", "title": "Fresenius Kabi (UK), Fresubin 3.2 kcal DRINK product datacard (PDF), accessed 1 October 2026. https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf", "url": "https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf"}], "text": "Leading patient drinks already use collagen: Fresubin 3.2 kcal packs 16 g protein per 100 ml from collagen hydrolysate and milk protein."}, {"links": [{"anchor": "r3-x4", "go": "r3", "label": "Cross-cutting: the in-phenotype gap (added 5 Oct)"}, {"anchor": "r3-s2", "go": "r3", "label": "Space 2: Collagen alongside GLP-1 weight-loss drugs"}, {"label": "[43] sciencedirect.com", "title": "Virgilio et al. 2026, Nextida GC acute crossover trial (Current Developments in Nutrition), as cited in the Limineer Clinical Nutrition Base Report; not re-opened this round. https://www.sciencedirect.com/science/article/pii/S2475299126018779", "url": "https://www.sciencedirect.com/science/article/pii/S2475299126018779"}, {"label": "[38] nutritioninsight.com", "title": "Nutrition Insight, \"Webinar preview: Rousselot targets GLP-1 companion products with Peptan and Nextida GC\", 31 August 2026. https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html", "url": "https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html"}], "text": "We found no trial comparing collagen with matched protein in patients, and no collagen trial in GLP-1 drug users."}, {"links": [{"anchor": "r3-s2", "go": "r3", "label": "Space 2: Collagen alongside GLP-1 weight-loss drugs"}, {"anchor": "r3-scan-4", "go": "r3", "label": "Scan: Regulation"}, {"label": "[34] legislation.gov.uk", "title": "European Union, Regulation (EU) No 1169/2011 on the provision of food information to consumers, Article 7 (legislation.gov.uk copy of the adopted text). https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted", "url": "https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted"}], "text": "EU food law forbids disease claims, so companion products need to describe the person's state, such as after-meal glucose, rather than the drug."}], "watchOut": "Health evidence is weaker than the marketing: a 2025 review of 23 skin trials found no effect in non-industry or high-quality trials.", "watchOutLinks": [{"anchor": "r3-x3", "go": "r3", "label": "5 Oct reframe: feedback received and how the map changed"}, {"label": "[36] amjmed.com", "title": "Myung SK, Park Y. Effects of Collagen Supplements on Skin Aging: A Systematic Review and Meta-Analysis of Randomized Controlled Trials. American Journal of Medicine, 2025. https://www.amjmed.com/article/S0002-9343(25)00283-9/abstract", "url": "https://www.amjmed.com/article/S0002-9343(25)00283-9/abstract"}, {"label": "[37] nutraingredients.com", "title": "NutraIngredients, \"Industry reacts to meta-analysis concluding collagen supplements show no proven benefit for skin aging\", 26 August 2025. https://www.nutraingredients.com/Article/2025/08/26/industry-reacts-to-meta-analysis-concluding-collagen-supplements-show-no-proven-benefit-for-skin-aging/", "url": "https://www.nutraingredients.com/Article/2025/08/26/industry-reacts-to-meta-analysis-concluding-collagen-supplements-show-no-proven-benefit-for-skin-aging/"}]}, "sourceNote": "", "updatedAt": "2026-10-06", "spaces": [{"area": "R3", "arena": "Pharma and biomedical", "cell": "", "fields": {"evidence": "<p>Fresubin 3.2 kcal DRINK: 320 kcal and 16 g protein per 100 ml, protein sources \"collagen hydrolysate, milk protein\" <a class=\"cite\" href=\"https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. Pro-Stat: 15 g \"Hydrolyzed Collagen Protein\" per 30 ml <a class=\"cite\" href=\"https://www.specializedadultnutrition.com/en/pro-stat\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>. Brook 2021: eight older men, Fresubin 3.2 kcal (about 50 percent collagen) versus isoenergetic milk protein, equivalent muscle protein synthesis at rest and after exercise <a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S0261561421000066\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. Aussieker 2025: 25 g whey plus 5 g collagen raised myofibrillar and connective protein synthesis against placebo [9]. Oikawa 2020 and McKendry 2024: collagen alone did not raise synthesis where whey did [6][7]. Capacity is being added by the formulators themselves: Danone inaugurated a EUR 70m Fortimel line at Steenvoorde on 15 September 2026, close to 20 million litres of ONS a year across about 150 references <a href=\"https://www.danone.com/newsroom/press-releases/new-production-line-in-steenvoorde.html\" target=\"_blank\" rel=\"noopener\">Danone, 15 September 2026<\/a>.<\/p>", "first": "<p>Five formulator conversations (Fresenius Kabi, Nutricia, Nestlé HS, two contract manufacturers) on viscosity, amino-acid balancing and dossier needs. Draft a one-page protocol for an isonitrogenous, isoenergetic trial in a patient group named in paragraph 55 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>, and price it.<\/p>", "magnitude": "<p>Not separable from public data; the four majors' relevant segments total roughly EUR 9.3 bn (Danone Specialized Nutrition), CHF 6.6 bn (Nestlé Health Science), EUR 2.4 bn (Fresenius Kabi Nutrition) and USD 4.5 bn (Abbott Adult Nutrition) in 2025, all broader than ONS <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://report.fresenius.com/2025/annual-report/management-report/economic-report/results-of-operations.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><a class=\"cite\" href=\"https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>. The research-firm ranges in the base report are low-trust.<\/p>", "tension": "<p>The loser believes protein quality is a single league table (whey top, collagen bottom) and that collagen is a cheap filler. The winner sees that in a 125 ml ONS the binding constraint is viscosity and tolerance, that collagen hydrolysate is what lets 20 g protein and 400 kcal fit in one small drink <a class=\"cite\" href=\"https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>, and that a blend matched for energy and protein performs as well as milk protein in older men <a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S0261561421000066\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>.<\/p>", "uncertainties": "<p>What share of collagen can a formulator push before essential amino acid content fails the \"sound medical and nutritional principles\" test under Article 2(2) of 2016/128 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0128\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>? Do formulators see collagen as commodity or as a specified fraction with a dossier? Would Fresenius or Nutricia co-fund a matched trial?<\/p>"}, "lastChange": "R3-1: add Danone's new Steenvoorde ONS line to the evidence (accepted 2026-10-06)", "name": "Carrier lane: protein-dense ONS (arena B Pharma and (bio)medical x threshold Products to Outcomes)", "other": ["<p>Gate 0 (evidence-adjusted) from the R3 Opportunity Scan, as shared on 2 Oct: 57% (raw 80%), conditional go.<\/p>", "<p><strong>Added 6 Oct (feedback received).<\/strong> Whey is currently priced above collagen, so collagen is already winning some protein volume on price (feedback received; not yet checked publicly). Formulation is reversing from \"collagen added to whey\" to \"protein added to collagen's health benefit\"; Rousselot's commercial team has been asked to act on this, and Danone is on the agenda. For this space, the carrier lane can be pitched to brand owners as a collagen-led matrix rather than a filler, provided the matched-comparator trial exists.<\/p>"], "rank": 1, "shortName": "Collagen for denser patient nutrition drinks", "soWhat": "Collagen helps leading patient drinks pack 16 g protein into 100 ml. A medical-grade fraction backed by the first matched-protein patient trial could be sold into brand owners' medical foods.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Lead"}, {"area": "R3", "arena": "Metabolic health / GLP-1", "cell": "", "fields": {"evidence": "<p>Abbott Protality, 30 g protein, 150 kcal, launched 31 Jan 2024 <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>. Nestlé Vital Pursuit (21 May 2024) and the Nestlé HS GLP-1 platform (25 Jun 2024) <a class=\"cite\" href=\"https://www.nestlehealthscience.us/stories/nestle-health-science-launches-comprehensive-glp-1nutrition-support-platform\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://www.nestle.com/media/news/vital-pursuit-brand-glp-1-weight-support\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>. Danone Oikos Fusion, 23 g protein with whey and leucine (2025); Isabelle Esser, Chief Research and Innovation Officer, Danone: \"The problem with weight loss is that it's not only fat, you also lose muscle.\" <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>. Nextida GC US patent, 3 Jun 2026 <a class=\"cite\" href=\"https://www.darlingii.com/investors\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>. Rousselot already positions Peptan for GLP-1 side effects (skin, gut, muscle) and Nextida GC as a GLP-1 booster; the cited studies are in healthy adults, not drug users <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. No collagen trial in GLP-1 users was found. A European contract manufacturer, ANJAC Health &amp; Beauty, launched a turnkey GLP-1 range on 29 September 2026 covering muscle-mass preservation, digestion, micronutrients, skin and hair, across supplements, devices, medicines and cosmetics; no ingredients are named <a href=\"https://www.globenewswire.com/news-release/2026/09/29/3370499/0/en/anjac-health-beauty-launches-a-dedicated-offering-to-support-patients-on-glp-1-treatments.html\" target=\"_blank\" rel=\"noopener\">GlobeNewswire, 29 Sep 2026<\/a>. Since 6 Oct: hair loss RR 3.25 versus placebo in randomised trials <a class=\"cite\" href=\"https://europepmc.org/article/MED/42155605\" target=\"_blank\" rel=\"noopener\">Cheng 2026<\/a> and telogen effluvium aOR 1.76 in real-world data <a class=\"cite\" href=\"https://europepmc.org/article/MED/42621629\" target=\"_blank\" rel=\"noopener\">Viquez Burboa 2026<\/a>; over 60% of 1,226 telehealth users report skin, face or hair concerns <a class=\"cite\" href=\"https://europepmc.org/article/MED/42639588\" target=\"_blank\" rel=\"noopener\">Santiago Mangual 2026<\/a>; only about 5% of GLP-1 products make hair claims <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/08/12/are-glp-1s-driving-demand-for-hair-growth-supplements/\" target=\"_blank\" rel=\"noopener\">NutraIngredients, Aug 2026<\/a>. The nearest collagen hair evidence is a 24-week RCT in damaged hair without alopecia <a class=\"cite\" href=\"https://europepmc.org/article/MED/42624827\" target=\"_blank\" rel=\"noopener\">Kim 2026<\/a>.<\/p>", "first": "<p>Separate what the core already sells from what a venture would own: in-user trial evidence, the pharmacy or HCP channel, or a pharma or telehealth partner <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. Ask Rousselot (6 Oct catch-up, data by 16 Oct) for Rousselot's unpublished human data on Peptan and Nextida GC, including any participants on GLP-1 drugs. Outline one trial: collagen-whey blend against whey alone in GLP-1 users, equal protein.<\/p>", "magnitude": "<p>Not sizeable from public data. The base report refines an earlier figure: the USD 204.8 bn \"GLP-1 companion products\" figure in the Battlefield report covers a broader category than companions (research-firm, low-trust) [33]; the replacement USD 4.7 bn (Fact.MR, 2025) was not re-opened and is also low-trust.<\/p>", "tension": "<p>The loser believes any protein shake with a GLP-1 label will sell. The winner sees that every incumbent launch uses whey or pea and claims muscle <a class=\"cite\" href=\"https://www.dairyreporter.com/Article/2026/09/02/healthy-aging-glp-1-products-and-beyond/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>, that collagen alone loses on muscle [6][7], and that collagen's only defensible roles are tolerance (small volume, low satiety load) and connective tissue [9]. Since the 5 Oct feedback: the value is collagen's health effect alongside the drug, not its protein. The winner also sees that the EU only allows this as a phenotype: a food may not claim to prevent, treat or cure a disease, in labels or advertising <a class=\"cite\" href=\"https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>, so the drug is never named.<\/p>", "uncertainties": "<p>Does the FSMP route exist at all for GLP-1 users (Orthomol requires a disease-driven nutritional requirement, and drug-induced appetite loss in obesity is untested) <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62021CJ0418\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>? Does paragraph 61 push any \"companion\" product into supplement or fortified-food status <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>? How far does the core's GLP-1 programme intend to go, so a venture does not duplicate it? Would Rousselot accept an independent trial that might show collagen adds nothing over whey in GLP-1 users? Claims wording: the UK ASA treats claims that a supplement affects GLP-1 production as medicinal <a class=\"cite\" href=\"https://www.asa.org.uk/rulings/evolution-slimming-ltd-a25-1281271-evolution-slimming-ltd.html\" target=\"_blank\" rel=\"noopener\">ASA, Aug 2025<\/a><a class=\"cite\" href=\"https://www.asa.org.uk/rulings/glp-1-pro-ltd-a25-1317723-glp-1-pro-ltd.html\" target=\"_blank\" rel=\"noopener\">ASA, May 2026<\/a>, and Rousselot's published Nextida GC message uses that kind of wording <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-collagen-peptides-glp1-companion-products.html\" target=\"_blank\" rel=\"noopener\">Nutrition Insight, Jun 2026<\/a>; the companion position is untested. Is hair shedding a separate space or part of this one?<\/p>"}, "lastChange": "Widen the GLP-1 companion space to hair and skin change, and add the claims-wording risk (includes the ANJAC evidence) (accepted 2026-10-06)", "name": "Active lane: GLP-1 companion, lean mass, tolerance and side effects (arena A Metabolic health x threshold Products to Outcomes)", "other": ["<p>Gate 0 (evidence-adjusted) from the R3 Opportunity Scan, as shared on 2 Oct: 54% (raw 72%), hold and recycle. To be re-scored for the active lane once Rousselot's own human data are in.<\/p>", "<p><strong>Added 6 Oct (feedback received).<\/strong> GLP-1 is the clearest case of lifestyle built into a medical treatment: users must eat more protein and train. People in cancer treatment are named as a second group where collagen may help alongside therapy. Both follow the companion logic: support the treatment, never replace it. The cancer-treatment group is not yet scanned.<\/p>"], "rank": 2, "shortName": "Collagen alongside GLP-1 weight-loss drugs", "soWhat": "The large companion launches for GLP-1 drug users we found use whey or pea, and none names collagen. Collagen's edge could be tolerance, connective tissue, hair and skin, but no trial in drug users exists yet.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Promising"}, {"area": "R3", "arena": "Metabolic health / GLP-1", "cell": "", "fields": {"evidence": "<p>Emerging. Nextida GC, about 10 g taken 30 minutes before a meal, cut post-meal glucose spikes by up to 37% and raised GLP-1 in two clinical studies; patents in the US, EU, Japan and Australia <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a><a class=\"cite\" href=\"https://www.darlingii.com/investors\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>. Acute crossover trials, n=16 and n=30, maltodextrin placebo <a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S2475299126018779\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>. Rousselot marketing now cites \"up to 42%\" <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. No whey preload arm, no 12-week HbA1c or CGM data.<\/p><p>Added 8 Oct, competitor: Ingredia's Pep2Dia, a whey hydrolysate (dipeptide AP) with a US NDI registration, is dosed at 700 to 1,400 mg; Ingredia reports a six-week study with lower HbA1c in glucose-intolerant adults (company-reported, not yet checked against the paper) <a href=\"https://www.ingredia-usa.com/pep2dias-new-dietary-ingredient-ndi-registration-approved-by-the-us-fda/\" target=\"_blank\" rel=\"noopener\">Ingredia USA<\/a>, and it was presented for CPHI Milan 2026 as increasing GLP-1 secretion <a href=\"https://www.nutritioninsight.com/news/cphi-milan-2026-hair-mood-heart-eye-cognitive-health.html\" target=\"_blank\" rel=\"noopener\">Nutrition Insight, 28 September 2026<\/a>.<\/p>", "first": "<p>Ask Rousselot for the full Nextida GC data (n, populations, any prediabetic subgroup analysis) by 16 Oct. Map overlap with A1 GC Outcomes before scoring, so the space describes only what A1 does not.<\/p>", "magnitude": "<p>Very large population; no sizing yet for a phenotype product. Provisional space, to be scored by 16 Oct.<\/p>", "tension": "<p>The loser hopes Nextida GC's glucose story opens an FSMP door; Orthomol closes it, since a glucose benefit is a \"general benefit\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62021CJ0418\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. The winner sees the much larger group before diagnosis or before drugs, where \"after-meal glucose\" is a phenotype that can be said and \"diabetes\" cannot <a class=\"cite\" href=\"https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>. 634.8 million adults have impaired glucose tolerance <a class=\"cite\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK618744/\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a>.<\/p>", "uncertainties": "<p>Whether an acute glucose effect persists over weeks; whether a whey preload does as well; how much of this space A1 already covers.<\/p><p>Added 6 Oct: stage and target of the cholesterol Nextida candidate; whether visceral fat can be named in EU claim language. Whether Pep2Dia's sub-gram dose and HbA1c data set the bar Nextida GC is judged against.<\/p>"}, "lastChange": "R3-6: add Ingredia's Pep2Dia as a dairy peptide competitor with HbA1c data at a sub-gram to 1.4 g dose (accepted 2026-10-09)", "name": "Active lane (provisional): early glucose dysregulation as a phenotype (arena A Metabolic health x threshold Products to Outcomes)", "other": ["<p><strong>Added 6 Oct (feedback received).<\/strong> The space widens from glucose to metabolic phenotypes that are not diseases but raise vulnerability: visceral fat (common in Asian populations who are often not obese yet carry higher diabetes risk), borderline cholesterol (above target, below the treatment threshold, managed by diet because there is nothing to prescribe) and high BMI. Rousselot is developing a Nextida candidate specifically for cholesterol. Each phenotype is tested on two questions: who advises the person at the \"not bad enough to treat\" moment, and what claim language is allowed.<\/p>"], "rank": 3, "shortName": "Early blood sugar and metabolic risk", "soWhat": "634.8 million adults have impaired glucose tolerance, and food can talk about after-meal glucose but not diabetes. Nextida GC cut after-meal spikes in short trials; lasting effect is untested.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-09", "verdict": "Test first"}, {"area": "R3", "arena": null, "cell": "", "fields": {"evidence": "<p>Paragraph 55 wording <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>. Fresubin 3.2 kcal is prescribable for dysphagia in the UK datacard <a class=\"cite\" href=\"https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. V CRESC CP10 is sold as a drink and as a jelly in Japan (retail listings) <a class=\"cite\" href=\"https://www.nutri.co.jp/news/detail/0002677.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a><a class=\"cite\" href=\"https://prtimes.jp/main/html/rd/p/000000008.000073095.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. No matched trial of a collagen-based texture-modified FSMP was found in Europe PMC (searched 1 Oct 2026).<\/p>", "first": "<p>Internal check with the gelatin sales team on existing dysphagia customers; one conversation with a texture-modified-food manufacturer.<\/p>", "magnitude": "<p>Not sizeable from public data.<\/p>", "tension": "<p>The loser treats texture and nutrition as separate product lines. The winner sees paragraph 55 naming \"swallowing difficulties ... (e.g. head and neck cancer or surgery)\" as a qualifying need <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>, and gelatin and collagen as both texture and protein.<\/p>", "uncertainties": "<p>Whether IDDSI-level texture can be achieved with gelatin or collagen alone without starch or gums; whether Rousselot's gelatin business already supplies dysphagia makers (internal).<\/p>"}, "lastChange": "Feedback received 6 Oct integrated (6 Oct 2026)", "name": "Carrier lane: dysphagia texture plus protein (arena B x threshold Products to Outcomes)", "other": ["<p>Gate 0 (evidence-adjusted) from the R3 Opportunity Scan, as shared on 2 Oct: 46% (raw 65%), hold and recycle.<\/p>", "<p><strong>Added 6 Oct (idea to check).<\/strong> Format innovation for people who struggle to drink: Jelly Drops, water-dense sweets designed for people with dementia, show that delivery format alone can solve a clinical-nutrition problem <a class=\"cite\" href=\"https://www.alzheimers.org.uk/blog/jelly-drops-sweets-tackle-dehydration-dementia\" target=\"_blank\" rel=\"noopener\">Alzheimer's Society<\/a><a class=\"cite\" href=\"https://www.eib.org/en/stories/dehydration-dementia\" target=\"_blank\" rel=\"noopener\">EIB<\/a>. Whether a gelatin or collagen format could carry hydration plus protein for this group is unchecked; the gelling agent used by Jelly Drops was not verified.<\/p>"], "rank": 4, "shortName": "Texture plus protein for swallowing problems", "soWhat": "EU rules name swallowing difficulties as a qualifying need, and gelatin and collagen give both texture and protein. No matched trial exists, and Rousselot may already supply these makers.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Hold"}, {"area": "R3", "arena": null, "cell": "", "fields": {"evidence": "<p>Weak. Mechanistic and small trials only (Shaw 2017 in healthy men; Praet 2019, n=18, Gelita-funded, Achilles). The one perioperative RCT found 15 g/day after hip replacement left bone markers unchanged <a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S2405457726003499\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>. ESPEN surgery guideline 2025 [22].<\/p>", "first": "<p>One conversation each with an ERAS nurse lead, a sports or orthopaedic physiotherapist and a community pharmacist on what patients take after surgery today and who recommends it. Check registries for collagen trials after ACL, tendon or joint surgery.<\/p>", "magnitude": "<p>Not sizeable from public data. Provisional space, to be scored by 16 Oct.<\/p>", "tension": "<p>The loser sees recovery as a hospital episode with a protein shake at discharge. The winner sees \"recovering from surgery or injury\" as a phenotype a pharmacist or physiotherapist can act on in the weeks after discharge, where collagen's connective-tissue effect (not its protein score) is the reason to buy. Paragraph 55 names \"patients pre or post-surgery\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; ESPEN 2025 pushes early nutrition therapy [22].<\/p>", "uncertainties": "<p>Whether any functional endpoint (return to activity, tendon stiffness) responds to collagen in patients; who pays after discharge; whether the pharmacy or physio channel moves volume.<\/p>"}, "lastChange": "Feedback received 6 Oct integrated (6 Oct 2026)", "name": "Active lane (provisional): connective-tissue recovery after surgery or injury (arena B x threshold Ingredients to Ecosystems)", "other": ["<p><strong>Added 6 Oct (feedback received).<\/strong> Joint and tendon pain is the example raised for the in-between moment: the person is told it is not bad enough to treat, then looks for something themselves. Test this space at that moment (who they ask, what they buy), not only after surgery.<\/p>"], "rank": 5, "shortName": "Collagen for tendon and joint recovery", "soWhat": "People told their joint or tendon pain is not bad enough to treat seek help themselves, from pharmacists or physiotherapists. Collagen's evidence in patients is limited so far.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-06", "verdict": "Test first"}, {"area": "R3", "arena": null, "cell": "", "fields": {"evidence": "<p>Lee 2006: 89 long-term-care residents with stage II to IV pressure ulcers, collagen hydrolysate supplement three times daily for eight weeks, better PUSH scores than placebo [14]. V CRESC CP10 permissions 2021 and 2024 <a class=\"cite\" href=\"https://www.nutri.co.jp/news/detail/0002677.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a><a class=\"cite\" href=\"https://prtimes.jp/main/html/rd/p/000000008.000073095.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. Alipoor 2023: 66 major-burn patients, 40 g/day collagen beverage, faster wound healing than placebo [23]. AM-RL section 24 exclusion <a class=\"cite\" href=\"https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>. Paragraph 55 names \"severe wounds, burns or pressure sores\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>.<\/p>", "first": "<p>Translate the Nutri RCT (Journal of Nutrition and Intermediary Metabolism, vol. 8, 2017, cited by Nutri <a class=\"cite\" href=\"https://www.nutri.co.jp/news/detail/0002677.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a>; not opened) and compare with Lee 2006; map reimbursement in three more countries.<\/p>", "magnitude": "<p>An internal deck gives about 1.8 m malnourished patients (EU plus North America), 10 g/day for 60 days, about 1,080 t, USD 27 to 38 m at full penetration [33]. The base report's realistic figure of USD 3 to 10 m a year is a Limineer estimate, not a sourced one, and should be labelled as such.<\/p>", "tension": "<p>The loser believes the Japanese pressure-ulcer claim and the US Pro-Stat RCT transfer directly to Europe. The winner sees that Germany excludes products offered specifically for \"Dekubitusprophylaxe oder -behandlung\" from reimbursement <a class=\"cite\" href=\"https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>, so the European route is a protein-dense standard product with wound evidence, not a wound-labelled product. Since 5 Oct, this space is also the possible bridge between the lanes: Orthomol requires a disease-driven nutrient requirement <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62021CJ0418\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>, and glycine is the one collagen-specific candidate. Modelling puts the body's glycine shortfall at \"about 10 g per day for a 70 kg human\" <a class=\"cite\" href=\"https://link.springer.com/article/10.1007/s12038-009-0100-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>. If high collagen turnover (pressure ulcers, burns, major surgery) raises that need, a health effect becomes a nutrient requirement an FSMP can carry.<\/p>", "uncertainties": "<p>Whether a \"standard\" high-protein ONS carrying wound trial data would be challenged in Germany as a disguised special product; reimbursement rules in France, the Netherlands and the UK (not checked this round). Is there any patient data on glycine status or need in pressure ulcers, burns or after surgery? The glycine argument rests on one modelling paper <a class=\"cite\" href=\"https://link.springer.com/article/10.1007/s12038-009-0100-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>; it is a hypothesis for Praneeth and a regulatory lawyer, not a position.<\/p>"}, "name": "Bridge: wound healing, from protein for healing to a collagen-specific nutrient need (arena B x threshold Products to Outcomes)", "other": [], "rank": 6, "shortName": "Collagen for wound and pressure-ulcer healing", "soWhat": "Trials show collagen helped pressure ulcers and burns heal, but Germany does not currently reimburse pressure-ulcer products. If high collagen turnover raises glycine need, this could link both routes; that is still a hypothesis.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-05", "verdict": "Test first"}, {"area": "R3", "arena": "Pharma and biomedical", "cell": "", "fields": {"evidence": "<p>Mean incidence 39.1%, discontinuation 9.3% <a class=\"cite\" href=\"https://europepmc.org/article/MED/38601139\" target=\"_blank\" rel=\"noopener\">Kim 2024<\/a>; arthralgia the most common reason for poor adherence <a class=\"cite\" href=\"https://europepmc.org/article/MED/25452437\" target=\"_blank\" rel=\"noopener\">Irwin 2015<\/a>; only acupuncture is recommended and natural-product evidence is rated low <a class=\"cite\" href=\"https://www.oncnursingnews.com/view/asco-sio-panel-recommends-acupuncture-for-adults-with-aromatase-inhibitor-related-joint-pain\" target=\"_blank\" rel=\"noopener\">Oncology Nursing News, Dec 2022<\/a>; tendon and trigger-finger signals for all three AIs <a class=\"cite\" href=\"https://europepmc.org/article/MED/42482750\" target=\"_blank\" rel=\"noopener\">Zhao 2026<\/a>; uncontrolled glucosamine plus chondroitin signal (53 enrolled, 46% improved) <a class=\"cite\" href=\"https://europepmc.org/article/MED/23111941\" target=\"_blank\" rel=\"noopener\">Greenlee 2013<\/a>. No collagen trial in this population was found.<\/p>", "first": "<p>Interview five breast-care nurses and two oncology pharmacists (France via OncoPharma-certified pharmacies <a class=\"cite\" href=\"https://oncologypro.esmo.org/meeting-resources/esmo-congress-2023/supportive-care-in-french-community-pharmacies-oncopharma-certification\" target=\"_blank\" rel=\"noopener\">ESMO 2023<\/a>, Belgium, the Netherlands) on what they tell women with AI joint pain today and what evidence they would need. Draft a placebo-controlled pilot synopsis on the SWOG endpoint (worst pain) so the evidence bar is costed before any commitment.<\/p>", "magnitude": "<p>374,800 new female breast cancers in the EU in 2022 <a class=\"cite\" href=\"https://ecis.jrc.ec.europa.eu/pdf/factsheets/Breast_cancer_2022-Oct_2023.pdf\" target=\"_blank\" rel=\"noopener\">ECIS 2023<\/a>; 4.3 million US women living with a history of breast cancer <a class=\"cite\" href=\"https://www.cancer.org/research/cancer-facts-statistics/survivor-facts-figures.html\" target=\"_blank\" rel=\"noopener\">ACS<\/a>; 70.1% of US cases HR+/HER2- <a class=\"cite\" href=\"https://seer.cancer.gov/statfacts/html/breast-subtypes.html\" target=\"_blank\" rel=\"noopener\">SEER<\/a>. The treated European pool is not sizeable from public data; roughly 100,000 new EU cases of AI arthralgia a year is Limineer arithmetic, not a sourced figure.<\/p>", "tension": "<p>The loser treats aromatase-inhibitor joint pain as a tolerability nuisance handled with analgesics, acupuncture or a switch of drug. The winner sees staying on therapy for five to ten years as the outcome breast-care teams care about, and a nutrition companion carried by the breast-care team as part of keeping women on treatment <a class=\"cite\" href=\"https://europepmc.org/article/MED/25452437\" target=\"_blank\" rel=\"noopener\">Irwin 2015<\/a><a class=\"cite\" href=\"https://europepmc.org/article/MED/40226826\" target=\"_blank\" rel=\"noopener\">Bobo 2025<\/a>.<\/p>", "uncertainties": "<p>Placebo response above 50% in SWOG S0927 <a class=\"cite\" href=\"https://europepmc.org/article/MED/25940724\" target=\"_blank\" rel=\"noopener\">Hershman 2015<\/a>, so any study must be placebo-controlled and powered for it. Whether oncologists will recommend a supplement at all. Whether collagen has a plausible mechanism in a mostly non-inflammatory arthralgia <a class=\"cite\" href=\"https://europepmc.org/article/MED/38601139\" target=\"_blank\" rel=\"noopener\">Kim 2024<\/a>. Whether Colartix's chondroitin helps or muddies the story <a class=\"cite\" href=\"https://www.darlingii.com/rousselot/resources/news/2025/09/rousselot-receives-european-japanese-chinese-patents-for-colartix\" target=\"_blank\" rel=\"noopener\">Darling, Sep 2025<\/a>. Androgen deprivation therapy in prostate cancer is a possible second population <a class=\"cite\" href=\"https://europepmc.org/article/MED/42073599\" target=\"_blank\" rel=\"noopener\">Kumar 2026<\/a>.<\/p>"}, "lastChange": "Add a provisional active-lane space: staying on aromatase-inhibitor therapy (rank 7; fatty-liver watch moves to 8) (accepted 2026-10-06)", "name": "Active lane (provisional): staying on aromatase-inhibitor therapy without the joint and tendon cost (oncology survivorship x Products to Outcomes)", "other": [], "rank": 7, "shortName": "Joint pain on breast cancer hormone therapy", "soWhat": "Joint pain hits 39.1% of women on this therapy and is the most common reason they do not stay on it. No collagen trial exists, and placebo response tops 50%.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Test first"}, {"area": "R3", "arena": "Metabolic health / GLP-1", "cell": "", "fields": {"evidence": "<p>None for collagen; glycine in mice and one uncontrolled human study (base report).<\/p>", "first": "<p>Hold. Ask Praneeth which disease \"lime disease\" in the original email ask meant, and whether any controlled human trial of glycine or collagen in steatosis is planned.<\/p>", "magnitude": "<p>Very large population <a class=\"cite\" href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2835411\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>, no category and no product to size.<\/p>", "tension": "<p>The example raised in the 5 Oct feedback. The loser treats all liver disease as drug-managed. The winner sees that Europe's first MASH drug is licensed only for F2 to F3 fibrosis, about 370,000 eligible patients <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2025/08/19/3136003/0/en/Madrigal-Receives-European-Commission-Approval-for-Rezdiffra-resmetirom-for-the-Treatment-of-MASH-with-Moderate-to-Advanced-Liver-Fibrosis.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>, while about 38% of adults worldwide have MASLD <a class=\"cite\" href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2835411\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>. Earlier steatosis is managed by lifestyle advice, with no nutrition category.<\/p>", "uncertainties": "<p>The \"lime disease\" wording in the original email ask: possibly Lyme disease, possibly liver disease (the deck has a MASLD pathway). This is an open question for Praneeth and should not be resolved by assumption. Lyme disease has no nutritional management evidence found and was marked \"not pursue\" in the base report; that stands only if Praneeth confirms the word meant Lyme.<\/p>"}, "lastChange": "Add a provisional active-lane space: staying on aromatase-inhibitor therapy (rank 7; fatty-liver watch moves to 8) (accepted 2026-10-06)", "name": "Watch: early fatty liver, a condition treated as a disease (arena A Metabolic health x threshold Products to Outcomes)", "other": ["<p><strong>Added 6 Oct (feedback received).<\/strong> Praneeth holds some fatty-liver data (not from a clinical trial) and is discussing exploratory trial protocols with CROs. This makes liver the more likely meaning of the original email ask, but it stays an open question for 13 Oct.<\/p>"], "rank": 8, "shortName": "Early fatty liver before drugs apply", "soWhat": "About 38% of adults have fatty liver, yet Europe's first drug covers only later-stage disease, about 370,000 patients. There is no collagen evidence, and the original request may not mean liver.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Watch"}, {"area": "R3", "arena": "Pharma and biomedical", "cell": "", "fields": {"evidence": "<p>Feedback received 6 Oct: a research group studying the effect of GLP-1 drugs on fertility has two cohorts and a protocol that could be copied to test collagen (scientific rationale via oxidative stress), at low cost. Women's health in the Nextida pipeline covers menopause, perimenopause and hormone imbalance; fertility goes beyond it. No public evidence checked yet.<\/p>", "first": "<p>Ask Praneeth (13 Oct) for the protocol, cohorts, endpoints and cost; decide whether a cheap exploratory trial is worth running before any market work.<\/p>", "magnitude": "<p>Not sized.<\/p>", "tension": "<p>The loser files fertility under women's health and lifestyle. The winner sees that people with fertility problems act fast and move to medical treatment early, so collagen can only enter as a companion to treatment, not as a lifestyle first step, and that an existing trial protocol can be reused cheaply.<\/p>", "uncertainties": "<p>Scientific plausibility; claim language for fertility in the EU (likely medicinal territory); fit with Rousselot's healthy-individual positioning.<\/p>"}, "lastChange": "Added from feedback received 6 Oct", "name": "Watch: fertility as a companion moment (arena Pharma and biomedical x threshold Products to Outcomes)", "other": [], "rank": 9, "shortName": "Collagen alongside fertility treatment", "soWhat": "People with fertility problems move to medical treatment fast, so collagen is most likely to enter as a companion. An existing research protocol could test it cheaply, but plausibility and EU claim rules are unchecked.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Watch"}], "sources": [{"n": 1, "text": "Regulation (EU) No 609/2013 of the European Parliament and of the Council of 12 June 2013 on food intended for infants and young children, food for special medical purposes, and total diet replacement for weight control, EUR-Lex. https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32013R0609", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32013R0609"}, {"n": 2, "text": "Commission Delegated Regulation (EU) 2016/128 of 25 September 2015 supplementing Regulation (EU) No 609/2013 regarding compositional and information requirements for food for special medical purposes, EUR-Lex. https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0128", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0128"}, {"n": 3, "text": "Commission Notice on the classification of Food for Special Medical Purposes (2017/C 401/01), 25 November 2017, EUR-Lex. https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01)", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52017XC1125(01"}, {"n": 4, "text": "Judgment of the Court, Case C-418/21, Orthomol pharmazeutische Vertriebs GmbH v Verband Sozialer Wettbewerb eV, 27 October 2022, EUR-Lex. https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62021CJ0418", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:62021CJ0418"}, {"n": 5, "text": "Gemeinsamer Bundesausschuss, Arzneimittel-Richtlinie (AM-RL), consolidated version in force 1 October 2026, sections 22 to 26 (enterale Ernährung). https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf", "url": "https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf"}, {"n": 6, "text": "Oikawa SY, Kamal MJ, Webb EK, McGlory C, Baker SK, Phillips SM. Whey protein but not collagen peptides stimulate acute and longer-term muscle protein synthesis with and without resistance exercise in healthy older women: a randomized controlled trial. American Journal of Clinical Nutrition 2020;111:708-718. DOI 10.1093/ajcn/nqz332 (record opened via Europe PMC, PMID 31919527).", "url": null}, {"n": 7, "text": "McKendry J, Lowisz CV, Nanthakumar A, MacDonald M, Lim C, Currier BS, Phillips SM. The effects of whey, pea, and collagen protein supplementation beyond the recommended dietary allowance on integrated myofibrillar protein synthetic rates in older males: a randomized controlled trial. American Journal of Clinical Nutrition 2024;120:34-46. DOI 10.1016/j.ajcnut.2024.05.009 (Europe PMC, PMID 38762187).", "url": null}, {"n": 8, "text": "Brook MS, Scaife P, Bass JJ, et al. A collagen hydrolysate/milk protein-blend stimulates muscle anabolism equivalently to an isoenergetic milk protein-blend containing a greater quantity of essential amino acids in older men. Clinical Nutrition 2021;40(6):4456-4464. DOI 10.1016/j.clnu.2021.01.002. https://www.sciencedirect.com/science/article/pii/S0261561421000066", "url": "https://www.sciencedirect.com/science/article/pii/S0261561421000066"}, {"n": 9, "text": "Aussieker T, Kaiser J, Hermans WJH, et al. Ingestion of a Whey Plus Collagen Protein Blend Increases Myofibrillar and Muscle Connective Protein Synthesis Rates. Medicine and Science in Sports and Exercise 2025;57:544-554. DOI 10.1249/mss.0000000000003596 (Europe PMC, PMID 39501478).", "url": null}, {"n": 10, "text": "Nutricia North America, Pro-Stat product page (Specialized Adult Nutrition), accessed 1 October 2026. https://www.specializedadultnutrition.com/en/pro-stat", "url": "https://www.specializedadultnutrition.com/en/pro-stat"}, {"n": 11, "text": "Fresenius Kabi (UK), Fresubin 3.2 kcal DRINK product datacard (PDF), accessed 1 October 2026. https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf", "url": "https://www.fresenius-kabi.com/content/dam/fresenius-kabi/gb/products/product-documents/enteral-nutrition/en-datacards/fresubin-3-2kcal-drink/Fresubin%203.2KCAL%20DRINK.pdf.coredownload.inline.pdf"}, {"n": 12, "text": "Nutri Co., Ltd. (ニュートリー株式会社), news release, 31 August 2021: ブイ・クレスCP10 ミックスフルーツ obtains Consumer Affairs Agency permission as 個別評価型病者用食品. https://www.nutri.co.jp/news/detail/0002677.html", "url": "https://www.nutri.co.jp/news/detail/0002677.html"}, {"n": 13, "text": "PR Times, Nutri Co., Ltd., 19 June 2024: ブイ・クレスCP10 ルビーオレンジ shipped with 個別評価型病者用食品 mark (permission 27 March 2024). https://prtimes.jp/main/html/rd/p/000000008.000073095.html", "url": "https://prtimes.jp/main/html/rd/p/000000008.000073095.html"}, {"n": 14, "text": "Lee SK, Posthauer ME, Dorner B, Redovian V, Maloney MJ. Pressure ulcer healing with a concentrated, fortified, collagen protein hydrolysate supplement: a randomized controlled trial. Advances in Skin and Wound Care 2006;19:92-96. DOI 10.1097/00129334-200603000-00011 (Europe PMC, PMID 16557055).", "url": null}, {"n": 15, "text": "Danone, \"2025: Another year of strong delivery\", full-year results press release, 20 February 2026 (GlobeNewswire). https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html", "url": "https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html"}, {"n": 16, "text": "Nestlé S.A., Full-year results 2025 press release (PDF), 19 February 2026. https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf", "url": "https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf"}, {"n": 17, "text": "Fresenius SE, Annual Report 2025, Management report, Results of operations. https://report.fresenius.com/2025/annual-report/management-report/economic-report/results-of-operations.html", "url": "https://report.fresenius.com/2025/annual-report/management-report/economic-report/results-of-operations.html"}, {"n": 18, "text": "Abbott, \"Abbott Reports Fourth-Quarter and Full-Year 2025 Results; Issues 2026 Financial Outlook\", 22 January 2026. https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook", "url": "https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook"}, {"n": 19, "text": "Medical Nutrition International Industry (MNI), \"Oral Nutritional Supplements to Tackle Malnutrition\", summary booklet, 2012 (PDF). https://www.medicalnutritionindustry.org/content/uploads/2023/10/mnibookletfinal2911-3.pdf", "url": "https://www.medicalnutritionindustry.org/content/uploads/2023/10/mnibookletfinal2911-3.pdf"}, {"n": 20, "text": "US Food and Drug Administration, proposed rule \"Substances Generally Recognized as Safe\", Federal Register, 11 August 2026, docket FDA-2025-N-3262. https://www.federalregister.gov/documents/2026/08/11/2026-16296/substances-generally-recognized-as-safe", "url": "https://www.federalregister.gov/documents/2026/08/11/2026-16296/substances-generally-recognized-as-safe"}, {"n": 21, "text": "Gibson Dunn, \"FDA Proposes Mandatory GRAS Notification for Food Substances, with a Time-Limited Streamlined Path\", client alert, 11 August 2026. https://www.gibsondunn.com/fda-proposes-mandatory-gras-notification-for-food-substances-with-a-time-limited-streamlined-path/", "url": "https://www.gibsondunn.com/fda-proposes-mandatory-gras-notification-for-food-substances-with-a-time-limited-streamlined-path/"}, {"n": 22, "text": "Weimann A, Bezmarevic M, Braga M, et al. ESPEN guideline on clinical nutrition in surgery - Update 2025. Clinical Nutrition 2025;52:222-261. DOI 10.1016/j.clnu.2025.08.029 (Europe PMC record).", "url": null}, {"n": 23, "text": "Alipoor E, Jazayeri S, Dahmardehei M, et al. Effect of a collagen-enriched beverage with or without omega-3 fatty acids on wound healing, metabolic biomarkers, and adipokines in patients with major burns. Clinical Nutrition 2023;42:298-308. DOI 10.1016/j.clnu.2022.12.014 (Europe PMC record).", "url": null}, {"n": 24, "text": "DairyReporter, \"Healthy Aging: GLP-1 Products and beyond\", 2 September 2026. https://www.dairyreporter.com/Article/2026/09/02/healthy-aging-glp-1-products-and-beyond/", "url": "https://www.dairyreporter.com/Article/2026/09/02/healthy-aging-glp-1-products-and-beyond/"}, {"n": 25, "text": "FoodNavigator, \"Danone's playbook in the GLP-1 arena: 3 key moves\", 30 October 2025. https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/", "url": "https://www.foodnavigator.com/Article/2025/10/30/danone-glp-1-strategy/"}, {"n": 26, "text": "Nestlé Health Science US, \"Nestlé Health Science Launches Comprehensive GLP-1 Nutrition Support Platform\", 25 June 2024. https://www.nestlehealthscience.us/stories/nestle-health-science-launches-comprehensive-glp-1nutrition-support-platform", "url": "https://www.nestlehealthscience.us/stories/nestle-health-science-launches-comprehensive-glp-1nutrition-support-platform"}, {"n": 27, "text": "Abbott, \"Abbott Launches New PROTALITY Brand To Support Adults on Their Weight Loss Journey\", PR Newswire, 31 January 2024. https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html", "url": "https://www.prnewswire.com/news-releases/abbott-launches-new-protality-brand-to-support-adults-on-their-weight-loss-journey-302048952.html"}, {"n": 28, "text": "Nestlé, \"Nestlé introduces Vital Pursuit brand to support GLP-1 users in the US\", 21 May 2024. https://www.nestle.com/media/news/vital-pursuit-brand-glp-1-weight-support", "url": "https://www.nestle.com/media/news/vital-pursuit-brand-glp-1-weight-support"}, {"n": 29, "text": "Darling Ingredients, Investors page, news release listing including \"U.S. patent granted for Nextida GC\" (3 June 2026) and second-quarter 2026 results (30 July 2026), accessed 1 October 2026. https://www.darlingii.com/investors", "url": "https://www.darlingii.com/investors"}, {"n": 30, "text": "GELITA, News listing 2026, accessed 1 October 2026. https://www.gelita.com/en/news", "url": "https://www.gelita.com/en/news"}, {"n": 31, "text": "Darling Ingredients, Rousselot brand page with news listing (2025 items), accessed 1 October 2026. https://www.darlingii.com/rousselot", "url": "https://www.darlingii.com/rousselot"}, {"n": 32, "text": "Fresenius SE, Annual Report 2025, \"Kabi story\" (five new enteral nutrition products launched in 2025). https://report.fresenius.com/2025/annual-report/stories/story1.html", "url": "https://report.fresenius.com/2025/annual-report/stories/story1.html"}, {"n": 33, "text": "Limineer internal: Rousselot NBO Portfolio Part 2 (Battlefield Report, Aug 2026); Rousselot Clinical Nutrition Base Report (R3, 28 Sep 2026); Praneeth's Clinical Nutrition V2 deck (Sep 2026). Not public.", "url": null}, {"n": 34, "text": "European Union, Regulation (EU) No 1169/2011 on the provision of food information to consumers, Article 7 (legislation.gov.uk copy of the adopted text). https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted", "url": "https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted"}, {"n": 35, "text": "Meléndez-Hevia E, de Paz-Lugo P, Cornish-Bowden A, Cárdenas ML. A weak link in metabolism: the metabolic capacity for glycine biosynthesis does not satisfy the need for collagen synthesis. Journal of Biosciences 2009;34(6):853-872. https://link.springer.com/article/10.1007/s12038-009-0100-9", "url": "https://link.springer.com/article/10.1007/s12038-009-0100-9"}, {"n": 36, "text": "Myung SK, Park Y. Effects of Collagen Supplements on Skin Aging: A Systematic Review and Meta-Analysis of Randomized Controlled Trials. American Journal of Medicine, 2025. https://www.amjmed.com/article/S0002-9343(25)00283-9/abstract", "url": "https://www.amjmed.com/article/S0002-9343(25)00283-9/abstract"}, {"n": 37, "text": "NutraIngredients, \"Industry reacts to meta-analysis concluding collagen supplements show no proven benefit for skin aging\", 26 August 2025. https://www.nutraingredients.com/Article/2025/08/26/industry-reacts-to-meta-analysis-concluding-collagen-supplements-show-no-proven-benefit-for-skin-aging/", "url": "https://www.nutraingredients.com/Article/2025/08/26/industry-reacts-to-meta-analysis-concluding-collagen-supplements-show-no-proven-benefit-for-skin-aging/"}, {"n": 38, "text": "Nutrition Insight, \"Webinar preview: Rousselot targets GLP-1 companion products with Peptan and Nextida GC\", 31 August 2026. https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html", "url": "https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html"}, {"n": 39, "text": "NutraIngredients, \"Rousselot targets post-meal glucose control with newly patented collagen peptide\", 20 March 2026. https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/", "url": "https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/"}, {"n": 40, "text": "Madrigal Pharmaceuticals, \"Madrigal Receives European Commission Approval for Rezdiffra (resmetirom) for the Treatment of MASH with Moderate to Advanced Liver Fibrosis\", GlobeNewswire, 19 August 2025. https://www.globenewswire.com/news-release/2025/08/19/3136003/0/en/Madrigal-Receives-European-Commission-Approval-for-Rezdiffra-resmetirom-for-the-Treatment-of-MASH-with-Moderate-to-Advanced-Liver-Fibrosis.html"
