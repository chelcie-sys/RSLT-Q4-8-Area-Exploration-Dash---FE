ine.com/home/news/21842993/geltor-animalfree-collagen-ingestibles-by-gelita-and-geltor"}, {"n": 86, "text": "ADM, \"ADM Ventures\" web page. https://adm.com/products-services/admventures", "url": "https://adm.com/products-services/admventures"}, {"n": 87, "text": "Davis Wright Tremaine, \"Food Venture Financing News, Weekly Issue No. 60\", June 2021. https://www.dwt.com/insights/2021/06/food-venture-financing-news-weekly-issue-no-60", "url": "https://www.dwt.com/insights/2021/06/food-venture-financing-news-weekly-issue-no-60"}, {"n": 88, "text": "Givaudan press release, \"Givaudan launches MISTA, a new innovation platform for the food industry\", 2018. https://www.givaudan.com/print/16511", "url": "https://www.givaudan.com/print/16511"}, {"n": 89, "text": "Startupticker.ch, \"An incubator tailor-made to the needs of start-ups\" (Givaudan Zurich Innovation Centre). https://www.startupticker.ch/en/news/an-incubator-tailor-made-to-the-needs-of-start-ups", "url": "https://www.startupticker.ch/en/news/an-incubator-tailor-made-to-the-needs-of-start-ups"}, {"n": 90, "text": "Merck KGaA, Darmstadt, Germany, \"Factsheet New Innovation Center\", 2018. https://www.emdgroup.com/company/350_campaign/ceremony_350/us/Factsheet-IC-US.pdf", "url": "https://www.emdgroup.com/company/350_campaign/ceremony_350/us/Factsheet-IC-US.pdf"}, {"n": 91, "text": "Fast Company, \"How 3M Gave Everyone Days Off and Created an Innovation Dynamo\". https://www.fastcompany.com/1663137/how-3m-gave-everyone-days-off-and-created-an-innovation-dynamo", "url": "https://www.fastcompany.com/1663137/how-3m-gave-everyone-days-off-and-created-an-innovation-dynamo"}, {"n": 92, "text": "Global Corporate Venturing, \"Munich Re winds down $1.2bn VC arm after decade of investing\" (cites GCV survival data). https://globalventuring.com/corporate/services/munich-re-winds-down-1-2bn-vc-arm-after-decade-of-investing/", "url": "https://globalventuring.com/corporate/services/munich-re-winds-down-1-2bn-vc-arm-after-decade-of-investing/"}, {"n": 93, "text": "Nature Biotechnology (2012), \"Six principles of corporate venturing\" study of 48 corporate venture units, doi 10.1038/nbt.2383 (research run with Bain & Company). https://doi.org/10.1038/nbt.2383", "url": "https://doi.org/10.1038/nbt.2383"}, {"n": 94, "text": "INSEAD Knowledge, \"Why Do So Many Corporate VCs Die Young?\", on Gaba and Dokko, \"Learning to let go\" (70 US IT firms, 1992 to 2008). https://knowledge.insead.edu/entrepreneurship/why-do-so-many-corporate-vcs-die-young", "url": "https://knowledge.insead.edu/entrepreneurship/why-do-so-many-corporate-vcs-die-young"}, {"n": 96, "text": "EEPower, \"Schneider Electric Ventures Launched with up to €500 Million\", 18 November 2018. https://eepower.com/news/schneider-electric-ventures-launched-with-up-to-e500-million/", "url": "https://eepower.com/news/schneider-electric-ventures-launched-with-up-to-e500-million/"}], "peers": "<p>The scan's benchmarks leaned on consultancy surveys. This pass adds what ingredient, food and chemicals companies report themselves, from filings, company releases and trade press. Fund sizes and staff numbers are company-stated; none of these units publishes returns.<\/p>\n<table><thead><tr><th>Company and unit<\/th><th>Model<\/th><th>Figures<\/th><th>Read-across for RBB<\/th><\/tr><\/thead><tbody><tr><td><strong>Evonik: Creavis<\/strong><\/td><td>Standing incubation unit; time-boxed \"project houses\" staffed from the business units<\/td><td>About 145 staff running 20+ projects in 2014, with 20 projects handed to operating units in the previous three years <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/more-clout-for-strategic-research-103070.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a>; about 200 staff by 2022 <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 60\">60<\/a>. Project houses run for a normal three-year term with about 15 people <a class=\"cite\" href=\"https://corporate.evonik.com/en/media/press-releases/corporate/attachment/7128?rev=1\" target=\"_blank\" rel=\"noopener\" title=\"Source 62\">62<\/a>, funded by the participating business units plus corporate <a class=\"cite\" href=\"https://list.iupac.org/symposia/conferences/chemrawn/crXVI/N13-Droescher.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>; 12 started since 2000 <a class=\"cite\" href=\"https://publications.evonik.com/en/innovation/success-stories/completed-projects/project-houses\" target=\"_blank\" rel=\"noopener\" title=\"Source 64\">64<\/a>. Innovation growth fields added more than €500m of sales in 2021 against 2015, towards a target above €1bn by 2025 <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 60\">60<\/a>.<\/td><td>A fixed clock and a named receiving business unit are built in from day one; the unit has survived several realignments.<\/td><\/tr><tr><td><strong>Nestlé: R&D Accelerator<\/strong><\/td><td>Six-month \"idea to shop\" sprints inside R&D sites, with staff, students and start-ups<\/td><td>12 sites in 8 countries, 165 participants and nearly 80 products tested in 18 countries, aiming for 100 to 150 projects a year <a class=\"cite\" href=\"https://consumergoods.com/inside-nestles-largest-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 66\">66<\/a>. Group-wide, average project time fell from 33 to 12 months and approval gates were cut from six to three <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2022/12/21/nestle-s-innovation-strategy-we-are-faster-now-than-many-of-the-startups/\" target=\"_blank\" rel=\"noopener\" title=\"Source 67\">67<\/a>.<\/td><td>A short, fixed test window with a real shelf test as the exit, and fewer gates, not more.<\/td><\/tr><tr><td><strong>Evonik and DSM: Veramaris<\/strong><\/td><td>50:50 joint venture combining one partner's strain with the other's fermentation site<\/td><td>Announced March 2017; US$200m plant funded US$100m each <a class=\"cite\" href=\"https://corporate.evonik.com/en/omega-3-fatty-acids-from-natural-marine-algae-1090.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 68\">68<\/a>. Pilot volumes from an existing DSM plant went to customers while the new plant was built <a class=\"cite\" href=\"https://corporate.evonik.com/en/omega-3-fatty-acids-from-natural-marine-algae-1090.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 68\">68<\/a>, and the plant ran within two years, next to Evonik's existing site <a class=\"cite\" href=\"https://corporate.evonik.com/en/unique-facility-begins-production-of-omega-3-fatty-acids-for-sustainable-salmon-farming-114610.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 69\">69<\/a>. First-phase capacity was sized at about 15 per cent of salmon farming's EPA and DHA demand <a class=\"cite\" href=\"https://www.fishfarmingexpert.com/news/evonik-and-dsm-plan-200m-omega-3-factory/\" target=\"_blank\" rel=\"noopener\" title=\"Source 70\">70<\/a>.<\/td><td>Existing plants can carry market development before any new capacity is committed.<\/td><\/tr><tr><td><strong>dsm-firmenich and Fonterra: Vivici<\/strong><\/td><td>Joint venture start-up for precision-fermented dairy protein<\/td><td>Formed in late 2022 and launched in 2023 <a class=\"cite\" href=\"https://app.dealroom.co/companies/vivici\" target=\"_blank\" rel=\"noopener\" title=\"Source 73\">73<\/a>; first customer offtake agreements were signed before a €32.5m Series A in February 2025 <a class=\"cite\" href=\"https://www.innovationquarter.nl/en/vivici-secures-e32-5-million-in-series-a-funding/\" target=\"_blank\" rel=\"noopener\" title=\"Source 71\">71<\/a>, led by APG for ABP and Invest-NL, with both parents following on <a class=\"cite\" href=\"https://pulse2.com/vivici-e32-5-million-series-a-raised-for-making-dairy-protein-from-precision-fermentation/amp/\" target=\"_blank\" rel=\"noopener\" title=\"Source 72\">72<\/a>.<\/td><td>External capital arrived after customer commitments, and the parents kept their stakes.<\/td><\/tr><tr><td><strong>Darling and Valero: Diamond Green Diesel<\/strong><\/td><td>50:50 joint venture: Darling's feedstock, Valero's refinery site<\/td><td>Formed 21 January 2011 <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a>; production began in late June 2013 <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654019000015/dar-20190330x10q.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 75\">75<\/a>. Quarterly distributions are paid when distributable cash exceeds US$50m <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a>; a second plant was approved to lift capacity from 275m to 675m gallons a year <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654020000027/dar-20200926.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 76\">76<\/a>.<\/td><td>Darling's own record already favours partner-built ventures, with cash rules written into the agreement.<\/td><\/tr><tr><td><strong>Tate & Lyle Ventures<\/strong><\/td><td>Independently managed fund, Tate & Lyle as sole limited partner<\/td><td>Fund I: £25m over five years from 2006 <a class=\"cite\" href=\"https://www.just-food.com/?p=17313\" target=\"_blank\" rel=\"noopener\" title=\"Source 77\">77<\/a>. Fund II: £30m over eight years from 2013, targeting eight to ten companies; there had been no exits from Fund I at that point <a class=\"cite\" href=\"https://globalventuring.com/corporate/tate-lyle-sweetens-second-fund/\" target=\"_blank\" rel=\"noopener\" title=\"Source 78\">78<\/a>. Two managing partners run it, with no right of first refusal for Tate & Lyle <a class=\"cite\" href=\"https://agfundernews.com/5-questions-with-tate-lyle-ventures-as-firm-launches-second-food-tech-fund012.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 79\">79<\/a>; Fund I exits followed later, for example in 2015 <a class=\"cite\" href=\"https://www.tateandlyle.com/news/tate-lyle-ventures-delivers-latest-exit-fund-i\" target=\"_blank\" rel=\"noopener\" title=\"Source 80\">80<\/a>.<\/td><td>Small, fixed envelopes with a long horizon: Fund I had no exits six years in.<\/td><\/tr><tr><td><strong>Danone Manifesto Ventures<\/strong><\/td><td>Corporate venture fund for brands next to the core<\/td><td>Set up in 2016 with an initial US$150m and a goal of six to seven deals a year <a class=\"cite\" href=\"https://esmmagazine.com/a-brands/french-group-danones-venture-capital-fund-eyes-20-25-deals-2020-61465\" target=\"_blank\" rel=\"noopener\" title=\"Source 81\">81<\/a>. Its first deal, a 40 per cent stake in Michel et Augustin, later became a majority holding, reported at about 95 per cent <a class=\"cite\" href=\"https://just-food.com/?p=88617\" target=\"_blank\" rel=\"noopener\" title=\"Source 82\">82<\/a>.<\/td><td>Minority-to-control is a real route; it needs agreed step-up terms at the start.<\/td><\/tr><tr><td><strong>GELITA<\/strong><\/td><td>Start-up partnership programme plus investment<\/td><td>Start-ups are routed to innovation projects, business-unit co-development or the investment team <a class=\"cite\" href=\"https://startups.gelita.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 84\">84<\/a>. After investing in Geltor, GELITA agreed that Geltor would design and make animal-free collagen while GELITA ran the clinical research and sold it <a class=\"cite\" href=\"https://www.gcimagazine.com/home/news/21842993/geltor-animalfree-collagen-ingestibles-by-gelita-and-geltor\" target=\"_blank\" rel=\"noopener\" title=\"Source 85\">85<\/a>.<\/td><td>The closest peer in collagen splits the work by strength: partner makes, incumbent proves and sells.<\/td><\/tr><tr><td><strong>ADM Ventures and dsm-firmenich Ventures<\/strong><\/td><td>Ingredient majors' venture arms<\/td><td>ADM Ventures prefers a board seat or observer role and often acts as customer, distributor or supplier to its start-ups <a class=\"cite\" href=\"https://adm.com/products-services/admventures\" target=\"_blank\" rel=\"noopener\" title=\"Source 86\">86<\/a>; its portfolio has included Geltor <a class=\"cite\" href=\"https://www.dwt.com/insights/2021/06/food-venture-financing-news-weekly-issue-no-60\" target=\"_blank\" rel=\"noopener\" title=\"Source 87\">87<\/a>. dsm-firmenich Ventures has backed more than 100 start-ups since 2001 <a class=\"cite\" href=\"https://www.dsm-firmenich.com/ventures\" target=\"_blank\" rel=\"noopener\" title=\"Source 83\">83<\/a>.<\/td><td>Commercial links (supply, distribution) carry as much weight as the cheque.<\/td><\/tr><tr><td><strong>Givaudan<\/strong><\/td><td>MISTA platform and a demand test before an incubator<\/td><td>MISTA aimed for 20 start-ups in its first year, about ten on site <a class=\"cite\" href=\"https://www.givaudan.com/print/16511\" target=\"_blank\" rel=\"noopener\" title=\"Source 88\">88<\/a>. For its Zurich centre, Givaudan ran a call for interest and said it would open an incubator only if there was a real need <a class=\"cite\" href=\"https://www.startupticker.ch/en/news/an-incubator-tailor-made-to-the-needs-of-start-ups\" target=\"_blank\" rel=\"noopener\" title=\"Source 89\">89<\/a>.<\/td><td>Test demand for the intake channel before building it.<\/td><\/tr><\/tbody><\/table>\n<h4>Survival and staffing<\/h4>\n<ul>\n<li>About 40 per cent of corporate venture units close within their first three years, on Global Corporate Venturing's tracking <a class=\"cite\" href=\"https://globalventuring.com/corporate/services/munich-re-winds-down-1-2bn-vc-arm-after-decade-of-investing/\" target=\"_blank\" rel=\"noopener\" title=\"Source 92\">92<\/a>. A 2012 study of 48 units put average lifespan at about four years, up from 2.5 in the previous decade <a class=\"cite\" href=\"https://doi.org/10.1038/nbt.2383\" target=\"_blank\" rel=\"noopener\" title=\"Source 93\">93<\/a>.<\/li>\n<li>In a study of 70 US IT firms, units staffed with a higher share of internal hires were more likely to be abandoned <a class=\"cite\" href=\"https://knowledge.insead.edu/entrepreneurship/why-do-so-many-corporate-vcs-die-young\" target=\"_blank\" rel=\"noopener\" title=\"Source 94\">94<\/a>.<\/li>\n<li>Protected time has known shapes: Merck KGaA offers employees a three-month residency in its Innovation Center <a class=\"cite\" href=\"https://www.emdgroup.com/company/350_campaign/ceremony_350/us/Factsheet-IC-US.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 90\">90<\/a>; 3M has allowed up to 15 per cent of working time on own projects since 1948 <a class=\"cite\" href=\"https://www.fastcompany.com/1663137/how-3m-gave-everyone-days-off-and-created-an-innovation-dynamo\" target=\"_blank\" rel=\"noopener\" title=\"Source 91\">91<\/a>.<\/li>\n<li>Time horizons are long in chemistry-based units. Peter Nagler, then Evonik Chief Innovation Officer, told Chemical Week (27 January 2014): \"Eight to 10 years would be nothing for development of new products for Creavis.\" <a class=\"cite\" href=\"https://chemweek.mydigitalpublication.com/janurary-27-2014/20\" target=\"_blank\" rel=\"noopener\" title=\"Source 65\">65<\/a><\/li>\n<\/ul>\n<h4>What this adds to the eight choices<\/h4>\n<ul>\n<li><strong>Where RBB sits:<\/strong> the longest-lived peer (Creavis) hands projects to a named business unit on a fixed clock <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/more-clout-for-strategic-research-103070.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a><a class=\"cite\" href=\"https://corporate.evonik.com/en/media/press-releases/corporate/attachment/7128?rev=1\" target=\"_blank\" rel=\"noopener\" title=\"Source 62\">62<\/a>, which gives a unit inside Rousselot a defined exit rather than a permanent home.<\/li>\n<li><strong>Funding model:<\/strong> co-funding by the receiving business unit (Creavis) <a class=\"cite\" href=\"https://list.iupac.org/symposia/conferences/chemrawn/crXVI/N13-Droescher.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a> and equal partner funding (Veramaris, Diamond Green Diesel) <a class=\"cite\" href=\"https://corporate.evonik.com/en/omega-3-fatty-acids-from-natural-marine-algae-1090.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 68\">68<\/a><a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a> are the common patterns; fixed envelopes run for five to eight years (Tate & Lyle) <a class=\"cite\" href=\"https://www.just-food.com/?p=17313\" target=\"_blank\" rel=\"noopener\" title=\"Source 77\">77<\/a><a class=\"cite\" href=\"https://globalventuring.com/corporate/tate-lyle-sweetens-second-fund/\" target=\"_blank\" rel=\"noopener\" title=\"Source 78\">78<\/a>.<\/li>\n<li><strong>Idea intake:<\/strong> a short residency (Merck) <a class=\"cite\" href=\"https://www.emdgroup.com/company/350_campaign/ceremony_350/us/Factsheet-IC-US.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 90\">90<\/a> or a demand test before building (Givaudan) <a class=\"cite\" href=\"https://www.startupticker.ch/en/news/an-incubator-tailor-made-to-the-needs-of-start-ups\" target=\"_blank\" rel=\"noopener\" title=\"Source 89\">89<\/a> both fit a unit starting with a few named scientists.<\/li>\n<li><strong>Build route:<\/strong> in ingredients the partner or joint-venture route dominates, including in Darling's own history and at GELITA in collagen <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a><a class=\"cite\" href=\"https://www.gcimagazine.com/home/news/21842993/geltor-animalfree-collagen-ingestibles-by-gelita-and-geltor\" target=\"_blank\" rel=\"noopener\" title=\"Source 85\">85<\/a>. Existing plants can supply pilot volumes before any new capacity, as at Veramaris <a class=\"cite\" href=\"https://corporate.evonik.com/en/omega-3-fatty-acids-from-natural-marine-algae-1090.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 68\">68<\/a>.<\/li>\n<li><strong>Portfolio shape:<\/strong> Creavis ran 20+ projects with about 145 people <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/more-clout-for-strategic-research-103070.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a>; three concurrent ventures is a small-unit figure, not a peer norm, and should be read that way.<\/li>\n<li><strong>Governance:<\/strong> cash and exit rules can be written into the venture agreement itself, as in Diamond Green Diesel's distribution policy <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a>.<\/li>\n<li><strong>Metrics:<\/strong> peers report transfers to business units <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/more-clout-for-strategic-research-103070.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a>, products tested in market <a class=\"cite\" href=\"https://consumergoods.com/inside-nestles-largest-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 66\">66<\/a> and time to market <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2022/12/21/nestle-s-innovation-strategy-we-are-faster-now-than-many-of-the-startups/\" target=\"_blank\" rel=\"noopener\" title=\"Source 67\">67<\/a>, not venture revenue; Tate & Lyle's first fund had no exits six years in <a class=\"cite\" href=\"https://globalventuring.com/corporate/tate-lyle-sweetens-second-fund/\" target=\"_blank\" rel=\"noopener\" title=\"Source 78\">78<\/a><a class=\"cite\" href=\"https://www.tateandlyle.com/news/tate-lyle-ventures-delivers-latest-exit-fund-i\" target=\"_blank\" rel=\"noopener\" title=\"Source 80\">80<\/a>.<\/li>\n<li><strong>Staffing:<\/strong> our read of the abandonment finding, which comes from IT venture-capital units, <a class=\"cite\" href=\"https://knowledge.insead.edu/entrepreneurship/why-do-so-many-corporate-vcs-die-young\" target=\"_blank\" rel=\"noopener\" title=\"Source 94\">94<\/a> argues for at least one external or venture-experienced hire alongside seconded scientists.<\/li>\n<\/ul>", "builder": "<p>Limineer wrote this map and works with Rousselot today, so it has an interest in these choices. This section sets out where an outside builder usually sits in each of the eight choices, where it should not, and how it hands over, so the decision can be made on its merits. Every model above can also run without one.<\/p>\n<table><thead><tr><th>Choice<\/th><th>Where an external builder usually helps<\/th><th>Where it should not sit<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Where RBB sits<\/strong><\/td><td>Method and part of the team, under an internal sponsor, while the unit is new<\/td><td>Owning the unit, its budget or its pipeline<\/td><td>Schneider Electric, whose incubator spun out ventures such as eIQ Mobility, within a €300m to €500m ventures commitment <a class=\"cite\" href=\"https://eepower.com/news/schneider-electric-ventures-launched-with-up-to-e500-million/\" target=\"_blank\" rel=\"noopener\" title=\"Source 96\">96<\/a> <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>; Limineer with Rousselot today<\/td><\/tr><tr><td><strong>Funding model<\/strong><\/td><td>Drafting stage ceilings and evidence criteria; preparing the case for each tranche<\/td><td>Deciding or releasing money<\/td><td>Tate &amp; Lyle shows a different, fully external model: an independent manager running a fund with Tate &amp; Lyle as sole limited partner <a class=\"cite\" href=\"https://agfundernews.com/5-questions-with-tate-lyle-ventures-as-firm-launches-second-food-tech-fund012.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 79\">79<\/a><\/td><\/tr><tr><td><strong>Idea intake<\/strong><\/td><td>Running discovery sprints and coaching scientists through first customer conversations<\/td><td>Owning the ideas, which sit with Rousselot's scientists and customers<\/td><td>Nestlé's R+D Accelerator, which runs fixed six-month sprints to a shop test <a class=\"cite\" href=\"https://consumergoods.com/inside-nestles-largest-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 66\">66<\/a><\/td><\/tr><tr><td><strong>Build route<\/strong><\/td><td>Desk work on partner, licensing and acquisition options; early partner and customer conversations<\/td><td>Negotiating joint-venture or acquisition terms, which sit with Rousselot, Darling corporate development and legal<\/td><td>Veramaris and Diamond Green Diesel were negotiated corporate to corporate <a class=\"cite\" href=\"https://corporate.evonik.com/en/omega-3-fatty-acids-from-natural-marine-algae-1090.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 68\">68<\/a><a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a><\/td><\/tr><tr><td><strong>Portfolio shape<\/strong><\/td><td>Comparison with other ventures and corporates when setting the mix<\/td><td>Setting the ambition, which is a leadership call<\/td><td>No peer example sourced<\/td><\/tr><tr><td><strong>Governance<\/strong><\/td><td>Preparing board papers; an outside voice in the room, without a vote on Rousselot capital<\/td><td>Voting on Rousselot money<\/td><td>Chemovator's board included the head of BASF's venture capital unit <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><\/td><\/tr><tr><td><strong>Metrics<\/strong><\/td><td>Setting up innovation accounting and the first dashboard<\/td><td>Owning the numbers it is judged on; an internal owner should hold them<\/td><td>Toma and Gons on innovation accounting <a class=\"cite\" href=\"https://ssir.org/books/excerpts/entry/analyzing_your_innovation_portfolio\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a><\/td><\/tr><tr><td><strong>Staffing<\/strong><\/td><td>Interim venture leads and method in year one, with the handover planned from the start<\/td><td>Permanent roles<\/td><td>Bionova, where the venture boards moved to a team-led format<\/td><\/tr><\/tbody><\/table>\n<h4>When an outside builder adds little<\/h4>\n<ul>\n<li>Moves that are extensions inside one business unit, with an existing team and customers.<\/li>\n<li>Joint ventures where the partner brings its own build capacity and plant, as in the Veramaris and Diamond Green Diesel cases <a class=\"cite\" href=\"https://corporate.evonik.com/en/omega-3-fatty-acids-from-natural-marine-algae-1090.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 68\">68<\/a><a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/0000916540/000091654020000007/dar-2019122810xk.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 74\">74<\/a>.<\/li>\n<li>Once RBB has run a full cycle (intake, sprint, board, kill or continue) with its own leads.<\/li>\n<\/ul>\n<h4>Handover markers worth agreeing at the start<\/h4>\n<ul>\n<li>An internal lead prepares and presents the board papers.<\/li>\n<li>An internal owner holds the dashboard and the stage criteria.<\/li>\n<li>The outside role is reviewed at each annual charter review, with a default of shrinking it.<\/li>\n<\/ul>\n<p>The staffing evidence cuts both ways: units run mostly by internal hires were more likely to be abandoned <a class=\"cite\" href=\"https://knowledge.insead.edu/entrepreneurship/why-do-so-many-corporate-vcs-die-young\" target=\"_blank\" rel=\"noopener\" title=\"Source 94\">94<\/a>, while a unit that never builds its own capability stays dependent. A mixed team with a dated handover is the middle path; where that line sits is Rousselot's call.<\/p>"}]};

  if(typeof t==='string') return `<li>${esc(t)}</li>`;
  const L=t.links||[], f=L.find(l=>l.go);
  return `<li>${f?jump(f,'main',esc(t.text)):esc(t.text)}${chips(L)}</li>`;
}
function soWhat(sw,fallback){
  if(!sw) return fallback?`<div class="sowhat prose">${fallback}</div>`:'';
  const cell=(k,lab)=>{ if(!sw[k])return ''; const L=sw[k+'Links']||[], f=L.find(l=>l.go);
    return `<div><span class="label">${lab}</span><p>${f?jump(f,'main',esc(sw[k])):esc(sw[k])}</p>${chips(L)}</div>`; };
  return `<div class="sowhat"><p class="sw-head">${esc(sw.headline)}</p>
    ${(sw.takeaways||[]).length?`<ul class="sw-list">${sw.takeaways.map(swPoint).join('')}</ul>`:''}
    <div class="sw-grid">${cell('forRousselot','What it means for Rousselot')}${cell('next','Next step')}${cell('watchOut','Watch out')}</div></div>`;
}

const D=DATA, A=D.areas, M=D.meta||{};
const sec=t=>(M.sections||[]).find(s=>s.title.toLowerCase().startsWith(t));
const ALL=[]; A.forEach(a=>a.spaces.forEach(s=>ALL.push({...s,_a:a})));

function spaceBlock(s,a){
  const f=s.fields||{}, id=a.code.toLowerCase();
  const F=[['tension','The tension'],['evidence','Evidence'],['magnitude','How big'],['uncertainties','Open questions']];
  const upd=(s.other||[]).length?`<div class="field wide updates"><span class="label">Since the scan</span><div class="prose">${s.other.join('')}</div></div>`:'';
  return `<details class="space" id="${id}-s${s.rank}">
   <summary><span class="rank ${s.rank===1?'r1':''}">${s.rank}</span>
    <div><h3>${esc(sname(s))}${vpill(s.verdict)}${s.lastChange&&s.updatedAt?`<span class="updated">Updated ${fmtDate(s.updatedAt)}</span>`:''}</h3>
    <p class="sw-line">${ssw(s)}</p>${f.first?`<p class="sw-first"><b>First move</b>${esc(firstSentence(f.first))}</p>`:''}</div>
    <span class="tw-label"><span class="t">Evidence</span><span class="tw" aria-hidden="true">›</span></span></summary>
   <div class="detail">${s.shortName?`<div class="fullname">${esc(s.name)}</div>`:''}
    <div class="fields">${F.filter(([k])=>f[k]).map(([k,l])=>`<div class="field"><span class="label">${l}</span><div class="prose">${f[k]}</div></div>`).join('')}
    ${f.first?`<div class="field wide first"><span class="label">What Rousselot could do first</span><div class="prose">${f.first}</div></div>`:''}${upd}</div></div></details>`;
}
const legend=`<div class="legend">${['Lead','Promising','Test first','Watch','Hold','Park'].map(v=>{const t={'Lead':'strongest case now','Promising':'worth a deep dive','Test first':'one cheap test decides it','Watch':'track, no action yet','Hold':'paused pending input','Park':'not for now'}[v];return `<span>${vpill(v)}${t}</span>`}).join('')}</div>`;

function overviewView(){
  const prem=liItems(sec('four premises')?.html), st=liItems(sec('settled')?.html), hr=sec('the highest-ranked');
  const cards=(items,cls)=>items.map(p=>{const m=p.match(/^<strong>(.*?)<\/strong>\s*([\s\S]*)$/);const body=m?m[2]:p;const t=strip(body);const k=t.search(/\.\s/);return `<div class="premise ${cls||''}"><h3>${m?m[1].replace(/\.$/,''):''}</h3><p>${esc(k>0?t.slice(0,k+1):t)}</p></div>`}).join('');
  const nSources=A.reduce((n,a)=>n+a.sources.length,0);
  return `<div class="view" id="v-overview">
   <span class="label">Research and mapping, Q4 2026</span>
   <h1 class="h-title">Eight areas, one choice on 30 October</h1>
   <p class="lede">A desk scan and an initial map of the liminal spaces in each of the eight research areas, ranked by potential for Rousselot. It is Limineer's read for discussion, built to help choose three or four areas for deep dives.</p>
   <div class="status"><span><b>${A.length}</b> areas</span><span><b>${ALL.length}</b> spaces ranked</span><span><b>${nSources}</b> sources, all linked</span><span>Status at <b>9 October 2026</b></span></div>
   ${soWhat(M.soWhat)}
   <section class="block"><span class="label">Area by area</span><h2>The headline from each area</h2>
    <div class="area-list">${A.map(a=>{const t=a.spaces.find(s=>s.rank===1);const id=a.code.toLowerCase();return `<a class="area-row" href="#${id}" data-go="${id}"><span class="pill ${engClass(a.engine)}">${a.code}</span><div><div class="ar-name">${esc(a.name)}</div><div class="ar-head">${esc(a.soWhat?.headline||strip(a.oneLine).slice(0,200))}</div>${t?`<div class="ar-top">Leading space: ${esc(sname(t))}</div>`:''}</div><span class="go" aria-hidden="true">›</span></a>`}).join('')}</div></section>
   ${prem.length?`<section class="block"><span class="label">Read this first</span><h2>Premises the research changes</h2><div class="premises">${cards(prem)}</div></section>`:''}
   ${st.length?`<section class="block"><span class="label">Settled since the scan</span><h2>Decisions already made</h2><div class="premises">${cards(st,'settled')}</div></section>`:''}
   <section class="block"><span class="label">Background</span><h2>Method and detail</h2>
    ${hr?more('Why each leading space ranks first',`<div class="prose tablewrap">${hr.html}</div>`):''}
    ${sec('what the research')?more('What the research says about the likely test candidates',`<div class="prose">${sec('what the research').html}</div>`):''}
    ${sec('the naming')?more('A note on the name Nextida',`<div class="prose">${sec('the naming').html}</div>`):''}
    ${prem.length?more('The premises in full',`<div class="prose"><ol>${prem.map(x=>`<li>${x}</li>`).join('')}</ol></div>`):''}
    ${sec('what this')?more('What this document is',`<div class="prose">${sec('what this').html}</div>`):''}
    ${sec('how to read')?more('How to read an area',`<div class="prose">${sec('how to read').html}</div>`):''}
    ${sec('caveats')?more('Caveats on this pass',`<div class="prose">${sec('caveats').html}</div>`):''}
   </section></div>`;
}
const filt={th:new Set(),en:new Set(),top:false};
function spacesView(){
  const ths=[...new Set(ALL.map(s=>s.threshold).filter(t=>t&&t!=='None'))];
  return `<div class="view" id="v-spaces" hidden><span class="label">Across all areas</span><h1 class="h-title">All ${ALL.length} spaces</h1>
   <p class="lede">Every liminal space from the seven market areas, with its rank inside its own area. Filter by threshold or engine, then open a card for the tension, evidence, size and first move.</p>
   <div class="filters"><span class="lab">Threshold</span>${ths.map(t=>`<button class="fchip" data-f="th" data-v="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
   <div class="filters"><span class="lab">Engine</span>${['Core','Add more'].map(t=>`<button class="fchip" data-f="en" data-v="${t}" aria-pressed="false">${t==='Core'?'Core: protect what pays today':'Add more: build what pays tomorrow'}</button>`).join('')}<button class="fchip" data-f="top" data-v="1" aria-pressed="false">Top-ranked only</button></div>
   <div class="grid" id="spacegrid"></div><div class="empty" id="spaceempty" hidden>No spaces match these filters. Clear one to see more.</div></div>`;
}
function renderSpaces(){
  const list=ALL.filter(s=>(!filt.th.size||filt.th.has(s.threshold))&&(!filt.en.size||filt.en.has(s._a.engine))&&(!filt.top||s.rank===1));
  $('#spacegrid').innerHTML=list.map(s=>{const id=s._a.code.toLowerCase();return `<a class="card" href="#${id}" data-jump="${id}" data-anchor="${id}-s${s.rank}"><div class="meta"><span class="rank ${s.rank===1?'r1':''}">${s.rank}</span><span class="pill ${engClass(s._a.engine)}">${s._a.code}</span>${vpill(s.verdict)}</div><h3>${esc(sname(s))}</h3><div class="snip">${ssw(s)}</div></a>`}).join('');
  $('#spaceempty').hidden=list.length>0;
}
function areaView(a,i){
  const id=a.code.toLowerCase(), isR8=a.code==='R8', rep=repOf(a);
  const scan=(a.scan||[]).map((s,k)=>acc(s.title,s.html,`${id}-scan-${k+1}`)).join('');
  const map=isR8?'':`<section class="block" id="${id}-map"><span class="label">The spaces, ranked</span><h2>Where the opportunity sits</h2><div class="spaces">${a.spaces.map(s=>spaceBlock(s,a)).join('')}</div></section>`;
  const swOpts={}; (a.soWhat?.options||[]).forEach(o=>swOpts[o.title]=o.soWhat);
  const opts=isR8?`<section class="block" id="${id}-map"><span class="label">Options</span><h2>Eight design choices for RBB</h2><div class="spaces">${(a.options||[]).map((o,k)=>`<details class="space opt" id="${id}-o${k+1}"><summary><span class="rank">${k+1}</span><div><h3>${esc(o.title)}</h3><p class="sw-line">${esc(swOpts[o.title]||'')}</p></div><span class="tw-label"><span class="t">Options and benchmarks</span><span class="tw" aria-hidden="true">›</span></span></summary><div class="detail prose tablewrap" style="max-width:none;padding-top:14px">${o.html}</div></details>`).join('')}</div></section>`:'';
  const peers=a.peers?`<section class="block" id="${id}-peers"><span class="label">Benchmarks from peers</span><h2>What peers report</h2><div class="prose tablewrap" style="max-width:none">${a.peers}</div></section>`:'';
  const builder=a.builder?`<section class="block" id="${id}-builder"><span class="label">Outside support</span><h2>Where an external builder fits</h2><div class="prose tablewrap" style="max-width:none">${a.builder}</div></section>`:'';
  const prev=A[i-1], next=A[i+1];
  const support=[
    a.soWhat&&a.oneLine?more('Full summary',`<div class="prose">${a.oneLine}</div>`,false,id+'-summary'):'',
    isR8&&a.optionsIntro?more('How to read the options',`<div class="prose">${a.optionsIntro}</div>`):'',
    more(isR8?'The scan: trends, benchmarks, reference models, governance, signals':'The scan: trends, size, players, regulation, signals',scan,false,id+'-scan'),
    a.mapIntro?more('Notes on the map',`<div class="prose">${a.mapIntro}</div>`,false,id+'-mapnotes'):'',
    (a.extras||[]).length?more('Updates and cross-cutting notes',a.extras.map((e,k)=>acc(e.title,e.html,`${id}-x${k+1}`)).join(''),false,id+'-more',a.extras.length):'',
    isR8&&a.bionova?more('Bionova learnings to capture',`<div class="prose">${a.bionova}</div>`,false,id+'-bionova'):'',
    a.internal?more('What we need from Rousselot to finish the map',`<div class="prose">${a.internal}</div>`,false,id+'-inputs'):'',
    more('Sources',`<ol class="srcs">${a.sources.map(s=>`<li id="${id}-src${s.n}"><span class="n">${s.n}</span><span>${s.url?(s.text.includes(s.url)?esc(s.text).replace(esc(s.url),`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//,''))}</a>`):`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.text)}</a>`):esc(s.text)}</span></li>`).join('')}</ol>${a.sourceNote?`<div class="prose" style="font-size:13px;color:var(--muted);margin-top:14px">${a.sourceNote}</div>`:''}`,false,id+'-sources',a.sources.length)
  ].join('');
  return `<div class="view" id="v-${id}" hidden>
   <div class="ahead"><div><span class="label">Research area ${a.code.slice(1)} · ${esc(a.engine_long||a.engine)}</span><h1 class="h-title">${esc(a.name)}</h1></div>
   ${rep?`<a class="rep-btn" href="${esc(rep.url)}" target="_blank" rel="noopener">Open the ${esc(rep.title)} ↗</a>`:''}</div>
   ${soWhat(a.soWhat,a.oneLine)}
   ${map}${opts}${peers}${builder}
   <section class="block"><span class="label">Supporting detail</span>${support}</section>
   <div class="pager"><button data-go="${prev?prev.code.toLowerCase():'overview'}">‹ ${prev?prev.code+' '+esc(prev.name):'Overview'}</button><button data-go="${next?next.code.toLowerCase():'overview'}">${next?next.code+' '+esc(next.name):'Overview'} ›</button></div></div>`;
}
function questionsView(){
  const qs=liItems(sec('questions')?.html), st=liItems(sec('settled')?.html);
  return `<div class="view" id="v-questions" hidden><span class="label">Before the maps are finalised</span><h1 class="h-title">Open questions</h1>
   <p class="lede">What has been settled since the scan, what is still open, and the internal inputs each area needs. Most can only be answered inside Rousselot.</p>
   ${st.length?`<section class="block" style="margin-top:32px"><span class="label">Settled</span><h2>Decided since the scan</h2><div class="premises">${st.map(x=>{const m=x.match(/^<strong>(.*?)<\/strong>\s*([\s\S]*)$/);return `<div class="premise settled"><h3>${m?m[1].replace(/\.$/,''):''}</h3><p>${m?esc(strip(m[2])):x}</p></div>`}).join('')}</div></section>`:''}
   <section class="block"><span class="label">Still open</span><h2>${qs.length} questions</h2><ol class="qlist">${qs.map(q=>`<li><span>${q}</span></li>`).join('')}</ol></section>
   <section class="block"><span class="label">By area</span><h2>Internal inputs needed</h2>${A.filter(a=>a.internal).map(a=>acc(a.code+'  '+a.name,a.internal)).join('')}</section></div>`;
}

/* tabs and render */
const SHORT={R1:'Supply resilience',R2:'Value chain',R3:'Clinical nutrition',R4:'Aesthetics and biomedical',R5:'Pet health',R6:'Owning the outcome',R7:'AI and data',R8:'How Rousselot builds'};
const TABS=[{id:'overview',label:'Overview'},{id:'spaces',label:'All spaces'},...A.map(a=>({id:a.code.toLowerCase(),label:SHORT[a.code]||a.name,code:a.code,full:a.name}))];
$('#rail').innerHTML=TABS.map(t=>`<button class="tab ${t.sep?'sep':''}" role="tab" data-id="${t.id}" aria-selected="false" ${t.full?`title="${esc(t.full)}"`:''}>${t.code?`<span class="code">${t.code}</span>`:''}${esc(t.label)}</button>`).join('');
$('#views').innerHTML=overviewView()+spacesView()+A.map(areaView).join('')+`<div class="view" id="v-search" hidden><span class="label">Search</span><h1 class="h-title" id="searchtitle" style="max-width:none;font-size:30px"></h1><div id="results" style="margin-top:18px"></div></div>`;
$$('.prose table').forEach(t=>{if(!t.parentElement.classList.contains('tablewrap')){const w=document.createElement('div');w.className='tablewrap';t.replaceWith(w);w.appendChild(t);}});
$$('#views a[href*="claude.ai/code/artifact"],#views a[href*="claude.ai/artifact"]').forEach(a=>a.replaceWith(...a.childNodes));
$$('#views a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
renderSpaces();

let current='overview';
function show(id){ current=id; $$('.view').forEach(v=>v.hidden=v.id!=='v-'+id); $$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===id)); const tb=$(`.tab[data-id="${id}"]`); if(tb) tb.scrollIntoView({block:'nearest',inline:'nearest'}); }
function go(id,anchor){
  if(!$('#v-'+id)) id='overview';
  show(id); if(id!=='search'){try{history.replaceState(null,'','#'+id)}catch(e){}}
  if(anchor){const el=document.getElementById(anchor); if(el){ for(let n=el;n;n=n.parentElement){ if(n.tagName==='DETAILS') n.open=true; }
    setTimeout(()=>{ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); },30); } }
  else window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
  const t=e.target; if(t.closest('a[target="_blank"]')) return;
  const tab=t.closest('.tab'); if(tab){ $('#q').value=''; go(tab.dataset.id); return; }
  const j=t.closest('[data-jump]'); if(j){ e.preventDefault(); $('#q').value=''; go(j.dataset.jump,j.dataset.anchor||null); return; }
  const g=t.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const fc=t.closest('.fchip'); if(fc){ const f=fc.dataset.f,v=fc.dataset.v,on=fc.getAttribute('aria-pressed')!=='true'; fc.setAttribute('aria-pressed',on); if(f==='top')filt.top=on; else on?filt[f].add(v):filt[f].delete(v); renderSpaces(); }
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  const ids=TABS.map(t=>t.id), i=ids.indexOf(current); if(i<0)return;
  if(e.key==='ArrowRight'&&i<ids.length-1) go(ids[i+1]); if(e.key==='ArrowLeft'&&i>0) go(ids[i-1]);
});

/* search */
const index=[];
A.forEach(a=>{const id=a.code.toLowerCase();
  (a.scan||[]).forEach((s,k)=>index.push({where:a.code+', scan',what:s.title,text:strip(s.html),go:id,anchor:`${id}-scan-${k+1}`}));
  a.spaces.forEach(s=>index.push({where:a.code+', space '+s.rank,what:sname(s),text:strip((s.soWhat||'')+' '+Object.values(s.fields||{}).join(' ')+(s.other||[]).join(' ')),go:id,anchor:`${id}-s${s.rank}`}));
  (a.options||[]).forEach((o,k)=>index.push({where:a.code+', option',what:o.title,text:strip(o.html),go:id,anchor:`${id}-o${k+1}`}));
  (a.extras||[]).forEach((x,k)=>index.push({where:a.code+', update',what:x.title,text:strip(x.html),go:id,anchor:`${id}-x${k+1}`}));
  if(a.builder) index.push({where:a.code+', external builder',what:'Where an external builder fits',text:strip(a.builder),go:id,anchor:id+'-builder'});
  if(a.peers) index.push({where:a.code+', peer benchmarks',what:'What peers report',text:strip(a.peers),go:id,anchor:id+'-peers'});
  if(a.internal) index.push({where:a.code+', inputs',what:'What we need from Rousselot',text:strip(a.internal),go:id,anchor:id+'-inputs'});
});
(M.sections||[]).filter(s=>!/^questions/i.test(s.title)).forEach(s=>index.push({where:'Overview',what:s.title,text:strip(s.html),go:'overview'}));
let lastView='overview';
$('#q').addEventListener('input',e=>{
  const raw=e.target.value.trim(), q=raw.toLowerCase(); if(q.length<3){ if(current==='search') go(lastView); return; }
  if(current!=='search') lastView=current;
  const hits=index.filter(x=>(x.what+' '+x.text).toLowerCase().includes(q)).slice(0,40);
  $('#searchtitle').textContent=`${hits.length} result${hits.length===1?'':'s'} for “${raw}”`;
  $('#results').innerHTML=hits.map(h=>{const t=h.text.toLowerCase(), i=t.indexOf(q), s=Math.max(0,i-90);
    const snip=i<0?esc(h.text.slice(0,200)):(s?'…':'')+esc(h.text.slice(s,i))+'<mark>'+esc(h.text.slice(i,i+q.length))+'</mark>'+esc(h.text.slice(i+q.length,i+q.length+160))+'…';
    return `<a class="result" href="#${h.go}" data-jump="${h.go}" data-anchor="${h.anchor||''}"><div class="where">${esc(h.where)}</div><div class="what">${esc(h.what)}</div><div class="snip">${snip}</div></a>`}).join('')||'<p class="empty">Nothing matches. Try a company, ingredient or regulation name.</p>';
  show('search');
});

const h=(location.hash||'').slice(1); go(TABS.some(t=>t.id===h)?h:'overview');
})();
</script>
</body></html>
