, "url": "https://www.globenewswire.com/news-release/2025/08/19/3136003/0/en/Madrigal-Receives-European-Commission-Approval-for-Rezdiffra-resmetirom-for-the-Treatment-of-MASH-with-Moderate-to-Advanced-Liver-Fibrosis.html"}, {"n": 41, "text": "Ginès P, Serra-Burriel M, Kamath PS. The New Epidemic of MASLD. JAMA Network Open, 17 June 2025. https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2835411", "url": "https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2835411"}, {"n": 42, "text": "Il Sole 24 Ore, \"Food supplements, turnover in Italy at 4.5 billion\", 2 July 2024. https://en.ilsole24ore.com/art/food-supplements-italy-turnover-45-billion-AF5dPOPC", "url": "https://en.ilsole24ore.com/art/food-supplements-italy-turnover-45-billion-AF5dPOPC"}, {"n": 43, "text": "Virgilio et al. 2026, Nextida GC acute crossover trial (Current Developments in Nutrition), as cited in the Limineer Clinical Nutrition Base Report; not re-opened this round. https://www.sciencedirect.com/science/article/pii/S2475299126018779", "url": "https://www.sciencedirect.com/science/article/pii/S2475299126018779"}, {"n": 44, "text": "Monsegue et al. 2026, collagen peptides after hip replacement, bone markers (Clinical Nutrition ESPEN), as cited in the Limineer Clinical Nutrition Base Report; not re-opened this round. https://www.sciencedirect.com/science/article/pii/S2405457726003499", "url": "https://www.sciencedirect.com/science/article/pii/S2405457726003499"}, {"n": 45, "text": "International Diabetes Federation, IDF Diabetes Atlas 2025 (NCBI Bookshelf), impaired glucose tolerance estimate, as cited in the base report. https://www.ncbi.nlm.nih.gov/books/NBK618744/", "url": "https://www.ncbi.nlm.nih.gov/books/NBK618744/"}]}, {"code": "R4", "engine": "Add more", "engine_long": "Build what pays tomorrow", "extras": [{"html": "<ul><li><strong>Keep it broad.<\/strong> Initial interest was cosmetics (topical by definition), but the area should cover injectables, in-body applications that are not deep (nasal sprays) and intravenous use, at the overlap of health, nutrition and biomedical.<\/li>\n<li><strong>Going straight to the blood.<\/strong> Oral collagen still has to be absorbed into the bloodstream. Going direct would skip gut signalling (the R&amp;D objection) and undercut the natural product's value proposition: digestion produces the small peptides. If the target is small peptides, synthetic peptides win, unless Rousselot owns the sequences and has a contract manufacturer synthesise them.<\/li>\n<li><strong>Topical history.<\/strong> Peptan was promoted for topical use years ago, without a product: it does not penetrate the skin (too large) but forms a film. Separately, an active-peptides programme for scarring and burn wounds (AP Scar) was stopped but generated scientific data and a consumer trial run by Ipsos.<\/li>\n<li><strong>Find the sweet spot.<\/strong> Injectables mean multi-year development, a valley of death. Map the whole landscape to say what is too far, what is not far enough, and why.<\/li><\/ul>\n<p><strong>Our take.<\/strong> The routes split into two businesses: material (X-Pure, recombinant, film-forming) and sequence (owned peptides, sold or licensed, made by whoever is cheapest). The sequence business is the one this feedback opens, and it depends on IP and on whether any sequence works outside the gut. AP Scar is the cheapest evidence to recover before any new work.<\/p>", "title": "6 Oct: feedback received and how the map changed"}, {"html": "<p><strong>What the deck shows.<\/strong> Rousselot already designs hydrolysate fractions by enzyme choice and screens them on human skin receptors [45]. Leads: AP26-418 inhibits MC5R by 48.2% (plus or minus 3.1%) at 1.25 to 5 mg/mL; TRPV1 leads (about 1,368 Da) reach an IC50 of roughly 1.0 to 1.6 mg/mL against 3 to 4.6 mg/mL for standard hydrolysates including Nextida GC; ActiPep Scar enriches cyclic glycine-proline to 10% and reduces gel contraction in vitro. All data are single in vitro assays.<\/p><ul><li><strong>Potency is weak.<\/strong> About 0.73 mM at TRPV1 against capsazepine at 0.04 to 0.33 uM <a class=\"cite\" href=\"https://www.selleckchem.com/products/capsazepine.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a>; roughly 3 to 5 mM at MC5R (our estimate) against 200 nM for JNJ-10229570 <a class=\"cite\" href=\"https://www.caymanchem.com/product/37768/jnj-10229570\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a>.<\/li><li><strong>Not first.<\/strong> Chemyunion has sold an MC5R-blocking tripeptide for oily skin since October 2023 <a class=\"cite\" href=\"https://www.cosmeticsbusiness.com/novel-tripeptide-to-control-skin-oiliness-for-all\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>; Symrise's TRPV1 active is in Eucerin's sensitive-skin range <a class=\"cite\" href=\"https://www.cosmeticsbusiness.com/beiersdorf-selects-symsitive-for-new-eucerin-ranges-101864\" target=\"_blank\" rel=\"noopener\" title=\"Source 64\">64<\/a>. Demand is proven; no collagen-derived version exists.<\/li><li><strong>Citations to fix.<\/strong> The MC5R paper is in J Dermatol Sci 2011, not J Invest Dermatol <a class=\"cite\" href=\"https://www.caymanchem.com/product/37768/jnj-10229570\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a>; Lucius 2023 does not cover MAPK, MMP or eczema <a class=\"cite\" href=\"https://doi.org/10.3390/ijms241411815\" target=\"_blank\" rel=\"noopener\" title=\"Source 49\">49<\/a>; ST-100 is a collagen-repair peptide, not a TRPV1 blocker, and missed its Phase 3 primary endpoint <a class=\"cite\" href=\"https://www.optometrytimes.com/view/phase-3-clinical-trial-results-for-st-100-vezocolmitide-ophthalmic-solution-a-novel-dry-eye-candidate\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a>.<\/li><li><strong>Hair.<\/strong> Capsaicin inhibits human hair growth in organ culture and a TRPV1 blocker reverses it, but the blocker alone had no significant effect <a class=\"cite\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC1602392\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a>. Claim must stay at reducing hair loss <a class=\"cite\" href=\"https://ec.europa.eu/docsroom/documents/58054/attachments/1/translations/en/renditions/native\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>.<\/li><li><strong>Possible conflict.<\/strong> TRPV1 activation reduces sebocyte lipid synthesis <a class=\"cite\" href=\"https://go.drugbank.com/articles/A21529\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a>, so a TRPV1 blocker could raise sebum (our inference). Keep dryness and oily-skin actives apart.<\/li><li><strong>Market figures.<\/strong> The deck's hair (11.6bn by 2030), scar (61.9bn by 2030, topicals 20.6bn) and dry-eye (700M) figures do not trace to sources; GMI gives hair at USD 8.8bn in 2025, of which pharmaceuticals 6.2bn <a class=\"cite\" href=\"https://www.gminsights.com/industry-analysis/hair-growth-supplement-and-treatment-market/amp\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a>; scar estimates range from USD 2.9bn to 32.3bn for 2025 depending on scope <a class=\"cite\" href=\"https://www.biospace.com/scar-treatment-market-size-growth-trends-report-2022-to-2030\" target=\"_blank\" rel=\"noopener\" title=\"Source 61\">61<\/a><a class=\"cite\" href=\"https://www.grandviewresearch.com/industry-analysis/scar-treatment-market\" target=\"_blank\" rel=\"noopener\" title=\"Source 62\">62<\/a>.<\/li><li><strong>ActiPep Scar IP.<\/strong> The deck says patent protection was rejected, but Rousselot BV was granted AU2025257522B2 on 14 May 2026 <a class=\"cite\" href=\"https://patents.google.com/patent/AU2025257522B2/en\" target=\"_blank\" rel=\"noopener\" title=\"Source 57\">57<\/a> and its WO covers fibrosis including scars <a class=\"cite\" href=\"https://patents.google.com/patent/WO2025219352A1/en\" target=\"_blank\" rel=\"noopener\" title=\"Source 58\">58<\/a>. No peer-reviewed work links cGP to skin fibroblasts or scarring; its known role is IGF-1 regulation <a class=\"cite\" href=\"https://www.nature.com/articles/srep04388\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a>. Heat cyclisation from collagen was published by Jellice <a class=\"cite\" href=\"https://www.jstage.jst.go.jp/article/fstr/22/4/22_477/_article/-char/en\" target=\"_blank\" rel=\"noopener\" title=\"Source 56\">56<\/a>.<\/li><\/ul><p><strong>Our take.<\/strong> The deck is the strongest asset in this area and points it at topical actives, not injectables. Rank programmes by claim, not biology: sebum first, sensitive skin second (benchmarked against Symrise), hair third; ActiPep Scar is a route decision for biomedical. Sell through an actives house on the Givaudan and Amyris model <a class=\"cite\" href=\"https://www.tipranks.com/news/press-releases/givaudan-to-acquire-portfolio-of-major-cosmetic-ingredients-from-amyris-and-to-establish-strategic-partnership-for-natural-sustainably-sourced-ingredients-for-the-beauty-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 66\">66<\/a>. Full claim check in the base report 68.<\/p>", "title": "8 Oct: R&D deck, four programmes and claim check"}, {"html": "<p><strong>What changed.<\/strong> The 45-minute conversation with R&amp;D on 9 October turns the designed-actives idea into a two-stage venture and moves the bottleneck: the science is cheap and early (modest screening spend so far, activity found at the second screen); what is missing is a regulatory green light, market understanding and a decision to go topical. An earlier external consultation reportedly concluded collagen peptides in cosmetics would be very hard; competitors already on shelf suggest otherwise.<\/p><ul><li><strong>The pitch.<\/strong> A Nextida-style tailored-hydrolysate platform taken from nutrition to cosmetics. R&amp;D agrees collagen peptides do not enter the skin to rebuild collagen; generic collagen in a cream gives hydration only. The claim rests on targeted receptor activity.<\/li><li><strong>Two-stage model.<\/strong> (1) Sell the defined hydrolysate as a cosmetic ingredient, most likely in Asia (Korean cosmetics). (2) In parallel, identify the active sequences, patent them, make them synthetically (not by fermentation) and license them to brands. Synthetic versions would be vegan and ease EU and US safety files.<\/li><li><strong>Sebum (MC5R).<\/strong> Works with fish and bovine collagen, fish slightly better, which fits Asia and avoids China's bovine restrictions. A 1% solution is described as giving about 50% inhibition and 2% is being tested; this still needs reconciling with the 1.25 to 5 mg/mL range in the deck.<\/li><li><strong>Dryness and hair (TRPV1).<\/strong> Tested in bovine hide collagen only, the source China restricts. Ex vivo 3D eye and hair models are running; results are expected in December 2026. Eye is deprioritised (crowded IP, small market).<\/li><li><strong>Peptide profile.<\/strong> About 500 to 2,000 Da; mass spectrometry sees at least 15,000 species, likely three to four times more. Batch consistency is not yet tested. Oral activity is unknown; a Peptan B5000 hair clinical trial is running, which links this area to R2.<\/li><li><strong>ActiPep Scar.<\/strong> Stopped three to four years ago for regulatory reasons and a rejected use patent; biomedical owns the follow-up. Out of this area's scope.<\/li><li><strong>External exposure.<\/strong> The deck is internal; no customer or partner conversations yet. The only market signal is reported Asian interest in fish and marine collagen for skin.<\/li><\/ul><p><strong>Where our read differs.<\/strong> R&amp;D's bet is hair first, oily skin second; the map ranked sebum first. Recommendation: run both and let the December hair data decide. Frame hair as protecting the scalp and follicle from heat-styling stress, which matches the published rescue biology (a TRPV1 blocker rescued growth arrested by TRPV1 activation) and the cosmetic claim \"reduces hair loss\"; a leave-on scalp serum or mask is more credible than a rinse-off shampoo. The dose arithmetic also needs checking: on a standard dose-response curve twice the IC50 gives about 67% inhibition and about nine times gives 90% (our calculation), and only a fraction of what is in a cream reaches the receptor, so 0.1 to 0.2% in formulation looks optimistic.<\/p><p>Full detail in the Cosmetics &amp; Medical Aesthetics Base Report, section \"What the R&amp;D conversation added\".<\/p>", "title": "9 Oct: R&D conversation, two-stage model, sebum or hair first"}], "internal": "<ol>\n<li>X-Pure and Quali-Pure revenue by grade (research, technical, GMP) and by customer development stage, plus which customers have filed or will file under MDR before the 2027 and 2028 deadlines. Holder: Tanja Vervust (Global Director, Biomedical; name and title from earlier press coverage, to be confirmed) or her successor.<\/li>\n<li>Regulatory dossier inventory for X-Pure: EDQM TSE certificates of suitability, drug master files (US and EU), ISO 22442 risk files, 722/2012 consultation history. Holder: Regulatory Affairs, Biomedical (to be confirmed).<\/li>\n<li>Matt's work: what the \"peptides as actives\" programme has in hand (sequences, in vitro fibroblast data, any fermentation route, patent filings), and whether it is bio-designed non-animal or animal-derived. Holder: Matt.<\/li>\n<li>Biomex: what it is, its legal status, owner, and what can be shared; nothing is public. Holder: Elke.<\/li>\n<li>Whether any current Rousselot material is a component of a CE-marked or FDA-cleared injectable or topical device, and under what supply agreement. Holder: Biomedical commercial team.<\/li>\n<li>Colartix composition and whether an undenatured type II fraction exists or could be made. Holder: R&amp;D (ISS or Ghent).<\/li>\n<li>Learnings from the X1 co-development thread and the B3 fermentation conversation, if either has started. Holder: Limineer team and Elke.<\/li>\n<li>Darling Ingredients' position on fermentation partnerships and on cosmetics ingredient businesses (mandate boundaries). Holder: Jeroen.<\/li>\n<li>AP Scar (new, 6 Oct): the scarring and burn-wound programme's scientific data and Ipsos consumer trial, and why it stopped. Holder: the former AP Scar project team; check with R&D.<\/li><li>Peptan topical (new, 6 Oct): data from the earlier topical promotion, including the film-forming effect.<\/li><li>Peptide sequences (new, 6 Oct): which sequences Rousselot owns or could patent independently of the hydrolysate, and any data on activity outside the gut route.<\/li><li>Matt's slides: confirm the scope covers injectable, nasal and intravenous routes, not only topical.<\/li><li>R&amp;D deck follow-ups (new, 8 Oct): molecular weight, dose-response and cytotoxicity data for AP26-418 and the TRPV1 leads; meaning of the negative MC5R readings; which ActiPep Scar filing was rejected and on what grounds; why bovine rather than porcine or fish, given China accepts bovine collagen only from bone; results of the VitroScreen corneal model if run. Holder: Matt.<\/li><li>R&amp;D conversation follow-ups (new, 9 Oct): the 2% MC5R result now being tested and how the 1% figure maps to the 1.25 to 5 mg/mL tested range; whether a fish or porcine TRPV1 version can be screened; batch-consistency plan for the designed fraction; the earlier external regulatory consultation on collagen peptides in cosmetics (who, when, what it concluded); December 3D hair and eye results. Holder: Matt.<\/li><li>Decision owner for going topical (new, 9 Oct): who in Rousselot can give the regulatory and commercial green light for a cosmetics ingredient, and whether Darling's mandate allows it. Holder: Elke.<\/li><\/ol>", "lastChange": "Updated with the R&D conversation and the 9 Oct focus report (direct edit, 9 Oct 2026)", "mapIntro": "<p><strong>Updated 9 Oct after the R&amp;D conversation (direct edit, not via proposals).<\/strong> The 45-minute conversation confirms the area's shape and moves the bottleneck from science to a regulatory green light, market understanding and a decision to go topical. Space 2 (designed collagen actives) now carries the two-stage model: a defined hydrolysate sold as a cosmetic ingredient first, most likely in Asia, then active sequences identified, patented, made synthetically and licensed. Sebum (MC5R, works with fish and bovine) and heat-stress hair care (TRPV1, bovine hide only) are the lead candidates; December 3D hair and eye results decide which leads. ActiPep Scar moves out of this area to biomedical. The area headline now follows the focus report's two-track framing. No re-ranking.<\/p><p><strong>Updated 8 Oct after the R&amp;D deck (direct edit, not via proposals).<\/strong> The R&amp;D deck received 8 Oct shows four tailored-hydrolysate programmes: sebum control via MC5R, dryness and sensitive skin via TRPV1, hair via TRPV1, and ActiPep Scar (the AP Scar programme, cyclic glycine-proline) [45]. Space 4 is reframed as designed collagen actives for skin and moves to rank 2; spaces 2 and 3 move down one. Space 6 now feeds space 4. ActiPep Scar sits under space 1 as a biomedical route decision.<\/p><p>Updated 6 Oct after feedback received: one provisional space added (6, owned peptide sequences beyond the natural product). Spaces 1 and 4 carry new internal history (the AP Scar programme and Peptan's earlier topical promotion).<\/p><p><strong>Focus report (updated 9 Oct 2026, with the R&amp;D conversation):<\/strong> Cosmetics &amp; Medical Aesthetics Base Report. The report numbers its spaces differently from this map; each space here names its report counterpart.<\/p>", "name": "Beyond oral: aesthetics and biomedical", "oneLine": "<p>This area asks whether Rousselot's purified collagen and gelatin, and the peptide know-how behind Peptan and Nextida, can earn money outside the oral supplement channel: as components of medical devices, as actives in topical cosmetics, and at the edge of medical aesthetics. The scan finds two markets moving fast in opposite directions from Rousselot's position: biostimulator injectables are growing at double digits on a \"clinically proven collagen stimulation\" promise that Rousselot does not supply into today, and China's recombinant collagen companies have turned non-animal collagen into a RMB 7bn revenue reality with Class III device approvals, while Western recombinant entrants remain small or pre-revenue. Rousselot's realistic right to play is as a GMP, MDR-ready biomaterial supplier and co-developer (X-Pure), not as a maker of injectables; nothing public was found on \"Biomex\". Feedback received on 6 Oct asks to keep the area broad: topical, injectable, shallow in-body (nasal sprays) and intravenous routes, plus owned peptide sequences made by contract synthesis and bio-designed collagen. The aim is to map the whole landscape and find the sweet spot between going too far into multi-year biomedical development and not going far enough.<\/p>", "options": [], "order": 4, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Three shifts matter. First, the aesthetics market is moving from volume fillers to \"regenerative\" biostimulators. Galderma's Fillers and Biostimulators line grew only 3.9% at constant currency in H1 2025 because of US filler softness, while biostimulators (Sculptra) kept \"sustained high growth momentum\" <a class=\"cite\" href=\"https://www.galderma.com/news/galderma-H12025-performance\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>; by full year 2025 the line grew 8.0% to USD 1,101m and Galderma reported that Sculptra was \"gaining significant market share in its first year in China\" and had obtained EU MDR certification in December 2025 for body areas beyond the face <a class=\"cite\" href=\"https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Merz published a six-month placebo-controlled study in May 2026 claiming Radiesse increased collagen up to 23 times versus saline <a class=\"cite\" href=\"https://merzaesthetics.com/news/new-research-shows-radiesse-supports-substantial-regeneration-of-collagen-and-key-extracellular-matrix-proteins/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. Salmon-DNA polynucleotides (Rejuran, PharmaResearch) have become the fastest-growing \"skin booster\" class, with approvals in 47 countries and a European distribution deal with Vivacy in 2026 <a class=\"cite\" href=\"https://en.sedaily.com/culture/2026/06/05/pharmaresearch-posts-record-results-on-export-driven-rejuran\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a><a class=\"cite\" href=\"https://www.forbes.com/sites/johnkang/2025/05/27/maker-of-popular-skin-booster-shot-rejuran-becomes-billionaire-on-k-beauty-boom/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. The commercial promise in all three is measurable new collagen in the dermis, which is exactly the outcome oral collagen peptides claim with weaker visibility.<\/p>\n<p>Second, recombinant collagen has gone from laboratory to Class III device in China. Jinbo's recombinant humanised type III collagen injectable was approved by the NMPA in October 2023 <a class=\"cite\" href=\"https://www.ccfdie.org/en/yjxx/ylqx/webinfo/2023/10/1697427795327595.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>; Giant Biogene obtained Class III approvals for a recombinant type I alpha-1 collagen freeze-dried fibre (October 2025) and a collagen plus sodium hyaluronate composite solution (January 2026) <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://chinacosmetics.com/giant-biogene-shuts-down-nutricosmetics-venture-to-refocus-on-medical-aesthetics/\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. Western entrants are at an earlier stage: Evonik launched a clinical-grade VECOLLAN recombinant collagen-like protein in September 2025 with \"validated material offering\" beginning in 2026 <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>, and CollPlant's AbbVie dermal filler programme has been waiting since 2023 on interim cohort results <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/1631487/000121390026034402/ea028352301ex99-1.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/collplant-biotechnologies-reports-2025-third-quarter-financial-results-and-provides-corporate-update-302626666.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a><a class=\"cite\" href=\"https://ir.collplant.com/news-events/press-releases/detail/169/collplant-biotechnologies-provides-a-corporate-update\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>.<\/p>\n<p>Third, the biomaterial supply chain is consolidating and moving upmarket. Collagen Solutions (medical-grade collagen components) was sold to RTI Surgical, a Montagu-backed tissue CDMO, in October 2024 <a class=\"cite\" href=\"https://englandco.com/transaction/collagen-solutions-has-agreed-to-be-acquired-by-rti-surgical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>; Collagen Matrix (Linden Capital) bought Polyganics in 2022 <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/collagen-matrix-acquires-polyganics-301640830.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>; Gelita launched MedellaPro gelatin at under 10 EU/g endotoxin for COMPAMED 2025 <a class=\"cite\" href=\"https://manufacturingchemist.com/gelita-showcase-next-gen-collagen-excipients-compamed\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. Rousselot's own X-Pure range already sits here: endotoxin below 10 EU/g, GMP, ISO 22442, \"fully MDR ready\" <a class=\"cite\" href=\"https://www.medicaldevice-developments.com/companies/rousselot-biomedical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>, with the first GMP-grade GelMA (April 2022) <a class=\"cite\" href=\"https://www.darlingii.com/media/news/rousselot-biomedical-announces-the-worlds-first-gmp-grade-gelma\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a> and a bioink distribution deal with BIO INX (March 2024) <a class=\"cite\" href=\"https://bioinx.com/news/bio-inx-and-rousselot-announce-collaboration-materials-3d-bioprinting\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<table>\n<thead>\n<tr>\n<th>Segment<\/th>\n<th>Figure<\/th>\n<th>Source, year, scope<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Injectable aesthetics (Galderma only)<\/td>\n<td>USD 2,572m net sales 2025, +11.5% cc; Fillers and Biostimulators USD 1,101m, +8.0% cc<\/td>\n<td>Galderma FY2025 release, global <a class=\"cite\" href=\"https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><\/td>\n<\/tr>\n<tr>\n<td>Recombinant collagen, China (listed leaders)<\/td>\n<td>Giant Biogene RMB 5.52bn revenue 2025 (flat, -0.4%), net profit RMB 1.91bn (-7.1%), 78.6% functional skincare, 21.0% medical dressings <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; Jinbo Bio RMB 1,595m revenue 2025 (+10.6%), medical devices RMB 1,288m at 94.1% gross margin <a class=\"cite\" href=\"http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a><\/td>\n<td>Company annual results, 2025<\/td>\n<\/tr>\n<tr>\n<td>Recombinant collagen injectables, China<\/td>\n<td>Frost &amp; Sullivan forecast RMB 12.1bn by 2027 (36.5% CAGR from 2022); 2023 CMBI report, low-trust forecast<\/td>\n<td><a class=\"cite\" href=\"https://hk-official.cmbi.info/upload/75c09041-33c6-4806-b5cf-cfe9dfc02d19.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a><\/td>\n<\/tr>\n<tr>\n<td>Polynucleotide skin boosters (PharmaResearch only)<\/td>\n<td>KRW 146.1bn revenue Q1 2026 (+25% YoY); medical devices KRW 79.5bn<\/td>\n<td>Seoul Economic Daily, June 2026 <a class=\"cite\" href=\"https://en.sedaily.com/culture/2026/06/05/pharmaresearch-posts-record-results-on-export-driven-rejuran\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td>Undenatured type II collagen<\/td>\n<td>No public UC-II revenue; the parent Capsules and Health Ingredients unit was sold at CHF 2.3bn enterprise value, March 2026<\/td>\n<td>Lonza <a class=\"cite\" href=\"https://www.lonza.com/news/2026-03-06-18-05\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><\/td>\n<\/tr>\n<tr>\n<td>Western recombinant collagen<\/td>\n<td>CollPlant revenue USD 2.4m 2025, net loss USD 11.5m, cash USD 5.6m <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/1631487/000121390026034402/ea028352301ex99-1.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; Geltor total raised USD 137m, no revenue disclosed <a class=\"cite\" href=\"https://cultivated-x.com/investments-finance/geltor-closes-equity-financing-round-animal-free-beauty-ingredients/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>; Agronomics carries its Geltor stake at GBP 237,617 against GBP 7.2m invested <a class=\"cite\" href=\"https://www.investegate.co.uk/announcement/rns/agronomics-limited--anic/geltor-inc-update-/9183159\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><\/td>\n<td>Company filings 2025 to 2026<\/td>\n<\/tr>\n<tr>\n<td>Medical-grade collagen and gelatin (global)<\/td>\n<td>No reliable public figure found. Paid reports (SNS Insider, cited in the Battlefield report [44]) are low-trust<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "title": "Size and growth"}, {"full": "Players", "html": "<p>Incumbent injectable makers (Galderma Sculptra, poly-L-lactic acid; Merz Radiesse, calcium hydroxylapatite; PharmaResearch Rejuran, salmon polynucleotides) do not use collagen as the active; collagen is the outcome they sell <a class=\"cite\" href=\"https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://merzaesthetics.com/news/new-research-shows-radiesse-supports-substantial-regeneration-of-collagen-and-key-extracellular-matrix-proteins/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a><a class=\"cite\" href=\"https://www.forbes.com/sites/johnkang/2025/05/27/maker-of-popular-skin-booster-shot-rejuran-becomes-billionaire-on-k-beauty-boom/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. Chinese recombinant collagen companies (Giant Biogene, Jinbo, Trautec with L Catterton and CITIC backing <a class=\"cite\" href=\"https://www.trautec.us/post/trautec-unveils-recombinant-human-collagen\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>) are vertically integrated from fermentation to branded skincare and Class III injectables <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>. Western recombinant entrants are Evonik (VECOLLAN for medical devices, VECOLLAGE Fortify L for cosmetics, both fermentation-made) <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a><a class=\"cite\" href=\"https://medical.evonik.com/en/media/news/evonik-launches-non-animal-derived-collagen-platform-vecollan-at-commercial-scale-for-medical-device-242849.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://elements.evonik.com/en/articles/OnlineOnly/vegan-collagen.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>, CollPlant (tobacco-plant rhCollagen, AbbVie filler programme, bioinks) <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/1631487/000121390026034402/ea028352301ex99-1.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>, Geltor (E. coli fermentation; PrimaColl for ingestibles with FDA GRAS no-questions letter GRN 001171; HumaColl21, Elastapure for beauty) <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://cultivated-x.com/investments-finance/geltor-closes-equity-financing-round-animal-free-beauty-ingredients/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>, Humabiologics (human donor-tissue collagen, research grade) <a class=\"cite\" href=\"https://www.24-7pressrelease.com/press-release/521579/humabiologics-introduces-research-grade-human-collagen-to-support-scientists-amid-funding-challenges\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>, and Jellatech (cell-cultured collagen, seed stage; profile pages only, not verified further). Medical-grade animal collagen and gelatin suppliers are Rousselot X-Pure and Quali-Pure <a class=\"cite\" href=\"https://www.medicaldevice-developments.com/companies/rousselot-biomedical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>, Gelita Medical (MedellaPro, VacciPro) <a class=\"cite\" href=\"https://manufacturingchemist.com/gelita-showcase-next-gen-collagen-excipients-compamed\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/gelita-cphi-2025-live-collagen-gelatin.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>, Collagen Matrix <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/collagen-matrix-acquires-polyganics-301640830.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>, Collagen Solutions now inside RTI Surgical <a class=\"cite\" href=\"https://englandco.com/transaction/collagen-solutions-has-agreed-to-be-acquired-by-rti-surgical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>. Nitta Gelatin's medical pages could not be opened. Topical peptide actives are dominated by Sederma (Croda) Matrixyl and Lubrizol Argireline, which claims to \"reduce wrinkle appearance in 7 days\" <a class=\"cite\" href=\"https://www.lubrizol.com/Personal-Care/Products/Product-Finder/Products-Data/Argireline-peptide-solution-C\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>; no public price per kilogram was found for either, and Croda's product page returned an error.<\/p>", "title": "Players"}, {"full": "Regulation", "html": "<p>Medical devices made from non-viable animal tissue fall inside Regulation (EU) 2017/745 (Article 1(6)(f)) <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32017R0745\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a> and are Class III under Annex VIII Rule 18 unless they only touch intact skin; Regulation (EU) 722/2012 still requires a competent-authority consultation on TSE risk even when an EDQM TSE certificate of suitability exists <a class=\"cite\" href=\"https://www.tuvsud.com/en/industries/medical-devices/medical-device-regulation/eu-requirements-for-medical-devices-with-animal-derived-materials\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>, and ISO 22442-1:2020 governs risk management for such materials (a revision is under way as of 2026) <a class=\"cite\" href=\"https://www.iso.org/standard/74280.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>. Legacy-device MDR deadlines under Regulation (EU) 2023/607 are 31 December 2027 for Class III and implantables and 31 December 2028 for the rest, conditional on a notified-body application by 26 May 2024 <a class=\"cite\" href=\"https://www.emergobyul.com/news/eu-update-deadline-nears-medical-device-regulation-2023607\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>. Cosmetics fall under Regulation (EC) 1223/2009, whose Article 20 prohibits claims implying \"characteristics or functions which they do not have\" and whose Article 18 bans animal-tested ingredients since 2009 and 2013 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32009R1223\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>; US courts in 2025 let a L'Oréal \"collagen moisture filler\" case proceed while dismissing a \"vegan collagen\" claim against Algenist, so \"vegan collagen\" labelling carries live legal risk <a class=\"cite\" href=\"https://www.cosmeticsdesign-europe.com/Article/2025/07/16/how-recent-rulings-are-shaping-the-legal-risk-of-vegan-collagen-marketing/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>. In China, injectable recombinant collagen is a Class III device under NMPA, with industry standards YY/T 1849-2022 and a humanised collagen standard from July 2023 <a class=\"cite\" href=\"https://market.chemlinked.com/insight/from-lab-to-market-the-rising-recombinant-collagen-in-the-cosmetic-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>. In the US, Geltor's PrimaColl is GRAS for food and topical use; it is the first collagen added to the FDA GRAS inventory since 1999 <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.investegate.co.uk/announcement/rns/agronomics-limited--anic/geltor-inc-update-/9183159\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>.<\/p>", "title": "Regulation"}, {"full": "Signals", "html": "<ol>\n<li>5 March 2026: Galderma reports Sculptra share gains in China and December 2025 EU MDR certification for body indications; 2026 guidance 17 to 20% growth <a class=\"cite\" href=\"https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>.<\/li>\n<li>19 March 2026: Giant Biogene posts its first revenue and profit decline since listing, yet secures two Class III recombinant collagen injectable approvals (October 2025, January 2026) <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://chinacosmetics.com/giant-biogene-shuts-down-nutricosmetics-venture-to-refocus-on-medical-aesthetics/\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>.<\/li>\n<li>29 April 2026: Jinbo Bio reports medical device revenue of RMB 1.29bn at 94% gross margin and first device registrations in Thailand and the Philippines <a class=\"cite\" href=\"http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>.<\/li>\n<li>16 September 2025: Evonik launches clinical-grade VECOLLAN for orthopaedics, medical aesthetics and sports medicine; validated material from 2026 <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>.<\/li>\n<li>16 October 2025: Geltor announces FDA GRAS no-questions letter for PrimaColl; by August 2025 it had raised USD 137m in total <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://cultivated-x.com/investments-finance/geltor-closes-equity-financing-round-animal-free-beauty-ingredients/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>; its investor Agronomics carries the stake at about 3% of cost <a class=\"cite\" href=\"https://www.investegate.co.uk/announcement/rns/agronomics-limited--anic/geltor-inc-update-/9183159\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>.<\/li>\n<li>26 March 2026: CollPlant ends 2025 with USD 5.6m cash; AbbVie still reviewing interim results of a filler trial that began in 2023 <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/1631487/000121390026034402/ea028352301ex99-1.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>.<\/li>\n<li>6 March 2026: Lonza sells Capsules and Health Ingredients (home of UC-II) to Lone Star at CHF 2.3bn EV, keeping 40% <a class=\"cite\" href=\"https://www.lonza.com/news/2026-03-06-18-05\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>; UC-II marks 25 years with 11 human trials at a 40 mg dose <a class=\"cite\" href=\"https://nutraceuticalbusinessreview.com/lonza-capsugel-25-years-uc-collagen-joint-health-ingredient\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a>.<\/li>\n<li>October 2024: Collagen Solutions acquired by RTI Surgical, a PE-backed regenerative-medicine CDMO <a class=\"cite\" href=\"https://englandco.com/transaction/collagen-solutions-has-agreed-to-be-acquired-by-rti-surgical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>; 26 September 2025: Gelita launches sub-10 EU/g MedellaPro gelatin for haemostats and sealants <a class=\"cite\" href=\"https://manufacturingchemist.com/gelita-showcase-next-gen-collagen-excipients-compamed\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>.<\/li>\n<\/ol>", "title": "Signals"}], "soWhat": {"forRousselot": "Take the area to 30 October as two tracks: material (X-Pure inside partners' injectables, plus a recovery protocol that builds independent proof) and sequence (designed topical actives, sold first as a defined hydrolysate in Asia, later as licensed synthetic sequences).", "forRousselotLinks": [{"anchor": "r4-x1", "go": "r4", "label": "6 Oct: feedback received and how the map changed"}, {"anchor": "r4-mapnotes", "go": "r4", "label": "Notes on the map"}], "headline": "Two possible ventures, neither an injected peptide: collagen as the documented material inside partners' skin-quality injectables, and designed collagen fractions sold as topical actives.", "next": "Proposed: share the updated report with R&D, build a claims route map for topical collagen actives (EU, Korea, China), and hold three buyer conversations (an actives house, a Korean brand, a hair-care brand) ahead of 30 October.", "nextLinks": [{"anchor": "r4-s2", "go": "r4", "label": "Space 2: Designed collagen actives for skin creams"}, {"anchor": "r4-x3", "go": "r4", "label": "9 Oct: R&D conversation, two-stage model, sebum or hair first"}], "takeaways": [{"links": [{"anchor": "r4-s1", "go": "r4", "label": "Space 1: Pharma-grade collagen partner for device makers"}, {"anchor": "r4-scan-1", "go": "r4", "label": "Scan: Trends"}, {"label": "[1] investors.galderma.com", "title": "Galderma Delivers Record 2025 Results With Net Sales of 5.207 Billion USD, Galderma, 5 March 2026, https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd", "url": "https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd"}, {"label": "[2] galderma.com", "title": "Galderma delivers record first half 2025 net sales of 2.448 billion USD, Galderma, 24 July 2025, https://www.galderma.com/news/galderma-H12025-performance", "url": "https://www.galderma.com/news/galderma-H12025-performance"}], "text": "Aesthetics now sells the body's own new collagen: HA filler procedures fell 25% in 2025 while biostimulators and skin boosters grow 10 to 20% a year, and injectable makers are signing collagen suppliers (Hugel with Jellatech, BASF with Bota)."}, {"links": [{"anchor": "r4-x3", "go": "r4", "label": "9 Oct: R&D conversation, two-stage model, sebum or hair first"}, {"anchor": "r4-s2", "go": "r4", "label": "Space 2: Designed collagen actives for skin creams"}], "text": "R&D is already screening designed collagen fractions on skin receptors at modest cost. The main constraints appear to be a regulatory green light, market understanding and a decision to go topical, rather than the science."}, {"links": [{"anchor": "r4-s6", "go": "r4", "label": "Space 6: Owning peptide sequences beyond the natural product"}, {"anchor": "r4-scan-4", "go": "r4", "label": "Scan: Regulation"}, {"anchor": "r4-s1", "go": "r4", "label": "Space 1: Pharma-grade collagen partner for device makers"}, {"label": "[7] market.chemlinked.com", "title": "From Lab to Market: The Rising Recombinant Collagen in the Chinese Cosmetic Industry, ChemLinked, 18 September 2023, https://market.chemlinked.com/insight/from-lab-to-market-the-rising-recombinant-collagen-in-the-cosmetic-industry", "url": "https://market.chemlinked.com/insight/from-lab-to-market-the-rising-recombinant-collagen-in-the-cosmetic-industry"}], "text": "The mode-of-action line largely decides the route: an injected peptide that signals cells is presumed a medicine in the EU (7 to 12 years, EUR 75m plus); a material with a physical action is a Class III device; a cream is a cosmetic."}], "watchOut": "The receptor data so far are early in vitro results, skin penetration and batch consistency are still untested, and no customer has seen the work yet. ", "watchOutLinks": [{"anchor": "r4-x2", "go": "r4", "label": "8 Oct: R&D deck, four programmes and claim check"}, {"anchor": "r4-s2", "go": "r4", "label": "Space 2: Designed collagen actives for skin creams"}, {"label": "[46] caymanchem.com", "title": "JNJ-10229570 product information (MC1R/MC4R/MC5R antagonist; refers to Eisinger et al., J Dermatol Sci 2011), Cayman Chemical, undated, https://www.caymanchem.com/product/37768/jnj-10229570", "url": "https://www.caymanchem.com/product/37768/jnj-10229570"}, {"label": "[51] selleckchem.com", "title": "Capsazepine product information (human TRPV1 IC50 data), Selleck Chemicals, undated, https://www.selleckchem.com/products/capsazepine.html", "url": "https://www.selleckchem.com/products/capsazepine.html"}]}, "sourceNote": "", "updatedAt": "2026-10-09", "spaces": [{"area": "R4", "arena": "Pharma and biomedical", "cell": "Pharma and biomedical x Ingredients to Ecosystems", "fields": {"evidence": "<p>Rousselot already claims the only GMP GelMA (2022), research and GMP grades that are \"functionally equivalent\" so developers avoid revalidation, endotoxin below 10 EU/g, ISO 22442 and \"fully MDR ready\" <a class=\"cite\" href=\"https://www.darlingii.com/media/news/rousselot-biomedical-announces-the-worlds-first-gmp-grade-gelma\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://www.medicaldevice-developments.com/companies/rousselot-biomedical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>; BIO INX chose X-Pure for its \"GMP-like\" bioink precisely for reproducibility, per Prof. Sandra Van Vlierberghe: \"The added standardization and quality were the missing link.\" <a class=\"cite\" href=\"https://bioinx.com/news/bio-inx-and-rousselot-announce-collaboration-materials-3d-bioprinting\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>; Gelita is now matching on endotoxin specification <a class=\"cite\" href=\"https://manufacturingchemist.com/gelita-showcase-next-gen-collagen-excipients-compamed\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>; medical collagen component makers are being bought by CDMOs (RTI Surgical, Collagen Matrix) to own more of the device value chain <a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/collagen-matrix-acquires-polyganics-301640830.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a><a class=\"cite\" href=\"https://englandco.com/transaction/collagen-solutions-has-agreed-to-be-acquired-by-rti-surgical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>; MDR legacy deadlines of 2027 and 2028 force every animal-tissue device maker to re-file with notified bodies, including the 722/2012 TSE consultation <a class=\"cite\" href=\"https://www.tuvsud.com/en/industries/medical-devices/medical-device-regulation/eu-requirements-for-medical-devices-with-animal-derived-materials\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a><a class=\"cite\" href=\"https://www.emergobyul.com/news/eu-update-deadline-nears-medical-device-regulation-2023607\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>.<\/p>", "first": "<p>List every X-Pure customer by development stage and ask the five closest to a clinical filing what regulatory documentation they would pay for; price a \"regulatory file carry\" service (TSE dossier, 722/2012 consultation support, ISO 22442 risk file) as a paid add-on with one willing customer before building anything.<\/p>", "magnitude": "<p>Not sizeable from public data for the biomaterial layer itself; the demand side is visible in CDMO consolidation and in Rousselot and Gelita both investing in sub-10 EU/g products <a class=\"cite\" href=\"https://manufacturingchemist.com/gelita-showcase-next-gen-collagen-excipients-compamed\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><a class=\"cite\" href=\"https://www.medicaldevice-developments.com/companies/rousselot-biomedical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>.<\/p>", "tension": "<p>The loser believes a medical-grade gelatin is a catalogue item sold on a specification sheet. The winner sees that a device developer buys the de-risked path from research grade to GMP grade to MDR file, and will pay for the supplier who carries that file with them.<\/p>", "uncertainties": "<p>How much of X-Pure revenue is repeat GMP supply versus research-grade sampling; whether Rousselot holds EDQM TSE certificates of suitability and drug master files for X-Pure (claimed \"MDR ready\" but not detailed publicly <a class=\"cite\" href=\"https://www.medicaldevice-developments.com/companies/rousselot-biomedical/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><a class=\"cite\" href=\"https://www.darlingii.com/rousselot/applications/biomedical\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>); whether device customers want a co-development partner or only a reliable supplier; what the Battlefield report's X1 co-development thread has already learned [44].<\/p>"}, "focusRef": "Report space 1: collagen biomaterial in skin-quality injectables (lead)", "lastChange": "ActiPep Scar status added from the R&D deck (8 Oct 2026)", "name": "GMP biomaterial co-development with medtech and ATMP developers", "other": ["<p><strong>Added 6 Oct (feedback received).<\/strong> An earlier active-peptides programme for scarring and burn wounds (AP Scar) generated scientific data and an Ipsos consumer trial before it was stopped. It is the closest internal precedent for a wound or scar route and should be recovered before co-development talks.<\/p>", "<p><strong>Added 8 Oct (R&amp;D deck).<\/strong> AP Scar continues as ActiPep Scar, NPD stage 1: a collagen peptide enriched to 10% cyclic glycine-proline that reduced gel contraction in vitro [45]. Rousselot BV holds AU2025257522B2 (granted 14 May 2026) <a class=\"cite\" href=\"https://patents.google.com/patent/AU2025257522B2/en\" target=\"_blank\" rel=\"noopener\" title=\"Source 57\">57<\/a>; prior art on cyclic dipeptides for wound healing may block a scar-use claim <a class=\"cite\" href=\"https://patents.google.com/patent/US20190314449A1/en\" target=\"_blank\" rel=\"noopener\" title=\"Source 59\">59<\/a>. Claimed as anti-fibrotic it is a medicine, not a device; Juvista (TGF-beta3) failed Phase III in 2011 after strong early data <a class=\"cite\" href=\"https://pharmatimes.com/news/renovo_stock_demolished_by_justiva_trial_failure_979597/\" target=\"_blank\" rel=\"noopener\" title=\"Source 67\">67<\/a>. Route decision needed: medicine with a partner, or a device or cosmetic with weaker claims. The Ipsos consumer trial mentioned on 6 Oct is not in the deck.<\/p>"], "rank": 1, "shortName": "Pharma-grade collagen partner for device makers", "soWhat": "Device developers buy a lower-risk path from research grade to approved product, and EU deadlines in 2027 and 2028 force re-filing. X-Pure already has the specification; carrying the regulatory file is the opportunity.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-08", "verdict": "Lead"}, {"area": "R4", "arena": "Beauty and consumer", "cell": "Beauty and consumer x Animal-based to Origin-agnostic", "fields": {"evidence": "<p>Evonik's VECOLLAGE Fortify L is sold as \"100 percent identical to the natural collagen in our skin\" (Arnoldo Fonseca, Bioactive Substances Lead, Care Solutions) <a class=\"cite\" href=\"https://elements.evonik.com/en/articles/OnlineOnly/vegan-collagen.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>; Geltor's HumaColl21 and Elastapure target beauty brands <a class=\"cite\" href=\"https://cultivated-x.com/investments-finance/geltor-closes-equity-financing-round-animal-free-beauty-ingredients/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>; Chinese recombinant skincare is a RMB 4bn-plus category at Giant Biogene alone <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; Lubrizol's Argireline shows the established peptide-active playbook <a class=\"cite\" href=\"https://www.lubrizol.com/Personal-Care/Products/Product-Finder/Products-Data/Argireline-peptide-solution-C\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>; the Algenist and L'Oréal rulings show the legal line <a class=\"cite\" href=\"https://www.cosmeticsdesign-europe.com/Article/2025/07/16/how-recent-rulings-are-shaping-the-legal-risk-of-vegan-collagen-marketing/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>; the R&amp;D deck shows an MC5R lead (48.2% inhibition) and TRPV1 leads beating standard hydrolysates by about 2 to 3 times [45]; Chemyunion's MC5R tripeptide <a class=\"cite\" href=\"https://www.cosmeticsbusiness.com/novel-tripeptide-to-control-skin-oiliness-for-all\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a> and Symrise's TRPV1 active in Eucerin <a class=\"cite\" href=\"https://www.cosmeticsbusiness.com/beiersdorf-selects-symsitive-for-new-eucerin-ranges-101864\" target=\"_blank\" rel=\"noopener\" title=\"Source 64\">64<\/a> show the claims sell. Against: potency in the millimolar range <a class=\"cite\" href=\"https://www.caymanchem.com/product/37768/jnj-10229570\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><a class=\"cite\" href=\"https://www.selleckchem.com/products/capsazepine.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a>, and 1.2 to 1.5 kDa hydrophilic peptides sit above the 500 Dalton rule <a class=\"cite\" href=\"https://doi.org/10.1034/j.1600-0625.2000.009003165.x\" target=\"_blank\" rel=\"noopener\" title=\"Source 69\">69<\/a>, though the follicle route helps sebum and hair targets <a class=\"cite\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5198016\" target=\"_blank\" rel=\"noopener\" title=\"Source 65\">65<\/a>.<\/p>", "first": "<p>Run both leads and let data decide: the 2% MC5R test and a sebocyte and skin explant study with a follicular penetration arm and cytotoxicity controls for the sebum fraction; the December 3D hair results for TRPV1, framed as heat-styling stress protection in a leave-on scalp format. Alongside: a claims route map for topical collagen actives (EU, Korea, China), a freedom-to-operate check against Chemyunion's MC5R peptide, and three buyer conversations (an actives house, a Korean brand, a hair-care brand) on what data they need.<\/p>", "magnitude": "<p>Cosmetic peptide actives about USD 0.25 to 0.5bn at ingredient value (Limineer working range, low confidence) 68. A single branded sebum active is the realistic first step, in the low millions a year.<\/p>", "tension": "<p>The loser sells hydrolysed collagen as a humectant and film-former and treats animal origin as irrelevant. The winner sells a designed fraction with a receptor target, a peptide fingerprint and a patent, through an actives house, in a market rebuilt around signal peptides and fermentation-made skin-identical collagen, where claim rules decide who can say what.<\/p>", "uncertainties": "<p>Whether AP26-418 cuts sebum lipids at a dose that reaches the gland; whether a natural collagen fraction can be patented as a composition (novelty) or needs process and fingerprint claims; whether sebum claims stay cosmetic (Borderline Manual para 192) <a class=\"cite\" href=\"https://ec.europa.eu/docsroom/documents/58054/attachments/1/translations/en/renditions/native\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>; whether bovine origin limits China; whether Darling wants a brand-facing actives business. Earlier: whether a bio-designed non-animal peptide could be filed as a new cosmetic ingredient. Added 9 Oct: whether the designed fraction (15,000-plus peptide species) can be made batch to batch consistently; whether a fish or porcine TRPV1 version works, since bovine hide is restricted in China; how the 1% and 2% solution figures relate to the tested range and to what crosses the skin; who inside Rousselot can give the green light to go topical.<\/p>"}, "focusRef": "Report space 4: designed-hydrolysate topical actives (joint second)", "lastChange": "Two-stage model, sebum and hair leads, next steps from the R&D conversation (direct edit, 9 Oct 2026)", "name": "designed collagen actives for skin (sebum, sensitive skin, hair) and \"vegan collagen\" claims", "other": ["<p><strong>Added 6 Oct (feedback received).<\/strong> Rousselot has been here before: Peptan was promoted for topical use years ago without a dedicated product. It does not penetrate the skin, being too large, but forms a film. A film-forming role is more modest than a signal-peptide active, and it is the one Rousselot has data for.<\/p>", "<p><strong>Added 8 Oct (R&amp;D deck).<\/strong> Programme order by claim: sebum control first (appearance claims such as visibly less oily), sensitive skin second (benchmark Symrise, not dry-eye drugs; eye drops are a Class III device or a medicine), hair third (claim limited to reducing hair loss) <a class=\"cite\" href=\"https://ec.europa.eu/docsroom/documents/58054/attachments/1/translations/en/renditions/native\" target=\"_blank\" rel=\"noopener\" title=\"Source 63\">63<\/a>. Route: producer manufactures, actives house markets <a class=\"cite\" href=\"https://www.tipranks.com/news/press-releases/givaudan-to-acquire-portfolio-of-major-cosmetic-ingredients-from-amyris-and-to-establish-strategic-partnership-for-natural-sustainably-sourced-ingredients-for-the-beauty-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 66\">66<\/a>.<\/p>", "<p><strong>Added 9 Oct (R&amp;D conversation).<\/strong> Two-stage model confirmed: (1) the defined hydrolysate sold as a cosmetic ingredient, most likely to Korean cosmetics; (2) active sequences identified, patented, made synthetically and licensed to brands. The sebum fraction works with fish as well as bovine collagen; TRPV1 has been tested on bovine hide only. R&amp;D bets on hair first, the map on sebum; both run until the December 3D results. Hair is best framed as scalp and follicle protection from heat styling, in a leave-on format. Screening costs so far are modest; no customer has seen it yet. ActiPep Scar moves to biomedical.<\/p>"], "rank": 2, "shortName": "Designed collagen actives for skin creams", "soWhat": "R&D sees a two-stage route: sell a defined collagen fraction as a cosmetic active in Asia first, then patent and license synthetic sequences. Sebum and heat-stress hair care lead; December hair data should inform which goes first.", "threshold": "Animal-based to Origin-agnostic", "updatedAt": "2026-10-09", "verdict": "Promising"}, {"area": "R4", "arena": "Pharma and biomedical", "cell": "Pharma and biomedical x Animal-based to Origin-agnostic", "fields": {"evidence": "<p>Evonik positions VECOLLAN on \"simplified regulatory approval for medical devices\" and sells into orthopaedics and medical aesthetics <a class=\"cite\" href=\"https://medical.evonik.com/en/media/news/evonik-launches-non-animal-derived-collagen-platform-vecollan-at-commercial-scale-for-medical-device-242849.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>; Jinbo's device segment runs at 94.1% gross margin on recombinant type III collagen <a class=\"cite\" href=\"http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>; Giant Biogene holds two Class III recombinant injectable approvals <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; Western pure-plays are fragile (CollPlant USD 5.6m cash at end 2025, down to USD 2.6m at 30 June 2026 with H1 2026 revenue of USD 181,000, and in September 2026 it bought a photonic computing company <a href=\"https://www.prnewswire.com/il/news-releases/collplant-reports-2026-second-quarter-financial-results-and-provides-corporate-update-302895046.html\" target=\"_blank\" rel=\"noopener\">CollPlant, 30 Sep 2026<\/a>; Geltor marked down by an investor) <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/1631487/000121390026034402/ea028352301ex99-1.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><a class=\"cite\" href=\"https://www.investegate.co.uk/announcement/rns/agronomics-limited--anic/geltor-inc-update-/9183159\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>; Gelita publicly says it is developing animal-free alternatives <a class=\"cite\" href=\"https://manufacturingchemist.com/gelita-showcase-next-gen-collagen-excipients-compamed\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>; the Battlefield report's B3 cell proposes licensing-in rather than building fermentation [44].<\/p>", "first": "<p>One non-equity supply conversation with Evonik Health Care or Geltor about a recombinant grade sold through Rousselot's biomedical channel, as B3 already recommends [44]; a one-page comparison of the MDR file for an X-Pure device versus a VECOLLAN device, written with a notified-body consultant, to test whether the \"simplified regulatory\" claim holds.<\/p>", "magnitude": "<p>China listed recombinant leaders generate about RMB 7.1bn combined revenue in 2025 <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>; the Frost &amp; Sullivan RMB 12.1bn 2027 forecast for recombinant injectables is low-trust <a class=\"cite\" href=\"https://hk-official.cmbi.info/upload/75c09041-33c6-4806-b5cf-cfe9dfc02d19.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. No credible figure for medical recombinant collagen outside China.<\/p>", "tension": "<p>The loser believes that a century of safety data and TSE controls on bovine and porcine material is a permanent moat. The winner sees that the recombinant pitch to medtech is \"no TSE consultation, no animal-origin questions in the notified body file\", and that Chinese firms have already proven Class III approval and 90%-plus gross margins on recombinant injectables.<\/p>", "uncertainties": "<p>Whether EU notified bodies in practice treat recombinant collagen as easier than animal collagen (Evonik claims it, no notified-body source found); whether a Western fermentation producer would supply Rousselot (B3 crux [44]); whether Rousselot's precision-fermentation peptide work with Matt is at bench, pilot or paper stage.<\/p>"}, "focusRef": "Report space 5: bio-designed human-sequence collagen (partner, not build)", "lastChange": "Moved from rank 2 to 3 when space 4 moved up (8 Oct 2026)", "name": "recombinant versus animal-derived medical collagen", "other": [], "rank": 3, "shortName": "Fermentation-made versus animal collagen in devices", "soWhat": "Fermentation-made collagen promises device makers no animal-origin safety review and earns over 90% margins in China. Licensing a grade from a Western producer may beat building fermentation in-house.", "threshold": "Animal-based to Origin-agnostic", "updatedAt": "2026-10-08", "verdict": "Promising"}, {"area": "R4", "arena": "Beauty and consumer", "cell": "Beauty and consumer x Products to Outcomes", "fields": {"evidence": "<p>Galderma biostimulators growing double digits while plain fillers soften <a class=\"cite\" href=\"https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://www.galderma.com/news/galderma-H12025-performance\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>; Merz's 23-fold collagen claim <a class=\"cite\" href=\"https://merzaesthetics.com/news/new-research-shows-radiesse-supports-substantial-regeneration-of-collagen-and-key-extracellular-matrix-proteins/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>; PharmaResearch revenue up 25% on Rejuran with 47 country approvals <a class=\"cite\" href=\"https://en.sedaily.com/culture/2026/06/05/pharmaresearch-posts-record-results-on-export-driven-rejuran\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>; Geltor claims PrimaColl works at 1 g per day versus \"5-10 grams required by conventional collagens\" <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a>; Giant Biogene's recombinant skincare is 78.6% of RMB 5.5bn revenue <a class=\"cite\" href=\"https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; US courts are testing whether topical \"collagen\" claims mislead <a class=\"cite\" href=\"https://www.cosmeticsdesign-europe.com/Article/2025/07/16/how-recent-rulings-are-shaping-the-legal-risk-of-vegan-collagen-marketing/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>.<\/p>", "first": "<p>An evidence audit with Matt of what Rousselot peptides do in dermal fibroblast models versus Matrixyl-type signal peptides; three conversations with aesthetic clinic chains or distributors (for example those carrying Sculptra or Rejuran) on whether they would stock a clinically backed oral or topical adjunct, to learn whether the clinic channel is reachable without an injectable.<\/p>", "magnitude": "<p>Galderma Fillers and Biostimulators USD 1,101m in 2025 <a class=\"cite\" href=\"https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a> is one company; PharmaResearch devices KRW 79.5bn in a quarter <a class=\"cite\" href=\"https://en.sedaily.com/culture/2026/06/05/pharmaresearch-posts-record-results-on-export-driven-rejuran\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>. No figure for the collagen-ingredient share of this market; Rousselot's current share is presumably nil since the leading biostimulators contain no collagen.<\/p>", "tension": "<p>The loser believes collagen's beauty value is sold by the gram in a sachet. The winner sees that clinics now sell collagen as an outcome measured by biopsy and ultrasound, that a 40 mg or sub-gram dose with a mechanism of action beats 10 g of bulk peptides, and that the money has moved to whoever owns the clinical proof and the clinic relationship.<\/p>", "uncertainties": "<p>Whether any Rousselot material (purified porcine or fish collagen, gelatin carriers, GelMA) has a defensible role inside an injectable or a clinic-channel topical; whether Matt's \"peptides as actives\" has in vitro or ex vivo data on fibroblast stimulation; whether the Peptan skin clinical work can be reframed for the clinic channel (post-procedure oral protocols) without a new injectable.<\/p>"}, "focusRef": "Report spaces 1 and 2: injectable biomaterial and post-procedure recovery", "lastChange": "Moved from rank 3 to 4 when space 4 moved up (8 Oct 2026)", "name": "clinically proven collagen stimulation in medical aesthetics", "other": [], "rank": 4, "shortName": "Clinic-proven collagen results in aesthetics", "soWhat": "Clinics now sell new collagen as a measured outcome, and the fastest-growing injectables contain no collagen. The money sits with whoever owns clinical proof and the clinic relationship.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-08", "verdict": "Promising"}, {"area": "R4", "arena": "Beauty and consumer", "cell": "Consumer and joint health x Products to Outcomes", "fields": {"evidence": "<p>UC-II at 40 mg daily, 20-plus studies, 11 human trials, now extending into pet nutrition <a class=\"cite\" href=\"https://nutraceuticalbusinessreview.com/lonza-capsugel-25-years-uc-collagen-joint-health-ingredient\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/younger-joint-health-lonza-capsugel-uc-ii-collagen.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>; its owner unit just changed hands at CHF 2.3bn EV, so a PE owner will push the brand harder <a class=\"cite\" href=\"https://www.lonza.com/news/2026-03-06-18-05\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>; Bioiberica sells a second native type II collagen, Collavant n2, at 40 mg a day and is positioning its healthy-ageing range on longevity and GLP-1 companions <a href=\"https://www.nutritioninsight.com/news/cphi-milan-2026-bioiberica-pharma-nutraceutical.html\" target=\"_blank\" rel=\"noopener\">Nutrition Insight, 6 Oct 2026<\/a>; Rousselot's Colartix is a cartilage-derived matrix (internal fact to verify; not checked in public sources here).<\/p>", "first": "<p>A technical note from R&amp;D on whether an undenatured grade is feasible from existing cartilage streams; a patent search on undenatured type II collagen claims expiring 2026 to 2030.<\/p>\n<p>Not mapped: a China biomedical localisation space (the Battlefield report's B5) is real on this evidence (Jinbo and Giant are both expanding abroad and the NMPA has a recombinant collagen standard) but belongs with the geographic scan rather than here.<\/p>", "magnitude": "<p>No public UC-II revenue; not sizeable from public data.<\/p>", "tension": "<p>The loser believes more grams of hydrolysed collagen is the product. The winner sees that UC-II has built a 25-year franchise on 40 mg a day with 11 human trials, that Bioiberica's Collavant n2 now competes at the same dose, and that the Colartix cartilage matrix is Rousselot's closest native-collagen asset.<\/p>", "uncertainties": "<p>Whether Colartix or any Rousselot process yields undenatured type II collagen with intact epitopes; how Bioiberica entered alongside UC-II (its own process, licence or expired claims) and what that implies for a third entrant; whether this belongs in R4 or in the oral joint-health area.<\/p>"}, "lastChange": "R4-5: reframe the patent uncertainty now that a second native type II entrant (Bioiberica, SARIA) is in market (accepted 2026-10-07)", "name": "native (non-hydrolysed) collagen at milligram doses", "other": [], "rank": 5, "shortName": "Tiny-dose native collagen for joints", "soWhat": "UC-II built a 25-year franchise on 40 mg a day with 11 human trials, not grams of hydrolysed collagen. Whether Rousselot's cartilage material can yield an intact, non-hydrolysed grade is unknown.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-07", "verdict": "Test first"}, {"area": "R4", "arena": "Pharma and biomedical", "cell": "", "fields": {"evidence": "<p>Feedback received 6 Oct: the R&amp;D objection (direct delivery misses gut signalling) and the contract-manufacturer model. Space 4 shows the topical market moving to signal peptides and fermentation-made collagen. Not yet scanned: peptide CDMO costs, the IP landscape for collagen-derived sequences. Added 8 Oct: Rousselot's Nextida GC patent claims a hydrolysate defined by enzymes and molecular weight plus an oral use, not a sequence <a class=\"cite\" href=\"https://patents.google.com/patent/EP4498839B1/en\" target=\"_blank\" rel=\"noopener\" title=\"Source 70\">70<\/a>; Nitta Gelatin and Fukuoka University claim synthetic Pro-Hyp and Hyp-Gly for scars, including local injection <a class=\"cite\" href=\"https://patents.justia.com/patent/20210228675\" target=\"_blank\" rel=\"noopener\" title=\"Source 71\">71<\/a>; the R&amp;D deck plans LC-MS/MS mapping to file on specific sequences [45].<\/p>", "first": "<p>Inventory the sequences in the Nextida library with any non-oral data. One conversation with a peptide CDMO on cost per gram at cosmetic and pharma grade.<\/p>", "magnitude": "<p>Not sized.<\/p>", "tension": "<p>The loser believes Rousselot's value is the natural hydrolysate and the digestion that turns it into small peptides. The winner sees that once the active is a known small peptide, the natural product loses its reason to exist on non-oral routes (injectable, nasal, intravenous, topical), because a synthetic peptide is purer and easier to standardise. What keeps value is owning the sequence and its evidence, made by a contract manufacturer, or produced as bio-designed collagen.<\/p>", "uncertainties": "<p>Whether any sequence is active outside the gut; patentability; whether this cannibalises or complements Peptan.<\/p>"}, "focusRef": "Report space 4 and the watch item: designed actives, injected signalling peptide", "lastChange": "IP findings added; now feeds space 4 (8 Oct 2026)", "name": "Provisional: owned peptide sequences beyond the natural product (arena Pharma and biomedical x threshold Animal-based to Origin-agnostic)", "other": ["<p>Related: space 2 (recombinant versus animal-derived) and space 4 (topical actives). Provisional, raised in feedback received 6 Oct.<\/p>", "<p><strong>Added 8 Oct.<\/strong> The R&amp;D deck turns this space into a concrete pipeline, now carried in space 4 (designed collagen actives). Kept here for the non-oral routes beyond the skin (injectable, nasal, intravenous), where a signalling peptide is presumed a medicine.<\/p>"], "rank": 6, "shortName": "Owning peptide sequences beyond the natural product", "soWhat": "Off the oral route, a known small peptide made synthetically is likely to be favoured over the natural hydrolysate, so value moves to owning the sequence and its evidence. Nobody yet knows if any sequence works outside the gut.", "threshold": "Animal-based to Origin-agnostic", "updatedAt": "2026-10-08", "verdict": "Test first"}], "sources": [{"n": 1, "text": "Galderma Delivers Record 2025 Results With Net Sales of 5.207 Billion USD, Galderma, 5 March 2026, https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd", "url": "https://investors.galderma.com/news-releases/news-release-details/galderma-delivers-record-2025-results-net-sales-5207-billion-usd"}, {"n": 2, "text": "Galderma delivers record first half 2025 net sales of 2.448 billion USD, Galderma, 24 July 2025, https://www.galderma.com/news/galderma-H12025-performance", "url": "https://www.galderma.com/news/galderma-H12025-performance"}, {"n": 3, "text": "Giant Biogene Holding Co., Ltd, 2025 annual results announcement, 19 March 2026, https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF", "url": "https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260319/12059378-0.PDF"}, {"n": 4, "text": "Giant Biogene Shuts Down Nutricosmetics Venture to Refocus on Medical Aesthetics, ChinaCosmetics.com, 5 August 2026, https://chinacosmetics.com/giant-biogene-shuts-down-nutricosmetics-venture-to-refocus-on-medical-aesthetics/", "url": "https://chinacosmetics.com/giant-biogene-shuts-down-nutricosmetics-venture-to-refocus-on-medical-aesthetics/"}, {"n": 5, "text": "Shanxi Jinbo Bio-Pharmaceutical Co., Ltd, 2025 Annual Report, 29 April 2026, http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf", "url": "http://xinpi.zqrb.cn/pdf/BJ/920982/2026/0429/2d142c0c2c81d24d94939791d6cae8c0.pdf"}, {"n": 6, "text": "Recombinant Humanized Type III Collagen Solution for injection approved for marketing, CCFDIE (China Center for Food and Drug International Exchange), 25 October 2023, https://www.ccfdie.org/en/yjxx/ylqx/webinfo/2023/10/1697427795327595.htm", "url": "https://www.ccfdie.org/en/yjxx/ylqx/webinfo/2023/10/1697427795327595.htm"}, {"n": 7, "text": "From Lab to Market: The Rising Recombinant Collagen in the Chinese Cosmetic Industry, ChemLinked, 18 September 2023, https://market.chemlinked.com/insight/from-lab-to-market-the-rising-recombinant-collagen-in-the-cosmetic-industry", "url": "https://market.chemlinked.com/insight/from-lab-to-market-the-rising-recombinant-collagen-in-the-cosmetic-industry"}, {"n": 8, "text": "Giant Biogene (2367 HK) initiation report, CMB International Global Markets, 27 November 2023, https://hk-official.cmbi.info/upload/75c09041-33c6-4806-b5cf-cfe9dfc02d19.pdf", "url": "https://hk-official.cmbi.info/upload/75c09041-33c6-4806-b5cf-cfe9dfc02d19.pdf"}, {"n": 9, "text": "Trautec has unveiled its recombinant human collagen, Trautec, 20 February 2024, https://www.trautec.us/post/trautec-unveils-recombinant-human-collagen", "url": "https://www.trautec.us/post/trautec-unveils-recombinant-human-collagen"}, {"n": 10, "text": "PharmaResearch Posts Record Results on Export-Driven 'Rejuran', Seoul Economic Daily, 5 June 2026, https://en.sedaily.com/culture/2026/06/05/pharmaresearch-posts-record-results-on-export-driven-rejuran", "url": "https://en.sedaily.com/culture/2026/06/05/pharmaresearch-posts-record-results-on-export-driven-rejuran"}, {"n": 11, "text": "Maker Of Popular Skin Booster Shot Rejuran Becomes Billionaire On K-
