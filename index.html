<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Q4 2026 research map prepared by Limineer for Rousselot.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rousselot × Limineer · Q4 2026 research map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FAF6EC; --surface-2:#F3EBD6; --fg:#1E1208; --muted:#5A4330; --label:#7A4E12;
  --amber:#D68529; --amber-soft:#F6E2C2; --teal:#007A94; --line:#DCCFAE; --line-soft:#ECE4CF;
  --core:#7A4E12; --add:#007A94; --vert:#1E1208;
  --display:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1A110A; --surface:#231710; --surface-2:#2D1F14; --fg:#F5ECD4; --muted:#CDBA96; --label:#E5A54A; --amber:#E59A3F; --amber-soft:#4A2F14; --teal:#5CC8DF; --line:#4A3620; --line-soft:#33251A; --core:#E5A54A; --add:#5CC8DF; --vert:#F5ECD4; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1A110A; --surface:#231710; --surface-2:#2D1F14; --fg:#F5ECD4; --muted:#CDBA96; --label:#E5A54A; --amber:#E59A3F; --amber-soft:#4A2F14; --teal:#5CC8DF; --line:#4A3620; --line-soft:#33251A; --core:#E5A54A; --add:#5CC8DF; --vert:#F5ECD4; color-scheme:dark }
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}

/* header */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.mark{display:flex;align-items:baseline;gap:10px;white-space:nowrap;min-width:0}
.mark b{font-family:var(--display);font-weight:700;letter-spacing:-.035em;font-size:19px}
.mark span{font-family:var(--display);color:var(--label);font-weight:500;font-size:13.5px}
.search{margin-left:auto}
.search input{font:inherit;font-size:13.5px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);width:230px;max-width:42vw}
.search input:focus{outline:2px solid var(--amber);outline-offset:1px}
.rail{position:sticky;top:60px;z-index:19;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.rail .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:7px}
.rail .wrap::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:baseline}
.tab:hover{background:var(--surface)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tab .code{font-size:11.5px;font-weight:700;opacity:.65}
.tab.sep{margin-left:10px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

main{padding-block:36px 72px}
.label{font-family:var(--display);font-size:13px;font-weight:600;color:var(--label)}
.h-title{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.025em;margin-top:6px;max-width:22ch}
.lede{font-size:17px;color:var(--muted);max-width:66ch;margin:12px 0 0}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:13px;color:var(--muted)}
.status b{font-weight:600;color:var(--fg)}
section.block{margin-top:52px}
section.block > h2{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:4px 0 16px}
.prose{max-width:72ch}
.prose p{margin:0 0 12px} .prose ul,.prose ol{padding-left:22px;margin:0 0 12px} .prose li{margin-bottom:6px}
.prose strong{font-weight:600}
.prose table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0 16px}
.prose h4{font-family:var(--display);font-size:16px;font-weight:600;margin:22px 0 8px}
.prose th{text-align:left;background:var(--surface-2);font-family:var(--display);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.prose td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tablewrap{overflow-x:auto;max-width:100%}
.prose a,.srcs a{overflow-wrap:anywhere}
.cite{display:inline-block;font-family:var(--display);font-size:10.5px;font-weight:700;line-height:1;padding:3px 5px;margin-left:2px;border-radius:4px;background:var(--amber-soft);color:var(--label);vertical-align:2px}
.cite:hover{background:var(--amber);color:#fff;text-decoration:none}

/* engine pills */
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.core{color:var(--core);border-color:var(--core)} .pill.add{color:var(--add);border-color:var(--add)} .pill.vert{color:var(--vert);border-color:var(--vert)}

/* verdicts */
.verdict{font-family:var(--display);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;vertical-align:3px;margin-left:8px}
.v-lead{background:var(--amber);color:#fff}.v-prom{background:var(--amber-soft);color:var(--label)}
.v-test{color:var(--teal);border:1px solid var(--teal)}.v-watch,.v-hold{color:var(--muted);border:1px solid var(--line)}.v-park{color:var(--muted);border:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend .verdict{margin-left:0;margin-right:6px}

/* so-what */
.sowhat{border-left:4px solid var(--amber);background:var(--surface);border-radius:0 14px 14px 0;padding:22px 26px;margin-top:22px;max-width:920px}
.sw-head{font-family:var(--display);font-size:clamp(19px,2.3vw,24px);font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
.sw-list{margin:0 0 16px;padding-left:20px;display:grid;gap:10px}
.sw-list li{padding-left:2px}
.sw-list a.main{color:var(--fg)} .sw-list a.main:hover{text-decoration-color:var(--amber);text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--display);font-size:12px;font-weight:600;color:var(--label);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.chip:hover{border-color:var(--amber);text-decoration:none}
.chip.ext{color:var(--teal);border-style:dashed}
.sw-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid var(--line);padding-top:16px}
.sw-grid p{margin:4px 0 0;font-size:14.5px}
.sw-grid a.main{color:var(--fg)}

/* area list */
.area-list{display:grid;gap:8px}
.area-row{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:start;padding:16px 18px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--fg)}
.area-row:hover{background:var(--surface);text-decoration:none}
.area-row .ar-name{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--label)}
.area-row .ar-head{font-size:15.5px;margin-top:2px}
.area-row .ar-top{font-size:13.5px;color:var(--muted);margin-top:6px}
.area-row .pill{justify-self:start}
.area-row .go{font-family:var(--display);color:var(--label);font-weight:700}

/* premise cards */
.premises{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.premise{border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:10px;padding:16px 18px;background:var(--bg)}
.premise.settled{border-top-color:var(--teal)}
.premise h3{font-size:15.5px;font-weight:600;margin-bottom:6px}
.premise p{font-size:14px;color:var(--muted);margin:0}

/* collapsibles */
details.more{border-top:1px solid var(--line-soft)}
details.more:last-of-type{border-bottom:1px solid var(--line-soft)}
details > summary{list-style:none;cursor:pointer}
details > summary::-webkit-details-marker{display:none}
details.more > summary{display:flex;align-items:center;gap:10px;padding:14px 4px;font-family:var(--display);font-weight:600;font-size:15.5px}
.tw{margin-left:auto;color:var(--label);transition:transform .2s;font-size:18px;line-height:1}
details[open] > summary .tw{transform:rotate(90deg)}
.cnt{font-size:11.5px;font-weight:700;color:var(--label);background:var(--amber-soft);border-radius:9px;padding:1px 7px}
.more-body{padding:0 4px 20px}
details.acc{border-top:1px solid var(--line-soft)}
details.acc > summary{display:flex;gap:12px;align-items:center;padding:12px 4px;font-family:var(--display);font-weight:600;font-size:15px}
details.acc > .body{padding:0 4px 16px}

/* spaces */
.spaces{display:grid;gap:10px}
.space{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
.space > summary{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:16px 18px;color:var(--fg)}
.rank{font-family:var(--display);font-weight:700;font-size:12.5px;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--fg);color:var(--bg);flex:none}
.rank.r1{background:var(--amber);color:#fff}
.space h3{font-size:17px;font-weight:600}
.sw-line{margin:6px 0 0;font-size:14.5px}
.sw-first{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.sw-first b{font-family:var(--display);font-weight:600;color:var(--label);margin-right:4px}
.tw-label{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--label);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tw-label .tw{margin-left:0}
.space[open] .tw-label .tw{transform:rotate(90deg)}
.space .detail{padding:0 18px 18px;border-top:1px solid var(--line-soft)}
.fullname{font-size:13px;color:var(--label);font-family:var(--display);font-weight:600;margin-top:14px}
.fields{display:grid;gap:18px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:860px){.fields{grid-template-columns:1fr 1fr}}
.field{min-width:0}.field .label{display:block;margin-bottom:4px}
.field .prose{max-width:none;font-size:14px}
.field.wide{grid-column:1/-1}
.field.first{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.updates{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px 16px}
.updated{font-family:var(--display);font-size:11.5px;font-weight:600;color:var(--teal);margin-left:8px;white-space:nowrap;vertical-align:3px}
.sp-rep{font-size:13.5px;color:var(--muted);margin-top:12px}

/* explorer */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 0}
.filters .lab{font-family:var(--display);font-size:13px;font-weight:600;color:var(--label);margin-right:4px;min-width:72px}
.fchip{font-family:var(--display);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--label)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--line)}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .meta .verdict{margin-left:0;vertical-align:0}
.card h3{font-size:16px;font-weight:600}
.card .snip{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:30px 0}

/* area head */
.ahead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rep-btn{display:inline-flex;gap:6px;font-family:var(--display);font-weight:600;font-size:13.5px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:999px;padding:7px 14px;white-space:nowrap}
.rep-btn:hover{text-decoration:none;opacity:.9}
.opt .detail{font-size:14px}

/* questions */
.qlist{counter-reset:q;list-style:none;padding:0;margin:0;max-width:78ch}
.qlist li{counter-increment:q;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.qlist li::before{content:counter(q);font-family:var(--display);font-weight:700;color:var(--label);font-variant-numeric:tabular-nums}

/* sources */
.srcs{list-style:none;padding:0;margin:0;font-size:13px}
@media (min-width:860px){.srcs{columns:2;column-gap:28px}}
.srcs li{break-inside:avoid;margin-bottom:8px;display:flex;gap:8px}
.srcs .n{font-family:var(--display);font-weight:700;color:var(--label);min-width:26px;font-variant-numeric:tabular-nums}

/* stats */
.stats{display:flex;gap:32px;flex-wrap:wrap}
.stat b{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* pager, search, foot */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:52px;border-top:1px solid var(--line-soft);padding-top:18px}
.pager button{font:inherit;font-family:var(--display);font-weight:600;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--fg)}
.pager button:hover{background:var(--surface)}
.result{display:block;padding:12px 6px;border-bottom:1px solid var(--line-soft);cursor:pointer;color:var(--fg)}
.result:hover{background:var(--surface);text-decoration:none}
.result .where{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--label)}
.result .what{font-weight:600;margin:2px 0}
.result .snip{font-size:13.5px;color:var(--muted)}
mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}
.foot{margin-top:64px;border-top:1px solid var(--line-soft);padding-top:16px;font-size:12.5px;color:var(--muted);display:flex;gap:6px 20px;flex-wrap:wrap}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 3px transparent}}
.view[hidden]{display:none}
ul.todo{list-style:none;padding-left:0}
ul.todo li{position:relative;padding-left:28px}
ul.todo li::before{content:'';position:absolute;left:2px;top:4px;width:14px;height:14px;border:1.5px solid var(--label);border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.mark span{display:none}.search input{width:150px}.tw-label .t{display:none}.area-row{grid-template-columns:1fr auto}.area-row .pill{grid-column:1/-1;justify-self:start}.sowhat{padding:18px}}
@media print{.bar,.rail,.pager,.search{display:none}details>*{display:block!important}.view[hidden]{display:block!important}}
</style></head>
<body>
<div class="bar"><div class="wrap">
  <div class="mark"><b>LIMINEER</b><span>for Rousselot · Q4 2026</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search all eight areas" aria-label="Search all eight areas" autocomplete="off"></div>
</div></div>
<div class="rail"><div class="wrap" id="rail" role="tablist" aria-label="Sections"></div></div>
<main class="wrap">
  <div id="views"></div>
  <div class="foot"><span>Q4 2026 research map, prepared by Limineer for Rousselot.</span><span>Desk research; status at 9 October 2026.</span><span>Every figure links to its source.</span></div>
</main>
<script>
const DATA={"meta": {"sections": [{"html": "<p>The Q4 kickoff (29 September) set out eight research areas to be scanned by 16 October and mapped by 16 November, with three or four chosen for deep dives on 30 October. This document is the first pass on all eight: a desk scan (trends, size, players, regulation, signals) and an initial map of the liminal spaces in each area, ranked by potential for Rousselot, with the open uncertainties that desk work cannot resolve and the internal inputs needed to finish the map. Each area has its own section. R8 is different in kind: it benchmarks how corporates structure business-building units and lays out the design options for the RBB vertical rather than mapping a market.<\/p>\n<p>Three rules were applied throughout. Every figure carries a source, year and scope, and figures from paid research firms are marked low-trust where they could not be replaced with company filings, regulators, trade bodies or peer-reviewed work. Direct quotes are verbatim with speaker, title and source. Where something could not be found, the section says so rather than filling the gap.<\/p>", "title": "What this document is"}, {"html": "<p>Each section runs: one-line read; scan (trends, size and growth, players, regulation, signals); initial map with the liminal spaces ranked, each with the tension, evidence, magnitude, open uncertainties and a realistic first move; internal inputs needed; sources. Liminal spaces are named as arena x threshold wherever they sit on the discovery grid (six arenas: metabolic health, pharma and biomedical, personalised and digital, beauty and consumer, food and beverage, animal and vet health; five thresholds: products to outcomes, ingredients to ecosystems, animal-based to origin-agnostic, knowledge bundled to AI-unbundled, stable inputs to volatile world). Prior NBO codes (A1, C4, E3, F1 and so on) refer to the August Battlefield report. First moves are deliberately framed as moves, not venture names, so that the space is agreed before a concept anchors the discussion.<\/p>", "title": "How to read a section"}, {"html": "<ol>\n<li><strong>The European plant list.<\/strong> Darling's FY2025 10-K lists Rousselot's European collagen sites as Angoulême, Isle-sur-la-Sorgue, Gent and Girona (Spain); Son, Netherlands appears only as a rendering and bioenergy site (R1). The team should confirm which four plants \"the four European plants\" refers to.<\/li>\n<li><strong>Section 301 is not only about China.<\/strong> The USTR investigation opened on 11 March 2026 names the EU among sixteen economies in scope; the North American Renderers Association's 14 April petition asked for China-specific collagen and gelatin tariffs within it (R1). The US market is a moving target for European supply, not just a place where China gets taxed.<\/li>\n<li><strong>Rousselot is not publicly in pets, and Sonac is.<\/strong> No public Peptan or Colartix pet positioning was found. Sonac sells Hydro-P Premium (hydrolysed collagen for pet food, joint positioning), Darling funds a canine osteoarthritis programme at Utrecht, and a Rousselot scientist (Janne Prawitt, Rousselot BV, Ghent) co-authored the 2024 Utrecht review on collagen hydrolysates in canine osteoarthritis (R5). The boundary was already porous at R&amp;D level. Update, 2 October 2026: the remit is now settled. Rousselot has free rein in pet and animal health, coordinated with Sonac; the coordination mechanism is still to be defined.<\/li>\n<li><strong>The C4 \"Compiler\" has no paying precedent.<\/strong> Every ingredient major found (Ingredion, Symrise, dsm-firmenich, Givaudan, Tate and Lyle, Kerry) gives formulation AI to customers free as a sales aid; the companies that charge for food or protein AI are discovery biotechs and software vendors (R7). The AI area reads better as internal discovery and simulation capability with a narrow data-licensing test underneath.<\/li>\n<\/ol>\n<p>Two further refinements carried from the R3 base report: the GLP-1 companion market figure of USD 204.8bn in the Battlefield report covered a broader category and has been rescoped, and the internal USD 27 to 38m pressure-injury sizing assumes full penetration (R3).<\/p>", "title": "Four premises in the kickoff material that the research changes"}, {"html": "<p>\"Nextida\" is used in two senses in public sources: the 2024 product platform (Nextida GC, with Nextida Brain flagged) and the name given in May 2025 coverage to the Rousselot plus PB Leiner combination (Darling 85 per cent, Tessenderlo 15 per cent, definitive agreement 10 December 2025, Bundeskartellamt clearance 27 April 2026, closing still pending at the Q2 2026 call) (R1, R2, R8). The sections use \"Nextida GC\" for the product and \"the PB Leiner combination\" for the deal. RBB is now chartered under Rousselot, and for now everything sits within Rousselot. The perimeter after closing (whether pet, consumer or biomedical moves fall inside the combined company) is still open and should be treated as a governance constraint on 30 October.<\/p>", "title": "The naming point on Nextida"}, {"html": "<table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>Engine<\/th>\n<th>Highest-ranked space<\/th>\n<th>Why it ranks first<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R1 Supply resilience and European plants<\/td>\n<td>Core<\/td>\n<td>European pharma-grade bone gelatin as a scarce asset (ISS)<\/td>\n<td>Tessenderlo has said European bone gelatin is not viable for it and is closing Vilvoorde; ISS is pharma-weighted and profitable; scarcity is sellable if exposure is mapped first<\/td>\n<\/tr>\n<tr>\n<td>R2 Value chain and premiumising the core<\/td>\n<td>Core<\/td>\n<td>Premium peptide tier, \"composition not kilos\" (Products to Outcomes)<\/td>\n<td>Darling's own management puts targeted ingredients at 7 to 11 times gelatin margin; the tier is contested on dose-per-effect and clinical evidence, where Nextida GC already has patents and two studies<\/td>\n<\/tr>\n<tr>\n<td>R3 Clinical and medical nutrition<\/td>\n<td>Add more<\/td>\n<td>Protein-dense ONS, the formulation limit (Pharma and biomedical x Products to Outcomes)<\/td>\n<td>Collagen is already inside Pro-Stat, Fresubin 3.2 kcal and V CRESC CP10 with no supplier owning the clinical story; German reimbursement rules favour standard high-calorie products over wound-labelled ones<\/td>\n<\/tr>\n<tr>\n<td>R4 Beyond oral: aesthetics and biomedical<\/td>\n<td>Add more<\/td>\n<td>GMP biomaterial co-development with medtech and ATMP developers (Ingredients to Ecosystems)<\/td>\n<td>X-Pure is the documented right to play (GMP GelMA, ISO 22442, MDR-ready); injectables and recombinant collagen are where the growth is but not where Rousselot sells today<\/td>\n<\/tr>\n<tr>\n<td>R5 Pet and animal health<\/td>\n<td>Add more<\/td>\n<td>Vet-grade collagen tier with canine outcome data (Products to Outcomes)<\/td>\n<td>Hip and joint is the top pet supplement segment; the only placebo-controlled dog RCT is Gelita's; the Utrecht review names the gaps (no standard dose, no validated outcomes)<\/td>\n<\/tr>\n<tr>\n<td>R6 Owning the outcome and the consumer<\/td>\n<td>Add more<\/td>\n<td>The proof office: standards sold across brands (Ingredients to Ecosystems)<\/td>\n<td>Ingredient makers already run paid trust marks; regulators demand product-level trials; consumer brands are being bought at 4 to 8 times revenue, which is the expensive route<\/td>\n<\/tr>\n<tr>\n<td>R7 AI, knowledge and data<\/td>\n<td>Add more<\/td>\n<td>Peptide composition discovery as an internal engine (Knowledge bundled to AI-unbundled)<\/td>\n<td>Peers now buy discovery capability (Givaudan licenses from Nuritas, Ingredion signed Shiru in March 2026); Rousselot's Nextida discovery is described publicly as bench-led<\/td>\n<\/tr>\n<tr>\n<td>R8 How Rousselot builds<\/td>\n<td>Vertical<\/td>\n<td>Not a space: eight design choices with options laid out<\/td>\n<td>The closest chemical and ingredient analogues (Chemovator, The Uncovery, foodspring, Bosch's in-house attempt) were closed or folded back within 30 months, mostly in parent restructurings<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>This table is a first read from desk research. The ranking inside each section carries the evidence; the cross-area choice of deep dives is for the 30 October session.<\/p>", "title": "The highest-ranked space per area (Limineer's initial read)"}, {"html": "<p>The kickoff named five likely test candidates. Clinical nutrition partner pull (R3) remains the clearest test: the crux is whether an FSMP brand owner will put a collagen fraction into a dossier, which only buyer conversations can answer. Pet health premium (R5) is now testable: the Sonac remit is settled as free rein, so buyer conversations can start once the coordination step with Sonac is agreed for any shared accounts. European supply premium (R1) now has a sharper framing (pharma-grade bone gelatin scarcity) but needs plant-level exposure data before a priced offer makes sense. Aesthetics actives (R4) depends on Matt's peptide data and the fermentation route, which are internal. Enriched Nextida (R2) is already being tested by the market in a small way (Pura Collagen GLPure+ at GBP 50 against GBP 45 for standard; Codeage at USD 59.99 against USD 39.99), so the question is less whether a premium exists and more how large it is at scale.<\/p>", "title": "What the research says about the deck's likely test candidates"}, {"html": "<ol>\n<li><strong>Sonac remit (R5, R8).<\/strong> Rousselot has free rein in pet and animal health, coordinated with Sonac. How that coordination works (shared accounts, use of the Utrecht canine data) is not yet defined.<\/li>\n<li><strong>RBB charter (R8).<\/strong> RBB is chartered under Rousselot.<\/li>\n<li><strong>PB Leiner perimeter (R1, R2, R4, R5, R6).<\/strong> Not settled. For now everything, new business building included, sits within Rousselot.<\/li>\n<li><strong>Praneeth introduction (R3).<\/strong> Made on 5 Oct; first conversation booked for Tue 13 Oct.<\/li><\/ol>", "title": "Settled since the scan"}, {"html": "<p>This is desk research built on primary sources wherever they could be reached: company filings and earnings transcripts, regulators and official journals, trade bodies, peer-reviewed papers and trade press. Each section names what could not be opened or found. A second-pass check re-opened 38 of the most consequential claims against their cited sources and corrected six (the Vilvoorde headcount, the PLOS One dog trial enrolment, a McKinsey quotation, a Nuritas speaker attribution, Knowde's self-description, PayPal Ventures' status); residual risks are listed per section. Market-size figures from paid research firms appear only where labelled low-trust and where no better source exists. No market tests, expert conversations or internal data were used; those are the November work.<\/p>", "title": "Caveats on this pass"}], "soWhat": {"forRousselot": "Choose deep dives that build evidence Rousselot can own and reuse across areas, rather than several unconnected bets. This is Limineer's reading for discussion.", "headline": "Across the eight areas a common pattern emerges: value appears to be moving to proven outcomes, and Rousselot does not yet own much of that proof.", "next": "Pick three or four deep-dive areas on 30 October.", "nextLinks": [{"anchor": "r8-map", "go": "r8", "label": "The eight design choices"}], "takeaways": [{"links": [{"anchor": "r1-s1", "go": "r1", "label": "R1 Supply resilience"}, {"label": "[2] ec.europa.eu", "title": "Eurostat, \"EU livestock numbers continued to shrink in 2025\", 30 June 2026, https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2", "url": "https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2"}, {"label": "[3] brusselstimes.com", "title": "The Brussels Times, \"Tessenderlo announces plans to restructure gelatin factory in Vilvoorde\", 21 November 2024, https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde", "url": "https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde"}], "text": "Europe's bone gelatin is getting scarcer: cattle and pig herds are down about 9% since 2015, and PB Leiner is closing its Vilvoorde plant. That makes Rousselot's pharma-grade site at Isle-sur-la-Sorgue more valuable, and the PB Leiner combination means plant roles will likely need deciding soon."}, {"links": [{"anchor": "r2-s1", "go": "r2", "label": "R2 Value chain"}, {"label": "[1] fool.com", "title": "Darling Ingredients (DAR) Q2 2026 Earnings Call Transcript, The Motley Fool, 3 August 2026 (call 30 July 2026). https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/", "url": "https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/"}], "text": "The margin appears to sit in compositions with their own clinical proof rather than in tonnes sold: Darling says targeted ingredients such as Nextida GC earn 7 to 11 times the margin of gelatin."}, {"links": [{"anchor": "r3-s1", "go": "r3", "label": "R3 Clinical nutrition"}, {"anchor": "r4-s1", "go": "r4", "label": "R4 Aesthetics and biomedical"}, {"anchor": "r5-s1", "go": "r5", "label": "R5 Pet health"}, {"anchor": "r6-s1", "go": "r6", "label": "R6 Owning the outcome"}], "text": "Clinical nutrition, aesthetics, pet health and consumer health share a common gap: trial data, owned by Rousselot, in the patients, users or animals the product is for. Partners and regulators increasingly ask for exactly that."}, {"links": [{"anchor": "r7-s1", "go": "r7", "label": "R7 AI and data"}, {"label": "[29] nutraingredients.com", "title": "'Not an AI box of tricks': Nuritas moves industry forward with peptide library, NutraIngredients, 27 February 2024, https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/", "url": "https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/"}], "text": "AI looks most valuable inside Rousselot, by helping find the next Nextida-type peptide faster. No case was found of a customer paying an ingredient supplier for a formulation platform."}, {"links": [{"anchor": "r8-map", "go": "r8", "label": "R8 How Rousselot builds"}], "text": "The business-building unit (RBB) is chartered under Rousselot. Eight design choices, from where it sits to how it is funded and governed, are laid out for decision on 30 October."}]}, "updatedAt": "2026-10-06"}, "areas": [{"code": "R1", "engine": "Core", "engine_long": "Protect what pays today", "extras": [], "internal": "<p>Plant-level data: raw material mix, tonnage and top suppliers per European plant, and energy contracts (plant directors; Jeroen). ISS: product split by customer type, contract tenor, cost per kilogram versus Brazil and China, and any investment or conversion plan already under discussion (ISS site director; Elke). Combination plan: expected closing and the European footprint plan after Vilvoorde (Kathleen, as future RBB lead; Darling corporate development). Sonac: its remit on bone chips and whether it can sign longer supply agreements on Rousselot's behalf (Sonac leadership). Trade: US-destined volumes by plant and the status of any Section 301 monitoring (export sales; legal). Sizing: Praneeth's figures on European collagen peptide and pharma gelatin volumes to replace the gaps marked \"not sizeable\" above. Certification: halal and kosher status per plant and line, which this scan did not cover.<\/p>", "name": "Supply resilience and European plants", "oneLine": "<p>This area asks which of Rousselot's European lines, origins and plants are exposed to raw-material scarcity, trade policy and the coming Rousselot and PB Leiner combination, and what protects them. The scan finds a European collagen business that is still growing (Food segment Europe sales USD 728m in FY2025, 47% of the segment <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>) but sitting on a shrinking raw-material base (EU cattle down 9.7% and pigs down 8.9% in a decade <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>), a direct competitor that has declared European bone gelatin unviable and is closing Vilvoorde <a class=\"cite\" href=\"https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>, and a US Section 301 investigation that names the EU itself as a target, not only China <a class=\"cite\" href=\"https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>. Isle-sur-la-Sorgue (ISS) is a profitable, pharma-weighted bone-gelatin plant (turnover around EUR 100m, EBITDA EUR 14.8m in 2025 <a class=\"cite\" href=\"https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>) whose future is a plant-mix decision, not a rescue.<\/p>", "options": [], "order": 1, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Three shifts are under way at once. First, European raw material is contracting: Eurostat's 30 June 2026 release puts the EU bovine herd at 71.6m head (minus 0.4% year on year, minus 9.7% since 2015) and pigs at 131.5m (minus 0.5%, minus 8.9% since 2015) <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>. France, the largest cattle holder (16.2m, 22.7% of the EU), has lost 16.2% of its herd since 2015, Germany 17.5% and the Netherlands 17.8% <a class=\"cite\" href=\"https://ahdb.org.uk/news/eu-cattle-population-falls-again-in-december-2025-as-breeding-herd-continues-to-shrink\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>. European edible gelatine is roughly 80% pigskin-based, with at most 10% from cattle hide splits and the rest from bones and fish <a class=\"cite\" href=\"https://www.gelatine.org/en/service/faq.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>; GME members used 105,000 to 110,000 tonnes of porcine gelatine capacity in 2023, needing 210 to 230 million pigs <a class=\"cite\" href=\"https://animaltaskforce.eu/wp-content/uploads/2024/11/ATF_seminar2024_06_GME.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>. GME's Line Jensen (title not verified against source) said in 2023 that \"the rate at which supply could follow demand was limited more by raw material availability than by capacity\" <a class=\"cite\" href=\"https://www.leathermag.com/analysis/in-the-clear-110523-10838566/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>.<\/p>\n<p>Second, the industry is consolidating and shifting mix from gelatin to hydrolysed collagen. Darling and Tessenderlo signed a definitive agreement on 10 December 2025 to pool Rousselot and PB Leiner into a company with around 200,000 tonnes of capacity, 22 plants and about USD 1.5bn revenue, 85% Darling and 15% Tessenderlo, closing subject to approvals <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a>. The Bundeskartellamt cleared it on 27 April 2026, noting a combined share of nearly 40% in European collagen peptides, \"sufficient alternative sources of supply\", and high producer flexibility to switch between gelatin and peptides <a class=\"cite\" href=\"https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. Darling's CEO told analysts on 4 May 2026 that \"gelatin margins came under some pretty significant pressure the last couple years due to capacity additions in South America and China\" <a class=\"cite\" href=\"https://www.investing.com/news/transcripts/earnings-call-transcript-darling-ingredients-q1-2026-beats-eps-forecast-93CH-4656449\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>, and on 30 July 2026 that \"We transitioned our extraction capacity to the hydrolyzed collagen market\" <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>; the CFO put collagen at \"roughly 2.5x to 3x the margin of gelatin\" <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>.<\/p>\n<p>Third, trade rules are moving. USTR opened Section 301 investigations on 11 March 2026 into \"structural excess capacity\" in 16 economies including China and the European Union, with \"processed food and beverages\" among the sectors examined <a class=\"cite\" href=\"https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a><a class=\"cite\" href=\"https://www.hklaw.com/en/insights/publications/2026/03/ustr-launches-awaited-section-301-investigations\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>. NARA's 14 April 2026 submission asks USTR to put collagen and gelatin on the record and to impose China-specific tariffs <a class=\"cite\" href=\"https://nara.org/wp-content/uploads/2026/04/4.14.2026-USTR-301-Collagen-Comments-NARA.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>; its SVP International Programs, Dana Johnson Downing, wrote that \"Chinese collagen and gelatin overcapacity and below-market pricing burden U.S. commerce by suppressing prices for market-based suppliers\" <a class=\"cite\" href=\"https://nara.org/wp-content/uploads/2026/04/4.14.2026-USTR-301-Collagen-Comments-NARA.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>, and told trade press that US producers are shut out of China while Chinese producers sell freely into the US <a class=\"cite\" href=\"https://www.provisioneronline.com/articles/120469-nara-urges-investigation-into-chinese-collagen-imports\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a>. The EU exported 10,372 tonnes of gelatin (HS 3503) to the US in 2025, its largest extra-EU destination by volume <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>. Darling booked USD 51m of IEEPA tariff recoveries in Q2 2026 after the US Supreme Court's 20 February 2026 ruling, a reminder that tariff regimes can reverse within a year <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<p>Darling's Food Ingredients segment (Rousselot, Gelnex, CTH casings, Sonac specialties) had net sales of USD 1,545m in FY2025, of which Europe USD 728m, North America USD 416m, China USD 229m, South America USD 126m; collagen and gelatin (\"Food ingredients\" product line) were USD 1,254m of that <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Note that Europe's share is likely inflated by casings, bone chips and edible fats, which sit mostly in Europe (Limineer inference from the 10-K product descriptions, not a stated figure). Q2 2026 segment sales were USD 408.5m with adjusted EBITDA USD 108.5m (up from USD 69.9m), helped by USD 18.5m of net tariff recoveries <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>. Segment raw material processed was 1.32m tonnes in 2025 (up 7%) <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Extra-EU gelatin imports (HS 3503) rose from 35,287 t (EUR 204m) in 2024 to 45,542 t (EUR 235m) in 2025, led by Brazil 9,870 t and Türkiye 9,754 t (up from 5,773 t); China supplied 2,125 t and India 2,258 t <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>. Extra-EU exports were flat at 51,149 t (EUR 301m) <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>. PB Leiner reported H1 2026 revenue of EUR 279m and adjusted EBITDA of EUR 12.2m <a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. The ISS legal entity reported turnover of EUR 100.2m and EBITDA of EUR 14.8m in 2025 with 100 to 199 employees <a class=\"cite\" href=\"https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>; another registry shows a different 2025 turnover, so treat the figure as indicative until checked internally <a class=\"cite\" href=\"https://www.societe.com/societe/rousselot-isle-sur-la-sorgue-484870142.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a>. No reliable public figure was found for European gelatin or collagen production by origin or for hide and bone prices.<\/p>", "title": "Size and growth"}, {"full": "Players", "html": "<p>Rousselot's four European collagen plants per Darling's 10-K are Angoulême and Isle-sur-la-Sorgue (France), Gent (Belgium) and Girona (Spain); Son (Netherlands) appears only as a rendering and bioenergy site <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Angoulême makes food gelatins, gelatin peptides and collagen peptides, including a fish-skin Peptan line opened in 2020 <a class=\"cite\" href=\"https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-angouleme-72095519\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a><a class=\"cite\" href=\"https://www.peptan.com/our-story/\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>; Gent added a porcine Peptan line in 2022 alongside bovine and fish <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/rousselot-adds-porcine-collagen-production-line\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; ISS, a site with more than a century of bone-gelatin production and a past in photographic gelatin <a class=\"cite\" href=\"https://velleron-culture-patrimoine.fr/conference-rousselot-100-ans-de-presence-a-lisle/\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>, makes food, pharmaceutical and technical gelatin from animal bones, around 85% for pharma (capsules, plasma substitutes), and is IED-regulated with a 13.6 MW gas boiler <a class=\"cite\" href=\"https://luberonetsorguesentreprendre.fr/Annuaires%20des%20entreprises/rousselot/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-isle-sur-la-sorgue-72151309\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.georisques.gouv.fr/webappReport/ws/installations/inspection/vPlC7EQqPvnjuuEYNeNutFsuV22aaN0r\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>. Sonac supplies bone chips to the collagen industry in Europe <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. PB Leiner (Tessenderlo) is widely described as the third-largest producer (not verified against a source) and is closing Vilvoorde (bone and pork gelatin; 106 jobs at risk at Vilvoorde and 93 at Treforest per the November 2024 announcement <a class=\"cite\" href=\"https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>) by H1 2027 after stating in November 2024 that \"the European bone gelatin business does not have a viable future\" <a class=\"cite\" href=\"https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a><a class=\"cite\" href=\"https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. Gelita (Eberbach, Memmingen, Göppingen, Minden) makes pharma and food gelatin and peptides <a class=\"cite\" href=\"https://www.gelita.com/en/career/locations/plant-eberbach\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>. Nitta Gelatin is expanding collagen peptides in India (600 to 1,150 t/yr) <a class=\"cite\" href=\"https://globalflowcontrol.com/newsroom/nitta-gelatin-breaks-ground-for-collagen-peptide-expansion-project/\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>. No 2023 to 2026 plant moves were found in public sources for Weishardt, Lapi, Italgelatine, Juncà or Ewald.<\/p>", "title": "Players"}, {"full": "Regulation", "html": "<p>Regulation (EC) 999/2001 (TSE) and Regulation (EC) 1069/2009 (animal by-products) govern raw material eligibility and feed uses; Directive 2010/75/EU (IED) governs plants such as ISS; CSRD (Directive (EU) 2022/2464) and CSDDD (Directive (EU) 2024/1760) are named by Darling as compliance cost risks <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://www.georisques.gouv.fr/webappReport/ws/installations/inspection/vPlC7EQqPvnjuuEYNeNutFsuV22aaN0r\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>. Commission Delegated Regulation (EU) 2026/2102 (in force 18 September 2026) removed bovine hides, skins and leather from EUDR Annex I; EUDR applies to large operators from 30 December 2026, with a leather review foreseen in 2030 <a class=\"cite\" href=\"https://www.eudr.today/en/delegated-act-july-2026\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://usleather.org/news-events/leather-is-out-of-the-eu-deforestation-regulation.-here-is-what-changed-and-what-comes-next\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. No EU anti-dumping or safeguard measure on gelatin or collagen was found in the sources opened.<\/p>", "title": "Regulation"}, {"full": "Signals", "html": "<ol>\n<li>11 March 2026: USTR initiates Section 301 investigations into 16 economies including the EU <a class=\"cite\" href=\"https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>.<\/li>\n<li>14 April 2026: NARA asks USTR for China-specific collagen and gelatin tariffs <a class=\"cite\" href=\"https://nara.org/wp-content/uploads/2026/04/4.14.2026-USTR-301-Collagen-Comments-NARA.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>.<\/li>\n<li>27 April 2026: Bundeskartellamt clears Darling control of PB Leiner <a class=\"cite\" href=\"https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/li>\n<li>30 June 2026: Eurostat confirms a tenth year of EU livestock decline <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>.<\/li>\n<li>2 July 2026: Darling agrees to sell its European casings business to Van Hessen for about EUR 58m <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>.<\/li>\n<li>21 August 2026: Tessenderlo reaches formal agreement to close Vilvoorde, cost about EUR 31m <a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>.<\/li>\n<li>18 September 2026: hides and leather leave EUDR scope <a class=\"cite\" href=\"https://www.eudr.today/en/delegated-act-july-2026\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>.<\/li>\n<li>2025 Comext data: extra-EU gelatin imports up 29% in volume, Türkiye volumes up 69% <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>.<\/li>\n<\/ol>", "title": "Signals"}], "soWhat": {"forRousselot": "Decide which European plant carries bone gelatin, hydrolysed collagen and fish or porcine peptides before the PB Leiner combination is likely to force it. Isle-sur-la-Sorgue earned EBITDA of EUR 14.8m in 2025, so this is about mix.", "forRousselotLinks": [{"anchor": "r1-s5", "go": "r1", "label": "Space 5: Which lines each European plant keeps"}, {"anchor": "r1-s1", "go": "r1", "label": "Space 1: Pharma-grade bone gelatin as a scarce asset"}, {"label": "[6] infonet.fr", "title": "Infonet, \"ROUSSELOT ISLE SUR LA SORGUE\" company data (turnover, EBITDA, workforce 2022 to 2025), accessed 1 October 2026, https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/", "url": "https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/"}, {"label": "[15] fool.com", "title": "The Motley Fool, \"Darling Ingredients (DAR) Q2 2026 Earnings Call Transcript\", call of 30 July 2026, published 3 August 2026, https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/", "url": "https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/"}], "headline": "European bone gelatin is getting scarcer as a rival exits, so Isle-sur-la-Sorgue looks more like a plant-mix decision than a rescue.", "next": "Map Isle-sur-la-Sorgue volumes by customer type, bone origin and contract tenor, then interview three capsule customers on their second sources.", "nextLinks": [{"anchor": "r1-s1", "go": "r1", "label": "Space 1: Pharma-grade bone gelatin as a scarce asset"}, {"anchor": "r1-inputs", "go": "r1", "label": "What we still need"}], "takeaways": [{"links": [{"anchor": "r1-scan-1", "go": "r1", "label": "Scan: Trends"}, {"label": "[2] ec.europa.eu", "title": "Eurostat, \"EU livestock numbers continued to shrink in 2025\", 30 June 2026, https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2", "url": "https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2"}], "text": "EU cattle fell 9.7% and pigs 8.9% since 2015; raw material, more than capacity, appears to limit European supply."}, {"links": [{"anchor": "r1-scan-3", "go": "r1", "label": "Scan: Players"}, {"anchor": "r1-s1", "go": "r1", "label": "Space 1: Pharma-grade bone gelatin as a scarce asset"}, {"label": "[3] brusselstimes.com", "title": "The Brussels Times, \"Tessenderlo announces plans to restructure gelatin factory in Vilvoorde\", 21 November 2024, https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde", "url": "https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde"}, {"label": "[4] tessenderlo.com", "title": "Tessenderlo Group, HY26 results webinar presentation, August 2026, https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf", "url": "https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf"}], "text": "PB Leiner said European bone gelatin has no viable future and is closing Vilvoorde by H1 2027."}, {"links": [{"anchor": "r1-s4", "go": "r1", "label": "Space 4: US market access under trade pressure"}, {"anchor": "r1-scan-1", "go": "r1", "label": "Scan: Trends"}, {"label": "[5] ustr.gov", "title": "USTR, Federal Register notice 2026-05214, \"Initiation of Section 301 Investigations: Acts, Policies, and Practices of Certain Economies Relating to Structural Excess Capacity and Production in Manufacturing Sectors\", 17 March 2026, https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/S", "url": "https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf"}, {"label": "[17] ec.europa.eu", "title": "Eurostat Comext, dataset ds-045409, EU27 trade in product 350300 (gelatin and derivatives), annual 2021 to 2025, queried 1 October 2026, https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300", "url": "https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300"}], "text": "The US Section 301 investigation names the EU itself, not only China; the EU exported 10,372 t of gelatin there in 2025."}], "watchOut": "The Isle-sur-la-Sorgue turnover figure differs between registries, and European pharma gelatin volumes cannot be sized from public data.", "watchOutLinks": [{"anchor": "r1-scan-2", "go": "r1", "label": "Scan: Size and growth"}, {"anchor": "r1-inputs", "go": "r1", "label": "What we still need"}, {"label": "[6] infonet.fr", "title": "Infonet, \"ROUSSELOT ISLE SUR LA SORGUE\" company data (turnover, EBITDA, workforce 2022 to 2025), accessed 1 October 2026, https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/", "url": "https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/"}]}, "sourceNote": "", "updatedAt": "2026-10-01", "spaces": [{"area": "R1", "arena": "Pharma and biomedical", "cell": "Pharma and biomedical x Stable inputs to Volatile world", "fields": {"evidence": "<p>Vilvoorde (bone and pork gelatin) closes by H1 2027 and Treforest (bone only) was put at risk in 2024 <a class=\"cite\" href=\"https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>; ISS is around 85% pharma and bone-based <a class=\"cite\" href=\"https://luberonetsorguesentreprendre.fr/Annuaires%20des%20entreprises/rousselot/\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-isle-sur-la-sorgue-72151309\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>; the ISS entity earned EBITDA of EUR 14.8m on EUR 100m in 2025 <a class=\"cite\" href=\"https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>; the EU exported 10,372 t of gelatin to the US in 2025 <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; collagen peptide imports are described by the regulator as significant, but pharma gelatin faces registration barriers the regulator does not discuss <a class=\"cite\" href=\"https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/p>", "first": "<p>Build a line-by-line map of ISS volumes by customer type, origin of bone (country, supplier) and contract tenor; interview three capsule customers on their qualified second sources and what a European-origin, audit-ready supply is worth to them.<\/p>", "magnitude": "<p>ISS turnover around EUR 100m <a class=\"cite\" href=\"https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>; wider European pharma gelatin volumes not sizeable from public data.<\/p>", "tension": "<p>The loser believes European bone gelatin is a sunset commodity to exit, as Tessenderlo has stated <a class=\"cite\" href=\"https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; the winner sees that each exit makes remaining European pharma-grade capacity scarcer for capsule makers who, per Darling's own filing, \"value quality and consistency, supply reliability, application know-how and regulatory support\" <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>.<\/p>", "uncertainties": "<p>How much of ISS output goes to capsule makers under long-term contracts (Darling's long-term supply contracts fell from USD 171m in 2023 to USD 144m in 2025, segment not stated <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>); whether bone supply in southern France holds as the French herd shrinks; what the combined Rousselot and PB Leiner plan assigns to ISS.<\/p>"}, "name": "European pharma-grade bone gelatin as a scarce asset", "other": [], "rank": 1, "shortName": "Pharma-grade bone gelatin as a scarce asset", "soWhat": "Each rival exit makes Europe's remaining pharma-grade bone gelatin scarcer for capsule makers. Isle-sur-la-Sorgue, around 85% pharma with EBITDA of EUR 14.8m, could gain.", "threshold": "Stable inputs to Volatile world", "updatedAt": "2026-10-01", "verdict": "Lead"}, {"area": "R1", "arena": "Food and beverage", "cell": "Food and beverage x Stable inputs to Volatile world", "fields": {"evidence": "<p>Rousselot already processes pigskin, hides, bones and fish in Europe <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a> with porcine at Gent and fish at Angoulême <a class=\"cite\" href=\"https://www.peptan.com/our-story/\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/rousselot-adds-porcine-collagen-production-line\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; the regulator notes \"high producer flexibility switching between gelatin/collagen peptide production\" <a class=\"cite\" href=\"https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>; import origins into the EU shifted sharply in one year (Türkiye plus 69%, extra-EU plus 29%) <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; Darling says it realises \"a relatively stable margin per kilogram\" by passing raw material costs through <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Gelita moved to near-full ownership of SelJel, a Turkish producer of halal edible, pharmaceutical and technical gelatin (about 6,500 t at the 2020 deal), in 2026 <a href=\"https://www.gelita.com/en/news/gelita-increases-ownership-seljel\" target=\"_blank\" rel=\"noopener\">Gelita, 26 August 2026<\/a><a href=\"https://www.nutritioninsight.com/news/gelita-expands-into-halal-gelatin-with-seljel-majority-stake-acquisition.html\" target=\"_blank\" rel=\"noopener\">Nutrition Insight, 2 December 2020<\/a>.<\/p>", "first": "<p>Ask five existing European F&amp;B accounts whether a volume-based, origin-flexible contract would change their buying; cost one plant's ability to run two origins on the same line, with changeover and certification time.<\/p>", "magnitude": "<p>EU extra-imports of EUR 235m in 2025 are the volume that origin-flexible European supply competes against <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; willingness to pay a premium not sizeable from public data.<\/p>", "tension": "<p>The loser sells a fixed-origin product and absorbs every shock in margin; the winner sells the right to switch origin (pig, bovine, fish, later others) inside one contract and prices that option, as the E3 and E5 cards already argue.<\/p>", "uncertainties": "<p>Whether F&amp;B buyers value switching or only price (the E3 crux); whether halal and kosher requirements, which were not researched here, constrain switching between porcine and bovine; the legal and labelling cost of multi-origin specifications.<\/p><p>Added 8 Oct: Gelita's SelJel move shows a rival buying halal origin as capacity; whether Rousselot's EU customers pay for halal status, and whether Türkiye's import growth is SelJel volume, is not yet known.<\/p>"}, "lastChange": "R1-2: add Gelita's SelJel ownership as evidence that a rival owns halal origin as capacity (accepted 2026-10-09)", "name": "origin flexibility as a sellable attribute", "other": [], "rank": 2, "shortName": "Origin flexibility as something customers buy", "soWhat": "Selling the right to switch between pig, cattle and fish inside one contract could turn raw material shocks into a priced option, not a margin hit. Buyer appetite is unproven.", "threshold": "Stable inputs to Volatile world", "updatedAt": "2026-10-09", "verdict": "Promising"}, {"area": "R1", "arena": null, "cell": "Raw-material sourcing x Ingredients to Ecosystems", "fields": {"evidence": "<p>Herd decline across the main supplying countries <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><a class=\"cite\" href=\"https://ahdb.org.uk/news/eu-cattle-population-falls-again-in-december-2025-as-breeding-herd-continues-to-shrink\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>; GME says supply has been constrained by raw material rather than capacity <a class=\"cite\" href=\"https://www.leathermag.com/analysis/in-the-clear-110523-10838566/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>; Sonac already supplies bone chips to the collagen industry in Europe <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>; the leather trade reports split hides being diverted to collagen and prices staying high in Europe <a class=\"cite\" href=\"https://www.leathermag.com/analysis/in-the-clear-110523-10838566/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a><a class=\"cite\" href=\"https://shoegazing.com/2026/09/06/news-collagen-boom-puts-pressure-on-suede-supply/\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a> (the 2026 trade-press piece carries no named sources and is low trust <a class=\"cite\" href=\"https://shoegazing.com/2026/09/06/news-collagen-boom-puts-pressure-on-suede-supply/\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>).<\/p>", "first": "<p>Map each European plant's top ten raw-material suppliers by tonnage, contract length and alternative buyers; price the option of longer-tenor supply agreements with the two largest European slaughter groups.<\/p>", "magnitude": "<p>1.32m t of raw material processed by the segment in 2025 <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>; European hide and bone price series not found in public sources.<\/p>", "tension": "<p>The loser treats hides, skins and bones as spot inputs bought from slaughterers; the winner treats slaughterhouse and renderer relationships as the asset, since Darling itself states that \"the most competitive aspect of our business is the procurement of raw materials\" <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>.<\/p>", "uncertainties": "<p>The Sonac remit and whether intra-group transfer pricing already captures the sourcing advantage; competition from leather and from pet food for the same splits and bones; whether Darling's Brazilian rendering acquisitions (Bovinos, June 2026 <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>) signal a preference to source bovine material outside Europe.<\/p>"}, "name": "owning the European co-product stream", "other": [], "rank": 3, "shortName": "Owning slaughterhouse and renderer supply ties", "soWhat": "With herds shrinking and supply limited by raw material, long relationships with slaughterers and renderers become the real asset. The segment processed 1.32m t of raw material in 2025.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-01", "verdict": "Promising"}, {"area": "R1", "arena": null, "cell": "Trade geography x Volatile world", "fields": {"evidence": "<p>Federal Register notice listing the EU <a class=\"cite\" href=\"https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>; NARA's China-specific request <a class=\"cite\" href=\"https://nara.org/wp-content/uploads/2026/04/4.14.2026-USTR-301-Collagen-Comments-NARA.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>; EU gelatin exports to the US of 10,372 t in 2025 <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; Darling's statement that tariffs \"have not had a material impact\" to date but remain uncertain <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>.<\/p>", "first": "<p>List US-destined SKUs by producing plant and qualification status; set a named trigger (USTR determination or tariff notice) as E5 already proposes, with a pre-agreed re-routing plan.<\/p>", "magnitude": "<p>EU gelatin exports to the US EUR 58.6m in 2025 <a class=\"cite\" href=\"https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>; Rousselot's own share not public.<\/p>", "tension": "<p>The loser reads Section 301 as a China-only problem that favours Western origin; the winner notes the EU is itself under investigation <a class=\"cite\" href=\"https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>, that tariffs were imposed and refunded within a year <a class=\"cite\" href=\"https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>, and that the advantage lies in being able to re-route volume across 22 plants on four continents <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>.<\/p>", "uncertainties": "<p>USTR's determination timing (no determination as of 4 October 2026; the statutory window runs into March 2027 <a href=\"https://www.icpainc.org/section-301-tracker/\" target=\"_blank\" rel=\"noopener\">ICPA, 4 October 2026<\/a>) and whether processed food is retained in scope; which European plant's volumes serve US customers; whether customers would accept a plant switch without requalification. Added 8 Oct: the EU, France, Germany, Italy and Türkiye co-signed a US-led excess-capacity statement on 7 October 2026 whose five named sectors exclude food ingredients and which does not mention Section 301 <a href=\"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/october/fourteen-economies-join-united-states-signing-joint-ministerial-statement-address-global-excess\" target=\"_blank\" rel=\"noopener\">USTR, 7 October 2026<\/a><a href=\"https://aninews.in/news/world/us/india-joins-us-13-economies-in-joint-statement-to-address-global-excess-capacity-after-g20-meeting20261008031702/\" target=\"_blank\" rel=\"noopener\">ANI, 8 October 2026<\/a>; whether that cooperation changes how the EU is treated in the investigation is unknown.<\/p>"}, "lastChange": "R1-4: note that the EU co-signed the 7 October excess-capacity statement, which leaves food ingredients out (accepted 2026-10-09)", "name": "the US market as a moving target", "other": [], "rank": 4, "shortName": "US market access under trade pressure", "soWhat": "The US investigation targets the EU as well as China, and tariffs have been imposed and refunded within a year. The edge is being able to re-route volume between plants.", "threshold": "Stable inputs to Volatile world", "updatedAt": "2026-10-09", "verdict": "Watch"}, {"area": "R1", "arena": null, "cell": "European plants x Animal-based to Origin-agnostic (within animal)", "fields": {"evidence": "<p>Darling has moved extraction capacity to hydrolysed collagen <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>; new spray-drying is going to Kaiping and Paraguay, not Europe <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>; Vilvoorde closes, leaving PB Leiner's remaining European footprint to be rationalised with Rousselot's <a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>; ISS runs 24/7 on a gas boiler at EU non-household gas prices of EUR 0.0605 per kWh in H2 2025 <a class=\"cite\" href=\"https://www.georisques.gouv.fr/webappReport/ws/installations/inspection/vPlC7EQqPvnjuuEYNeNutFsuV22aaN0r\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Natural_gas_price_statistics\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>.<\/p>", "first": "<p>A one-page plant-by-plant exposure sheet (origin, raw material, energy intensity, customer segment, export share); a scenario in which ISS keeps pharma bone gelatin only, costed against one in which it adds a peptide line.<\/p>", "magnitude": "<p>Not sizeable from public data; the combined entity's European capacity after Vilvoorde is an internal number.<\/p>", "tension": "<p>The loser defends every line at every plant; the winner decides, before the combination with PB Leiner forces it, which European plant carries bone gelatin, which carries hydrolysed collagen, and which carries fish or porcine peptides, given collagen's 2.5 to 3 times gelatin margin <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>.<\/p>", "uncertainties": "<p>Closing date and integration plan for the Rousselot and PB Leiner combination; capital cost of converting bone-gelatin extraction to peptides at ISS; local employment and permitting constraints (the 28 February 2025 inspection shows open compliance items <a class=\"cite\" href=\"https://www.georisques.gouv.fr/webappReport/ws/installations/inspection/vPlC7EQqPvnjuuEYNeNutFsuV22aaN0r\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>).<\/p>"}, "name": "which lines each plant keeps", "other": [], "rank": 5, "shortName": "Which lines each European plant keeps", "soWhat": "Collagen earns 2.5 to 3 times gelatin margin, and the PB Leiner combination is likely to force plant choices. Deciding early which plant makes what should help keep Rousselot in control.", "threshold": "Animal-based to Origin-agnostic", "updatedAt": "2026-10-01", "verdict": "Test first"}], "sources": [{"n": 1, "text": "Darling Ingredients Inc., Form 10-K for fiscal year ended 3 January 2026, filed 3 March 2026, SEC, https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm", "url": "https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm"}, {"n": 2, "text": "Eurostat, \"EU livestock numbers continued to shrink in 2025\", 30 June 2026, https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2", "url": "https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260630-2"}, {"n": 3, "text": "The Brussels Times, \"Tessenderlo announces plans to restructure gelatin factory in Vilvoorde\", 21 November 2024, https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde", "url": "https://www.brusselstimes.com/1322920/tessenderlo-announces-plans-to-restructure-gelatin-factory-in-vilvoorde"}, {"n": 4, "text": "Tessenderlo Group, HY26 results webinar presentation, August 2026, https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf", "url": "https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf"}, {"n": 5, "text": "USTR, Federal Register notice 2026-05214, \"Initiation of Section 301 Investigations: Acts, Policies, and Practices of Certain Economies Relating to Structural Excess Capacity and Production in Manufacturing Sectors\", 17 March 2026, https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf", "url": "https://ustr.gov/sites/default/files/files/Issue_Areas/Enforcement/Section%20301/Initiation%20Notice%202026-05214.pdf"}, {"n": 6, "text": "Infonet, \"ROUSSELOT ISLE SUR LA SORGUE\" company data (turnover, EBITDA, workforce 2022 to 2025), accessed 1 October 2026, https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/", "url": "https://infonet.fr/entreprises/48487014200011-rousselot-isle-sur-la-sorgue/"}, {"n": 7, "text": "AHDB, \"EU cattle population falls again in December 2025 as breeding herd continues to shrink\", 10 August 2026, https://ahdb.org.uk/news/eu-cattle-population-falls-again-in-december-2025-as-breeding-herd-continues-to-shrink", "url": "https://ahdb.org.uk/news/eu-cattle-population-falls-again-in-december-2025-as-breeding-herd-continues-to-shrink"}, {"n": 8, "text": "Gelatine Manufacturers of Europe, FAQ, accessed 1 October 2026, https://www.gelatine.org/en/s
