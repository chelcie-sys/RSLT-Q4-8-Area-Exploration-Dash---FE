ervice/faq.html", "url": "https://www.gelatine.org/en/service/faq.html"}, {"n": 9, "text": "Gelatine Manufacturers of Europe, presentation to Animal Task Force seminar, 20 November 2024, https://animaltaskforce.eu/wp-content/uploads/2024/11/ATF_seminar2024_06_GME.pdf", "url": "https://animaltaskforce.eu/wp-content/uploads/2024/11/ATF_seminar2024_06_GME.pdf"}, {"n": 10, "text": "Leather International, \"In the clear\", 15 May 2023 (quotes Line Jensen, GME), https://www.leathermag.com/analysis/in-the-clear-110523-10838566/", "url": "https://www.leathermag.com/analysis/in-the-clear-110523-10838566/"}, {"n": 11, "text": "Darling Ingredients, \"Darling Ingredients and Tessenderlo Group sign a definitive agreement to form new company\", 10 December 2025, https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company", "url": "https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company"}, {"n": 12, "text": "Darling Ingredients, \"Darling Ingredients and Tessenderlo Group agree to form new company to accelerate growth in attractive collagen-based health, wellness and nutrition sector\", 12 May 2025, https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company", "url": "https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company"}, {"n": 13, "text": "Bundeskartellamt, \"Darling Ingredients can acquire control of PB Leiner\", press release, 27 April 2026, https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html", "url": "https://www.bundeskartellamt.de/SharedDocs/Meldung/EN/Pressemitteilungen/2026/04_27_2026_Darling_PBL.html"}, {"n": 14, "text": "Investing.com, \"Earnings call transcript: Darling Ingredients Q1 2026 beats EPS forecast\", call of 4 May 2026, https://www.investing.com/news/transcripts/earnings-call-transcript-darling-ingredients-q1-2026-beats-eps-forecast-93CH-4656449", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-darling-ingredients-q1-2026-beats-eps-forecast-93CH-4656449"}, {"n": 15, "text": "The Motley Fool, \"Darling Ingredients (DAR) Q2 2026 Earnings Call Transcript\", call of 30 July 2026, published 3 August 2026, https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/", "url": "https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/"}, {"n": 16, "text": "North American Renderers Association, comments to USTR, docket USTR-2026-0067, 14 April 2026, https://nara.org/wp-content/uploads/2026/04/4.14.2026-USTR-301-Collagen-Comments-NARA.pdf", "url": "https://nara.org/wp-content/uploads/2026/04/4.14.2026-USTR-301-Collagen-Comments-NARA.pdf"}, {"n": 17, "text": "Eurostat Comext, dataset ds-045409, EU27 trade in product 350300 (gelatin and derivatives), annual 2021 to 2025, queried 1 October 2026, https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300", "url": "https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/ds-045409?reporter=EU27_2020&product=350300"}, {"n": 18, "text": "Darling Ingredients Inc., Form 10-Q for the quarter ended 4 July 2026, filed 7 August 2026, SEC, https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm", "url": "https://www.sec.gov/Archives/edgar/data/916540/000091654026000023/dar-20260704.htm"}, {"n": 19, "text": "Darling Ingredients, \"Darling Ingredients Inc. Reports Second Quarter 2026 Results\", 30 July 2026, https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results", "url": "https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results"}, {"n": 20, "text": "Societe.com, \"ROUSSELOT ISLE SUR LA SORGUE\" company extract, accessed 1 October 2026, https://www.societe.com/societe/rousselot-isle-sur-la-sorgue-484870142.html", "url": "https://www.societe.com/societe/rousselot-isle-sur-la-sorgue-484870142.html"}, {"n": 21, "text": "Industrie Explorer (L'Usine Nouvelle), \"ROUSSELOT ANGOULEME\", accessed 1 October 2026, https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-angouleme-72095519", "url": "https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-angouleme-72095519"}, {"n": 22, "text": "Peptan, \"Our Story\", accessed 1 October 2026, https://www.peptan.com/our-story/", "url": "https://www.peptan.com/our-story/"}, {"n": 23, "text": "Nutritional Outlook, \"Rousselot adds porcine collagen production line\", 23 February 2022, https://www.nutritionaloutlook.com/view/rousselot-adds-porcine-collagen-production-line", "url": "https://www.nutritionaloutlook.com/view/rousselot-adds-porcine-collagen-production-line"}, {"n": 24, "text": "Luberon & Sorgues Entreprendre, business directory entry \"ROUSSELOT\", accessed 1 October 2026, https://luberonetsorguesentreprendre.fr/Annuaires%20des%20entreprises/rousselot/", "url": "https://luberonetsorguesentreprendre.fr/Annuaires%20des%20entreprises/rousselot/"}, {"n": 25, "text": "Industrie Explorer (L'Usine Nouvelle), \"ROUSSELOT ISLE SUR LA SORGUE\", accessed 1 October 2026, https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-isle-sur-la-sorgue-72151309", "url": "https://industrie.usinenouvelle.com/fiche/etablissement/rousselot-isle-sur-la-sorgue-72151309"}, {"n": 26, "text": "DREAL PACA, inspection report, ROUSSELOT Isle sur Sorgue SAS, inspection of 28 February 2025, Géorisques, https://www.georisques.gouv.fr/webappReport/ws/installations/inspection/vPlC7EQqPvnjuuEYNeNutFsuV22aaN0r", "url": "https://www.georisques.gouv.fr/webappReport/ws/installations/inspection/vPlC7EQqPvnjuuEYNeNutFsuV22aaN0r"}, {"n": 27, "text": "Gelita, \"Plant Eberbach\", accessed 1 October 2026, https://www.gelita.com/en/career/locations/plant-eberbach", "url": "https://www.gelita.com/en/career/locations/plant-eberbach"}, {"n": 28, "text": "Global Flow Control, \"Nitta Gelatin breaks ground for collagen peptide expansion project\", 30 April 2024, https://globalflowcontrol.com/newsroom/nitta-gelatin-breaks-ground-for-collagen-peptide-expansion-project/", "url": "https://globalflowcontrol.com/newsroom/nitta-gelatin-breaks-ground-for-collagen-peptide-expansion-project/"}, {"n": 29, "text": "EUDR.today, \"EUDR Product Scope Final: The 13 July 2026 Delegated and Implementing Acts\" (Commission Delegated Regulation (EU) 2026/2102), accessed 1 October 2026, https://www.eudr.today/en/delegated-act-july-2026", "url": "https://www.eudr.today/en/delegated-act-july-2026"}, {"n": 30, "text": "Leather and Hide Council of America, \"Leather Is Out of the EU Deforestation Regulation. Here Is What Changed and What Comes Next\", 30 July 2026, https://usleather.org/news-events/leather-is-out-of-the-eu-deforestation-regulation.-here-is-what-changed-and-what-comes-next", "url": "https://usleather.org/news-events/leather-is-out-of-the-eu-deforestation-regulation.-here-is-what-changed-and-what-comes-next"}, {"n": 31, "text": "Shoegazing, \"News: Collagen boom puts pressure on suede supply\", 6 September 2026 (no named sources; low trust), https://shoegazing.com/2026/09/06/news-collagen-boom-puts-pressure-on-suede-supply/", "url": "https://shoegazing.com/2026/09/06/news-collagen-boom-puts-pressure-on-suede-supply/"}, {"n": 32, "text": "Eurostat, \"Natural gas price statistics\", data for second half of 2025, accessed 1 October 2026, https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Natural_gas_price_statistics", "url": "https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Natural_gas_price_statistics"}, {"n": 33, "text": "The National Provisioner, \"NARA urges investigation into Chinese collagen imports\", 15 April 2026 (quotes Dana Johnson Downing, SVP International Programs, NARA), https://www.provisioneronline.com/articles/120469-nara-urges-investigation-into-chinese-collagen-imports", "url": "https://www.provisioneronline.com/articles/120469-nara-urges-investigation-into-chinese-collagen-imports"}, {"n": 34, "text": "Holland & Knight, \"USTR Launches Awaited Section 301 Investigations of 16 Economies for Manufacturing Overcapacity\", March 2026, https://www.hklaw.com/en/insights/publications/2026/03/ustr-launches-awaited-section-301-investigations", "url": "https://www.hklaw.com/en/insights/publications/2026/03/ustr-launches-awaited-section-301-investigations"}, {"n": 35, "text": "Velleron Culture et Patrimoine, \"Conférence : Rousselot, 100 ans de présence à L'Isle\", 24 October 2015, https://velleron-culture-patrimoine.fr/conference-rousselot-100-ans-de-presence-a-lisle/", "url": "https://velleron-culture-patrimoine.fr/conference-rousselot-100-ans-de-presence-a-lisle/"}]}, {"code": "R2", "engine": "Core", "engine_long": "Protect what pays today", "extras": [{"html": "<p>Feedback received on 6 Oct raised a core question that is not a venture by default: how to keep Peptan leading beyond the science.<\/p><ul>\n<li><strong>Holistic positioning.<\/strong> Peptan's position is holistic: one product boosts the body's own collagen production, with benefits wherever the body needs collagen (skin, bones, joints), which may differ by person. A competitor that chose indication-specific peptides cannot go back to holistic; Rousselot has both (Peptan holistic, Nextida targeted). The holistic position should be made stronger.<\/li>\n<li><strong>What the co-brand means.<\/strong> Why would a consumer buy a product with Peptan inside? It is a quality label, and science is not the whole deal: taste, smell and dissolution matter. Rousselot already treats Peptan to help dissolution; further ideas include microencapsulation (for example lemon flavour) or fermentation. The B2B2C side beyond the science has not been worked.<\/li>\n<li><strong>Pre-mortem link.<\/strong> If nothing changes and other brands keep investing in science, possibly with more neutral flavour from smaller batches or new factories, Peptan stops being premium.<\/li>\n<li><strong>When it becomes a venture.<\/strong> If the physical change needs a production step Rousselot's own factories cannot run.<\/li><\/ul>\n<p><strong>Our take.<\/strong> Placed here (premiumising the core) as space 6, not in R1 (supply). It is a core programme unless the production-step test is met. It connects to R3 space 8: a blend in a better format is the same move seen from the margin side.<\/p>", "title": "6 Oct: feedback received and how the map changed"}], "internal": "<ol>\n<li>Gross margin and price per kilo by product tier (gelatin, Peptan, Colartix, Nextida GC) for the four European plants and ISS: who holds it? Finance (Jeroen) and Praneeth's sizing.<\/li>\n<li>Raw material intake by plant (pig skin, bovine hide, bone, fish), contract versus spot, and the share supplied by Darling or Sonac: Operations and Procurement; the Sonac coordination question.<\/li>\n<li>Nextida GC commercial facts: customers by region, repeat-order rate, realised price premium over Peptan, Asian launch partner: Lauretta Katsriku's category team.<\/li>\n<li>Pipeline status of the other compositions (Nextida Brain and the library of 17): R&amp;D (the team Matt works with).<\/li>\n<li>Whether Rousselot or the JV has, or wants, finished-dose (GMP) capacity, and what ALKUS already does for customers: Applications and Operations.<\/li>\n<li>The Nextida JV's integration plan for brand architecture (Peptan, Nextida product line, Nextida company): Elke and the integration office.<\/li>\n<li>Regulatory file on Nextida GC in the EU (does it rely on existing collagen hydrolysate status, and what claims are used in Austria): Regulatory Affairs.<\/li>\n<li>Peptan experience (new, 6 Oct): what the current dissolution treatment does; any consumer or sensory research on Peptan as a co-brand; sensory comparisons against competing peptides; which physical changes (encapsulation, flavour, fermentation) the current plants can or cannot run.<\/li><\/ol>", "name": "Value chain and premiumising the core", "oneLine": "<p>This area asks where money is actually made between the hide and the shelf, and whether Rousselot can move its mix up the margin ladder (gelatin to collagen peptides to targeted compositions) faster than the commodity end erodes. The scan found one hard, disclosed fact that organises everything else: Darling's own management puts hydrolysed collagen at 2.5 to 3 times the margin of gelatin and targeted ingredients at 7 to 11 times <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>, while the Food segment that houses Rousselot runs at a 19 per cent adjusted EBITDA margin for 2025 and 27 per cent in Q2 2026 <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. Downstream brand ownership is where the biggest companies have gone (Nestlé with Vital Proteins), but ingredient makers themselves have stopped at co-branding, private label and small licensed brands; the premium tier is being fought on dose-per-effect and clinical evidence, not on tonnes.<\/p>", "options": [], "order": 2, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Mix, not volume, is the margin story. Darling's CFO Bob Day told analysts on 30 July 2026 that \"collagen generates roughly 2.5x to 3x the margin of gelatin, and targeted ingredients can generate 7x to 11x\" <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. A Zacks article of 16 September 2026 (secondary; the underlying Darling presentation was not opened) puts collagen at 30 per cent of Food segment volume but 48 per cent of segment EBITDA in 2025 (from 20 per cent and 35 per cent in 2020), with targeted ingredients expected to reach 15 per cent of Food segment adjusted EBITDA by 2030 <a class=\"cite\" href=\"https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>. Those ratios are the only disclosed margin ladder in the industry; Gelita (private) last published an EBIT figure for 2017 (EUR 62 million on EUR 709 million revenue, 8.7 per cent) <a class=\"cite\" href=\"https://www.omano.de/art_ausgabe.php?id=37793&m=1\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>, and Tessenderlo's Bio-valorization segment (PB Leiner plus Akiolis rendering) earned an adjusted EBITDA margin of 2.7 per cent in 2025 and 4.4 per cent in H1 2026 after stopping European bone gelatin production <a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a><a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>.<\/p>\n<p>The premium tier is converging on \"less gram, more proof\". Gelita argues that Verisol at 2.5 g per day gives 400 doses per kilo versus 100 for a 10 g generic, so that \"even if VERISOL were double the per kilo price of competitive collagen peptides, its cost in use would still be half the price\" <a class=\"cite\" href=\"https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. Weishardt launched Naticol UltraPeptide (500 Da average, 0.5 to 1 g per day) on 22 May 2026 <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>; Nitta's Wellnex Replenwell line is sold on five clinical trials and 5 g per day for joint comfort <a class=\"cite\" href=\"https://wellnex-collagen.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>; Geltor claims PrimaColl \"works at just 1 gram per day\" <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. Rousselot's own Nextida GC sits in the same logic: launched 14 May 2024 as \"specific collagen peptide compositions with new targeted health benefits\" and first sold in the US <a class=\"cite\" href=\"https://www.darlingii.com/media/news/rousselot-introducing-nextida-a-groundbreaking-innovation-shaping-the-future-of-collagen-peptides\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a><a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/nextida-gc-collagen-peptides-by-rousselot-to-be-featured-at-vitafoods-europe-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a>, a first study presented at SupplySide West in October 2024 (42 per cent average reduction in post-meal glucose spike) <a class=\"cite\" href=\"https://nutraceuticalbusinessreview.com/rousselot-collagen-peptide-nutraceutical-reduces-post-meal-blood-sugar-spikes\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>, 5 g or 10 g taken 30 minutes before a meal, a second clinical study in prediabetic participants, and granted patents in the US, Europe, Japan, Australia and China <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/rousselot-s-nextida-gc-clinical-data-us-patent-and-the-byon-beverage-launch\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-nextida-precision-collagen-peptides.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>. Colartix, a patented collagen peptide plus chondroitin sulphate matrix at 1 g per day, is the other Rousselot entry in this tier <a class=\"cite\" href=\"https://www.darlingii.com/rousselot/brands/colartix\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>.<\/p>\n<p>Consolidation at the top. Darling and Tessenderlo announced on 12 May 2025 and signed definitively on 9 to 11 December 2025 a combination of Rousselot and PB Leiner into a new company named Nextida (85/15), with roughly USD 1.5 billion revenue, about 200,000 tonnes of gelatin and collagen capacity and 22 to 23 plants; Tessenderlo's Vilvoorde plant is excluded and was impaired by EUR 21.7 million <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.stocktitan.net/news/DAR/darling-ingredients-and-tessenderlo-group-sign-definitive-agreement-rlads5bxcgj6.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-pb-leiner-darling-ingredients-tessenderlo.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a>. Closing was still pending in Darling's Q4 2025 and Q2 2026 reporting <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>.<\/p>\n<p>Upstream, the hide has lost most of its value as leather, which changes the raw material economics. USDA reported on 30 September 2026 a branded steer hide at USD 24.50 per piece contributing USD 1.75 of a USD 15.12 per cwt total by-product value <a class=\"cite\" href=\"https://www.ams.usda.gov/mnreports/ams_2829.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>; in 2014 the total drop value peaked at USD 16.69 per cwt and native hides sold near USD 120 five years before 2020 <a class=\"cite\" href=\"https://www.canadiancattlemen.ca/news/cattle-hides-take-a-tanning/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<p>No trade body publishes a value figure. The Gelatine Manufacturers of Europe (11 members, close to all European gelatine output, about one third of world volume) reported 105,000 to 110,000 tonnes of European porcine gelatine production for 2023 <a class=\"cite\" href=\"https://animaltaskforce.eu/wp-content/uploads/2024/11/ATF_seminar2024_06_GME.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.gelatine.org/en/gme.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>. Paid research estimates diverge and are low-trust: Grand View puts the global collagen market at USD 11.4 billion in 2025 with gelatin at 66.4 per cent of revenue and hydrolysed collagen growing fastest <a class=\"cite\" href=\"https://www.grandviewresearch.com/industry-analysis/collagen-market\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>; Fortune Business Insights puts collagen peptides at USD 2.86 billion in 2025 <a class=\"cite\" href=\"https://www.fortunebusinessinsights.com/collagen-peptides-market-112516\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; IMARC puts hydrolysed collagen at USD 1.3 billion in 2025 <a class=\"cite\" href=\"https://www.imarcgroup.com/hydrolyzed-collagen-market\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a>. The one audited anchor is Darling's Food Ingredients segment: net sales USD 1,545 million and segment adjusted EBITDA USD 294.9 million for 2025 (19.1 per cent), up from 17.2 per cent in 2024; Q2 2026 reached USD 108.5 million EBITDA on USD 408.5 million sales (26.6 per cent) <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. No public figure splits premium from commodity collagen peptides.<\/p>", "title": "Size and growth"}, {"full": "Players", "html": "<p>Ingredient incumbents: Rousselot (Peptan, Colartix, Nextida), PB Leiner, Gelita (Verisol, Fortigel, Bodybalance; plus Gelita Health, which runs own brands CH-Alpha and Qyra, private label and distribution partners) <a class=\"cite\" href=\"https://gelita-health.com/distribution-partners/?lang=en\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>, Nitta Gelatin (Wellnex) <a class=\"cite\" href=\"https://wellnex-collagen.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>, Weishardt (Naticol) <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>. Downstream brand owners: Nestlé Health Science bought a majority of Vital Proteins in June 2020 (150 SKUs, 35,000 doors) and completed the acquisition in February 2022 <a class=\"cite\" href=\"https://www.nestlehealthscience.com/newsroom/press-releases/nestle-health-science-agrees-to-acquire-majority-stake-in-vital-proteins\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://www.nestlehealthscience.com/newsroom/press-releases/nhs-completes-acquisition-of-vp\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>; it reported CHF 6,551 million sales and a 16.1 per cent UTOP margin for 2025 but discloses nothing on Vital Proteins, and its separate Globally Managed Business structure is being dissolved into a new Nutrition unit <a class=\"cite\" href=\"https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>. Sports Research, Ancient Nutrition and Orgain publish no margins (not found in public sources). Non-animal challengers: Geltor (PrimaColl, FDA GRAS GRN 1171, \"no questions\" letter 22 October 2024; 2019 letter of intent with Gelita) <a class=\"cite\" href=\"https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a><a class=\"cite\" href=\"https://www.biospace.com/gelita-and-amp-geltor-sign-letter-of-intent-to-commercialize-first-animal-free-biodesigned-collagen-for-dietary-supplements-a-market-with-huge-growth-potential\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>; Evonik (Vecollan recombinant collagen-like protein, clinical grade for medical devices, 16 September 2025) <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>; Jellatech (cell-based collagen, USD 3.5 million seed, August 2023) <a class=\"cite\" href=\"https://agfundernews.com/jellatech-lands-3-5m-in-new-funds-to-commercialize-animal-free-collagen-for-food-pharma\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>. Modern Meadow today sells a leather alternative, not an ingestible collagen <a class=\"cite\" href=\"https://www.modernmeadow.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a>. \"Collagen+\" could not be verified as a company (not found in public sources).<\/p>", "title": "Players"}, {"full": "Regulation", "html": "<p>EU: Regulation (EC) 1924/2006 governs claims; EFSA's 2011 Article 13(5) opinion found that \"a cause and effect relationship has not been established between the consumption of collagen hydrolysate and maintenance of joints\" <a class=\"cite\" href=\"https://efsa.europa.eu/en/efsajournal/pub/2291\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>, and this scan found no authorised EU health claim for collagen. Novel foods from new production processes or microorganisms fall under Regulation (EU) 2015/2283 and need a Union-list entry <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32015R2283\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>; Geltor's materials cite only US GRAS <a class=\"cite\" href=\"https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>. US: GRAS self-determination with FDA notification is the route fermentation peptides have used <a class=\"cite\" href=\"https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>. Gelita notes approved claims for Verisol in Brazil, Japan and Canada, not the EU <a class=\"cite\" href=\"https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>.<\/p>", "title": "Regulation"}, {"full": "Signals", "html": "<ol>\n<li>30 July 2026: Darling discloses the 2.5 to 3x and 7 to 11x margin ratios and calls Nextida \"a five-year build, maybe longer\" with \"another half dozen products\" coming; Nextida GC \"continues to have repeat sales and also is now being sold in Asia\"; a Nextida Brain launch is flagged <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>.<\/li>\n<li>20 March 2026: Rousselot announces patents for Nextida GC and a second clinical study (up to 37 per cent reduction in glucose spikes) <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/li>\n<li>9 to 11 December 2025: definitive agreement for the Nextida JV; Vilvoorde excluded <a class=\"cite\" href=\"https://www.stocktitan.net/news/DAR/darling-ingredients-and-tessenderlo-group-sign-definitive-agreement-rlads5bxcgj6.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>.<\/li>\n<li>22 May 2026: Weishardt launches a 0.5 to 1 g per day marine peptide, the lowest dose claim in the category <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>.<\/li>\n<li>16 September 2025: Evonik launches clinical-grade recombinant collagen for medical devices <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>.<\/li>\n<li>22 October 2024: FDA closes Geltor's GRN 1171 with no questions; Geltor speaks of 1 g per day efficacy <a class=\"cite\" href=\"https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>.<\/li>\n<li>2025: Tessenderlo stops European bone gelatin activities and reports Bio-valorization adjusted EBITDA of 2.7 per cent <a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>.<\/li>\n<li>Retail: Pura Collagen prices GLPure+ (5 g Nextida GC per sachet) at GBP 50 against GBP 45 for its standard glow+ <a class=\"cite\" href=\"https://puracollagen.co.uk/products/glpure\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://puracollagen.co.uk/collections/frontpage\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a>; Codeage prices its 10 g Nextida GC powder at USD 59.99 against USD 39.99 for its plain multi-collagen large tub <a class=\"cite\" href=\"https://codeage.com/products/glp-1-supplement-collagen-peptides-powder\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a><a class=\"cite\" href=\"https://codeage.com/collections/collagen\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>.<\/li>\n<\/ol>", "title": "Signals"}], "soWhat": {"forRousselot": "Put effort into compositions with their own clinical proof and patents, like Nextida GC, rather than tonnes. Keep Peptan premium by strengthening its whole-body position and the consumer experience.", "forRousselotLinks": [{"anchor": "r2-s1", "go": "r2", "label": "Space 1: Selling proven effect, not kilos"}, {"anchor": "r2-x1", "go": "r2", "label": "6 Oct: feedback received and how the map changed"}, {"label": "[13] nutraingredients.com", "title": "Rousselot targets post-meal glucose control with newly patented collagen peptide, NutraIngredients, 20 March 2026. https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/", "url": "https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/"}], "headline": "Rousselot's margin is likely to grow most by moving up from gelatin to targeted compositions, which Darling says earn 7 to 11 times gelatin.", "next": "Build a one-page cost-in-use calculator for Nextida GC versus generic 10 g peptides and test it with five Peptan buyers.", "nextLinks": [{"anchor": "r2-s1", "go": "r2", "label": "Space 1: Selling proven effect, not kilos"}, {"label": "[8] gelita.com", "title": "Apples and Penguins: The Pitfall of Comparing Collagen Peptide Prices, Gelita blog, updated August 2025. https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices", "url": "https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices"}], "takeaways": [{"links": [{"anchor": "r2-scan-1", "go": "r2", "label": "Scan: Trends"}, {"anchor": "r2-s1", "go": "r2", "label": "Space 1: Selling proven effect, not kilos"}, {"label": "[1] fool.com", "title": "Darling Ingredients (DAR) Q2 2026 Earnings Call Transcript, The Motley Fool, 3 August 2026 (call 30 July 2026). https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/", "url": "https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/"}, {"label": "[2] finance.yahoo.com", "title": "Can Darling Ingredients Turn Collagen Into a Bigger Earnings Engine?, Zacks via Yahoo Finance, 16 September 2026. https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html", "url": "https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html"}], "text": "Darling puts collagen at 2.5 to 3 times gelatin margin and targeted ingredients at 7 to 11 times."}, {"links": [{"anchor": "r2-scan-1", "go": "r2", "label": "Scan: Trends"}, {"anchor": "r2-scan-5", "go": "r2", "label": "Scan: Signals"}, {"label": "[9] nutraingredients.com", "title": "Weishardt launches ultra-low molecular weight collagen for enhanced absorption, NutraIngredients, 22 May 2026. https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/", "url": "https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/"}, {"label": "[10] wellnex-collagen.com", "title": "Wellnex collagen peptides (Nitta Gelatin) website, accessed 1 October 2026. https://wellnex-collagen.com/", "url": "https://wellnex-collagen.com/"}, {"label": "[11] foodnavigator.com", "title": "FDA greenlights in-demand 'vegan' collagen from Geltor, FoodNavigator, 16 October 2025. https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/", "url": "https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/"}], "text": "The premium tier competes on lower dose and clinical proof; Weishardt now claims 0.5 to 1 g per day."}, {"links": [{"anchor": "r2-s1", "go": "r2", "label": "Space 1: Selling proven effect, not kilos"}, {"anchor": "r2-scan-5", "go": "r2", "label": "Scan: Signals"}, {"label": "[36] puracollagen.co.uk", "title": "GLPure+ product page, Pura Collagen, accessed 1 October 2026. https://puracollagen.co.uk/products/glpure", "url": "https://puracollagen.co.uk/products/glpure"}, {"label": "[37] puracollagen.co.uk", "title": "Our Range, Pura Collagen, accessed 1 October 2026. https://puracollagen.co.uk/collections/frontpage", "url": "https://puracollagen.co.uk/collections/frontpage"}, {"label": "[38] codeage.com", "title": "Glucose Support Collagen Peptides Powder, Nextida GC, Codeage, accessed 1 October 2026. https://codeage.com/products/glp-1-supplement-collagen-peptides-powder", "url": "https://codeage.com/products/glp-1-supplement-collagen-peptides-powder"}, {"label": "[39] codeage.com", "title": "Collagen collection, Codeage, accessed 1 October 2026. https://codeage.com/collections/collagen", "url": "https://codeage.com/collections/collagen"}], "text": "Retail Nextida GC products sell at 11 per cent to 50 per cent above the same brand's standard collagen."}], "watchOut": "The EU has no authorised health claim for collagen, and a premium may not survive once a composition is copied.", "watchOutLinks": [{"anchor": "r2-scan-4", "go": "r2", "label": "Scan: Regulation"}, {"anchor": "r2-s1", "go": "r2", "label": "Space 1: Selling proven effect, not kilos"}, {"label": "[34] efsa.europa.eu", "title": "Scientific Opinion on the substantiation of a health claim related to collagen hydrolysate and maintenance of joints pursuant to Article 13(5) of Regulation (EC) No 1924/2006, EFSA Journal 2011;9(7):2291. https://efsa.europa.eu/en/efsajournal/pub/2291", "url": "https://efsa.europa.eu/en/efsajournal/pub/2291"}]}, "sourceNote": "", "updatedAt": "2026-10-06", "spaces": [{"area": "R2", "arena": null, "cell": "Premium peptide tier x Products to Outcomes", "fields": {"evidence": "<p>Darling: targeted ingredients at 7 to 11 times gelatin margin, 15 per cent of Food EBITDA by 2030 <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>. Gelita's cost-in-use argument (400 doses per kilo) <a class=\"cite\" href=\"https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. Nextida GC: patents in five jurisdictions, two clinical studies, repeat orders, Asia sales <a class=\"cite\" href=\"https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-nextida-precision-collagen-peptides.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>. Retail uplift of 11 per cent (Pura) to 50 per cent (Codeage) for the Nextida GC SKU versus the same brand's standard collagen <a class=\"cite\" href=\"https://puracollagen.co.uk/products/glpure\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://puracollagen.co.uk/collections/frontpage\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><a class=\"cite\" href=\"https://codeage.com/products/glp-1-supplement-collagen-peptides-powder\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a><a class=\"cite\" href=\"https://codeage.com/collections/collagen\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>. Weishardt and Geltor racing the dose down to 1 g or less <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>.<\/p>", "first": "<p>Build a one-page cost-in-use calculator for Nextida GC versus generic 10 g peptides and test it with five existing Peptan buyers. Price-pair every Nextida GC retail SKU against its brand's standard collagen SKU (the two pairs above, plus Byon in Austria <a class=\"cite\" href=\"https://www.nutritionaloutlook.com/view/rousselot-s-nextida-gc-clinical-data-us-patent-and-the-byon-beverage-launch\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a>) to document the realised premium.<\/p>", "magnitude": "<p>Darling's own target implies targeted ingredients worth roughly USD 45 million of Food EBITDA by 2030 on 2025's base (15 per cent of USD 294.9 million) <a class=\"cite\" href=\"https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; the real prize is the multiple: management framed the shift as a route to 12 to 16 times EBITDA valuations (secondary transcript, treat as indicative) <a class=\"cite\" href=\"https://equibles.com/stocks/dar/calls/2025-q4\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>.<\/p>", "tension": "<p>The loser still believes collagen peptides are sold by the kilo with a brochure of borrowed studies attached. The winner sees that a patented composition with its own clinical dossier is priced per effect, defended by IP, and lands in a different budget line at the customer.<\/p>", "uncertainties": "<p>Does the premium survive once a composition is copied (patents cover composition, not the hydrolysate category)? What is the actual price per kilo and gross margin of Nextida GC versus Peptan (internal)? Can a second and third composition reach clinical proof at the same speed, given the 17-composition library <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-nextida-precision-collagen-peptides.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>? How much of the premium is absorbed by brand owners rather than passed back to the ingredient?<\/p>"}, "name": "\"composition, not kilos\"", "other": [], "rank": 1, "shortName": "Selling proven effect, not kilos", "soWhat": "Patented compositions with their own clinical studies are priced per effect and defended by patents. Darling expects targeted ingredients to reach 15 per cent of Food segment EBITDA by 2030.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-01", "verdict": "Lead"}, {"area": "R2", "arena": null, "cell": "Raw material x Stable inputs to Volatile world", "fields": {"evidence": "<p>Branded steer hide at USD 24.50 per piece and 11.6 per cent of drop value in September 2026 <a class=\"cite\" href=\"https://www.ams.usda.gov/mnreports/ams_2829.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>, against near USD 120 hides before 2018 and 5.5 million US hides landfilled in 2019 <a class=\"cite\" href=\"https://www.canadiancattlemen.ca/news/cattle-hides-take-a-tanning/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>. GME: 210 to 230 million pig skins needed in 2023 against falling European slaughter (237 million in 2022 to an estimated 218 million in 2024) <a class=\"cite\" href=\"https://animaltaskforce.eu/wp-content/uploads/2024/11/ATF_seminar2024_06_GME.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a>. Tessenderlo shut European bone gelatin activities in 2025 <a class=\"cite\" href=\"https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>. Darling's rendering and Sonac sit inside the same group as Rousselot (engagement brief).<\/p>", "first": "<p>Ask Operations for a plant-level raw material map (source, contract type, price index) for the four European plants and ISS. Run one conversation with Sonac on whether a long-term skin or bone supply agreement would carry a price advantage worth putting in the JV business case.<\/p>", "magnitude": "<p>Not sizeable from public data; the stake is the raw material share of cost of goods, which is internal.<\/p>", "tension": "<p>The loser still believes raw material is a shared, stable commodity that all gelatin makers buy at the same price. The winner sees that leather demand has fallen sharply, hides and bones are increasingly a disposal problem for slaughterers, and a producer with captive rendering can turn that into a cost advantage or a supply guarantee the others cannot match.<\/p>", "uncertainties": "<p>How much of the four European plants' pig skin and hide intake is contracted versus spot, and how much comes from Darling or Sonac? Is the European pig herd decline a price risk (scarcer skins) or an opportunity (slaughterers paying to dispose)? Does the JV with PB Leiner change sourcing geography?<\/p>"}, "name": "\"the hide is a cost line now, not a by-product bonus\"", "other": [], "rank": 2, "shortName": "Hides and skins as a cost advantage", "soWhat": "Leather demand has fallen sharply, so hides and bones are becoming a disposal problem for slaughterers. A group with its own rendering could turn that into lower cost or guaranteed supply.", "threshold": "Stable inputs to Volatile world", "updatedAt": "2026-10-01", "verdict": "Promising"}, {"area": "R2", "arena": "Food and beverage", "cell": "Food and beverage x Ingredients to Ecosystems", "fields": {"evidence": "<p>Gelita Health runs own brands (CH-Alpha, Qyra), private label across dosage forms and a distribution-partner network <a class=\"cite\" href=\"https://gelita-health.com/distribution-partners/?lang=en\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>. Nitta positions Wellnex as \"a 360 degree collagen ingredient partner\" with formulation and scale-up support <a class=\"cite\" href=\"https://wellnex-collagen.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>. Peptan already runs a co-branding model with named consumer partners <a class=\"cite\" href=\"https://www.peptan.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>. Nestlé Health Science earned 16.1 per cent UTOP on CHF 6.6 billion <a class=\"cite\" href=\"https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>, not obviously better than Darling's Food segment at 19 to 27 per cent EBITDA <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. The battlefield report parked E2 for lack of demand evidence (internal).<\/p>", "first": "<p>Interview three Peptan or Nextida customers who buy finished formats from third parties about where their margin goes. Commission a one-page teardown of Gelita Health's model (brands, countries, partner terms) from trade contacts.<\/p>", "magnitude": "<p>No reliable public figure for contract manufacturing margins in collagen supplements (not found in public sources).<\/p>", "tension": "<p>The loser still believes the choice is binary: sell powder by the kilo or launch a consumer brand against Nestlé. The winner sees a middle layer (finished-format private label, licensed small brands, co-development) that captures some brand-owner margin without a marketing budget, and that Gelita has quietly built it.<\/p>", "uncertainties": "<p>Would finished-format supply cannibalise Peptan's largest customers or be welcomed by them? Does Rousselot have, or want, GMP finished-dose capacity, or would this be a partnership with a contract manufacturer? What did Gelita Health actually earn (no disclosure found)?<\/p>"}, "name": "finished formats and private label as the margin step between ingredient and brand", "other": [], "rank": 3, "shortName": "Finished formats and private label", "soWhat": "A middle step between selling powder and launching a brand, such as private label and co-development, captures some brand margin without a marketing budget. Gelita appears to have built one.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-01", "verdict": "Test first"}, {"area": "R2", "arena": null, "cell": "Animal-based to Origin-agnostic via peptide enrichment", "fields": {"evidence": "<p>Geltor's GRN 1171 and 1 g per day claim <a class=\"cite\" href=\"https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>; Gelita's 2019 letter of intent with Geltor shows an incumbent already testing this route <a class=\"cite\" href=\"https://www.biospace.com/gelita-and-amp-geltor-sign-letter-of-intent-to-commercialize-first-animal-free-biodesigned-collagen-for-dietary-supplements-a-market-with-huge-growth-potential\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>; Evonik's Vecollan is clinical grade for medical devices only <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>; Jellatech remains at seed stage <a class=\"cite\" href=\"https://agfundernews.com/jellatech-lands-3-5m-in-new-funds-to-commercialize-animal-free-collagen-for-food-pharma\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>. The battlefield report reopened B3 as a licensing-in idea for pharma and cosmetic grades (internal). In the EU any fermentation-derived peptide is a novel food under Regulation (EU) 2015/2283 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32015R2283\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>.<\/p>", "first": "<p>One exploratory conversation with Geltor's and Evonik's business development teams about sampling for a US-only or cosmetic-grade blend. Ask Regulatory to confirm the novel food position of a hybrid composition before any formulation work.<\/p>", "magnitude": "<p>Not sizeable from public data; the fermentation players publish no revenue.<\/p>", "tension": "<p>The loser still believes non-animal collagen is either a threat to be ignored or a factory to be built. The winner sees that a small share of fermented or synthetic bioactive peptide, added to an animal collagen base, can carry a claim or a dose advantage the base cannot, and that the licensing route avoids both the capital and the EU novel food queue in the near term.<\/p>", "uncertainties": "<p>Will a fermentation producer sell to a competitor in animal collagen (B3 crux)? What is the delivered cost per kilo of PrimaColl or Vecollan today? Which claims would a hybrid composition be allowed to make in the EU without a novel food authorisation (answer: none for the fermented fraction in food)?<\/p>"}, "name": "hybrid compositions", "other": [], "rank": 4, "shortName": "Adding fermented peptides to animal collagen", "soWhat": "A small share of fermented peptide could add a claim or dose edge, and licensing it in avoids building a factory. In the EU the fermented part would need novel food approval.", "threshold": "Animal-based to Origin-agnostic", "updatedAt": "2026-10-01", "verdict": "Test first"}, {"area": "R2", "arena": "Beauty and consumer", "cell": "Beauty and consumer x Products to Outcomes", "fields": {"evidence": "<p>Nestlé's acquisition of Vital Proteins (2020 to 2022) is the only large reverse move found <a class=\"cite\" href=\"https://www.nestlehealthscience.com/newsroom/press-releases/nestle-health-science-agrees-to-acquire-majority-stake-in-vital-proteins\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><a class=\"cite\" href=\"https://www.nestlehealthscience.com/newsroom/press-releases/nhs-completes-acquisition-of-vp\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>; Nestlé discloses no Vital Proteins result and is folding Health Science into Nutrition <a class=\"cite\" href=\"https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>. Darling's Food segment EBITDA margin (19 to 27 per cent) versus Nestlé Health Science UTOP (16.1 per cent) <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a><a class=\"cite\" href=\"https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>. Gelita's and Nitta's consumer presence is small and partner-led <a class=\"cite\" href=\"https://gelita-health.com/distribution-partners/?lang=en\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://wellnex-collagen.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>.<\/p>", "first": "<p>None for the CORE engine; hand to the BUILD engine's D1 work. Record the Nestlé margin comparison as the base case to beat.<\/p>", "magnitude": "<p>Not sizeable from public data for ingredient-maker-owned brands.<\/p>", "tension": "<p>The loser believes the ingredient maker is condemned to the thinnest margin and must buy its way to the shelf. The winner sees that the brand-owner layer has not demonstrably out-earned the ingredient layer, and that the margin is already moving to the ingredient when the ingredient carries the claim.<\/p>", "uncertainties": "<p>Channel conflict with Peptan customers; whether D1 (longevity brand, internal) is better pursued through the licensing office logic of A1 than by owning a brand.<\/p>"}, "name": "owning a consumer brand outright", "other": [], "rank": 5, "shortName": "Owning a consumer brand outright", "soWhat": "Brand owners have not clearly out-earned ingredient makers: Nestlé Health Science made 16.1 per cent against 19 to 27 per cent for Darling's Food segment. Probably not one for the core business.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-01", "verdict": "Park"}, {"area": "R2", "arena": "Beauty and consumer", "cell": "", "fields": {"evidence": "<p>GELITA sells a specific peptide per indication (Verisol skin, Fortigel joints, Fortibone bone, Bodybalance body composition) <a class=\"cite\" href=\"https://www.gelita.com/sites/default/files/documents/2025-04/25008%20Folder%20BCP%202025%20A4%20eng%20%288p%29%20RZ01%20WEB.pdf\" target=\"_blank\" rel=\"noopener\">GELITA BCP brochure, 2025<\/a>. Feedback received 6 Oct: Rousselot already treats Peptan to improve dissolution; ideas include microencapsulation and fermentation; competing brands investing in science may reach more neutral flavour through smaller batches or new factories.<\/p>", "first": "<p>Ask what the Peptan co-brand means to a consumer (quality label, trust, experience). Run a quick sensory benchmark of Peptan against two competing peptides in water and one common format. List physical changes and mark which need a production step outside Rousselot's plants: that is the condition under which this becomes a venture.<\/p>", "magnitude": "<p>Defends existing Peptan revenue rather than adding new; not sized. Sits under space 1 on the margin ladder.<\/p>", "tension": "<p>The loser believes Peptan stays premium on science alone. The winner sees two things. Positioning: Peptan's holistic claim (one product boosts the body's own collagen, so skin, bones or joints benefit wherever needed) is, in the view received on 6 Oct, a place a competitor that chose indication-specific peptides cannot easily return to, while Rousselot holds both. Experience: consumers buy taste, smell and dissolution, a powder stirred into water is not necessarily nice, and the B2B2C side beyond the science has not been worked.<\/p>", "uncertainties": "<p>Which consumer to design for (younger digital natives, older adults, the middle); whether brand owners pay for a sensory upgrade; core programme or venture.<\/p>"}, "lastChange": "Added from feedback received 6 Oct", "name": "Provisional: the holistic Peptan position and the consumer experience (arena Beauty and consumer x threshold Products to Outcomes)", "other": ["<p>Raised as a core innovation point in feedback received 6 Oct; placed in R2 rather than R1 because it is about margin and positioning, not supply. Provisional.<\/p>"], "rank": 6, "shortName": "Peptan's whole-body position and taste", "soWhat": "Peptan may stop being premium if rivals match its science and improve taste, smell and dissolution. A stronger whole-body position and better consumer experience could help defend existing revenue.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-06", "verdict": "Test first"}], "sources": [{"n": 1, "text": "Darling Ingredients (DAR) Q2 2026 Earnings Call Transcript, The Motley Fool, 3 August 2026 (call 30 July 2026). https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/", "url": "https://www.fool.com/earnings/call-transcripts/2026/08/03/darling-ingredients-dar-q2-2026-earnings-call-transcript/"}, {"n": 2, "text": "Can Darling Ingredients Turn Collagen Into a Bigger Earnings Engine?, Zacks via Yahoo Finance, 16 September 2026. https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html", "url": "https://finance.yahoo.com/markets/stocks/articles/darling-ingredients-turn-collagen-bigger-153300632.html"}, {"n": 3, "text": "Darling Ingredients Inc. Reports Fourth Quarter and Fiscal Year 2025 Results, Darling Ingredients, 11 February 2026. https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results", "url": "https://www.darlingii.com/media/news/20260211-darling-ingredients-inc-reports-fourth-quarter-2025-results"}, {"n": 4, "text": "Darling Ingredients Inc. Reports Second Quarter 2026 Results, Darling Ingredients, 30 July 2026. https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results", "url": "https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results"}, {"n": 5, "text": "GELITA AG steigerte Jahresumsatz, Online-Magazin Neckartal-Odenwald (omano.de), 19 March 2018. https://www.omano.de/art_ausgabe.php?id=37793&m=1", "url": "https://www.omano.de/art_ausgabe.php?id=37793&m=1"}, {"n": 6, "text": "Tessenderlo Group Annual Results 2025 press release, Tessenderlo Group, March 2026. https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf", "url": "https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-03/2025-pr-tessenderlo-group-results-english_0.pdf"}, {"n": 7, "text": "Tessenderlo Group HY26 results webinar, Tessenderlo Group, August 2026. https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf", "url": "https://www.tessenderlo.com/sites/tessenderlo/files/files/2026-08/tessenderlo-group-webinar-hy26-results.pdf"}, {"n": 8, "text": "Apples and Penguins: The Pitfall of Comparing Collagen Peptide Prices, Gelita blog, updated August 2025. https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices", "url": "https://www.gelita.com/en/knowledge/blog/apples-and-penguins-pitfall-comparing-collagen-peptide-prices"}, {"n": 9, "text": "Weishardt launches ultra-low molecular weight collagen for enhanced absorption, NutraIngredients, 22 May 2026. https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/", "url": "https://www.nutraingredients.com/Article/2026/05/22/weishardt-launches-ultra-low-molecular-weight-collagen-for-enhanced-absorption/"}, {"n": 10, "text": "Wellnex collagen peptides (Nitta Gelatin) website, accessed 1 October 2026. https://wellnex-collagen.com/", "url": "https://wellnex-collagen.com/"}, {"n": 11, "text": "FDA greenlights in-demand 'vegan' collagen from Geltor, FoodNavigator, 16 October 2025. https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/", "url": "https://www.foodnavigator.com/Article/2025/10/16/fda-greenlights-in-demand-vegan-collagen-from-geltor/"}, {"n": 12, "text": "Rousselot's Nextida GC: Clinical Data, US Patent, and the Byon Beverage Launch, Nutritional Outlook, 9 March 2026. https://www.nutritionaloutlook.com/view/rousselot-s-nextida-gc-clinical-data-us-patent-and-the-byon-beverage-launch", "url": "https://www.nutritionaloutlook.com/view/rousselot-s-nextida-gc-clinical-data-us-patent-and-the-byon-beverage-launch"}, {"n": 13, "text": "Rousselot targets post-meal glucose control with newly patented collagen peptide, NutraIngredients, 20 March 2026. https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/", "url": "https://www.nutraingredients.com/Article/2026/03/20/rousselot-targets-post-meal-glucose-control-with-newly-patented-collagen-peptide/"}, {"n": 14, "text": "Rousselot pushes targeted collagen peptides beyond beauty and mobility with Nextida platform, Nutrition Insight, 7 July 2026. https://www.nutritioninsight.com/news/rousselot-nextida-precision-collagen-peptides.html", "url": "https://www.nutritioninsight.com/news/rousselot-nextida-precision-collagen-peptides.html"}, {"n": 15, "text": "Darling Ingredients and Tessenderlo Group agree to form new company, Darling Ingredients, 12 May 2025. https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company", "url": "https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company"}, {"n": 16, "text": "Darling Ingredients and Tessenderlo Group sign definitive agreement, Stock Titan (press release), 9 December 2025. https://www.stocktitan.net/news/DAR/darling-ingredients-and-tessenderlo-group-sign-definitive-agreement-rlads5bxcgj6.html", "url": "https://www.stocktitan.net/news/DAR/darling-ingredients-and-tessende research). https://www.imarcgroup.com/hydrolyzed-collagen-market", "url": "https://www.imarcgroup.com/hydrolyzed-collagen-market"}, {"n": 25, "text": "Distribution Partners, Gelita Health, accessed 1 October 2026. https://gelita-health.com/distribution-partners/?lang=en", "url": "https://gelita-health.com/distribution-partners/?lang=en"}, {"n": 26, "text": "Nestlé Health Science to Acquire Majority Stake in Vital Proteins, Nestlé Health Science, 10 June 2020. https://www.nestlehealthscience.com/newsroom/press-releases/nestle-health-science-agrees-to-acquire-majority-stake-in-vital-proteins", "url": "https://www.nestlehealthscience.com/newsroom/press-releases/nestle-health-science-agrees-to-acquire-majority-stake-in-vital-proteins"}, {"n": 27, "text": "Nestlé Health Science Completes Acquisition of Vital Proteins, Nestlé Health Science, 21 February 2022. https://www.nestlehealthscience.com/newsroom/press-releases/nhs-completes-acquisition-of-vp", "url": "https://www.nestlehealthscience.com/newsroom/press-releases/nhs-completes-acquisition-of-vp"}, {"n": 28, "text": "Nestlé full-year results 2025, Nestlé S.A., 19 February 2026. https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025", "url": "https://www.nestle.com/media/pressreleases/allpressreleases/full-year-results-2025"}, {"n": 29, "text": "GRAS Notice GRN 1171, Collagen polypeptide produced by Escherichia coli K-12 S9188, US FDA, closed 22 October 2024. https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices", "url": "https://www.hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=1171&set=GRASNotices"}, {"n": 30, "text": "GELITA and Geltor sign letter of intent to commercialize first animal-free biodesigned collagen for dietary supplements, BioSpace, 17 October 2019. https://www.biospace.com/gelita-and-amp-geltor-sign-letter-of-intent-to-commercialize-first-animal-free-biodesigned-collagen-for-dietary-supplements-a-market-with-huge-growth-potential", "url": "https://www.biospace.com/gelita-and-amp-geltor-sign-letter-of-intent-to-commercialize-first-animal-free-biodesigned-collagen-for-dietary-supplements-a-market-with-huge-growth-potential"}, {"n": 31, "text": "Evonik launches recombinant collagen VECOLLAN for use in clinical studies, Evonik, 16 September 2025. https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html", "url": "https://www.evonik.com/en/news/press-releases/2025/09/evonik-launches-recombinant-collagen-vecollan-for-use-in-clinic-studies.html"}, {"n": 32, "text": "Jellatech lands $3.5m in new funds to produce animal-free collagen, AgFunderNews, 22 August 2023. https://agfundernews.com/jellatech-lands-3-5m-in-new-funds-to-commercialize-animal-free-collagen-for-food-pharma", "url": "https://agfundernews.com/jellatech-lands-3-5m-in-new-funds-to-commercialize-animal-free-collagen-for-food-pharma"}, {"n": 33, "text": "Modern Meadow website, accessed 1 October 2026. https://www.modernmeadow.com/", "url": "https://www.modernmeadow.com/"}, {"n": 34, "text": "Scientific Opinion on the substantiation of a health claim related to collagen hydrolysate and maintenance of joints pursuant to Article 13(5) of Regulation (EC) No 1924/2006, EFSA Journal 2011;9(7):2291. https://efsa.europa.eu/en/efsajournal/pub/2291", "url": "https://efsa.europa.eu/en/efsajournal/pub/2291"}, {"n": 35, "text": "Regulation (EU) 2015/2283 of the European Parliament and of the Council of 25 November 2015 on novel foods, EUR-Lex. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32015R2283", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32015R2283"}, {"n": 36, "text": "GLPure+ product page, Pura Collagen, accessed 1 October 2026. https://puracollagen.co.uk/products/glpure", "url": "https://puracollagen.co.uk/products/glpure"}, {"n": 37, "text": "Our Range, Pura Collagen, accessed 1 October 2026. https://puracollagen.co.uk/collections/frontpage", "url": "https://puracollagen.co.uk/collections/frontpage"}, {"n": 38, "text": "Glucose Support Collagen Peptides Powder, Nextida GC, Codeage, accessed 1 October 2026. https://codeage.com/products/glp-1-supplement-collagen-peptides-powder", "url": "https://codeage.com/products/glp-1-supplement-collagen-peptides-powder"}, {"n": 39, "text": "Collagen collection, Codeage, accessed 1 October 2026. https://codeage.com/collections/collagen", "url": "https://codeage.com/collections/collagen"}, {"n": 40, "text": "Darling Ingredients Inc. (DAR) Q4 2025 Earnings Call Transcript, Equibles, February 2026 (machine transcript; product names garbled, used only for the margin and demand remarks). https://equibles.com/stocks/dar/calls/2025-q4", "url": "https://equibles.com/stocks/dar/calls/2025-q4"}, {"n": 41, "text": "Peptan website, Rousselot, accessed 1 October 2026. https://www.peptan.com/", "url": "https://www.peptan.com/"}, {"n": 42, "text": "Rousselot introduces Nextida, Darling Ingredients press release, 14 May 2024. https://www.darlingii.com/media/news/rousselot-introducing-nextida-a-groundbreaking-innovation-shaping-the-future-of-collagen-peptides", "url": "https://www.darlingii.com/media/news/rousselot-introducing-nextida-a-groundbreaking-innovation-shaping-the-future-of-collagen-peptides"}, {"n": 43, "text": "Collagen peptide nutraceutical slashes post-meal blood sugar spikes in recent study, Nutraceutical Business Review, 9 October 2024. https://nutraceuticalbusinessreview.com/rousselot-collagen-peptide-nutraceutical-reduces-post-meal-blood-sugar-spikes", "url": "https://nutraceuticalbusinessreview.com/rousselot-collagen-peptide-nutraceutical-reduces-post-meal-blood-sugar-spikes"}, {"n": 44, "text": "Colartix brand page, Rousselot / Darling Ingredients, accessed 1 October 2026. https://www.darlingii.com/rousselot/brands/colartix", "url": "https://www.darlingii.com/rousselot/brands/colartix"}, {"n": 45, "text": "Nextida GC collagen peptides by Rousselot to be featured at Vitafoods Europe 2025, Nutritional Outlook, 6 May 2025. https://www.nutritionaloutlook.com/view/nextida-gc-collagen-peptides-by-rousselot-to-be-featured-at-vitafoods-europe-2025", "url": "https://www.nutritionaloutlook.com/view/nextida-gc-collagen-peptides-by-rousselot-to-be-featured-at-vitafoods-europe-2025"}]}, {"code": "R3", "engine": "Add more", "engine_long": "Build what pays tomorrow", "extras": [{"html": "<p>No trial found compares a collagen-containing ONS with a matched high-protein ONS in patients (as opposed to healthy older adults) [6][7]<a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S0261561421000066\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>[9][14][23]. This is the single piece of evidence a B2B fraction business would need to own.<\/p>", "title": "Cross-cutting: the matched-comparator gap"}, {"html": "<p>Nothing in the ranking. Three corrections to the text: (a) AM-RL section 24 excludes six indications, not three; the base report omitted cardiorespiratory insufficiency, immune support and tumour patients <a class=\"cite\" href=\"https://www.g-ba.de/downloads/62-492-4232/AM-RL-2026-06-18_iK-2026-10-01_AT-31-08-2026-B3.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>; (b) the global and European market ranges are research-firm derived and unverified from primary sources, so they move from \"fact\" to \"low-trust range\" <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2026/02/20/3241691/0/en/danone-2025-another-year-of-strong-delivery.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><a class=\"cite\" href=\"https://www.nestle.com/sites/default/files/2026-02/full-year-results-press-release-2025-en.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://report.fresenius.com/2025/annual-report/management-report/economic-report/results-of-operations.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><a class=\"cite\" href=\"https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>; (c) one new trial (Aussieker 2025) strengthens space 1 but concerns young men and placebo, not a matched comparator [9]. One addition: the 9 Dec 2026 deadline is the FDA's mandatory GRAS notification proposed rule, which affects Rousselot's US basis for collagen peptides in food and medical food, not protein quality <a class=\"cite\" href=\"https://www.federalregister.gov/documents/2026/08/11/2026-16296/substances-generally-recognized-as-safe\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.gibsondunn.com/fda-proposes-mandatory-gras-notification-for-food-substances-with-a-time-limited-streamlined-path/\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>.<\/p>", "title": "What changed against the base report"}, {"html": "<p>Feedback received on 5 Oct: clinical nutrition is not only protein and formulation; collagen cannot beat whey as a protein but is unique in its health effects; the aim is to accompany drugs (as GLP-1 companions do), support recovery and help with \"conditions\" treated as diseases (fatty liver), never to replace drugs. We agree that the health effect is where the margin is, that companion is the clearest legal route <a class=\"cite\" href=\"https://www.legislation.gov.uk/eur/2011/1169/article/7/adopted\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a>, and that early fatty liver is a fair example (drugs cover only F2 to F3 MASH <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2025/08/19/3136003/0/en/Madrigal-Receives-European-Commission-Approval-for-Rezdiffra-resmetirom-for-the-Treatment-of-MASH-with-Moderate-to-Advanced-Liver-Fibrosis.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>; MASLD affects about 38% of adults <a class=\"cite\" href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2835411\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>). We would sharpen four points. (1) Phenotype and companion are one rule, not a choice: the companion moment has to be sold in phenotype language in the EU. (2) Health effects cannot qualify an FSMP unless a nutrient requirement exists; glycine is the one candidate <a class=\"cite\" href=\"https://link.springer.com/article/10.1007/s12038-009-0100-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>. (3) The health evidence is weaker than the marketing: a 2025 meta-analysis of 23 skin RCTs found no effect in non-industry or high-quality trials <a class=\"cite\" href=\"https://www.amjmed.com/article/S0002-9343(25)00283-9/abstract\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a>, contested by industry <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/08/26/industry-reacts-to-meta-analysis-concluding-collagen-supplements-show-no-proven-benefit-for-skin-aging/\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a>. (4) The core already sells Peptan and Nextida GC as GLP-1 companions on healthy-adult data <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>, so a venture would likely need to own in-user evidence, a channel or a partner. In Europe the pharmacy is the natural companion channel: 77.9% of Italy's EUR 4.5 bn supplement market (2023) sells there <a class=\"cite\" href=\"https://en.ilsole24ore.com/art/food-supplements-italy-turnover-45-billion-AF5dPOPC\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>.<\/p>", "title": "5 Oct reframe: feedback received and how the map changed"}, {"html": "<p>No collagen trial has been run in GLP-1 users, and Nextida GC's trials are acute, small and placebo-controlled <a class=\"cite\" href=\"https://www.sciencedirect.com/science/article/pii/S2475299126018779\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-peptan-nextida-glp1-companions.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. One trial of a collagen-whey blend against whey alone, in GLP-1 users, at equal protein, would close this gap and the matched-comparator gap together. Drug-induced phenotypes to scan next (not yet checked): joint pain on aromatase inhibitors, bone and skin effects of long-term glucocorticoids, skin and hair changes during rapid GLP-1 weight loss.<\/p>", "title": "Cross-cutting: the in-phenotype gap (added 5 Oct)"}, {"html": "<p>Feedback received on 6 Oct sharpens the two lanes and adds a nutrition direction.<\/p>\n<ul>\n<li><strong>Why collagen, not just protein.<\/strong> Clinical nutrition today is held by ingredients with nutritional value (proteins, fibres). Collagen is not a complete protein: it lacks essential amino acids, so for nutrition it has to be blended with whey or another protein. Its edge is health effects from peptide sequences that signal in the body, which whey does not have. Whey is currently priced above collagen, so collagen is already taking some of that market on price (feedback received; not yet checked against a public price series).<\/li>\n<li><strong>The trend is reversing.<\/strong> The old pitch was \"add collagen to whey for extra health benefits\"; formulation is now starting from collagen's health benefits and adding protein. The shift has been flagged in Rousselot's management team and the commercial team asked to act on it; a conversation with Danone is on the agenda (see the Danone Steenvoorde finding).<\/li>\n<li><strong>Two directions.<\/strong> (a) Towards nutrition: blends, with whey but also with vitamins and minerals that carry an authorised EU claim. Collagen has none, but vitamin C \"contributes to normal collagen formation for the normal function of\" bones, cartilage, skin and other tissues, and chromium \"contributes to the maintenance of normal blood glucose levels\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/eli/reg/2012/432/oj/eng\" target=\"_blank\" rel=\"noopener\">Reg. (EU) 432/2012<\/a>. Rousselot advises customers to play this game and could play it itself, one level between B2B and B2C. If Rousselot runs trials on a blend, it may make sense to sell the blend: a different product and business model from today (space 8). Combination data offered only as formulation support would also help the whey business. (b) Towards the diseased end: companion products and phenotypes, states that are not diseases but carry risk (high BMI, early fatty liver, visceral fat, borderline cholesterol).<\/li>\n<li><strong>Why a venture.<\/strong> Moving from healthy to diseased is the biomedical story, but oral: a different regulatory environment and a different value proposition from a core positioned on healthy individuals. That is the reason to separate it from the core.<\/li>\n<li><strong>The grey zone.<\/strong> Lifestyle is increasingly part of medical treatment: GLP-1 users must eat more protein and train; people in cancer treatment may also benefit from collagen. The grey zones between healthy and diseased may be blue oceans, shaped by regulation, Rousselot's own vision and how the market moves.<\/li>\n<li><strong>Science-led trials are being scoped.<\/strong> Praneeth is discussing exploratory protocols with CROs (science-led, not a market request). Some fatty-liver data exists, but no clinical trial yet. A new pitch is fertility (space 9).<\/li>\n<\/ul>\n<p><strong>Our take.<\/strong> (1) The blend direction and the phenotype direction need the same asset: a trial of a collagen-led blend against protein alone, in the people the product is for. One design could serve space 2 (GLP-1), space 8 (blends) and the matched-comparator gap. (2) The crux of every phen
