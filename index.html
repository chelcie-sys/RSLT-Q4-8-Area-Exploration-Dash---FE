plement Journal, 16 December 2025, https://www.supplysidesj.com/branding-marketing/supplement-claims-lessons-national-advertising-division-decisions", "url": "https://www.supplysidesj.com/branding-marketing/supplement-claims-lessons-national-advertising-division-decisions"}, {"n": 58, "text": "SupplySide West 2024 live: Rousselot's Nextida GC lowers post-meal glucose spikes, Food Ingredients First, 31 October 2024, https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html", "url": "https://www.foodingredientsfirst.com/news/supplyside-west-2024-live-rousselots-nextida-gc-lowers-post-meal-glucose-spikes-new-research-shows.html"}, {"n": 59, "text": "Rousselot launches Nextida, a collagen peptide platform for targeted health benefits, Nutritional Outlook, 14 May 2024, https://www.nutritionaloutlook.com/view/rousselot-launches-nextida-a-collagen-peptide-platform-for-targeted-health-benefits", "url": "https://www.nutritionaloutlook.com/view/rousselot-launches-nextida-a-collagen-peptide-platform-for-targeted-health-benefits"}, {"n": 60, "text": "Darling Ingredients' health brand Rousselot receives U.S. patent for Nextida GC, Darling Ingredients, 3 June 2026, https://www.darlingii.com/media/news/20260602-darling-ingredients-health-brand-rousselot-receives-us-patent-for-nextida-gc", "url": "https://www.darlingii.com/media/news/20260602-darling-ingredients-health-brand-rousselot-receives-us-patent-for-nextida-gc"}, {"n": 61, "text": "Darling Ingredients Inc. Form 10-K for fiscal year ended 3 January 2026, SEC EDGAR, filed 3 March 2026, https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm", "url": "https://www.sec.gov/Archives/edgar/data/916540/000091654026000008/dar-20260103.htm"}, {"n": 62, "text": "Darling Ingredients Inc. Reports Second Quarter 2026 Results, Darling Ingredients, 30 July 2026, https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results", "url": "https://www.darlingii.com/media/news/20260730-darling-ingredients-inc-reports-second-quarter-2026-results"}, {"n": 63, "text": "Pura Collagen homepage and GLPure+ listing, Pura Collagen, accessed 1 October 2026, https://puracollagen.co.uk/", "url": "https://puracollagen.co.uk/"}, {"n": 64, "text": "Nextida brand page, Darling Ingredients / Rousselot, undated, https://www.darlingii.com/rousselot/brands/nextida", "url": "https://www.darlingii.com/rousselot/brands/nextida"}, {"n": 65, "text": "Darling Completes VION Ingredients Acquisition, The Pig Site, 9 January 2014, https://www.thepigsite.com/news/2014/01/darling-completes-vion-ingredients-acquisition-1", "url": "https://www.thepigsite.com/news/2014/01/darling-completes-vion-ingredients-acquisition-1"}, {"n": 66, "text": "Rousselot reorganisation places fortunes on collagen's meaty shoulders, NutraIngredients, 30 September 2019, https://nutraingredients.com/Article/2019/09/27/Rousselot-reshuffle-places-collagen-at-core-of-business", "url": "https://nutraingredients.com/Article/2019/09/27/Rousselot-reshuffle-places-collagen-at-core-of-business"}, {"n": 67, "text": "Lonza's collagen improves joint flexibility by ten years, study finds, Nutrition Insight, 4 May 2022, https://www.nutritioninsight.com/news/lonzas-collagen-improves-joint-flexibility-by-ten-years-study-finds.html", "url": "https://www.nutritioninsight.com/news/lonzas-collagen-improves-joint-flexibility-by-ten-years-study-finds.html"}]}, {"code": "R7", "engine": "Add more", "engine_long": "Build what pays tomorrow", "extras": [], "internal": "<ol>\n<li>Matt (principal scientist): what the internal AI does today, which data it uses, whether it predicts outcomes or automates steps, and its measured accuracy. Who owns the models (Rousselot or Darling IT)?<\/li>\n<li>Bjorn Vergauwen (Scientific Director) and Catarina Silva (Science Integration Manager): how Nextida compositions were screened, how much of that data is structured, and whether it could train a model or be licensed.<\/li>\n<li>Praneeth (sizing): any internal estimate of application-lab request volume and cost per formulation request, to price the free tool in space 3.<\/li>\n<li>Plant leads at ISS and the other three European plants: which quality variables drive rework or downgrades, and whether historian and LIMS data are joined.<\/li>\n<li>Darling legal: trade secret protocol for formulation and process data, data clauses in top-20 customer contracts, and the AI Act classification of Saige.<\/li>\n<li>Elke and Kathleen: whether Saige's progress decision changes the appetite for space 2, and whether the RBB vertical can own a capability (space 4) rather than a venture.<\/li>\n<li>Rousselot AI team (new, 6 Oct): scope and timing of the data-lake project (one department first, lakes connected across departments later), what agent experiments taught, and the scope of the external AI-strategy review (adoption, awareness, initiative selection). Feedback received 6 Oct: the value is in the data Rousselot generates every day, more than in agents.<\/li><\/ol>", "lastChange": "R7 regulation section: replace 'pending Official Journal publication' with Regulation (EU) 2026/1744, in force 27 July 2026 (accepted 2026-10-07)", "name": "AI, knowledge and data", "oneLine": "<p>This area asks where Rousselot's knowledge (peptide composition, bioactivity, clinical evidence, process know-how) can be sold or used separately from the kilogram of ingredient, and whether the business has the data to do it. The scan finds that ingredient majors have built a great deal of AI, but almost all of it is used internally or given away to win the ingredient sale; the firms that actually charge for formulation or discovery AI are specialist software companies and discovery biotechs, not ingredient suppliers. The prior C4 \"Compiler\" idea has no public precedent of a customer paying an ingredient supplier for a formulation platform; the evidence points instead to AI as an internal discovery and simulation capability, with a narrower, testable data-licensing question underneath it.<\/p>", "options": [], "order": 7, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Three shifts are visible between 2024 and 2026. First, the ingredient majors have moved from announcing AI to shipping it, but as a sales aid rather than a product. Ingredion put a conversational \"Ask Ingredion\" assistant on its website in July 2026 that recommends ingredients, compares them and routes users to samples and experts; no price is attached <a class=\"cite\" href=\"https://www.ingredion.com/na/en-us/be-whats-next/ai-powered-ingredient-solutions\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>. Symrise extended Symvision AI in November 2025 to predict sensory outcomes of formula changes, run by Symrise flavourists for customers rather than handed over <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/symrise-ai-flavor-prediction.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>. dsm-firmenich's 2025 integrated report describes an \"AI-driven formula generation assistant\" and an \"AI-powered sensory description service\", both internal, alongside a Responsible AI committee set up in 2025 <a class=\"cite\" href=\"https://annualreport.dsm-firmenich.com/2025/our-performance/data-governance-and-ai.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. Tate &amp; Lyle's chief science and innovation officer described in March 2026 an internal generative AI layer over proprietary science plus \"Alfie\", a robotic lab in Singapore she called \"essentially a factory for starch data\" <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/tate-lyle-ai-healthier-ingredients-innovation.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. Givaudan's ATOM, VAS and Customer Foresight tools are presented as ways to \"facilitate collaboration with customers\", not as licensed software <a class=\"cite\" href=\"https://www.givaudan.com/taste-wellbeing/imagine/tools/digital-tools\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>. ADM and IFF each now have a named R&amp;D AI lead (ADM's Director of R&amp;D AI and Data Officer; IFF's Digital Innovation Platform Lead) <a class=\"cite\" href=\"https://www.perfumerflavorist.com/events/event-coverage/flavorcon/news/22915719/iff-digital-innovation-platform-lead-joins-flavorcon-2024-ai-panel-alongside-givaudan-adm\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/p>\n<p>Second, the companies that do charge for AI in food R&amp;D are discovery biotechs and software vendors, and their customers include ingredient suppliers. Nuritas licenses its AI Magnifier peptide discovery platform to partners (Givaudan, Sumitomo Chemical) while also selling its own branded peptides; its chief medical and innovation officer, Andy Franklyn-Miller, says the platform \"has six years of real-world data\", and the company reports over 200 million biological experiments <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.nuritas.com/ai-based-peptide-discovery-pioneer-partners-with-flavor-and-taste-innovation-leader-to-revolutionize-food-systems/\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. Shiru sells Flourish \"as-a-service\" with flexible licences, runs paid consortia (its GLP-1 Innovation Alliance has three fee tiers), and signed a global R&amp;D collaboration with Ingredion in March 2026 <a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/01/15/ai-co-shiru-seeks-sweetener-partnerships/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2025/06/23/3103466/0/en/Shiru-Launches-GLP-1-Innovation-Alliance-Uniting-CPG-Giants-and-Emerging-Brands-to-Explore-Natural-GLP-1-Activation.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a><a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/ai-ingredient-discovery-ingredion-shiru-prebiotics.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>. NotCo says Giuseppe is licensed to Mars, Mondelēz, Nestlé and Kraft Heinz and that its B2B licensing business grows at \"triple-digit rates\" <a class=\"cite\" href=\"https://www.greenqueen.com.hk/notco-ai-giuseppe-food-tech-kraft-heinz-not-company/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. Turing Labs lists Kalsec, an ingredient supplier, among customers of its formulation optimiser alongside Kraft Heinz and Unilever <a class=\"cite\" href=\"https://www.turingsaas.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. Cradle sells generative protein design software by subscription to Novo Nordisk, Johnson &amp; Johnson, Novonesis and Grifols <a class=\"cite\" href=\"https://www.eu-startups.com/2024/11/zurich-based-cradle-raises-e69-5-million-to-develop-protein-engineering-with-generative-ai/\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>.<\/p>\n<p>Third, the free-to-formulator, paid-by-supplier marketplace model is the dominant way ingredient knowledge is distributed digitally, and it is consolidating. Knowde's revenue comes entirely from suppliers (storefront fees, annual subscriptions, premium lead-generation tiers) while buyers search free; it raised $60 million in August 2024 and now presents itself as a chemical software company built around a master data management platform and commerce applications, while still calling itself a marketplace <a class=\"cite\" href=\"https://research.contrary.com/company/knowde\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://blog.knowde.com/knowde-series-c/\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><a class=\"cite\" href=\"https://www.digitalcommerce360.com/2024/08/15/chemicals-marketplace-company-knowde-gets-60-million/\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>. Covalo charges suppliers for premium badges, leads dashboards and marketing, keeps buyers free, bought Italy's Cosmetitrovo in December 2024 and raised €3.5 million in April 2026 <a class=\"cite\" href=\"https://covalo.com/faq/\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a><a class=\"cite\" href=\"https://beautymatter.com/articles/ingredient-platform-covalo-secures-euro-3-5-million\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a><a class=\"cite\" href=\"https://www.startupticker.ch/en/news/covala-acquires-italy-s-largest-platform-for-the-cosmetics-market\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<p>No reliable public figure was found for the market in ingredient-formulation software or licensed ingredient data; the available numbers are company-level. Knowde: $175 million raised in total, 8,000 plus supplier storefronts, 180,000 plus products, about 1,200 quote requests a month (December 2023) <a class=\"cite\" href=\"https://research.contrary.com/company/knowde\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://blog.knowde.com/knowde-series-c/\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>. Covalo: 1,500 plus suppliers, 6,000 brands, 145 countries (April 2026) <a class=\"cite\" href=\"https://beautymatter.com/articles/ingredient-platform-covalo-secures-euro-3-5-million\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>. Nutrition Integrated's ANIE tracks 25,000 plus products and 5,000 plus brands; pricing undisclosed <a class=\"cite\" href=\"https://www.nutritionintegrated.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>. Consumer evidence subscriptions are cheap: ConsumerLab charges $75 a year and Examine+ reports \"over 15,000 members\" <a class=\"cite\" href=\"https://examine.com/plus/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a><a class=\"cite\" href=\"https://www.consumerlab.com/membership/\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>. McKinsey's August 2026 State of AI survey (consultancy opinion) reports that \"Thirty-seven percent of respondents attribute at least some EBIT impact to AI use (about the same share as last year)\" and that 44 percent report AI scaling across the enterprise, up from 38 percent <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a>.<\/p>", "title": "Size and growth"}, {"full": "Players", "html": "<table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>Who<\/th>\n<th>What they actually do<\/th>\n<th>Paid or free<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ingredient majors<\/td>\n<td>Ingredion, Symrise, dsm-firmenich, Givaudan, Tate &amp; Lyle, Kerry<\/td>\n<td>Internal or customer-collaboration AI for formulation, sensory prediction, trend spotting (Kerry Trendspotter with IBM Watson claims concept delivery cut from 4 to 6 weeks to 5 days) <a class=\"cite\" href=\"https://www.ingredion.com/na/en-us/be-whats-next/ai-powered-ingredient-solutions\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a><a class=\"cite\" href=\"https://annualreport.dsm-firmenich.com/2025/our-performance/data-governance-and-ai.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a><a class=\"cite\" href=\"https://www.givaudan.com/taste-wellbeing/imagine/tools/digital-tools\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a><a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/symrise-ai-flavor-prediction.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a><a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/tate-lyle-ai-healthier-ingredients-innovation.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a><a class=\"cite\" href=\"https://www.ibm.com/ae-ar/case-studies/kerry\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a><\/td>\n<td>Free to customers; bundled with the ingredient sale<\/td>\n<\/tr>\n<tr>\n<td>Discovery biotechs<\/td>\n<td>Nuritas, Shiru, Brightseed, Arzeda, Protera<\/td>\n<td>AI peptide, protein or bioactive discovery; licence platform or co-develop, and sell own ingredients; Brightseed gives Haleon's team direct Forager access (May 2025) <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/05/02/brightseed-supports-british-healthcare-multinational-haleon-with-ai-tool/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/01/15/ai-co-shiru-seeks-sweetener-partnerships/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://www.arzeda.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a><a class=\"cite\" href=\"https://www.proterabio.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><\/td>\n<td>Paid licences, consortia fees, co-development<\/td>\n<\/tr>\n<tr>\n<td>Formulation and R&amp;D software<\/td>\n<td>Turing Labs, NotCo (Giuseppe, Concept Quant), Cradle, Benchling<\/td>\n<td>Formulation optimisation, concept generation, protein design, lab data platforms (Benchling: \"200,000 scientists\") <a class=\"cite\" href=\"https://www.turingsaas.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a><a class=\"cite\" href=\"https://www.foodnavigator.com/Article/2025/04/09/notco-leverages-ai-to-help-cpg-brands-innovate-more-quickly-and-accurately/\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a><a class=\"cite\" href=\"https://www.eu-startups.com/2024/11/zurich-based-cradle-raises-e69-5-million-to-develop-protein-engineering-with-generative-ai/\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><a class=\"cite\" href=\"https://www.benchling.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a><\/td>\n<td>Subscription or licence<\/td>\n<\/tr>\n<tr>\n<td>Marketplaces and directories<\/td>\n<td>Knowde, Covalo, SpecialChem (500,000 plus members), UL Prospector<\/td>\n<td>Searchable ingredient data; suppliers pay for listing and leads <a class=\"cite\" href=\"https://research.contrary.com/company/knowde\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://covalo.com/faq/\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a><a class=\"cite\" href=\"https://www.specialchem.com/about-us\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a><\/td>\n<td>Supplier pays; formulator free<\/td>\n<\/tr>\n<tr>\n<td>Evidence and intelligence<\/td>\n<td>Nutrition Integrated, Lumina Intelligence, Examine, ConsumerLab<\/td>\n<td>Product and ingredient intelligence sold to brands, manufacturers and suppliers (Lumina lists ADM Biopolis, Unilever Food Solutions as clients) <a class=\"cite\" href=\"https://www.nutritionintegrated.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><a class=\"cite\" href=\"https://www.lumina-intelligence.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a><a class=\"cite\" href=\"https://examine.com/plus/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a><a class=\"cite\" href=\"https://www.consumerlab.com/membership/\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a><\/td>\n<td>Subscription<\/td>\n<\/tr>\n<tr>\n<td>Process simulation vendors<\/td>\n<td>Siemens (Xcelerator, Pringles Poland digital twin case), AspenTech (Aspen Plus, Aspen Process Pulse)<\/td>\n<td>Plant and process digital twins, real-time quality prediction <a class=\"cite\" href=\"https://www.siemens.com/global/en/industries/food-beverage.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a><a class=\"cite\" href=\"https://www.aspentech.com/en/industries/pharmaceuticals\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a><\/td>\n<td>Enterprise software<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "title": "Players"}, {"full": "Regulation", "html": "<p>EU AI Act (Regulation (EU) 2024/1689): in force 1 August 2024; prohibitions and AI literacy from 2 February 2025; general-purpose AI model obligations from 2 August 2025; Article 50 transparency rules from 2 August 2026. The Digital Omnibus on AI, agreed politically on 6 May 2026 and published as Regulation (EU) 2026/1744 (in force 27 July 2026), defers Annex III high-risk obligations to 2 December 2027 and Annex I to 2 August 2028; systems placed on the market before 2 August 2026 have until 2 December 2026 for Article 50 watermarking <a href=\"https://www.whitecase.com/insight-alert/eu-ai-omnibus-enters-force-amending-ai-act\" target=\"_blank\" rel=\"noopener\">White & Case<\/a> <a class=\"cite\" href=\"https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><a class=\"cite\" href=\"https://artificialintelligenceact.eu/implementation-timeline/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>. A supplier-facing formulation assistant is unlikely to be high-risk, but any consumer-facing health advice tool needs checking against Annex III. EU Data Act (Regulation (EU) 2023/2854): applies from 12 September 2025; gives users of connected products access to the data they generate and prohibits unfair B2B data-sharing terms <a class=\"cite\" href=\"https://digital-strategy.ec.europa.eu/en/policies/data-act\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a>. Trade Secrets Directive (EU) 2016/943 is the instrument that protects formulation and process data, and it only protects what is kept secret through \"reasonable steps\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/eli/dir/2016/943/oj\" target=\"_blank\" rel=\"noopener\" title=\"Source 49\">49<\/a>. Nutrition and health claims remain governed by Regulation (EC) No 1924/2006; any evidence feed that drives claims inherits that constraint (register page not readable during this scan, see Sources).<\/p>", "title": "Regulation"}, {"full": "Signals", "html": "<ol>\n<li>13 August 2024: Knowde raises $60 million Series C and leans into supplier-side software; as of December 2023 all its revenue came from sellers <a class=\"cite\" href=\"https://research.contrary.com/company/knowde\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://blog.knowde.com/knowde-series-c/\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>.<\/li>\n<li>4 September 2024: Climax Foods, an AI-formulation darling, cuts to \"a handful\" of staff after a bridge round; a former employee said \"The cheeses were really made by talented cheesemakers, not AI\" <a class=\"cite\" href=\"https://agfundernews.com/plant-based-cheesemaker-climax-foods-secures-bridge-funding-plans-restructuring\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>.<\/li>\n<li>12 March 2025: GlobalData acquires trend-AI firm Ai Palette; Spoonshot had been bought by Target Research Group in September 2023. Food-AI point solutions are being absorbed by data incumbents, not scaling alone <a class=\"cite\" href=\"https://thespoon.tech/ai-powered-cpg-trend-forecaster-ai-palette-gets-gobbled-up/\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.foodbusinessnews.net/articles/24716-target-research-group-acquires-spoonshot\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>.<\/li>\n<li>2 May 2025: Haleon gets direct access to Brightseed's Forager platform, a pharma-grade consumer health firm paying for bioactive discovery AI <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2025/05/02/brightseed-supports-british-healthcare-multinational-haleon-with-ai-tool/\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>.<\/li>\n<li>23 June 2025: Shiru launches a fee-paying GLP-1 Innovation Alliance with three membership tiers <a class=\"cite\" href=\"https://www.globenewswire.com/news-release/2025/06/23/3103466/0/en/Shiru-Launches-GLP-1-Innovation-Alliance-Uniting-CPG-Giants-and-Emerging-Brands-to-Explore-Natural-GLP-1-Activation.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>.<\/li>\n<li>12 November 2025: Symrise expands Symvision AI, operated by its flavourists for customers <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/symrise-ai-flavor-prediction.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>.<\/li>\n<li>27 March 2026: Ingredion signs a global R&amp;D collaboration with Shiru; Ingredion's Eric Weisser: \"The real challenge after discovering a new ingredient is making sure it can deliver in real-world applications\" <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/ai-ingredient-discovery-ingredion-shiru-prebiotics.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>.<\/li>\n<li>4 June 2026: Darling receives US patent 12636339 covering the production process and use of Nextida GC; no public disclosure of how the peptide profiles were found beyond a \"proprietary process\" <a class=\"cite\" href=\"https://www.insidermonkey.com/blog/darling-ingredients-dar-awarded-us-patent-for-rousselots-nextida-gc-collagen-peptide-1793174/\" target=\"_blank\" rel=\"noopener\" title=\"Source 59\">59<\/a><a class=\"cite\" href=\"https://www.prnewswire.com/news-releases/darling-ingredients-inc-identifies-collagen-peptide-profiles-for-targeted-health-benefits-302114817.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 56\">56<\/a>.<\/li>\n<\/ol>", "title": "Signals"}], "soWhat": {"forRousselot": "Treat AI first as an engine for finding the next Nextida type peptide, and test data licensing narrowly. Deprioritise plans that rely on customers paying for a formulation platform.", "forRousselotLinks": [{"anchor": "r7-s1", "go": "r7", "label": "Space 1: AI to find the next bioactive peptide"}, {"anchor": "r7-s3", "go": "r7", "label": "Space 3: A paid formulation platform for customers"}], "headline": "Ingredient majors build AI to sell more ingredient, not to sell AI, so Rousselot's strongest use looks like internal peptide discovery rather than a paid platform.", "next": "Inventory the peptide and bioassay data behind Nextida GC: its volume, format and ownership.", "nextLinks": [{"anchor": "r7-s1", "go": "r7", "label": "Space 1: AI to find the next bioactive peptide"}], "takeaways": [{"links": [{"anchor": "r7-s3", "go": "r7", "label": "Space 3: A paid formulation platform for customers"}], "text": "No public case was found of a customer paying an ingredient supplier for a formulation platform; the majors we looked at offer such tools free."}, {"links": [{"anchor": "r7-s1", "go": "r7", "label": "Space 1: AI to find the next bioactive peptide"}, {"anchor": "r7-scan-1", "go": "r7", "label": "Scan: Trends"}, {"label": "[29] nutraingredients.com", "title": "'Not an AI box of tricks': Nuritas moves industry forward with peptide library, NutraIngredients, 27 February 2024, https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/", "url": "https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/"}, {"label": "[30] nuritas.com", "title": "AI-Based Peptide Discovery Pioneer Partners with Flavor and Taste Innovation Leader, Nuritas, 13 February 2024, https://www.nuritas.com/ai-based-peptide-discovery-pioneer-partners-with-flavor-and-taste-innovation-leader-to-revolutionize-food-systems/", "url": "https://www.nuritas.com/ai-based-peptide-discovery-pioneer-partners-with-flavor-and-taste-innovation-leader-to-revolutionize-food-systems/"}], "text": "Firms that charge for AI are discovery biotechs and software vendors; Nuritas reports over 200 million biological experiments and licenses to Givaudan."}, {"links": [{"anchor": "r7-scan-2", "go": "r7", "label": "Scan: Size and growth"}, {"anchor": "r7-scan-1", "go": "r7", "label": "Scan: Trends"}, {"label": "[1] research.contrary.com", "title": "Report: Knowde Business Breakdown & Founding Story, Contrary Research, December 2023, https://research.contrary.com/company/knowde", "url": "https://research.contrary.com/company/knowde"}, {"label": "[2] blog.knowde.com", "title": "Knowde Secures $60 Million to Digitally Transform Chemical and Ingredient Industry, Knowde Blog, 13 August 2024, https://blog.knowde.com/knowde-series-c/", "url": "https://blog.knowde.com/knowde-series-c/"}], "text": "Marketplaces are paid by suppliers, not formulators: Knowde raised $175 million in total and reported about 1,200 quote requests a month."}], "watchOut": "Trade secret law only protects formulation and process data kept secret through reasonable steps, so any data sharing needs careful handling.", "watchOutLinks": [{"anchor": "r7-scan-4", "go": "r7", "label": "Scan: Regulation"}, {"anchor": "r7-inputs", "go": "r7", "label": "What we still need"}, {"label": "[49] eur-lex.europa.eu", "title": "Directive (EU) 2016/943 on the protection of undisclosed know-how and business information (trade secrets), EUR-Lex, 8 June 2016, https://eur-lex.europa.eu/eli/dir/2016/943/oj", "url": "https://eur-lex.europa.eu/eli/dir/2016/943/oj"}]}, "sourceNote": "<p>Not consulted for this scan (so not cited for content): CNBC, \"AI startups want to crack open the recipe book in Big Food's test kitchens\", 14 February 2026; UL Prospector business-model page; Cochrane Library access page; EU Register of nutrition and health claims; IFT CoDeveloper page; MIT CISR research briefings on data monetisation.<\/p>", "updatedAt": "2026-10-07", "spaces": [{"area": "R7", "arena": "Pharma and biomedical", "cell": "Pharma and biomedical x Knowledge bundled to AI-unbundled", "fields": {"evidence": "<p>Nuritas claims over 200 million biological experiments and licenses its platform to Givaudan and Sumitomo Chemical <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2024/02/27/nuritas-moves-industry-forward-with-peptide-library/\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.nuritas.com/ai-based-peptide-discovery-pioneer-partners-with-flavor-and-taste-innovation-leader-to-revolutionize-food-systems/\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. Nuritas's Nora Khaldi: \"AI has zero value without validation. Just like in pharmaceutical industry, validation is everything.\" <a class=\"cite\" href=\"https://www.fooddive.com/news/food-science-ingredient-innovation-ai-nuritas-functional/815872/\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>. Ingredion chose to partner with Shiru rather than build (March 2026) <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/ai-ingredient-discovery-ingredion-shiru-prebiotics.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>. Rousselot's public account of Nextida discovery is bench-led: the team \"cut the collagen molecule in different ways and tested the resulting peptides on intestinal cells that secrete GLP-1\" <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-innovation-days-collagen-peptides-nextida.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 58\">58<\/a>. Tate &amp; Lyle is building a robotic data factory for starch precisely to feed models <a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/tate-lyle-ai-healthier-ingredients-innovation.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>. dsm-firmenich (September 2026) pairs Boltz's foundation models with its own receptor data to build exclusive models, with Boltz researchers embedded in its teams <a href=\"https://our-company.dsm-firmenich.com/en/our-company/news/trade-news/2026/dsm-firmenich-partners-with-boltz-on-ai-for-ingredient-discovery.html\" target=\"_blank\" rel=\"noopener\">dsm-firmenich, 14 September 2026<\/a>.<\/p>", "first": "<p>Inventory the peptide and bioassay data behind Nextida GC (volume, format, ownership). Request a scoping conversation with two discovery platforms under NDA to learn their licence terms and what data they would need.<\/p>", "magnitude": "<p>Not sizeable from public data; the stakes are the pace of the Nextida pipeline, which Jeroen Colpaert called \"the beginning of a long series of innovations\" <a class=\"cite\" href=\"https://www.darlingii.com/en/media/news/rousselot-introducing-nextida-a-groundbreaking-innovation-shaping-the-future-of-collagen-peptides\" target=\"_blank\" rel=\"noopener\" title=\"Source 57\">57<\/a>.<\/p>", "tension": "<p>The loser believes Nextida was a one-off win from years of bench work and that the next composition will come the same way. The winner sees that peptide bioactivity discovery is becoming a data and model problem, that Nuritas, Shiru and Brightseed are selling that capability to Rousselot's peers, and that whoever has the largest proprietary collagen hydrolysate dataset will out-discover the rest.<\/p>", "uncertainties": "<p>How much of Rousselot's hydrolysate, mass-spectrometry and bioassay data is structured and model-ready. Whether Matt's simulation work already covers composition-to-outcome prediction or only process. Whether a licence from Nuritas or Shiru is cheaper than building.<\/p>"}, "lastChange": "R7-1: add dsm-firmenich and Boltz as a third route: own the data, rent the model builder (accepted 2026-10-09)", "name": "peptide composition discovery as an internal engine", "other": [], "rank": 1, "shortName": "AI to find the next bioactive peptide", "soWhat": "Peptide discovery is becoming a data and model problem, and specialists already sell that capability to Rousselot's peers. Whoever holds the largest proprietary collagen peptide dataset could out-discover the rest.", "threshold": "Knowledge bundled to AI-unbundled", "updatedAt": "2026-10-09", "verdict": "Lead"}, {"area": "R7", "arena": "Personalised / digital", "cell": "Personalised and digital x Knowledge bundled to AI-unbundled", "fields": {"evidence": "<p>Knowde, Covalo and SpecialChem all run on the same economics: formulators get data free, suppliers pay to be found <a class=\"cite\" href=\"https://research.contrary.com/company/knowde\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://covalo.com/faq/\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a><a class=\"cite\" href=\"https://www.specialchem.com/about-us\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>. Nutrition Integrated and Lumina sell intelligence subscriptions to brands and suppliers, including ADM Biopolis <a class=\"cite\" href=\"https://www.nutritionintegrated.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><a class=\"cite\" href=\"https://www.lumina-intelligence.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>. Consumer evidence products price at $75 a year (ConsumerLab) <a class=\"cite\" href=\"https://www.consumerlab.com/membership/\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>. No public example was found of a single ingredient supplier charging third parties for its own evidence feed; the prior C2 crux stands unresolved.<\/p>", "first": "<p>Publish a machine-readable Nextida and Peptan evidence sheet (dose, endpoint, trial reference) on Rousselot's site and on one marketplace storefront, and measure who pulls it. Approach two personalised-nutrition platforms with a one-page spec and ask for a paid pilot, not a partnership letter.<\/p>", "magnitude": "<p>Not sizeable from public data. The comparable businesses are small: Covalo raised €3.5 million in 2026; Knowde has raised $175 million in total yet reports 1,200 quotes a month <a class=\"cite\" href=\"https://research.contrary.com/company/knowde\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://beautymatter.com/articles/ingredient-platform-covalo-secures-euro-3-5-million\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>.<\/p>", "tension": "<p>The loser believes the evidence lives in PDFs and sales decks and that customers will read them. The winner sees that formulators, brand R&amp;D teams and AI answer engines increasingly consume structured data, and that whoever supplies it becomes the default reference.<\/p>", "uncertainties": "<p>Whether anyone will pay rather than expect the data free as lead generation. Whether Rousselot's clinical evidence is distinctive enough versus the public literature to carry a licence. Claims law limits what a feed may say [regulation above].<\/p>"}, "name": "structured evidence licensed to platforms (the honest C2 test)", "other": [], "rank": 2, "shortName": "Licensing structured clinical evidence to platforms", "soWhat": "Formulators and AI tools increasingly use structured data, so its supplier becomes the default reference. But no ingredient supplier was found charging for its own evidence feed, so willingness to pay is unproven.", "threshold": "Knowledge bundled to AI-unbundled", "updatedAt": "2026-10-01", "verdict": "Test first"}, {"area": "R7", "arena": "Food and beverage", "cell": "Food and beverage x Ingredients to Ecosystems", "fields": {"evidence": "<p>Ingredion's Ask Ingredion, Symrise's Symvision, Givaudan's ATOM and dsm-firmenich's formula assistant are all free and supplier-operated <a class=\"cite\" href=\"https://www.ingredion.com/na/en-us/be-whats-next/ai-powered-ingredient-solutions\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a><a class=\"cite\" href=\"https://annualreport.dsm-firmenich.com/2025/our-performance/data-governance-and-ai.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a><a class=\"cite\" href=\"https://www.givaudan.com/taste-wellbeing/imagine/tools/digital-tools\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a><a class=\"cite\" href=\"https://www.foodingredientsfirst.com/news/symrise-ai-flavor-prediction.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>. Turing Labs sells to Kalsec, an ingredient company, meaning suppliers are buying, not selling, such platforms <a class=\"cite\" href=\"https://www.turingsaas.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. NotCo's licensees are CPG brands, not ingredient makers <a class=\"cite\" href=\"https://www.greenqueen.com.hk/notco-ai-giuseppe-food-tech-kraft-heinz-not-company/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. Climax Foods shows the gap between AI narrative and kitchen reality <a class=\"cite\" href=\"https://agfundernews.com/plant-based-cheesemaker-climax-foods-secures-bridge-funding-plans-restructuring\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>. No evidence was found of any customer paying an ingredient supplier for a formulation platform.<\/p>", "first": "<p>Reframe C4 as a free applications tool and test it as a sales aid in one segment (beverage or gummies) with three customers; set aside the platform-fee revenue model unless a customer volunteers to pay.<\/p>", "magnitude": "<p>Not sizeable from public data; the public comparables suggest value accrues as retained ingredient sales, not platform fees.<\/p>", "tension": "<p>The loser believes customers want a self-serve platform to assemble collagen formulations. The winner sees that every ingredient major that built formulation AI gives it away through its applications teams, and that the paid platforms (Turing Labs, NotCo, Benchling) are ingredient-agnostic by design.<\/p>", "uncertainties": "<p>Whether a brand partner would value a Rousselot-hosted configurator enough to prefer Rousselot ingredients (a lead-generation question, not a revenue one). Whether the Saige work changes the answer. Whether Rousselot's application labs already answer these requests by email and what that costs.<\/p>"}, "name": "the formulation platform question (C4 Compiler)", "other": [], "rank": 3, "shortName": "A paid formulation platform for customers", "soWhat": "Public evidence does not support customers paying for it: the majors we found offer formulation AI free, and the paid platforms work across all ingredients. It may work best as a free sales aid to test.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-01", "verdict": "Park"}, {"area": "R7", "arena": null, "cell": "All arenas x Stable to Volatile", "fields": {"evidence": "<p>Siemens cites Pringles Poland as a plant where \"Digital Twins and AI\" turn production data into process insight <a class=\"cite\" href=\"https://www.siemens.com/global/en/industries/food-beverage.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a>. AspenTech sells Aspen Plus for process modelling and Aspen Process Pulse to \"Monitor and Predict Product and Process Quality\" <a class=\"cite\" href=\"https://www.aspentech.com/en/industries/pharmaceuticals\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a>. Benchling's \"AI Scientist\" couples predictive models with wet-lab execution for 200,000 scientists <a class=\"cite\" href=\"https://www.benchling.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a>. ChemCrow (2023) showed LLM agents calling 18 chemistry tools, the pattern copilots now follow <a class=\"cite\" href=\"https://arxiv.org/abs/2304.05376\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a>. McKinsey finds enterprise EBIT impact from AI flat year on year, so returns depend on where it is applied <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a>. A 2024 review in Current Nutrition Reports, \"Digital Twin Methodology in Food Processing: Basic Concepts and Applications\", exists but could not be opened during this scan [60].<\/p>", "first": "<p>Ask Matt for a one-page description of inputs, outputs and accuracy of the current models. Pick one quality variable at ISS (gel strength or viscosity) and ask whether a prediction before batch release would change a decision.<\/p>", "magnitude": "<p>Not sizeable from public data; internal value depends on batch variability and development cycle time at ISS and the other plants.<\/p>", "tension": "<p>The loser believes AI in the plant means automating paperwork. The winner sees simulation (predicting yield, gel strength, viscosity or peptide profile from raw-material and process variables before running the batch) as the capability that shortens development and protects margin when inputs vary.<\/p>", "uncertainties": "<p>What Matt has built, on which data, and whether it predicts outcomes or automates tasks. Whether plant historian and LIMS data are joined. Whether Darling's IT policy allows model deployment at plant level.<\/p>"}, "name": "process simulation copilots inside the four European plants (capability, not venture)", "other": [], "rank": 4, "shortName": "Predicting batch quality inside the plants", "soWhat": "Predicting yield, gel strength or viscosity before running a batch could shorten development and protect margin when raw materials vary. It looks more like a capability than a venture, and is the cheapest space to test.", "threshold": "Stable inputs to Volatile world", "updatedAt": "2026-10-01", "verdict": "Test first"}, {"area": "R7", "arena": "Beauty and consumer", "cell": "Beauty and consumer x Knowledge bundled to AI-unbundled", "fields": {"evidence": "<p>Ingredion built its own assistant to intercept the question \"start with a challenge, not a specific product\" <a class=\"cite\" href=\"https://www.ingredion.com/na/en-us/be-whats-next/ai-powered-ingredient-solutions\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>. FoodDive (March 2026) notes consumer AI tools \"enabling real-time health claim verification may disrupt brand narratives\" <a class=\"cite\" href=\"https://www.fooddive.com/news/food-science-ingredient-innovation-ai-nuritas-functional/815872/\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>. Article 50 transparency rules apply from 2 August 2026 to AI systems interacting with people <a class=\"cite\" href=\"https://artificialintelligenceact.eu/implementation-timeline/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>.<\/p>", "first": "<p>Run a monthly audit of ten standard prompts across three assistants and record which suppliers and studies are cited.<\/p>\n<p>Ranking rationale: space 1 has paying precedents and a direct link to the Nextida pipeline; space 4 is the cheapest to test and sits in the protect engine; space 2 is the only testable version of the prior C2 and C4 thesis; space 3 is kept only to record that public evidence does not support a paid platform; space 5 is a tactic.<\/p>", "magnitude": "<p>Not sizeable from public data; cost is low (content structuring), so it is a tactic rather than a venture, as the prior D4 note concluded.<\/p>", "tension": "<p>The loser believes brand marketing reaches formulators. The winner sees formulators and consumers asking assistants, and structured, cited evidence is what gets surfaced.<\/p>", "uncertainties": "<p>Whether assistants currently cite Rousselot or competitors when asked about collagen peptides for glucose or skin.<\/p>"}, "name": "being the ingredient AI answer engines cite", "other": [], "rank": 5, "shortName": "Being the ingredient AI assistants cite", "soWhat": "Formulators and consumers increasingly ask AI assistants, which surface structured, cited evidence. The cost is low, so this is likely a tactic rather than a venture: audit what assistants cite monthly.", "threshold": "Knowledge bundled to AI-unbundled", "updatedAt": "2026-10-01", "verdict": "Watch"}], "sources": [{"n": 1, "text": "Report: Knowde Business Breakdown & Founding Story, Contrary Research, December 2023, https://research.contrary.com/company/knowde", "url": "https://research.contrary.com/company/knowde"}, {"n": 2, "text": "Knowde Secures $60 Million to Digitally Transform Chemical and Ingredient Industry, Knowde Blog, 13 August 2024, https://blog.knowde.com/knowde-series-c/", "url": "https://blog.knowde.com/knowde-series-c/"}, {"n": 3, "text": "Chemicals marketplace company Knowde gets $60 million, Digital Commerce 360, 15 August 2024, https://www.digitalcommerce360.com/2024/08/15/chemicals-marketplace-company-knowde-gets-60-million/", "url": "https://www.digitalcommerce360.com/2024/08/15/chemicals-marketplace-company-knowde-gets-60-million/"}, {"n": 4, "text": "FAQ, Covalo, undated (accessed October 2026), https://covalo.com/faq/", "url": "https://covalo.com/faq/"}, {"n": 5, "text": "Ingredient Platform Covalo Secures €3.5 Million, BeautyMatter, 3 April 2026, https://beautymatter.com/articles/ingredient-platform-covalo-secures-euro-3-5-million", "url": "https://beautymatter.com/articles/ingredient-platform-covalo-secures-euro-3-5-million"}, {"n": 6, "text": "Covalo acquires Italy's leading platform for the cosmetics industry, Startupticker, 4 December 2024, https://www.startupticker.ch/en/news/covala-acquires-italy-s-largest-platform-for-the-cosmetics-market", "url": "https://www.startupticker.ch/en/news/covala-acquires-italy-s-largest-platform-for-the-cosmetics-market"}, {"n": 7, "text": "AI Ingredient Assistant for Faster Formulation (Ask Ingredion), Ingredion, 27 July 2026, https://www.ingredion.com/na/en-us/be-whats-next/ai-powered-ingredient-solutions", "url": "https://www.ingredion.com/na/en-us/be-whats-next/ai-powered-ingredient-solutions"}, {"n": 8, "text": "Data governance and AI, dsm-firmenich Integrated Annual Report 2025, https://annualreport.dsm-firmenich.com/2025/our-performance/data-governance-and-ai.html", "url": "https://annualreport.dsm-firmenich.com/2025/our-performance/data-governance-and-ai.html"}, {"n": 9, "text": "AI-enabled digital tools for consumer understanding and product development, Givaudan, undated (accessed October 2026), https://www.givaudan.com/taste-wellbeing/imagine/tools/digital-tools", "url": "https://www.givaudan.com/taste-wellbeing/imagine/tools/digital-tools"}, {"n": 10, "text": "Symrise expands AI platform for optimized formulas and faster NPD, Food Ingredients First, 12 November 2025, https://www.foodingredientsfirst.com/news/symrise-ai-flavor-prediction.html", "url": "https://www.foodingredientsfirst.com/news/symrise-ai-flavor-prediction.html"}, {"n": 11, "text": "Future Food-Tech San Francisco 2026: How Tate & Lyle leverages AI for healthy ingredient innovation, Food Ingredients First, 20 March 2026, https://www.foodingredientsfirst.com/news/tate-lyle-ai-healthier-ingredients-innovation.html", "url": "https://www.foodingredientsfirst.com/news/tate-lyle-ai-healthier-ingredients-innovation.html"}, {"n": 12, "text": "Identifying consumer patterns with predictive AI (Kerry case study), IBM, 14 May 2024, https://www.ibm.com/ae-ar/case-studies/kerry", "url": "https://www.ibm.com/ae-ar/case-studies/kerry"}, {"n": 13, "text": "IFF Digital Innovation Platform Lead Joins Flavorcon 2024 AI Panel Alongside Givaudan & ADM, Perfumer & Flavorist, October 2024, https://www.perfumerflavorist.com/events/event-coverage/flavorcon/news/22915719/iff-digital-innovation-platform-lead-joins-flavorcon-2024-ai-panel-alongside-givaudan-adm", "url": "https://www.perfumerflavorist cessed October 2026, https://www.benchling.com/", "url": "https://www.benchling.com/"}, {"n": 51, "text": "ChemCrow: Augmenting large-language models with chemistry tools, Bran et al., arXiv, April 2023 (v5 October 2023), https://arxiv.org/abs/2304.05376", "url": "https://arxiv.org/abs/2304.05376"}, {"n": 52, "text": "The State of AI, McKinsey (QuantumBlack), 25 August 2026, https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai", "url": "https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai"}, {"n": 53, "text": "Food & Beverage industry page, Siemens, accessed October 2026, https://www.siemens.com/global/en/industries/food-beverage.html", "url": "https://www.siemens.com/global/en/industries/food-beverage.html"}, {"n": 54, "text": "Pharmaceuticals industry page, AspenTech, accessed October 2026, https://www.aspentech.com/en/industries/pharmaceuticals", "url": "https://www.aspentech.com/en/industries/pharmaceuticals"}, {"n": 55, "text": "Data Is Everybody's Business (endorsements page, Improve-Wrap-Sell framework, Barbara Wixom), MIT Press, accessed October 2026, https://mitpress.mit.edu/9780262048217/data-is-everybodys-business/", "url": "https://mitpress.mit.edu/9780262048217/data-is-everybodys-business/"}, {"n": 56, "text": "Darling Ingredients Inc. Identifies Collagen Peptide Profiles for Targeted Health Benefits, PR Newswire, 11 April 2024, https://www.prnewswire.com/news-releases/darling-ingredients-inc-identifies-collagen-peptide-profiles-for-targeted-health-benefits-302114817.html", "url": "https://www.prnewswire.com/news-releases/darling-ingredients-inc-identifies-collagen-peptide-profiles-for-targeted-health-benefits-302114817.html"}, {"n": 57, "text": "Rousselot introduces Nextida, Darling Ingredients, 14 May 2024, https://www.darlingii.com/en/media/news/rousselot-introducing-nextida-a-groundbreaking-innovation-shaping-the-future-of-collagen-peptides", "url": "https://www.darlingii.com/en/media/news/rousselot-introducing-nextida-a-groundbreaking-innovation-shaping-the-future-of-collagen-peptides"}, {"n": 58, "text": "Rousselot Innovation Days: Spotlight on collagen peptides research advances, Nutrition Insight, 24 September 2025, https://www.nutritioninsight.com/news/rousselot-innovation-days-collagen-peptides-nextida.html", "url": "https://www.nutritioninsight.com/news/rousselot-innovation-days-collagen-peptides-nextida.html"}, {"n": 59, "text": "Darling Ingredients (DAR) Awarded US Patent for Rousselot's Nextida GC Collagen Peptide, Insider Monkey, 4 June 2026, https://www.insidermonkey.com/blog/darling-ingredients-dar-awarded-us-patent-for-rousselots-nextida-gc-collagen-peptide-1793174/", "url": "https://www.insidermonkey.com/blog/darling-ingredients-dar-awarded-us-patent-for-rousselots-nextida-gc-collagen-peptide-1793174/"}, {"n": 60, "text": "Digital Twin Methodology in Food Processing: Basic Concepts and Applications, Current Nutrition Reports, 2024, DOI 10.1007/s13668-024-00584-2 (metadata via Crossref only; full text not opened)", "url": null}]}, {"bionova": "<p>To capture for the governance charter. Elke and Kathleen hold most of this; Limineer's Bionova board notes are the second source.<\/p><ul class=\"todo\"><li>Board: who sat on it, and how the cadence changed once boards became team-led<\/li><li>Funding: the stage ceilings, and any tranche released late or refused<\/li><li>Speed: how long each proceed-or-pause decision took<\/li><li>Origin: who had the idea, and how much protected time they got<\/li><li>Bought in: which external capabilities, at what cost<\/li><li>First customer: the first validated commitment, and when it came<\/li><li>Metrics: which of the six above Bionova could have reported at its first board<\/li><li>Handover: headcount cost of moving to a product owner and commercial lead<\/li><\/ul>", "code": "R8", "engine": "Vertical", "engine_long": "The RBB vertical", "extras": [{"html": "<p>Feedback received on 6 Oct gives two working tests for separating a move from the core. (1) <strong>Different regulation or value proposition:<\/strong> moves from healthy to diseased individuals (R3 companion and phenotype spaces) sit in a different regulatory environment from a core positioned on healthy individuals, so they belong in a venture. (2) <strong>Different production:<\/strong> a Peptan upgrade becomes a venture only if it needs a production step Rousselot's own plants cannot run (R2 space 6). A third test is implied for R3 space 8: a different business model (selling blends rather than ingredients). Our take: these three tests are a usable first filter for the 30 Oct choice and for RBB's charter, alongside the PB Leiner perimeter question.<\/p>", "title": "6 Oct: when a move becomes a venture"}], "internal": "<ol>\n<li>Sonac remit: settled on 2 October 2026 as free rein for Rousselot, coordinated with Sonac. Still open: a written coordination mechanism for shared customers and data, which the charter should reference.<\/li>\n<li>Charter and perimeter: RBB is chartered under Rousselot (settled, 2 October 2026). Still open: the closing date of the Rousselot plus PB Leiner company <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a> and whether new business moves into it after closing; for now everything sits within Rousselot. Holder: Elke, with Darling corporate development.<\/li>\n<li>Current spend on exploration: what Rousselot already spends on applications-lab concepts and co-development that never reach market (the X1 evidence), so that a year-one RBB budget can be set as a share of growth capital. Holder: finance partner to science and innovation.<\/li>\n<li>Protected-time rules: whether Praneeth and Matt can be allocated a fixed weekly share for six-week discovery sprints, and who backfills lab work. Holder: Elke and the plant or lab managers.<\/li>\n<li>The sandbox: status of the small-scale test facility request from the pre-mortem interviews, since in-house build is not credible without it. Holder: operations.<\/li>\n<li>Board membership: whether Jeroen chairs or attends, and whether a Darling or Sonac representative sits on the venture board. Holder: Jeroen's office.<\/li>\n<li>Bionova records: the venture-board minutes and stage decisions listed above. Holder: Kathleen, Elke, Limineer.<\/li>\n<\/ol>", "name": "How Rousselot builds", "oneLine": "<p>This section is about the vertical, not the ventures: how Rousselot sets up \"Rousselot Business Building\" (RBB) so that Kathleen can run it from January 2027 with Elke as sponsor and a first Q1 board review at executive level. The scan found that the field has moved since 2023 from labs and corporate venture capital towards small, serially run business-building units with tranched funding and C-level reporting, that the published benchmarks are mostly consultancy surveys (McKinsey n=715 to 1,176; BCG \"200+ cases\") rather than audited data, and that several of the closest reference models in chemicals and ingredients have been closed or folded back in the last 30 months (BASF Chemovator, Unilever's The Uncovery, Mars Edge's foodspring, Bosch's in-house build attempt). The design choices below are laid out so the leadership team can pick, not so that a model is pre-chosen. A peer pass on 9 October adds company-reported figures from ingredient, food and chemicals companies (Evonik, Nestlé, DSM, Darling, Tate &amp; Lyle, Danone, GELITA and others); see \"What peers report\" below.<\/p>", "options": [{"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Inside R&amp;D or science and innovation<\/td>\n<td>Business building as a track inside the existing innovation function<\/td>\n<td>Nestlé R+D Accelerator <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; Creavis under the CIO <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><\/td>\n<td>A science leader willing to own commercial gates<\/td>\n<td>Technical bias; \"a commercial incubator, not a technical incubator\" was Chemovator's explicit correction <a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><\/td>\n<td>Ideas are mostly scientist-originated and close to the core<\/td>\n<\/tr>\n<tr>\n<td>Inside a business unit<\/td>\n<td>Ventures incubated under a BU head with its P&amp;L<\/td>\n<td>Unilever's post-2023 arrangement <a class=\"cite\" href=\"https://www.beautyindependent.com/beauty-companies-close-in-house-brand-incubators-unilever-ipsy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>; Cargill's pre-2020 model <a class=\"cite\" href=\"https://agfundernews.com/cargill-restructures-corporate-venture-group-into-newly-centralized-unit\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a><\/td>\n<td>A BU head who accepts dilution of near-term margin<\/td>\n<td>Ventures killed when the BU budget tightens; Cargill centralised for exactly this reason <a class=\"cite\" href=\"https://agfundernews.com/cargill-restructures-corporate-venture-group-into-newly-centralized-unit\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a><\/td>\n<td>Ventures are adjacent to one BU's customers<\/td>\n<\/tr>\n<tr>\n<td>Standalone unit reporting to the executive committee<\/td>\n<td>Small unit with its own budget and board, CEO or ExCo sponsor<\/td>\n<td>McKinsey's recommended structure <a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>; Chemovator GmbH <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>; Bosch Business Innovations <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>A named sponsor and ring-fenced budget<\/td>\n<td>Exposed in group restructurings (Chemovator closed 2025) <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a><\/td>\n<td>The company wants ventures that may not fit any BU<\/td>\n<\/tr>\n<tr>\n<td>External venture-builder partnership<\/td>\n<td>A builder runs method and part of the team under a corporate sponsor<\/td>\n<td>Schneider Electric <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>; Limineer with Rousselot today<\/td>\n<td>Clear IP and equity terms; a transition plan<\/td>\n<td>Dependency; the builder leaves<\/td>\n<td>A first-year unit without in-house method<\/td>\n<\/tr>\n<tr>\n<td>Group-level at Darling<\/td>\n<td>Unit sits above Rousselot at the parent<\/td>\n<td>No public Darling unit found <a class=\"cite\" href=\"https://www.darlingii.com/rousselot/products/science\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a><\/td>\n<td>Parent appetite<\/td>\n<td>Distance from collagen science and customers<\/td>\n<td>Only if Darling wants a group vehicle<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: RBB is chartered under Rousselot (settled, 2 October 2026), and for now everything sits within Rousselot while the PB Leiner perimeter is open. With a new 85/15 company forming <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a>, a standalone unit at executive level is attractive for visibility but exposed to integration cost-cutting; sitting under the science and innovation function keeps it alive but risks a technical rather than commercial tilt. A hybrid (housed under science and innovation, governed by an executive-level venture board chaired or attended by an executive sponsor) is close to how Creavis and the Nestlé R+D Accelerator are housed <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; the executive-level board element is McKinsey's recommendation <a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>, not something either company documents publicly.<\/p>", "title": "Where RBB sits"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Annual budget<\/td>\n<td>A fixed envelope for the unit, allocated by the lead<\/td>\n<td>Creavis share of R&amp;D <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2024/09/evonik-aims-to-generate-additional-sales-with-new-innovation-strategy.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a><\/td>\n<td>Budget discipline<\/td>\n<td>Spending to budget, not to evidence<\/td>\n<td>Mature unit with a steady pipeline<\/td>\n<\/tr>\n<tr>\n<td>Metered funding by stage<\/td>\n<td>Ceilings per stage released on evidence<\/td>\n<td>Pearson USD 0/50k/250k <a class=\"cite\" href=\"https://www.strategyzer.com/library/howtodeliverinnovationresults\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>; Chemovator tranches <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>; McKinsey tranching <a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a><\/td>\n<td>A board that meets often enough to release tranches<\/td>\n<td>Slower if the board is slow<\/td>\n<td>Year-one unit that must prove discipline<\/td>\n<\/tr>\n<tr>\n<td>Venture-by-venture approval<\/td>\n<td>Each venture goes to ExCo for money<\/td>\n<td>Cargill Ventures with no deployment targets <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><\/td>\n<td>Senior time<\/td>\n<td>Politics decides; the InnoLead top challenge is \"internal politics and turf wars\" <a class=\"cite\" href=\"https://www.newswire.com/news/new-survey-data-shows-innovation-teams-at-large-companies-are-focusing-21949323\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a><\/td>\n<td>Very few, large bets<\/td>\n<\/tr>\n<tr>\n<td>Co-investment with partners<\/td>\n<td>External capital or JV partner shares cost from an early stage<\/td>\n<td>Bosch's JV route for capital-intensive fields <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a>; Chemovator's external-investor expectation <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>; Tate &amp; Lyle's externally managed LP <a class=\"cite\" href=\"https://www.tateandlyle.com/our-expertise/tate-lyle-ventures-what-we-do\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><\/td>\n<td>Term sheets, IP carve-outs<\/td>\n<td>Loss of control; sister-company remit questions<\/td>\n<td>Capital-intensive or Sonac-adjacent ventures<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: metered funding with small, published ceilings is the model most likely to show discipline at executive level inside one quarter; an annual envelope without gates could invite the \"innovation theatre\" charge. Co-investment could sit in the charter as the route for anything that needs plant capacity or Sonac's territory.<\/p>", "title": "Funding model"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Open call to all staff<\/td>\n<td>Periodic pitch events, anyone can apply<\/td>\n<td>Chemovator: events every 3 to 4 months, teams of 2 to 3, about 10 per cent accepted <a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><\/td>\n<td>Coaching for single applicants; a transparent scorecard<\/td>\n<td>Volume without quality; morale cost of 90 per cent rejections<\/td>\n<td>A culture already comfortable with pitching<\/td>\n<\/tr>\n<tr>\n<td>Curated intake via champions<\/td>\n<td>Named champions collect and pre-screen<\/td>\n<td>Cargill's BU operators paired with venture experts <a class=\"cite\" href=\"https://agfundernews.com/cargill-restructures-corporate-venture-group-into-newly-centralized-unit\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a><\/td>\n<td>Champions with time<\/td>\n<td>Gatekeeping<\/td>\n<td>Early months, few ideas<\/td>\n<\/tr>\n<tr>\n<td>Scientist-originated with protected time<\/td>\n<td>Scientists keep their job and get a time allocation to test<\/td>\n<td>Chemovator founders stayed employees at 100 per cent time <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>; Nestlé mixed teams <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><\/td>\n<td>HR rules for secondment<\/td>\n<td>Lab capacity loss; the \"sandbox\" dependency in the Battlefield report<\/td>\n<td>Ideas sit with named scientists (Praneeth, Matt)<\/td>\n<\/tr>\n<tr>\n<td>External scouting<\/td>\n<td>Funds and scouts bring startups<\/td>\n<td>Givaudan: about 1,000 startups a year via scouts and five funds <a class=\"cite\" href=\"https://agfundernews.com/how-does-front-end-innovation-work-at-givaudan-in-conversation-with-alexandre-bastos\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><\/td>\n<td>Budget for fund stakes<\/td>\n<td>Not business building; slow strategic return<\/td>\n<td>Capability gaps rather than new businesses<\/td>\n<\/tr>\n<tr>\n<td>Customer-originated<\/td>\n<td>Co-development requests become ventures<\/td>\n<td>X1 thread in the Battlefield report (Heineken case, internal)<\/td>\n<td>A proactive pitching pod<\/td>\n<td>Reactive if left as is<\/td>\n<td>Applications-lab concepts already exist<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: an open call may be premature for a unit with two named scientists volunteering ideas; a one-page intake form, a 30-day answer, and a fixed protected-time allocation (for example one day a week for a six-week discovery sprint, modelled on Chemovator's 100 to 150 customer contacts in three months <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>) is likely cheaper and closer to how scientists already work.<\/p>", "title": "Idea intake"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Build in-house<\/td>\n<td>Internal team builds and scales<\/td>\n<td>Nestlé <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; Cargill Studio <a class=\"cite\" href=\"https://www.farmprogress.com/technology/cargill-takes-startup-approach-to-new-ideas\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a><\/td>\n<td>Product and commercial talent (McKinsey's most-reported gap) <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><\/td>\n<td>Bosch's verdict after two 2025 tests: \"The answer is no.\" <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>Core-adjacent, uses existing plants and customers<\/td>\n<\/tr>\n<tr>\n<td>Partner or JV<\/td>\n<td>Shared build with a partner<\/td>\n<td>Bosch JV route <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a>; Veramaris-type JVs not sourced here<\/td>\n<td>Legal, IP<\/td>\n<td>Governance load<\/td>\n<td>Capital-intensive or outside Rousselot's remit<\/td>\n<\/tr>\n<tr>\n<td>License out<\/td>\n<td>IP or brand licensed to third parties<\/td>\n<td>Not sourced for the reference set; the D-arena certification idea in the Battlefield report is this type<\/td>\n<td>A standard and policing capability<\/td>\n<td>Cannibalisation<\/td>\n<td>Where the asset is a mark or a composition, not a plant<\/td>\n<\/tr>\n<tr>\n<td>Acquire<\/td>\n<td>Buy a business to get the capability<\/td>\n<td>Mars Edge and foodspring <a class=\"cite\" href=\"https://www.mars.com/news-and-stories/articles/mars-edge-and-foodspring-pioneer-personalized-nutrition\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a><a class=\"cite\" href=\"https://www.just-food.com/news/mars-backed-sports-nutrition-business-foodspring-to-cease-trading/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>; McKinsey: experts twice as likely to acquire during building <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><a class=\"cite\" href=\"https://www.weforum.org/stories/2025/01/new-business-deliver-meaningful-growth/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><\/td>\n<td>M&amp;A appetite<\/td>\n<td>foodspring closed 2025 <a class=\"cite\" href=\"https://www.just-food.com/news/mars-backed-sports-nutrition-business-foodspring-to-cease-trading/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a>; Peptan was acquired, not built (internal)<\/td>\n<td>Capability gap with a visible target<\/td>\n<\/tr>\n<tr>\n<td>Spin out<\/td>\n<td>Venture leaves with external investors<\/td>\n<td>Chemovator below 25 per cent stake <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>; M Ventures spinoffs <a class=\"cite\" href=\"https://www.nature.com/articles/d42473-020-00230-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a>; Bosch carve-outs <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>Willingness to lose control<\/td>\n<td>Value leaves the group<\/td>\n<td>Ventures the core will not fund to scale<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: the Battlefield report already flags D1 as more credible as acquisition or JV and X1 as partnership-led; the charter could name all five routes as legitimate exits from validation so that \"build it ourselves\" is not the default.<\/p>", "title": "Build route"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Core-adjacent majority<\/td>\n<td>Most ventures within the primary industry<\/td>\n<td>McKinsey 2025: about 60 per cent build within primary industry <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><\/td>\n<td>Customer access<\/td>\n<td>Incrementalism<\/td>\n<td>Year one<\/td>\n<\/tr>\n<tr>\n<td>Transformational minority<\/td>\n<td>One or two bets outside the core<\/td>\n<td>Creavis growth fields <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2024/09/evonik-aims-to-generate-additional-sales-with-new-innovation-strategy.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a><\/td>\n<td>Patience, 3 to 5 year sponsorship (Mastercard view) <a class=\"cite\" href=\"https://innov8rs.co/news/corporate-venture-building-the-practice/\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a><\/td>\n<td>Mortality<\/td>\n<td>After first gates work<\/td>\n<\/tr>\n<tr>\n<td>Concurrent venture count<\/td>\n<td>Three or more at once to be a \"serial builder\"<\/td>\n<td>McKinsey: serial builders 1.9x vs 1.3x <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>; experts about 6 in five years <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><\/td>\n<td>Team of at least one lead per venture<\/td>\n<td>Thin coverage<\/td>\n<td>Only if intake supports it<\/td>\n<\/tr>\n<tr>\n<td>Kill cadence<\/td>\n<td>Quarterly board, kill at any gate on pre-set criteria<\/td>\n<td>McGrath <a class=\"cite\" href=\"https://hbr.org/2011/04/failing-by-design\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a>; Strategyzer discovery attrition <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><\/td>\n<td>Written criteria before start<\/td>\n<td>None if criteria are written<\/td>\n<td>Always<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: three concurrent discovery-stage ventures (two core-adjacent, one transformational) with a quarterly kill point is arguably the smallest portfolio that still produces portfolio learning; a single venture behaves more like a project than a unit.<\/p>", "title": "Portfolio shape and ambition mix"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Executive-level venture board, quarterly<\/td>\n<td>Small senior committee releases tranches, kills, redirects<\/td>\n<td>BCG \"small, senior investment committees\" <a class=\"cite\" href=\"https://www.bcg.com/publications/2022/corporate-venturing-models\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>; Cargill ventures board <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><\/td>\n<td>4 to 6 people, 90 minutes a quarter<\/td>\n<td>Slowness between meetings<\/td>\n<td>Default<\/td>\n<\/tr>\n<tr>\n<td>Supervisory board with external member<\/td>\n<td>Includes an outside investor or builder<\/td>\n<td>Chemovator board with head of BASF VC <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><\/td>\n<td>An external willing to serve<\/td>\n<td>Confidentiality<\/td>\n<td>Spinout-oriented units<\/td>\n<\/tr>\n<tr>\n<td>Unit lead decides below a threshold<\/td>\n<td>Lead can spend to a ceiling without the board<\/td>\n<td>Pearson ceilings <a class=\"cite\" href=\"https://www.strategyzer.com/library/howtodeliverinn
