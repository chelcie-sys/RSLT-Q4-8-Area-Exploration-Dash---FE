ovationresults\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a><\/td>\n<td>Trust<\/td>\n<td>Scope creep<\/td>\n<td>Discovery stage<\/td>\n<\/tr>\n<tr>\n<td>Product or portfolio council<\/td>\n<td>Broader cross-functional council<\/td>\n<td>Strategyzer's \"Product Council, Innovation Board, Innovation Committee, Portfolio Council\" <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><\/td>\n<td>Time from many functions<\/td>\n<td>Committee drift<\/td>\n<td>Larger pipelines<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: a four-person board (an executive sponsor as chair or attendee, the science and innovation lead as sponsor, a commercial head, a finance partner) meeting quarterly, with the RBB lead holding spend authority up to the discovery ceiling, would fit the January start and the Q1 review; the board decides stage moves and kills, the team decides experiments. Whether Sonac or Darling should hold a seat is the governance question the Battlefield report could not resolve.<\/p>", "title": "Governance body"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Financial (revenue, margin)<\/td>\n<td>Treat ventures like BUs<\/td>\n<td>Common default; Osterwalder warns it kills the wrong ideas <a class=\"cite\" href=\"https://www.strategyzer.com/library/innovation-metrics-vs-execution-metrics\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a><\/td>\n<td>Nothing new<\/td>\n<td>Wrong kills in year one<\/td>\n<td>Scaling stage only<\/td>\n<\/tr>\n<tr>\n<td>Innovation accounting<\/td>\n<td>Risk-adjusted value, evidence, cost and time per stage<\/td>\n<td>Toma and Gons <a class=\"cite\" href=\"https://ssir.org/books/excerpts/entry/analyzing_your_innovation_portfolio\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a>; Etiemble <a class=\"cite\" href=\"https://www.strategyzer.com/library/taking-the-guesswork-out-of-innovation\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a>; Strategyzer board set <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><\/td>\n<td>Training the board to read it<\/td>\n<td>Looks soft to a CFO unless tied to ceilings<\/td>\n<td>Discovery and validation<\/td>\n<\/tr>\n<tr>\n<td>Leading and lagging mix<\/td>\n<td>Three activity and three outcome measures<\/td>\n<td>Pattern across sources (see Governance patterns)<\/td>\n<td>Discipline to keep six<\/td>\n<td>Gaming<\/td>\n<td>Year one<\/td>\n<\/tr>\n<tr>\n<td>Which six<\/td>\n<td>Intake conversion; experiments and hypotheses retired; spend and time vs ceiling; gate passes and kills with time to kill; validated customer commitments; risk-adjusted portfolio value vs strategic fit<\/td>\n<td>Synthesised from <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><a class=\"cite\" href=\"https://ssir.org/books/excerpts/entry/analyzing_your_innovation_portfolio\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a><a class=\"cite\" href=\"https://www.strategyzer.com/library/taking-the-guesswork-out-of-innovation\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a><a class=\"cite\" href=\"https://www.strategyzer.com/library/howtodeliverinnovationresults\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a><\/td>\n<td>A one-page dashboard<\/td>\n<td>None material<\/td>\n<td>Proposed for December<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: the six above give the executive board one lagging number it can audit in Q1 (validated customer commitments, for example paid pilots) and five that show whether the unit is disciplined; adding revenue in year one could make the first review a judgement on luck.<\/p>", "title": "Metrics"}, {"html": "<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>How it works<\/th>\n<th>Reference models<\/th>\n<th>What it needs<\/th>\n<th>Cost or risk<\/th>\n<th>When it fits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lean lead plus part-time scientists<\/td>\n<td>One lead, scientists on protected time, external coaching<\/td>\n<td>Nestlé mixed teams <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; Schneider Electric <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a><\/td>\n<td>Protected-time rules<\/td>\n<td>Lead becomes bottleneck<\/td>\n<td>Year one<\/td>\n<\/tr>\n<tr>\n<td>Venture lead or EiR per venture<\/td>\n<td>A named builder per venture, often external<\/td>\n<td>Chemovator: 80 per cent external hires; EiR coaches <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://www.chemie.de/news/1158772/basf-startet-geschaeftsinkubator-fuer-neue-ideen-aus-dem-chemiebereich.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; Bosch founder-led with founders above 70 per cent equity <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>Compensation outside the grid (25 per cent of expert builders do this vs 13 per cent of novices) <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><\/td>\n<td>HR friction<\/td>\n<td>Once a venture passes validation<\/td>\n<\/tr>\n<tr>\n<td>External builders<\/td>\n<td>A firm supplies method and people<\/td>\n<td>Schneider Electric <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a><\/td>\n<td>Transition plan<\/td>\n<td>Dependency<\/td>\n<td>Year one, with handover by year two<\/td>\n<\/tr>\n<tr>\n<td>Sonac-adjacent or JV-adjacent<\/td>\n<td>Joint team with the sister company or partner<\/td>\n<td>Bosch JV route <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>A defined coordination step with the sister company<\/td>\n<td>An undefined coordination step slows shared-account work<\/td>\n<td>Sonac remit settled as free rein, coordinated (2 October 2026); fits once the coordination step is defined<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rousselot trade-off: a year-one team of the RBB lead plus one commercial or venture lead, two scientists on protected time, and an external builder on method is likely the smallest unit that can run three discovery ventures; hiring a full-time EiR per venture before a venture passes validation is the staffing pattern Chemovator used <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://www.chemie.de/news/1158772/basf-startet-geschaeftsinkubator-fuer-neue-ideen-aus-dem-chemiebereich.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>; that this made it expensive to keep when BASF cut costs is a Limineer inference, since the closure coverage <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a> gives restructuring, not unit cost, as the reason.<\/p>", "title": "Staffing"}], "optionsIntro": "<p>The eight tables below give the options that exist in the reference set. The Rousselot line after each is a trade-off, not a recommendation; the 30 October session is where the choice should be made. One framing worth having in the room: EY-Parthenon's April 2025 typology sorts corporate builders by the endowment they monetise (an internal problem with a ready first customer, a disruptive technology, dormant IP, or customer relationships and channels) <a class=\"cite\" href=\"https://hbr.org/sponsored/2025/04/what-type-of-corporate-venture-builder-are-you\" target=\"_blank\" rel=\"noopener\" title=\"Source 59\">59<\/a>. On that reading Rousselot's volunteered ideas sit mostly in the IP and customer-relationship types, which favours licensing, co-development and partnership routes over pure in-house builds.<\/p>", "order": 8, "scan": [{"full": "Trends in corporate venture building 2023 to 2026", "html": "<p>Four shifts are visible in dated sources.<\/p>\n<p>First, the centre of gravity has moved from corporate venture capital (CVC) and innovation labs to building businesses, and the people doing it are concentrating on fewer, serial efforts. McKinsey's 2023 survey (1,010 senior managers, fielded 21 June to 5 July 2023) reported organisations building an average of 1.4 businesses in the prior 12 months and expecting nearly 30 per cent of revenue from new businesses within five years <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/ceos-choice-for-growth-building-new-businesses\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a>. Its 2024 survey (1,176 respondents, 21 May to 2 July 2024) found \"expert builders\" had built about six ventures in five years against fewer than two for novices, and were twice as likely to see a venture meet scale expectations <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a>. Its 2025 survey (715 respondents, 66 countries, companies above USD 100 million revenue, fielded 13 to 28 May 2025) reported 61 per cent of ventures crossing USD 10 million annual revenue (45 per cent in 2023), 47 per cent meeting or beating expectations, and serial builders (three or more ventures) generating 1.9 times revenue per dollar invested to breakeven against 1.3 times for one-or-two-venture builders <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>. All three are consultancy surveys with self-reported outcomes.<\/p>\n<p>Second, CVC deal volume has contracted and units are being closed or absorbed. CB Insights counted 3,434 CVC-backed deals in 2024, the lowest since 2018, even as dollars rose to USD 65.9 billion <a class=\"cite\" href=\"https://www.cbinsights.com/research/report/corporate-venture-capital-trends-2024/\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>. Global Corporate Venturing recorded closures of AC Ventures, ZX Ventures (AB InBev) and SAP.iO in early 2024 and the shrinking of Verizon Ventures from more than 12 staff to four <a class=\"cite\" href=\"https://globalventuring.com/corporate/fundraising/ac-ventures-leads-cvc-unit-closures/\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>, then Emasa Ventures, Anglo American's Decarbonisation Ventures, Verizon Ventures, SAP.iO and ZX Ventures by December 2024, noting that \"More than 60% of CVC units survive beyond their initial 3 years\" <a class=\"cite\" href=\"https://globalventuring.com/corporate/cvc-units-closed-2024\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a>. BASF closed its Chemovator incubator on 1 July 2025 and moved the portfolio under BASF Venture Capital <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a><a class=\"cite\" href=\"https://www.it-boltwise.de/basf-schliesst-chemovator-inkubator-im-zuge-von-umstrukturierungen.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a>. PayPal began winding down its venture arm and paused new investments in June 2026 under a new CEO, while \"exploring strategic options\" for it <a class=\"cite\" href=\"https://techcrunch.com/2026/06/17/paypal-ventures-shutters-as-company-restructuring-continues/\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a>. SVB's 2026 CVC survey (nearly 200 funds) found 55 per cent of CVCs reporting no change in independence from the parent and 25 per cent more dependent <a class=\"cite\" href=\"https://www.svb.com/trends-insights/reports/state-of-cvc/\" target=\"_blank\" rel=\"noopener\" title=\"Source 10\">10<\/a>.<\/p>\n<p>Third, the \"innovation theatre\" critique has hardened into design rules. Steve Blank's 2019 HBR piece named hackathons and similar activity as \"innovation theater\" and called for \"an Innovation Doctrine that addresses culture, mindset, and process\" <a class=\"cite\" href=\"https://hbr.org/2019/10/why-companies-do-innovation-theater-instead-of-actual-innovation\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a>; by November 2025 the counter-argument (Robyn Bolton: \"The problem isn't Innovation Theater itself. It's how we practice it.\") was about multi-year commitment rather than one-off events <a class=\"cite\" href=\"https://www.milezero.io/2025/11/19/in-defense-of-innovation-theater/\" target=\"_blank\" rel=\"noopener\" title=\"Source 12\">12<\/a>. The practical consequence in the McKinsey material is tranched, milestone-based funding, ventures reporting directly to C-level executives, and isolation from day-to-day management <a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/p>\n<p>Fourth, the cost of a venture is falling and AI is cited as one cause. McKinsey reports the average investment to breakeven fell from USD 125 million (2024 survey) to USD 77 million (2025 survey), roughly 2 per cent of the core organisation's annual revenue, with nearly one third of data- or IP-led ventures breaking even under USD 1 million, while physical-product ventures need substantially more <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. McKinsey's March 2026 AI piece cites an Antler survey in which 93 per cent of companies said AI accelerated execution and refers to ventures built by \"fewer than a dozen people\" <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-to-build-businesses-faster-and-better-with-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>. These are vendor claims; no independent audit of venture cost was found.<\/p>", "title": "Trends in corporate venture building 2023 to 2026"}, {"full": "Benchmarks", "html": "<p>All figures below are consultancy opinion or company self-report unless marked otherwise. Sample sizes are given where published.<\/p>\n<table>\n<thead>\n<tr>\n<th>Measure<\/th>\n<th>Figure<\/th>\n<th>Scope and source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ventures built per organisation<\/td>\n<td>1.4 in prior 12 months (2023); experts about 6 in five years vs fewer than 2 for novices (2024)<\/td>\n<td>McKinsey, n=1,010 (2023) and n=1,176 (2024) <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/ceos-choice-for-growth-building-new-businesses\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><\/td>\n<\/tr>\n<tr>\n<td>Share of ventures meeting or exceeding expectations<\/td>\n<td>47 per cent (2025); experts twice novices (2024)<\/td>\n<td>McKinsey, n=715 and n=1,176 <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><\/td>\n<\/tr>\n<tr>\n<td>Success ratio experienced vs inexperienced builders<\/td>\n<td>2.8 vs 1.6 successes per underperformer<\/td>\n<td>McKinsey 2023, n=1,010 <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/ceos-choice-for-growth-building-new-businesses\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><\/td>\n<\/tr>\n<tr>\n<td>Investor-tolerated success rate<\/td>\n<td>about 30 per cent; profitability expected nearly 4 years after announcement<\/td>\n<td>McKinsey 2023 investor survey, about 150 analysts <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/ceos-choice-for-growth-building-new-businesses\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><\/td>\n<\/tr>\n<tr>\n<td>Time to USD 10 million revenue<\/td>\n<td>31 months (2025) vs 38 months (2023)<\/td>\n<td>McKinsey 2025, n=715 <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><\/td>\n<\/tr>\n<tr>\n<td>Investment to breakeven<\/td>\n<td>USD 77 million (2025) vs USD 125 million (2024); about 2 per cent of core revenue; one third of data/IP ventures under USD 1 million<\/td>\n<td>McKinsey 2025, n=715 <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a><\/td>\n<\/tr>\n<tr>\n<td>Capital to outcome<\/td>\n<td>USD 3 million typically yields a USD 8 million business in five years; USD 30 million about USD 90 million<\/td>\n<td>Paul Jenkins, McKinsey, WEF, Jan 2025 <a class=\"cite\" href=\"https://www.weforum.org/stories/2025/01/new-business-deliver-meaningful-growth/\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a><\/td>\n<\/tr>\n<tr>\n<td>Growth-capital allocation<\/td>\n<td>20 per cent of growth capital to new ventures associated with 2 points higher revenue growth; only 38 per cent of respondents do this<\/td>\n<td>McKinsey 2024, n=1,176 <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><\/td>\n<\/tr>\n<tr>\n<td>Success rate of a studio model<\/td>\n<td>66 per cent \"success\" vs 20 to 30 per cent for VC, 200+ ventures<\/td>\n<td>BCG Digital Ventures self-report, 2022 <a class=\"cite\" href=\"https://www.bcg.com/publications/2022/corporate-venturing-models\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>; BCG 2024 scaling paper, \"more than 200 corporate venturing cases\", gives no rates <a class=\"cite\" href=\"https://web-assets.bcg.com/pdf-src/prod-live/how-to-scale-corporate-ventures.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><\/td>\n<\/tr>\n<tr>\n<td>Corporate venture success rate (practitioner view)<\/td>\n<td>10 to 15 per cent<\/td>\n<td>Innov8rs practitioner article, 2022, no sample <a class=\"cite\" href=\"https://innov8rs.co/news/corporate-venture-building-the-practice/\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a><\/td>\n<\/tr>\n<tr>\n<td>Intake conversion<\/td>\n<td>Chemovator accepted about 10 per cent of employee pitches; 45 teams had pitched by 2019; 30 companies invested and 8 spun out by mid-2023<\/td>\n<td>Global Venturing 2023; C&amp;EN 2019 <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><\/td>\n<\/tr>\n<tr>\n<td>Programme budgets per team<\/td>\n<td>Pearson product councils: USD 0 idea, up to USD 50k exploration, up to USD 250k validation<\/td>\n<td>Strategyzer webinar, Sept 2024 <a class=\"cite\" href=\"https://www.strategyzer.com/library/howtodeliverinnovationresults\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Merck KGaA accelerator: up to EUR 50k per startup, 3 months, up to 12 per intake, 57 startups since 2015<\/td>\n<td>Merck KGaA, 2019 <a class=\"cite\" href=\"https://www.emdgroup.com/en/news/accelerator-05-06-2019.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><\/td>\n<\/tr>\n<tr>\n<td>Unit budgets<\/td>\n<td>Chemovator's 2018 launch coverage gave up to 12 teams and 24 months of support, with a \"35\" headline figure reported as EUR 35 million of funding; treat the amount as unverified<\/td>\n<td>chemie.de, 2018 <a class=\"cite\" href=\"https://www.chemie.de/news/1158772/basf-startet-geschaeftsinkubator-fuer-neue-ideen-aus-dem-chemiebereich.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Leaps by Bayer: EUR 1.3 billion committed, 50+ companies, further EUR 1.3 billion through 2024<\/td>\n<td>Fierce Biotech, Apr 2022 <a class=\"cite\" href=\"https://www.fiercebiotech.com/biotech/leaping-forward-bayer-vc-arm-double-investment-pace-through-2024\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Tate &amp; Lyle Ventures: Fund I GBP 25 million (2006), Fund II GBP 30 million (2013), externally managed<\/td>\n<td>Tate &amp; Lyle <a class=\"cite\" href=\"https://www.tateandlyle.com/our-expertise/tate-lyle-ventures-what-we-do\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.tateandlyle.com/news/tate-lyle-ventures-delivers-latest-exit-fund-i\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><\/td>\n<\/tr>\n<tr>\n<td>Unit headcounts<\/td>\n<td>Creavis about 200 (2022); Cargill Digital Business Studio about 100 (2023); Verizon Ventures 12+ to 4 (2024)<\/td>\n<td>Evonik <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>; Farm Progress <a class=\"cite\" href=\"https://www.farmprogress.com/technology/cargill-takes-startup-approach-to-new-ideas\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>; GCV <a class=\"cite\" href=\"https://globalventuring.com/corporate/fundraising/ac-ventures-leads-cvc-unit-closures/\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a><\/td>\n<\/tr>\n<tr>\n<td>Cycle time<\/td>\n<td>Nestlé R+D Accelerator: six months concept to shelf, 30+ teams completed; Cargill Ventures: 10 to 12 weeks to a decision<\/td>\n<td>Nestlé <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; AgFunderNews, Jul 2026 <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><\/td>\n<\/tr>\n<tr>\n<td>CVC unit survival<\/td>\n<td>more than 60 per cent survive beyond three years<\/td>\n<td>Global Corporate Venturing, Dec 2024 <a class=\"cite\" href=\"https://globalventuring.com/corporate/cvc-units-closed-2024\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a><\/td>\n<\/tr>\n<tr>\n<td>Innovation team budgets<\/td>\n<td>26 per cent of innovation leaders expected budget cuts in 2023 (9 per cent in 2019); 39 per cent expected increases<\/td>\n<td>InnoLead, 200+ respondents, Feb 2023 <a class=\"cite\" href=\"https://www.newswire.com/news/new-survey-data-shows-innovation-teams-at-large-companies-are-focusing-21949323\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Two cautions. No published source gives kill rates or time-to-kill for corporate business-building units; the closest are Strategyzer's qualitative statement that \"a significant portion of projects are retired due to insufficient evidence\" in discovery <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a> and Chemovator's 10 per cent intake rate. And the McKinsey cost figures are averages across industries dominated by digital ventures; a physical ingredient venture may expect the upper end.<\/p>", "title": "Benchmarks"}, {"full": "Reference models", "html": "<p>Only publicly sourced detail is included. \"Status\" is as of the latest source found.<\/p>\n<table>\n<thead>\n<tr>\n<th>Unit (parent)<\/th>\n<th>Type and where it sits<\/th>\n<th>Funding and gates<\/th>\n<th>Intake<\/th>\n<th>Scale and outcomes<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chemovator (BASF)<\/td>\n<td>Separate GmbH in Mannheim, founded 2018; supervisory board included head of BASF Venture Capital; \"a service group to the organization\" funded by BASF <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.chemie.de/news/1158772/basf-startet-geschaeftsinkubator-fuer-neue-ideen-aus-dem-chemiebereich.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a><\/td>\n<td>2-stage qualification, 3-month development, 21-month build (24 months); first tranche on validation, second round or external investor at end of runway; BASF stake kept below 25 per cent at spinout <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><\/td>\n<td>BASF employees pitch in teams of 2 to 3 at events every 3 to 4 months; about 10 per cent accepted; founders stay BASF employees at 100 per cent time; 100 to 150 customer contacts in first 3 months <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><\/td>\n<td>30 companies invested, 8 spinouts (mid-2023); staff about 20 per cent BASF, 80 per cent external; up to 12 teams <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><\/td>\n<td>Closed 1 July 2025 in group restructuring; portfolio moved to BASF Venture Capital <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a><a class=\"cite\" href=\"https://www.it-boltwise.de/basf-schliesst-chemovator-inkubator-im-zuge-von-umstrukturierungen.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a><\/td>\n<\/tr>\n<tr>\n<td>Creavis (Evonik)<\/td>\n<td>\"Strategic innovation unit and business incubator\" inside Evonik innovation under the Chief Innovation Officer; about 200 staff (2022); Cambridge MA satellite opened 2024 <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><a class=\"cite\" href=\"https://www.investmentmonitor.ai/news/evonik-creavis-opens-innovation-satellite-in-cambridge/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><\/td>\n<td>Part of R&amp;D budget (EUR 443 million group R&amp;D in 2023, 2.9 per cent of sales); innovation growth fields set in 2015 delivered more than EUR 650 million additional sales by 2023 against a EUR 1 billion target; new 2024 strategy targets EUR 1.5 billion additional sales by 2032 <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2024/09/evonik-aims-to-generate-additional-sales-with-new-innovation-strategy.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a><a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><\/td>\n<td>Top-down growth fields; Creavis incubates and hands over to business lines (not detailed publicly) <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><\/td>\n<td>Lipid nanoparticles for mRNA vaccines cited as an output <a class=\"cite\" href=\"https://publications.evonik.com/en/media/press-releases/corporate/evonik-is-driving-growth-through-innovations-177402.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a><\/td>\n<td>Active; Evonik Venture Capital separate: about 55 investments since 2012, up to EUR 15 million per company <a class=\"cite\" href=\"https://www.evonik.com/en/company/Innovation/venture-capital/who-we-are.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a><\/td>\n<\/tr>\n<tr>\n<td>dsm-firmenich Venturing<\/td>\n<td>CVC arm since 2001, mapped to the three business units <a class=\"cite\" href=\"https://our-company.dsm-firmenich.com/en/our-company/ventures.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><\/td>\n<td>Minority stakes 5 to 25 per cent, EUR 0.5 to 5 million tickets, syndicated <a class=\"cite\" href=\"https://our-company.dsm-firmenich.com/en/our-company/ventures.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><\/td>\n<td>External startups<\/td>\n<td>More than 100 startups funded since 2001 <a class=\"cite\" href=\"https://our-company.dsm-firmenich.com/en/our-company/ventures.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><\/td>\n<td>Active<\/td>\n<\/tr>\n<tr>\n<td>Givaudan Front End Innovation, Ventures and Competitive Intelligence<\/td>\n<td>One unit under Alexandre Bastos; invests mainly through five VC funds, direct deals the exception <a class=\"cite\" href=\"https://agfundernews.com/how-does-front-end-innovation-work-at-givaudan-in-conversation-with-alexandre-bastos\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><\/td>\n<td>Joint development agreements and fund commitments; about half a billion a year to innovation across the two divisions (as reported) <a class=\"cite\" href=\"https://agfundernews.com/how-does-front-end-innovation-work-at-givaudan-in-conversation-with-alexandre-bastos\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><\/td>\n<td>External scouts and funds surface about 1,000 startups a year; Givaudan screens <a class=\"cite\" href=\"https://agfundernews.com/how-does-front-end-innovation-work-at-givaudan-in-conversation-with-alexandre-bastos\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><\/td>\n<td>MISTA platform in San Francisco with Bühler and others <a class=\"cite\" href=\"https://www.givaudan.com/media/trade-media/2024/givaudan-mista-buhler-celebrate-opening-extrusion-hub\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a><\/td>\n<td>Active (Oct 2025)<\/td>\n<\/tr>\n<tr>\n<td>Nestlé R+D Accelerator<\/td>\n<td>Inside Nestlé Research, Lausanne, launched 2019; led by Tom Wagner under Isabelle Bureau-Franz <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><\/td>\n<td>Six-month \"test and learn\" cycle with prototyping and mini-production <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.nestle.com/media/news/nestle-rd-accelerator-innovation-dairy-products-plant-based-alternatives\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a><\/td>\n<td>Nestlé scientists, students, startups in mixed teams <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><a class=\"cite\" href=\"https://www.nestle.com/media/news/nestle-rd-accelerator-innovation-dairy-products-plant-based-alternatives\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a><\/td>\n<td>30+ teams completed; in-market tests in Italy, France, Switzerland <a class=\"cite\" href=\"https://www.nestle.com/aboutus/research-development/news/consumer-driven-science-innovation-rd-accelerator\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a><\/td>\n<td>Active<\/td>\n<\/tr>\n<tr>\n<td>Mars Edge (Mars)<\/td>\n<td>Segment created 2017 for \"targeted personalised nutrition\", organic and non-organic <a class=\"cite\" href=\"https://www.just-food.com/news/mars-backed-sports-nutrition-business-foodspring-to-cease-trading/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><\/td>\n<td>Acquisition-led (majority stake in foodspring, 2019) <a class=\"cite\" href=\"https://www.mars.com/news-and-stories/articles/mars-edge-and-foodspring-pioneer-personalized-nutrition\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a><\/td>\n<td>Not published<\/td>\n<td>foodspring ceased trading by 30 June 2025, about 130 staff affected; Mars Edge head left for Oatly in 2022 <a class=\"cite\" href=\"https://www.just-food.com/news/mars-backed-sports-nutrition-business-foodspring-to-cease-trading/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><\/td>\n<td>foodspring closed; segment status not published<\/td>\n<\/tr>\n<tr>\n<td>The Uncovery (Unilever)<\/td>\n<td>Beauty brand incubator; about 10 brands created <a class=\"cite\" href=\"https://www.beautyindependent.com/beauty-companies-close-in-house-brand-incubators-unilever-ipsy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a><\/td>\n<td>Not published<\/td>\n<td>Internal<\/td>\n<td>Reorganised October 2023 into Beauty and Wellbeing business group under CEO Hein Schumacher's 30-brand focus <a class=\"cite\" href=\"https://www.beautyindependent.com/beauty-companies-close-in-house-brand-incubators-unilever-ipsy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a><\/td>\n<td>Folded back<\/td>\n<\/tr>\n<tr>\n<td>Tate &amp; Lyle Ventures<\/td>\n<td>Limited partnerships managed externally by Circadia Ventures LLP for independent decisions <a class=\"cite\" href=\"https://www.tateandlyle.com/our-expertise/tate-lyle-ventures-what-we-do\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><\/td>\n<td>Fund I GBP 25 million (2006), Fund II GBP 30 million (2013), 8-year period <a class=\"cite\" href=\"https://www.tateandlyle.com/our-expertise/tate-lyle-ventures-what-we-do\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><a class=\"cite\" href=\"https://www.tateandlyle.com/news/tate-lyle-ventures-delivers-latest-exit-fund-i\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><\/td>\n<td>External<\/td>\n<td>Lumora exit 2015 <a class=\"cite\" href=\"https://www.tateandlyle.com/news/tate-lyle-ventures-delivers-latest-exit-fund-i\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><\/td>\n<td>Active per company site<\/td>\n<\/tr>\n<tr>\n<td>ADM Ventures<\/td>\n<td>CVC arm, VP Darren Streiler; collaboration with every startup \"mandatory\" <a class=\"cite\" href=\"https://www.bakingbusiness.com/articles/58234-adm-ventures-investing-in-its-vision-of-the-future\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a><\/td>\n<td>Not disclosed<\/td>\n<td>External<\/td>\n<td>Air Protein, Geltor, Perfect Day, Innovafeed among holdings <a class=\"cite\" href=\"https://www.bakingbusiness.com/articles/58234-adm-ventures-investing-in-its-vision-of-the-future\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a><\/td>\n<td>Active<\/td>\n<\/tr>\n<tr>\n<td>Cargill Ventures and Digital Business Studio<\/td>\n<td>Ventures centralised from four BUs in 2020 to 2021 under Erin VanLanduit with a ventures board of senior executives; Digital Business Studio about 100 people across Minneapolis, Singapore, India, Europe, modelled on \"skunk works\" <a class=\"cite\" href=\"https://agfundernews.com/cargill-restructures-corporate-venture-group-into-newly-centralized-unit\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a><a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><a class=\"cite\" href=\"https://www.farmprogress.com/technology/cargill-takes-startup-approach-to-new-ideas\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a><\/td>\n<td>Ventures: Series A and B, no deployment targets, 10 to 12 weeks to decision; Studio: Singapore studio with EDB targeting at least five startups in three years (2022) <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><a class=\"cite\" href=\"https://www.cargill.com/2022/cargill-launches-asia-pacific-digital-business-studio\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a><\/td>\n<td>Studio: in-house food scientists; Ventures: 80 per cent partnerships not acquisition targets <a class=\"cite\" href=\"https://www.farmprogress.com/technology/cargill-takes-startup-approach-to-new-ideas\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a><a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><\/td>\n<td>\"We already have nine of our projects that show positive revenue,\" Eric Parkin, Feb 2023 <a class=\"cite\" href=\"https://www.farmprogress.com/technology/cargill-takes-startup-approach-to-new-ideas\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>; about 30 portfolio companies <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><\/td>\n<td>Active<\/td>\n<\/tr>\n<tr>\n<td>M Ventures and Innovation Center (Merck KGaA)<\/td>\n<td>M Ventures (2009), EUR 400 million evergreen, about 50 active companies, around 10 new a year; Innovation Center accelerator in Darmstadt since 2015 <a class=\"cite\" href=\"https://www.nature.com/articles/d42473-020-00230-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><a class=\"cite\" href=\"https://www.emdgroup.com/en/news/accelerator-05-06-2019.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><\/td>\n<td>Accelerator: up to EUR 50k, 3 months, up to 12 startups; \"90% of the startups are either collaborating or in negotiations to partner with us\" (Michael Gamber) <a class=\"cite\" href=\"https://www.emdgroup.com/en/news/accelerator-05-06-2019.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><\/td>\n<td>External startups; spinoffs from Merck via M Ventures <a class=\"cite\" href=\"https://www.nature.com/articles/d42473-020-00230-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><\/td>\n<td>Spinoffs ObsEva, Prexton (acquired by Lundbeck) and others; EUR 400 million+ external financing raised <a class=\"cite\" href=\"https://www.nature.com/articles/d42473-020-00230-9\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><\/td>\n<td>Active<\/td>\n<\/tr>\n<tr>\n<td>Schneider Electric Business Incubation<\/td>\n<td>Internal incubation VP (Gregoire Viasnoff) using an external builder <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a><\/td>\n<td>\"Ideate, Incubate, Accelerate\" with 230+ customer interviews up front <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a><\/td>\n<td>Internal teams coached by an external venture builder<\/td>\n<td>Clipsal Solar, NaviX, eIQ Mobility (sold to NextEra 2020), Dash Energy <a class=\"cite\" href=\"https://www.innovationleader.com/topics/special-features/venture-studios-and-venture-builders/mach49-and-schneider-electric-building-a-growth-engine-for-clean-renewable-energy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a><\/td>\n<td>Active (2022)<\/td>\n<\/tr>\n<tr>\n<td>Bosch Business Innovations (Bosch)<\/td>\n<td>Separate from Bosch Ventures; led by Axel Deniz since Jan 2025 <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>Founder-led, founders above 70 per cent equity, Bosch minority; JV route for capital-intensive fields <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>Inherited 7 startups; two 2025 tests<\/td>\n<td>2025: 2 sold, 1 shut, 2 spun in, 2 carved out; target 15 to 20 ventures by 2030 <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<td>\"We only started two new projects this year, more like tests to see if you could do the venture building in-house. The answer is no.\" Axel Deniz, Dec 2025 <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<\/tr>\n<tr>\n<td>Leaps by Bayer<\/td>\n<td>Impact investment arm, head Jürgen Eckhardt <a class=\"cite\" href=\"https://www.fiercebiotech.com/biotech/leaping-forward-bayer-vc-arm-double-investment-pace-through-2024\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><\/td>\n<td>EUR 1.3 billion committed, further EUR 1.3 billion through 2024; \"fewer, but maybe bigger bets\" <a class=\"cite\" href=\"https://www.fiercebiotech.com/biotech/leaping-forward-bayer-vc-arm-double-investment-pace-through-2024\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><\/td>\n<td>External<\/td>\n<td>50+ companies; BlueRock acquired by Bayer <a class=\"cite\" href=\"https://www.fiercebiotech.com/biotech/leaping-forward-bayer-vc-arm-double-investment-pace-through-2024\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><\/td>\n<td>Active (2022 source)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Not found in public sources: a business-building unit at Kerry, Ingredion (Ingredion Ventures is a CVC arm that led Better Juice's Series A <a class=\"cite\" href=\"https://agfundernews.com/juice-with-up-to-80-less-sugar-ingredion-ventures-leads-series-a-at-israeli-foodtech-co-better-juice\" target=\"_blank\" rel=\"noopener\" title=\"Source 49\">49<\/a>), Novonesis, Corbion or Lonza; Darling Ingredients publishes no venture-unit structure. Rousselot's public innovation organisation is three application centres (Belgium, Brazil, China) and a science and innovation function under Elke De Clerck, Global Science and Innovation Director <a class=\"cite\" href=\"https://www.darlingii.com/rousselot/products/science\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a>. Bionova: no public source linking a venture named Bionova to Rousselot or Darling was found; treat everything about it as internal input.<\/p>", "title": "Reference models"}, {"full": "Governance patterns", "html": "<p>Across the sources, five patterns recur.<\/p>\n<p>Stage gates with evidence, not dates. Osterwalder's \"explore\" portfolio runs ideation, discovery (early customer interest), validation (proof customers will pay) and growth, separate from the \"exploit\" portfolio of existing businesses <a class=\"cite\" href=\"https://www.strategyzer.com/library/the-invincible-company-book-summary\" target=\"_blank\" rel=\"noopener\" title=\"Source 58\">58<\/a>. Strategyzer's funnel runs discovery, validation, acceleration, with continuation tied to accumulated evidence and most retirements in discovery <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>. ING's PACE runs five phases (discover, problem fit, solution fit, market fit, scaling) <a class=\"cite\" href=\"https://innov8rs.co/news/corporate-venture-building-the-practice/\" target=\"_blank\" rel=\"noopener\" title=\"Source 18\">18<\/a>. Chemovator used a two-step qualification, a three-month development phase and a 21-month build <a class=\"cite\" href=\"https://cen.acs.org/business/investment/Cultivating-entrepreneurs-inside-BASF/97/i25\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a>. Rita McGrath's rule: \"You should decide what success and failure would look like before you start a project\" and \"Fail fast... and fail cheaply, to contain your downside risk\" <a class=\"cite\" href=\"https://hbr.org/2011/04/failing-by-design\" target=\"_blank\" rel=\"noopener\" title=\"Source 51\">51<\/a>.<\/p>\n<p>Metered funding. McKinsey recommends tranched, milestone-based funding with nine-month targets broken into three-month deliverables and 30 to 50 per cent of business-case value targeted in the first 12 to 18 months <a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>. Pearson's product councils carry fixed ceilings (USD 0, 50k, 250k) per stage <a class=\"cite\" href=\"https://www.strategyzer.com/library/howtodeliverinnovationresults\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>. Chemovator released a first tranche on validation and expected external money at the end of the runway <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/incubator-capital-markets-standards/\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>.<\/p>\n<p>A small, senior venture board. BCG's model relies on \"small, senior investment committees\" and milestone reviews rather than weekly reporting <a class=\"cite\" href=\"https://www.bcg.com/publications/2022/corporate-venturing-models\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>. Cargill Ventures runs a ventures board of senior executives spanning technology, R&amp;D, corporate development and IP <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. Osterwalder and Viki list what such a board should see: \"Revenue Potential,\" \"Innovation Risk,\" \"Money Spent to Test,\" and \"Time Spent Testing\" <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>. McKinsey adds direct reporting to a C-level executive and isolation from day-to-day management <a class=\"cite\" href=\"https://www.mckinsey.com.br/our-insights/the-serial-builder-advantage-why-repeat-innovators-win\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/p>\n<p>Innovation accounting rather than P&amp;L. Toma and Gons (2022) classify portfolio bets by risk-adjusted value-to-cost ratio (dead horse below 1x, faster horse 1 to 2x, workhorse 2 to 10x, unicorn above 10x) plotted against venture-board confidence and maturity, and add strategic-alignment and market-size lenses <a class=\"cite\" href=\"https://ssir.org/books/excerpts/entry/analyzing_your_innovation_portfolio\" target=\"_blank\" rel=\"noopener\" title=\"Source 52\">52<\/a>. Etiemble's four exploration metrics are risk and uncertainty, potential, time spent and cost <a class=\"cite\" href=\"https://www.strategyzer.com/library/taking-the-guesswork-out-of-innovation\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a>. Osterwalder's 2017 warning stands: applying execution metrics to exploration \"often leads to killing the wrong ideas\" <a class=\"cite\" href=\"https://www.strategyzer.com/library/innovation-metrics-vs-execution-metrics\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a><a class=\"cite\" href=\"https://www.strategyzer.com/library/taking-the-guesswork-out-of-innovation\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a>.<\/p>\n<p>What a six-metric year-one set typically contains. Combining the sources above, year-one sets for a new unit tend to pair three leading measures (ideas screened and the intake conversion rate; experiments run and hypotheses retired per venture; money and time spent per stage against the ceiling) with three lagging ones (ventures passing each gate or killed, with time to kill; validated customer commitments such as paid pilots or letters of intent; risk-adjusted portfolio value against strategic fit). Sources agree that revenue should not be a year-one metric for discovery-stage work <a class=\"cite\" href=\"https://www.strategyzer.com/library/how-should-your-innovation-board-make-decisions\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a><a class=\"cite\" href=\"https://www.strategyzer.com/library/taking-the-guesswork-out-of-innovation\" target=\"_blank\" rel=\"noopener\" title=\"Source 53\">53<\/a><a class=\"cite\" href=\"https://www.strategyzer.com/library/innovation-metrics-vs-execution-metrics\" target=\"_blank\" rel=\"noopener\" title=\"Source 54\">54<\/a>; McKinsey's \"USD 10 million in 31 months\" is a scaling-stage number <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a>.<\/p>", "title": "Governance patterns"}, {"full": "Signals", "html": "<table>\n<thead>\n<tr>\n<th>Date<\/th>\n<th>Signal<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>25 Oct 2023<\/td>\n<td>Unilever folds The Uncovery incubator back into Beauty and Wellbeing under a 30-brand focus<\/td>\n<td>Beauty Independent <a class=\"cite\" href=\"https://www.beautyindependent.com/beauty-companies-close-in-house-brand-incubators-unilever-ipsy/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a><\/td>\n<\/tr>\n<tr>\n<td>29 Mar 2024<\/td>\n<td>AC Ventures, ZX Ventures and SAP.iO close; Verizon Ventures cut from 12+ to 4<\/td>\n<td>Global Venturing <a class=\"cite\" href=\"https://globalventuring.com/corporate/fundraising/ac-ventures-leads-cvc-unit-closures/\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a><\/td>\n<\/tr>\n<tr>\n<td>1 Jul 2024<\/td>\n<td>Evonik Creavis opens a Cambridge MA satellite for nucleic-acid medicines and life-science venturing<\/td>\n<td>Investment Monitor <a class=\"cite\" href=\"https://www.investmentmonitor.ai/news/evonik-creavis-opens-innovation-satellite-in-cambridge/\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><\/td>\n<\/tr>\n<tr>\n<td>17 Sep 2024<\/td>\n<td>Evonik sets EUR 1.5 billion additional-sales target by 2032 from three innovation growth areas<\/td>\n<td>Evonik <a class=\"cite\" href=\"https://www.evonik.com/en/news/press-releases/2024/09/evonik-aims-to-generate-additional-sales-with-new-innovation-strategy.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a><\/td>\n<\/tr>\n<tr>\n<td>17 Mar 2025<\/td>\n<td>Mars-owned foodspring (bought via Mars Edge, 2019) announces closure by 30 June 2025<\/td>\n<td>Just Food <a class=\"cite\" href=\"https://www.just-food.com/news/mars-backed-sports-nutrition-business-foodspring-to-cease-trading/\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><\/td>\n<\/tr>\n<tr>\n<td>12 May and 10 Dec 2025<\/td>\n<td>Darling and Tessenderlo agree, then sign, the Rousselot plus PB Leiner combination: Darling 85 per cent, Tessenderlo 15 per cent, about USD 1.5 billion revenue, 200,000 tonnes, close expected 2026; name reported as Nextida in May coverage<\/td>\n<td>Darling <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20251210-darling-ingredients-and-tessenderlo-group-sign-definitive-agreements-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 55\">55<\/a>; NutritionInsight <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-pb-leiner-darling-ingredients-tessenderlo.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 56\">56<\/a><a class=\"cite\" href=\"https://www.nutritioninsight.com/news/darling-ingredients-rousselot-tessenderlo-pbleiner-nextida.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 57\">57<\/a><\/td>\n<\/tr>\n<tr>\n<td>1 Jul 2025<\/td>\n<td>BASF closes Chemovator; portfolio to BASF Venture Capital<\/td>\n<td>Global Venturing <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>; IT Boltwise <a class=\"cite\" href=\"https://www.it-boltwise.de/basf-schliesst-chemovator-inkubator-im-zuge-von-umstrukturierungen.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 8\">8<\/a><\/td>\n<\/tr>\n<tr>\n<td>28 Oct 2025<\/td>\n<td>McKinsey 2025 survey: breakeven cost falls to USD 77 million; serial builders earn 1.9x per dollar<\/td>\n<td>McKinsey <a class=\"cite\" href=\"https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><\/td>\n<\/tr>\n<tr>\n<td>18 Dec 2025<\/td>\n<td>Bosch Business Innovations head says in-house venture building test answer \"is no\"; moves to founder-led and JV models<\/td>\n<td>Global Venturing <a class=\"cite\" href=\"https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><\/td>\n<\/tr>\n<tr>\n<td>17 Jun 2026<\/td>\n<td>PayPal pauses PayPal Ventures (80+ investments, USD 850 million across three funds) under new CEO<\/td>\n<td>TechCrunch <a class=\"cite\" href=\"https://techcrunch.com/2026/06/17/paypal-ventures-shutters-as-company-restructuring-continues/\" target=\"_blank\" rel=\"noopener\" title=\"Source 9\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td>28 Jul 2026<\/td>\n<td>Cargill Ventures signals renewed dealmaking; ventures board, 10 to 12 week decisions, no deployment targets<\/td>\n<td>AgFunderNews <a class=\"cite\" href=\"https://agfundernews.com/cargill-ventures-eyes-renewed-dealmaking-as-agrifoodtech-resets\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "title": "Signals"}], "soWhat": {"forRousselot": "RBB is chartered under Rousselot, and everything sits there while the PB Leiner perimeter is open. The eight design choices should be made at the 30 October session, not assumed in advance.", "forRousselotLinks": [{"anchor": "r8-o1", "go": "r8", "label": "Choice: Where RBB sits"}, {"anchor": "r8-inputs", "go": "r8", "label": "What we still need"}], "headline": "Several close reference units have closed or been folded back since 2023, so RBB's design choices are likely to matter more than its ambition for whether it lasts.", "next": "Gather the Bionova board records and stage decisions, since no public source exists and they ground the charter.", "nextLinks": [{"anchor": "r8-bionova", "go": "r8", "label": "Bionova learnings"}, {"anchor": "r8-inputs", "go": "r8", "label": "What we still need"}], "options": [{"soWhat": "RBB is chartered under Rousselot; the choice is where inside it. A home in science and innovation keeps it alive but tilts it technical; a standalone executive-level unit is more visible but exposed to cost-cutting.", "title": "Where RBB sits"}, {"soWhat": "One route is to release money in small, published stages as evidence comes in, rather than a fixed annual budget. This could show discipline within a quarter; co-investment with partners could cover anything needing plant capacity or Sonac's territory.", "title": "Funding model"}, {"soWhat": "A lighter start could be a one-page intake form, a 30-day answer and fixed protected time for scientists, rather than an open call. It is likely cheaper and closer to how scientists work, but takes some lab capacity.", "title": "Idea intake"}, {"soWhat": "Naming all five routes (build, partner, license, acquire, spin out) as legitimate exits from validation is one option. This would keep in-house build from becoming the default, at the cost of more legal and governance work.", "title": "Build route"}, {"soWhat": "One workable shape is three discovery-stage ventures at once, two close to the core and one further out, with a quarterly kill point. A single venture behaves more like a project than a unit; more than three may stretch a small team.", "title": "Portfolio shape and ambition mix"}, {"soWhat": "One option is a four-person board meeting quarterly to decide stage moves and kills, with the unit lead holding spend authority up to the discovery ceiling. Whether Sonac or Darling should hold a seat is still unresolved.", "title": "Governance body"}, {"soWhat": "One set to consider is six measures: five that show discipline and one auditable outcome, validated customer commitments such as paid pilots. Leaving revenue out of year one would avoid judging the first review on luck.", "title": "Metrics"}, {"soWhat": "A possible year-one team: the unit lead, one commercial or venture lead, two scientists on protected time and an external builder on method. Hiring a dedicated builder per venture before validation can bring pay outside the grid and HR friction.", "title": "Staffing"}], "takeaways": [{"links": [{"anchor": "r8-scan-1", "go": "r8", "label": "Scan: Trends"}, {"anchor": "r8-scan-3", "go": "r8", "label": "Scan: Reference models"}, {"label": "[1] mckinsey.com", "title": "\"Building new businesses: CEOs' choice for growth\", McKinsey, 9 November 2023. https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/ceos-choice-for-growth-building-new-businesses", "url": "https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/ceos-choice-for-growth-building-new-businesses"}, {"label": "[2] mckinsey.com", "title": "\"How CEOs are turning corporate venture building into outsize growth\", McKinsey, October 2024. https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth", "url": "https://www.mckinsey.com/capabilities/business-building/our-insights/how-ceos-are-turning-corporate-venture-building-into-outsize-growth"}, {"label": "[3] mckinsey.com", "title": "\"The way to win in corporate venturing: Serial building and AI\", Aminetzah, Bello, Königsfeld, Jenkins, McKinsey, 28 October 2025. https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai", "url": "https://www.mckinsey.com/capabilities/business-building/our-insights/the-way-to-win-in-corporate-venturing-serial-building-and-ai"}], "text": "The field has moved from labs and corporate venture funds to small business-building units with staged funding and executive reporting."}, {"links": [{"anchor": "r8-scan-3", "go": "r8", "label": "Scan: Reference models"}, {"anchor": "r8-o4", "go": "r8", "label": "Choice: Build route"}, {"label": "[7] globalventuring.com", "title": "\"Chemicals maker BASF shuts down startup incubation arm\", Global Venturing, 1 July 2025. https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/", "url": "https://globalventuring.com/corporate/europe/chemicals-giant-basf-shuts-down-its-startup-incubation-arm/"}, {"label": "[8] it-boltwise.de", "title": "\"BASF schließt Chemovator-Inkubator im Zuge von Umstrukturierungen\", IT Boltwise, July 2025. https://www.it-boltwise.de/basf-schliesst-chemovator-inkubator-im-zuge-von-umstrukturierungen.html", "url": "https://www.it-boltwise.de/basf-schliesst-chemovator-inkubator-im-zuge-von-umstrukturierungen.html"}, {"label": "[48] globalventuring.com", "title": "\"Bosch plans to build up to 20 new startups in the next four years\", Global Venturing, 18 December 2025. https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/", "url": "https://globalventuring.com/corporate/europe/bosch-plans-to-build-up-to-20-new-startups-in-the-next-four-years/"}], "text": "BASF closed its Chemovator incubator on 1 July 2025; Bosch's unit head said of in-house venture building: \"Th
