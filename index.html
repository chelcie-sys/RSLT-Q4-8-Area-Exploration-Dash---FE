ranslations/en/renditions/native", "url": "https://ec.europa.eu/docsroom/documents/58054/attachments/1/translations/en/renditions/native"}, {"n": 64, "text": "Beiersdorf selects SymSitive for new Eucerin ranges, Cosmetics Business, 26 September 2014, https://www.cosmeticsbusiness.com/beiersdorf-selects-symsitive-for-new-eucerin-ranges-101864", "url": "https://www.cosmeticsbusiness.com/beiersdorf-selects-symsitive-for-new-eucerin-ranges-101864"}, {"n": 65, "text": "Mohd F et al., Contribution of the Hair Follicular Pathway to Total Skin Permeation, Pharmaceutics, 2016, https://pmc.ncbi.nlm.nih.gov/articles/PMC5198016", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5198016"}, {"n": 66, "text": "Givaudan to acquire portfolio of cosmetic ingredients from Amyris and establish strategic partnership, PR Newswire via TipRanks, 22 February 2023, https://www.tipranks.com/news/press-releases/givaudan-to-acquire-portfolio-of-major-cosmetic-ingredients-from-amyris-and-to-establish-strategic-partnership-for-natural-sustainably-sourced-ingredients-for-the-beauty-industry", "url": "https://www.tipranks.com/news/press-releases/givaudan-to-acquire-portfolio-of-major-cosmetic-ingredients-from-amyris-and-to-establish-strategic-partnership-for-natural-sustainably-sourced-ingredients-for-the-beauty-industry"}, {"n": 67, "text": "Renovo stock demolished by Juvista trial failure, PharmaTimes, February 2011, https://pharmatimes.com/news/renovo_stock_demolished_by_justiva_trial_failure_979597/", "url": "https://pharmatimes.com/news/renovo_stock_demolished_by_justiva_trial_failure_979597/"}, {"n": 69, "text": "Bos JD, Meinardi MM, The 500 Dalton rule for skin penetration, Exp Dermatol 9:165, 2000, https://doi.org/10.1034/j.1600-0625.2000.009003165.x", "url": "https://doi.org/10.1034/j.1600-0625.2000.009003165.x"}, {"n": 70, "text": "EP4498839B1, Rousselot BV, Hydrolysed collagen for use in ameliorating hyperglycaemia (Nextida GC), Google Patents, https://patents.google.com/patent/EP4498839B1/en", "url": "https://patents.google.com/patent/EP4498839B1/en"}, {"n": 71, "text": "US 2021/0228675, Fukuoka University and Nitta Gelatin, Hypertrophic scar inhibiting composition, 2021, Justia, https://patents.justia.com/patent/20210228675", "url": "https://patents.justia.com/patent/20210228675"}]}, {"code": "R5", "engine": "Add more", "engine_long": "Build what pays tomorrow", "extras": [], "internal": "<ol>\n<li>Remit settled (2 October 2026): free rein for Rousselot, coordinated with Sonac. Still open: the coordination mechanism, i.e. how shared pet-food customers are handled, what Hydro-P Premium sells and to whom, and whether Sonac positions it as a joint active or a protein. Who holds it: Sonac commercial lead for pet food; Jeroen for the group view.<\/li>\n<li>Ownership and status of the Utrecht canine OA programme (Blees, Tryfonidou, Corbee) and Janne Prawitt's role: is the data Sonac's, Darling R&amp;D's, or shareable with Rousselot? Who: Janne Prawitt (Rousselot BV, Ghent); Esther Prevo (Darling Ingredients R&amp;D).<\/li>\n<li>Whether the Colartix patent family (EP4465823B1 and counterparts) covers veterinary or animal use, and whether a canine dose is within claims. Who: Rousselot IP counsel.<\/li>\n<li>PB Leiner perimeter: not settled. For now pet applications sit within Rousselot; whether they move into the combined company after closing is open. Who: Jeroen; integration lead.<\/li>\n<li>Cost of goods for a canine dose of Peptan and Colartix versus Sonac's Hydro-P Premium. Who: Praneeth (sizing) and the Ghent applications lab.<\/li>\n<li>Any existing Rousselot sales into pet food or pet supplement customers today (volumes, customers), to establish whether the \"unspoken boundary\" is already crossed in practice. Who: Rousselot commercial, Europe.<\/li>\n<\/ol>", "mapIntro": "<p>Ranked by potential for Rousselot. What differs from the human playbook is stated inside each entry.<\/p>", "name": "Pet and animal health", "oneLine": "<p>Pet joint health is the one arena where Rousselot's human joint science (Colartix, Peptan) maps almost one to one onto a paying, growing, premium category, but the scan shows the territory is not empty inside Darling: Sonac already sells a hydrolysed collagen for pet food (Hydro-P Premium), Darling is funding a canine osteoarthritis programme at Utrecht, and a Rousselot scientist co-authored the 2025 review that frames it. That question is now settled: as of 2 October 2026 Rousselot has free rein in pet and animal health, coordinated with Sonac, with the coordination mechanism still to be defined. The working question becomes where a vet-grade, clinically substantiated outcome tier sits next to Sonac's pet-food-ingredient business, and how shared customers and the Utrecht data are handled. The playbook differs from human health in three ways that matter: the claims regime is feed law, not food law; the veterinarian is the gatekeeper; and dosing, palatability and species (dog, cat, horse) change the product.<\/p>", "options": [], "order": 5, "scan": [{"full": "Trends (what is shifting, with dates)", "html": "<p>Pet spending keeps growing but has shifted from discretionary to essential care: APPA puts US pet spend at USD 158bn in 2025 (+3.7%), USD 165bn forecast for 2026, with 22% of owners spending less in 2025 <a class=\"cite\" href=\"https://www.petage.com/appa-pet-industry-2025/\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-food-market/market-trends-and-reports/news/15825309/us-pet-industry-hits-158-billion-in-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a>. Supplements have slowed with it: Packaged Facts reports USD 2.9bn in 2025, growth under 3%, and \"competition from functional pet foods and treats along condition-specific lines\" <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.freedoniagroup.com/packaged-facts/pet-supplements-in-the-us\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a>. Hip and joint remains the most purchased segment (15 to 25% of a USD 5.4 to 5.6bn US pet wellness pool, L.E.K., June 2026) and online takes 65 to 70% of spend <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>. The vet-channel pharma alternative has wobbled: Zoetis reported a decline in its OA antibodies Librela and Solensia through 2025 after a US label update in February 2025 <a class=\"cite\" href=\"https://news.zoetis.com/press-releases/press-release-details/2026/Zoetis-Reports-Fourth-Quarter-and-Full-Year-2025-Results/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><a class=\"cite\" href=\"https://finance.yahoo.com/news/zoetis-lifts-outlook-companion-animal-145009170.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a><a class=\"cite\" href=\"https://investor.zoetis.com/news/news-details/2025/Zoetis-Announces-U.S.-Label-Update-for-Librela-bedinvetmab-injection-a-Treatment-to-Control-Canine-Osteoarthritis-OA-Pain-2025-iu22I1cCqp/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>. In Europe, FEDIAF values pet food at EUR 29.3bn (2023 data), with treats taking 24% of dog food value on 9% of volume, which is where functional ingredients get paid for <a class=\"cite\" href=\"https://europeanpetfood.org/_/news/fediaf-publishes-2025-facts-and-figures/\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/19391-fediaf-thriving-pet-ownership-fuels-337-billion-european-pet-food-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>. Collagen hydrolysate is moving from protein filler to studied joint active: a 2024 placebo-controlled dog trial (Gelita's Petagile) and a 2025 Utrecht review set the evidence bar <a class=\"cite\" href=\"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://api.crossref.org/works/10.1111/jpn.14076\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. US regulation is tightening: NASC extended its Quality Seal to treats (April 2026) and is pushing an Animal Health Supplement Act to give FDA CVM a formal remit (June 2026) <a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-supplements-pro/nasc-news/news/15817138/nasc-expands-quality-seal-program-to-include-pet-treats\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/06/08/nasc-pushes-animal-health-supplement-act-to-modernize-oversight/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>.<\/p>", "title": "Trends (what is shifting, with dates)"}, {"full": "Size and growth", "html": "<table>\n<thead>\n<tr>\n<th>Figure<\/th>\n<th>Value<\/th>\n<th>Scope and year<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>US pet industry spend<\/td>\n<td>USD 158bn (+3.7%); USD 165bn forecast 2026<\/td>\n<td>US, 2025, APPA<\/td>\n<td><a class=\"cite\" href=\"https://www.petage.com/appa-pet-industry-2025/\" target=\"_blank\" rel=\"noopener\" title=\"Source 20\">20<\/a><a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-food-market/market-trends-and-reports/news/15825309/us-pet-industry-hits-158-billion-in-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 21\">21<\/a><\/td>\n<\/tr>\n<tr>\n<td>US pet supplements<\/td>\n<td>USD 2.9bn; growth under 3%<\/td>\n<td>US retail, 2025, Packaged Facts 11th ed.<\/td>\n<td><a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.freedoniagroup.com/packaged-facts/pet-supplements-in-the-us\" target=\"_blank\" rel=\"noopener\" title=\"Source 23\">23<\/a><\/td>\n<\/tr>\n<tr>\n<td>US pet supplements (earlier)<\/td>\n<td>USD 2.7bn+; dogs 77%, cats 21%<\/td>\n<td>US, 2024, Packaged Facts<\/td>\n<td><a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><\/td>\n<\/tr>\n<tr>\n<td>US pet wellness (supplements plus adjacent)<\/td>\n<td>USD 5.4 to 5.6bn; 14 to 15% CAGR 2019 to 2025; hip and joint 15 to 25%<\/td>\n<td>US, 2025, L.E.K. at NASC conference<\/td>\n<td><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a><\/td>\n<\/tr>\n<tr>\n<td>Dog supplements<\/td>\n<td>USD 3bn+; online 70%+<\/td>\n<td>US, 2026, Cascadia Capital (investment bank note, medium trust)<\/td>\n<td><a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-supplements-pro/pet-supplements-and-treats-digest/news/15829540/healthspan-focus-drives-pet-supplements-growth-report-finds\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a><\/td>\n<\/tr>\n<tr>\n<td>Global pet supplements<\/td>\n<td>USD 2.76bn 2025 to USD 4.65bn 2033<\/td>\n<td>Global, Grand View via NutraIngredients (paid research, low trust)<\/td>\n<td><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/06/08/nasc-pushes-animal-health-supplement-act-to-modernize-oversight/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a><\/td>\n<\/tr>\n<tr>\n<td>European pet food<\/td>\n<td>EUR 29.3bn (USD 33.7bn); 139m pet-owning households<\/td>\n<td>41 countries, 2023 data, FEDIAF<\/td>\n<td><a class=\"cite\" href=\"https://europeanpetfood.org/_/news/fediaf-publishes-2025-facts-and-figures/\" target=\"_blank\" rel=\"noopener\" title=\"Source 46\">46<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/19391-fediaf-thriving-pet-ownership-fuels-337-billion-european-pet-food-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a><\/td>\n<\/tr>\n<tr>\n<td>Darling Feed segment (includes Sonac pet food ingredients)<\/td>\n<td>USD 3.99bn net sales (65% of group)<\/td>\n<td>FY ended 3 Jan 2026, 10-K<\/td>\n<td><a class=\"cite\" href=\"https://d18rn0p25nwr6d.cloudfront.net/CIK-0000916540/97f259dc-d3c0-40b5-bb65-98f842f835e7.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a><\/td>\n<\/tr>\n<tr>\n<td>Darling Food segment (Rousselot)<\/td>\n<td>USD 1.55bn net sales (25% of group)<\/td>\n<td>FY ended 3 Jan 2026, 10-K<\/td>\n<td><a class=\"cite\" href=\"https://d18rn0p25nwr6d.cloudfront.net/CIK-0000916540/97f259dc-d3c0-40b5-bb65-98f842f835e7.pdf\" target=\"_blank\" rel=\"noopener\" title=\"Source 6\">6<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>No reliable public figure was found for the pet joint-health ingredient market, for the European pet supplement market, or for collagen volumes sold into pet food. The battlefield report's \"USD 50bn+ veterinary market\" for F1 refers to the wider veterinary market and was not confirmed by the sources opened here; the directly addressable supplement pool is USD 3 to 6bn in the US depending on definition <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>.<\/p>", "title": "Size and growth"}, {"full": "Players", "html": "<p>Ingredient suppliers: Gelita sells Petagile (collagen peptides for dogs, cats and horses) plus a pet-food gelatin and protein range, and funded the 2024 LMU Munich trial <a class=\"cite\" href=\"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a><a class=\"cite\" href=\"https://www.gelita.com/en/news/new-study-confirms-petagiles-benefits-dogs-osteoarthritis\" target=\"_blank\" rel=\"noopener\" title=\"Source 17\">17<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/15731-gelita-to-showcase-protein-collagen-ingredients-at-interzoo\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a>. Sonac (Darling) sells Hydro-P Premium, a hydrolysed collagen for pet food described as \"natural, high-purity and hypoallergenic food-grade\" with joint positioning, and lists a \"research collaboration with the University of Utrecht investigating the effect of collagen hydrolysates such as Hydro-P Premium on joint health of dogs\" <a class=\"cite\" href=\"https://www.knowde.com/stores/sonac\" target=\"_blank\" rel=\"noopener\" title=\"Source 11\">11<\/a><a class=\"cite\" href=\"https://www.darlingii.com/sonac/research\" target=\"_blank\" rel=\"noopener\" title=\"Source 14\">14<\/a>. Rousselot's public Peptan and Colartix pages carry no pet or veterinary positioning <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-collagen-peptides-glp1-companion-products.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 1\">1<\/a><a class=\"cite\" href=\"https://www.darlingii.com/rousselot/brands/peptan\" target=\"_blank\" rel=\"noopener\" title=\"Source 2\">2<\/a><a class=\"cite\" href=\"https://www.darlingii.com/rousselot/brands/colartix\" target=\"_blank\" rel=\"noopener\" title=\"Source 3\">3<\/a><a class=\"cite\" href=\"https://peptan.com/keep-mobile\" target=\"_blank\" rel=\"noopener\" title=\"Source 4\">4<\/a>; its only public footprint in canine OA is Janne Prawitt (Rousselot BV, Ghent) as co-author of the 2025 Utrecht review <a class=\"cite\" href=\"https://api.crossref.org/works/10.1111/jpn.14076\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. Branded supplements: Nutramax (Dasuquin, \"#1 Joint Health Supplement BRAND Recommended By Veterinarians\", vet-exclusive Advanced line; Cosequin for dogs, cats and horses), built on glucosamine, chondroitin and ASU, no collagen listed <a class=\"cite\" href=\"https://www.dasuquin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://www.cosequin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>; Zesty Paws (H&amp;H Group, 20,000+ North American doors, +12.8% in 2025) <a class=\"cite\" href=\"https://www.hh.global/news/h-and-h-reports-growth-in-2025-annual-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>; PetLab Co (DTC, BC Partners majority stake, February 2025) <a class=\"cite\" href=\"https://www.bcpartners.com/news/bc-partners-acquires-a-majority-stake-in-premium-animal-health-brand-petlab-co/\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>; Fera Pets (General Mills) <a class=\"cite\" href=\"https://www.fooddive.com/news/general-mills-pet-supplements-fera-pets-equity-fund-launch-investment/699384/\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; YuMOVE (Lintbells, bought by Vetnique Labs, July 2024) <a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-food-market/article/15710718/pet-industry-mas-set-to-surge-in-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>. Majors: Mars Petcare (about USD 20bn, owner of Banfield, VCA, BluePearl) <a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-food-market/market-trends-and-reports/news/15705100/mars-petcare-investing-us1-billion-in-online-presence-ai\" target=\"_blank\" rel=\"noopener\" title=\"Source 31\">31<\/a>, Nestle Purina (CHF 19bn) <a class=\"cite\" href=\"https://fortune.com/europe/2025/02/11/nestle-purina-petcare-pet-foods-big-bets/\" target=\"_blank\" rel=\"noopener\" title=\"Source 32\">32<\/a>; Affinity Petcare's Advance Veterinary Diets Articular Care is a dietetic kibble with 2.5% hydrolysed collagen at EUR 6.54/kg <a class=\"cite\" href=\"https://www.zooplus.com/shop/dogs/dry_dog_food/advance_vet_diets/1583029\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a>. Pharma: Zoetis (USD 9.5bn 2025) with Librela, almost 25 million doses by December 2024 <a class=\"cite\" href=\"https://news.zoetis.com/press-releases/press-release-details/2026/Zoetis-Reports-Fourth-Quarter-and-Full-Year-2025-Results/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><a class=\"cite\" href=\"https://investor.zoetis.com/news/news-details/2025/Zoetis-Announces-U.S.-Label-Update-for-Librela-bedinvetmab-injection-a-Treatment-to-Control-Canine-Osteoarthritis-OA-Pain-2025-iu22I1cCqp/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>.<\/p>", "title": "Players"}, {"full": "Regulation", "html": "<p>EU: pet food is feed. Regulation (EC) 767/2009 Article 13 allows claims that are \"objective, verifiable by the competent authorities and understandable by the user\" and substantiated at placing on the market, and prohibits any claim that feed will \"prevent, treat or cure a disease\" <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02009R0767-20181226\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>. Supplements are complementary feed; dietetic foods must match an intended use in Regulation (EU) 2020/354, whose entry 27, \"support of the metabolism of joints in the case of osteoarthritis\", is defined by omega-3, EPA/DHA and vitamin E, not collagen, with a 3-month initial period and veterinary advice <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02020R0354-20250422\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>. Collagen hydrolysate therefore enters as a feed material, not an authorised additive under Regulation (EC) 1831/2003, with no equivalent of a human health claim <a class=\"cite\" href=\"https://www.petfoodindustry.com/safety-quality/pet-food-regulations/article/15749196/31-laws-and-rules-for-pet-food-production-in-europe\" target=\"_blank\" rel=\"noopener\" title=\"Source 45\">45<\/a>. US: there is no DSHEA for animals; AAFCO states that distributing human-style supplements for animals \"is contrary to animal-feed regulations\" and that disease claims \"are drug indications\" <a class=\"cite\" href=\"https://www.aafco.org/consumers/understanding-pet-food/supplements/\" target=\"_blank\" rel=\"noopener\" title=\"Source 42\">42<\/a>. The category runs on FDA CVM enforcement discretion plus the NASC Quality Seal (third-party audit; dogs, cats, horses), extended to treats in April 2026, with a proposed Animal Health Supplement Act of 2026 to formalise FDA oversight, GMPs and safety notification for new ingredients <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/06/08/nasc-pushes-animal-health-supplement-act-to-modernize-oversight/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a><a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-supplements-pro/nasc-news/news/15817138/nasc-expands-quality-seal-program-to-include-pet-treats\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><a class=\"cite\" href=\"https://nasc.cc/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>.<\/p>", "title": "Regulation"}, {"full": "Signals (dated)", "html": "<ol>\n<li>27 Nov 2024 (online): Utrecht and LMU authors with Janne Prawitt of Rousselot BV publish \"Collagen Hydrolysates as Nutritional Support in Canine Osteoarthritis: A Narrative Review\", concluding the evidence suggests reduced lameness but lacks standardised dosing and validated outcomes <a class=\"cite\" href=\"https://api.crossref.org/works/10.1111/jpn.14076\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>.<\/li>\n<li>19 Sep 2024: PLOS One publishes a double-blind, placebo-controlled 12-week trial of Gelita's Petagile in dogs with OA (41 enrolled, 31 completed; 240 mg/kg/day); only the collagen arm improved force-plate gait and CBPI quality of life; Gelita funded it <a class=\"cite\" href=\"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>.<\/li>\n<li>15 Apr 2025: Niels Blees (Utrecht, Sonac) describes an ongoing Darling-sponsored beagle study of Hydro-P Premium in kibble, running since 2021 <a class=\"cite\" href=\"https://globalpetindustry.com/article/the-effects-of-collagen-hydrolysate-in-dogs-with-osteoarthritis/\" target=\"_blank\" rel=\"noopener\" title=\"Source 13\">13<\/a>.<\/li>\n<li>12 May 2025: Darling and Tessenderlo agree to combine Rousselot and PB Leiner into \"Nextida\" (85/15), about USD 1.5bn revenue, 23 plants; the release mentions no animal applications <a class=\"cite\" href=\"https://www.darlingii.com/media/news/20250512-darling-ingredients-and-tessenderlo-group-agree-to-form-new-company\" target=\"_blank\" rel=\"noopener\" title=\"Source 7\">7<\/a>.<\/li>\n<li>2 Sep 2025: Rousselot is granted Colartix patents in Europe, Japan and China for a \"collagen hydrolysate composition for reducing joint pain after exercise\"; US and Brazil pending <a class=\"cite\" href=\"https://www.nutritioninsight.com/news/rousselot-joint-health-patents-granted.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 5\">5<\/a>.<\/li>\n<li>12 Feb 2026: Zoetis FY2025 results note a decline in Librela and Solensia in the US, after a February 2025 label update <a class=\"cite\" href=\"https://news.zoetis.com/press-releases/press-release-details/2026/Zoetis-Reports-Fourth-Quarter-and-Full-Year-2025-Results/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><a class=\"cite\" href=\"https://investor.zoetis.com/news/news-details/2025/Zoetis-Announces-U.S.-Label-Update-for-Librela-bedinvetmab-injection-a-Treatment-to-Control-Canine-Osteoarthritis-OA-Pain-2025-iu22I1cCqp/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 35\">35<\/a>.<\/li>\n<li>18 Mar 2026: Packaged Facts puts US pet supplements at USD 2.9bn with growth under 3% and functional foods and treats cannibalising supplements <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>.<\/li>\n<li>10 Apr and 8 Jun 2026: NASC extends its seal to treats and lobbies for the Animal Health Supplement Act; Bill Bookout, NASC President: \"You can't have a dual purpose product.\" <a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-supplements-pro/nasc-news/news/15817138/nasc-expands-quality-seal-program-to-include-pet-treats\" target=\"_blank\" rel=\"noopener\" title=\"Source 40\">40<\/a><a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/06/08/nasc-pushes-animal-health-supplement-act-to-modernize-oversight/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a><\/li>\n<\/ol>", "title": "Signals (dated)"}], "soWhat": {"forRousselot": "With the remit settled, the choice is where a vet-grade, clinically backed tier sits next to Sonac's Hydro-P Premium. How shared customers and the Utrecht data are handled should be agreed early.", "forRousselotLinks": [{"anchor": "r5-summary", "go": "r5", "label": "Full summary"}, {"anchor": "r5-inputs", "go": "r5", "label": "What we still need"}], "headline": "Pet joint health looks like the closest fit for Rousselot's human joint science, and Rousselot now has free rein, coordinated with Sonac.", "next": "Establish who owns the Utrecht canine joint data, and cost a canine dose of Colartix and Peptan against Hydro-P Premium.", "nextLinks": [{"anchor": "r5-s1", "go": "r5", "label": "Space 1: Vet-grade collagen backed by dog trials"}, {"anchor": "r5-inputs", "go": "r5", "label": "What we still need"}], "takeaways": [{"links": [{"anchor": "r5-scan-1", "go": "r5", "label": "Scan: Trends"}, {"anchor": "r5-s1", "go": "r5", "label": "Space 1: Vet-grade collagen backed by dog trials"}, {"label": "[24] petfoodindustry.com", "title": "U.S. pet supplement market surpasses $2.7B, Petfood Industry, 24 Sep 2024, https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends", "url": "https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends"}, {"label": "[25] petfoodprocessing.net", "title": "NASC conference report: Trends fueling pet supplement growth (L.E.K. Consulting data), Petfood Processing, 4 Jun 2026, https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth", "url": "https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth"}], "text": "Hip and joint is the top US pet supplement segment: 15 to 25% of a USD 5.4 to 5.6bn wellness pool."}, {"links": [{"anchor": "r5-scan-5", "go": "r5", "label": "Scan: Signals"}, {"anchor": "r5-s1", "go": "r5", "label": "Space 1: Vet-grade collagen backed by dog trials"}, {"label": "[16] journals.plos.org", "title": "Dobenecker et al., The oral intake of specific Bioactive Collagen Peptides (BCP) improves gait and quality of life in canine osteoarthritis patients, PLOS One, 19 Sep 2024, https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378", "url": "https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378"}], "text": "We found only one placebo-controlled dog trial, funded by Gelita: 41 dogs enrolled, 31 completed. We found no company with a full evidence dossier."}, {"links": [{"anchor": "r5-scan-4", "go": "r5", "label": "Scan: Regulation"}, {"anchor": "r5-s5", "go": "r5", "label": "Space 5: Supply shocks in animal collagen"}, {"label": "[42] aafco.org", "title": "Supplements, AAFCO (Understanding Pet Food), accessed 1 Oct 2026, https://www.aafco.org/consumers/understanding-pet-food/supplements/", "url": "https://www.aafco.org/consumers/understanding-pet-food/supplements/"}, {"label": "[44] eur-lex.europa.eu", "title": "Regulation (EC) No 767/2009 on the placing on the market and use of feed, consolidated text, EUR-Lex, https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02009R0767-20181226", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02009R0767-20181226"}, {"label": "[43] eur-lex.europa.eu", "title": "Commission Regulation (EU) 2020/354, consolidated text of 22 Apr 2025, EUR-Lex, https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02020R0354-20250422", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02020R0354-20250422"}], "text": "Pet food falls under feed law: no disease claims, no health-claim prize, and vets decide which brands get recommended."}], "watchOut": "The one trial dosed dogs at 240 mg/kg, roughly 15 times human per-kilo intake, so the economics may not work.", "watchOutLinks": [{"anchor": "r5-s5", "go": "r5", "label": "Space 5: Supply shocks in animal collagen"}, {"anchor": "r5-scan-5", "go": "r5", "label": "Scan: Signals"}, {"label": "[16] journals.plos.org", "title": "Dobenecker et al., The oral intake of specific Bioactive Collagen Peptides (BCP) improves gait and quality of life in canine osteoarthritis patients, PLOS One, 19 Sep 2024, https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378", "url": "https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378"}]}, "sourceNote": "", "updatedAt": "2026-10-01", "spaces": [{"area": "R5", "arena": "Animal and vet health", "cell": "Animal and vet health x Products to Outcomes", "fields": {"evidence": "<p>Hip and joint is the top-purchased supplement segment (15 to 25% of a USD 5.4 to 5.6bn US wellness pool) <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>. The one published RCT is Gelita's, 41 dogs enrolled and 31 completing, funded by Gelita <a class=\"cite\" href=\"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>. The Utrecht review, co-authored by Rousselot, states the gaps: no standardised dosing, no validated outcome measures <a class=\"cite\" href=\"https://api.crossref.org/works/10.1111/jpn.14076\" target=\"_blank\" rel=\"noopener\" title=\"Source 15\">15<\/a>. Nutramax's leadership rests on \"recommended by veterinarians\", not on collagen <a class=\"cite\" href=\"https://www.dasuquin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://www.cosequin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>. Zoetis's mAb decline <a class=\"cite\" href=\"https://news.zoetis.com/press-releases/press-release-details/2026/Zoetis-Reports-Fourth-Quarter-and-Full-Year-2025-Results/default.aspx\" target=\"_blank\" rel=\"noopener\" title=\"Source 33\">33<\/a><a class=\"cite\" href=\"https://finance.yahoo.com/news/zoetis-lifts-outlook-companion-animal-145009170.html\" target=\"_blank\" rel=\"noopener\" title=\"Source 34\">34<\/a> may indicate vets and owners are looking for alternatives alongside pharma (Limineer inference; the sources report the decline, not the reason). On the native side the file is further along: Lonza Capsugel says UC-II undenatured type II collagen has 10 peer-reviewed publications in companion animals, cites a 40 mg a day dose for UC-II Pets and launched UC-FLEX, a UC-II blend for pet food makers, in April 2026, though the dog study it names is exploratory <a href=\"https://www.capsugel.com/news/lonza-capsugel-launch-uc-flex-collagen\" target=\"_blank\" rel=\"noopener\">Lonza Capsugel, 16 April 2026<\/a>; Native Pet, in more than 13,000 retail locations, launched a UC-II dog joint powder in June 2026 <a href=\"https://www.prnewswire.com/news-releases/native-pet-launches-hipjoint-advanced-care-targeting-innovation-gap-in-512m-joint-supplement-category-302795706.html\" target=\"_blank\" rel=\"noopener\">Native Pet via PR Newswire, 10 June 2026<\/a>.<\/p>", "first": "<p>Ask Janne Prawitt and the Utrecht team to table what the Hydro-P Premium programme has measured and who owns the data; cost a canine dose of Colartix against Petagile's published dose; run one palatability and dose-finding study in a contract kennel.<\/p>", "magnitude": "<p>Addressable pool is the US supplement market (USD 2.9bn) plus functional treats and vet diets; the joint slice is roughly USD 0.8 to 1.4bn in the US on L.E.K. shares <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>. Europe not sizeable from public data.<\/p>", "tension": "<p>The loser believes pet collagen is a protein line item in kibble, sold on cost per tonne and \"hypoallergenic\" labels. The winner sees that the joint category is already the biggest supplement segment and that the only ingredients a veterinarian will recommend are those with placebo-controlled dog data; Gelita has one hydrolysate trial and nobody has a hydrolysate dossier, while Lonza is already building one for native type II collagen (UC-II) at a 40 mg dose and selling it into pet food.<\/p>", "uncertainties": "<p>Whether Colartix (type II collagen plus chondroitin, 1 g human dose) transfers to a 240 mg/kg canine dose economically; whether the Utrecht beagle trial is Sonac's asset or Darling's; whether vets will carry a non-pharma brand; what the 2020/354 route offers when entry 27 is omega-3 based. Whether a gram-dose hydrolysate can compete on cost and chew size with a 40 mg native type II dose that already has its own canine publications.<\/p>"}, "lastChange": "R5-1: record that native type II collagen (Lonza UC-II) already has a canine evidence file and pet food format, and narrow the gap claim to hydrolysates (accepted 2026-10-09)", "name": "a vet-grade collagen tier with canine outcome data", "other": [], "rank": 1, "shortName": "Vet-grade collagen backed by dog trials", "soWhat": "Vets back joint products with dog data. Lonza's native type II collagen is already building that file in pet food; no hydrolysed collagen has one yet, so the window for a proven hydrolysate tier may be narrowing.", "threshold": "Products to Outcomes", "updatedAt": "2026-10-09", "verdict": "Lead"}, {"area": "R5", "arena": "Animal and vet health", "cell": "Animal and vet health x Ingredients to Ecosystems", "fields": {"evidence": "<p>BC Partners took a majority of PetLab Co (DTC, London) in February 2025 <a class=\"cite\" href=\"https://www.bcpartners.com/news/bc-partners-acquires-a-majority-stake-in-premium-animal-health-brand-petlab-co/\" target=\"_blank\" rel=\"noopener\" title=\"Source 28\">28<\/a>; General Mills bought Fera Pets <a class=\"cite\" href=\"https://www.fooddive.com/news/general-mills-pet-supplements-fera-pets-equity-fund-launch-investment/699384/\" target=\"_blank\" rel=\"noopener\" title=\"Source 29\">29<\/a>; Vetnique bought Lintbells/YuMOVE <a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-food-market/article/15710718/pet-industry-mas-set-to-surge-in-2025\" target=\"_blank\" rel=\"noopener\" title=\"Source 30\">30<\/a>; Zesty Paws grew 12.8% in 2025 on e-commerce <a class=\"cite\" href=\"https://www.hh.global/news/h-and-h-reports-growth-in-2025-annual-results\" target=\"_blank\" rel=\"noopener\" title=\"Source 27\">27<\/a>. L.E.K.: \"There's tension between being really good brand, but having less clinical positioning.\" <a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a> Claims must be substantiated at placing on the market under 767/2009 Art. 13 <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02009R0767-20181226\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a>; NASC seal requires third-party audit <a class=\"cite\" href=\"https://nasc.cc/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>.<\/p>", "first": "<p>Pick three European DTC joint brands and offer a paid claim-substantiation and formulation workshop; map which of them already buy Hydro-P Premium or Petagile.<\/p>", "magnitude": "<p>Not sizeable from public data; M&amp;A count fell from 22 deals (2021) to 7 (2025), so brands are now competing on substance rather than exits <a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>.<\/p>", "tension": "<p>The loser sells powder to pet-food plants and leaves the claim to the brand. The winner notices that DTC and PE-backed brands (PetLab Co, Zesty Paws, Fera, YuMOVE) are built on marketing and have \"less clinical positioning\" (Lauren DeVestern, L.E.K.), so they will pay for a supplier that brings the trial, the label-safe claim and the NASC-compliant dossier.<\/p>", "uncertainties": "<p>Whether brands will accept a branded ingredient (as Nutramax never did with collagen); whether Rousselot's applications lab can formulate soft chews (40 to 50% of formats <a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>); how this sits with Sonac's existing pet-food customer relationships.<\/p>"}, "name": "from ingredient seller to formulation and substantiation partner for pet brands", "other": [], "rank": 2, "shortName": "Evidence and formulation partner for pet brands", "soWhat": "Fast-growing online pet brands lean on marketing more than clinical backing. They may pay a supplier that brings the trial, a compliant claim and an audit-ready dossier.", "threshold": "Ingredients to Ecosystems", "updatedAt": "2026-10-01", "verdict": "Promising"}, {"area": "R5", "arena": "Animal and vet health", "cell": "Premium human-grade tier", "fields": {"evidence": "<p>97% of US owners call pets family and 78% seek products for long-term vitality (Cascadia) <a class=\"cite\" href=\"https://www.petfoodindustry.com/pet-supplements-pro/pet-supplements-and-treats-digest/news/15829540/healthspan-focus-drives-pet-supplements-growth-report-finds\" target=\"_blank\" rel=\"noopener\" title=\"Source 26\">26<\/a>; Packaged Facts: functional foods and treats are taking share from supplements <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>; Rousselot already produces porcine, bovine and fish peptides at Ghent and Angouleme <a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/13995-darling-ingredients-expanding-collagen-peptide-production-in-belgium-brazil\" target=\"_blank\" rel=\"noopener\" title=\"Source 50\">50<\/a>.<\/p>", "first": "<p>Price a Peptan-based soft chew bill of materials against Zesty Paws and Dasuquin; check with a feed-law counsel what \"human-grade\" may say on an EU pet label.<\/p>", "magnitude": "<p>Treats are 24% of European dog food value <a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/19391-fediaf-thriving-pet-ownership-fuels-337-billion-european-pet-food-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>; US supplements USD 2.9bn <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a>. Human-grade tier share not sizeable from public data.<\/p>", "tension": "<p>The loser assumes pet owners will not pay human-ingredient prices for a dog. The winner reads the shelf: Dasuquin at USD 0.79 per chew, Advance Articular Care at EUR 6.54/kg with 2.5% hydrolysed collagen, treats at 24% of dog food value on 9% of volume <a class=\"cite\" href=\"https://www.chewy.com/nutramax-dasuquin-joint-health/dp/1064230\" target=\"_blank\" rel=\"noopener\" title=\"Source 37\">37<\/a><a class=\"cite\" href=\"https://www.zooplus.com/shop/dogs/dry_dog_food/advance_vet_diets/1583029\" target=\"_blank\" rel=\"noopener\" title=\"Source 48\">48<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/19391-fediaf-thriving-pet-ownership-fuels-337-billion-european-pet-food-industry\" target=\"_blank\" rel=\"noopener\" title=\"Source 47\">47<\/a>.<\/p>", "uncertainties": "<p>Whether \"human-grade\" is a permitted or meaningful claim under feed law; raw material cost gap versus Sonac's by-product streams; whether the Upcycled Certified story carries in pet.<\/p>"}, "name": "Peptan or Colartix into pet supplements and treats at human-grade cost", "other": [], "rank": 3, "shortName": "Human-grade collagen in pet chews and treats", "soWhat": "Owners pay premium prices: treats are 24% of European dog food value on 9% of volume. Whether \"human-grade\" is an allowed claim under feed law is still unclear.", "threshold": null, "updatedAt": "2026-10-01", "verdict": "Test first"}, {"area": "R5", "arena": null, "cell": "", "fields": {"evidence": "<p>Cosequin and Petagile both cover horses; NASC covers dogs, cats, horses <a class=\"cite\" href=\"https://www.cosequin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a><a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/15731-gelita-to-showcase-protein-collagen-ingredients-at-interzoo\" target=\"_blank\" rel=\"noopener\" title=\"Source 19\">19<\/a><a class=\"cite\" href=\"https://nasc.cc/\" target=\"_blank\" rel=\"noopener\" title=\"Source 41\">41<\/a>; cats take 21% of US supplement sales, dogs 77% <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a>; 2020/354 entry 27 has separate feline criteria (DHA, methionine, manganese) <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02020R0354-20250422\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>.<\/p>", "first": "<p>Desk review of equine joint supplement labels in the UK and Germany to see whether collagen appears; no spend before space 1 is resolved.<\/p>", "magnitude": "<p>Not sizeable from public data for equine; feline supplements roughly USD 0.6bn in the US on the 21% share <a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15819954/report-pet-supplement-sales-near-3b-as-growth-moderates\" target=\"_blank\" rel=\"noopener\" title=\"Source 22\">22<\/a><a class=\"cite\" href=\"https://www.petfoodindustry.com/nutrition/pet-food-additives-supplements/news/15684592/us-pet-supplement-market-surpasses-27b-driven-by-health-and-wellness-trends\" target=\"_blank\" rel=\"noopener\" title=\"Source 24\">24<\/a>.<\/p>", "tension": "<p>The loser treats pets as dogs. The winner sees horses as a high-value, owner-paid, NASC-covered joint market and cats as the under-served species (21% of supplement sales, flagged by Packaged Facts as \"a key area of opportunity\").<\/p>", "uncertainties": "<p>Palatability of collagen for cats; equine dosing economics at 500 kg body weight. Whether a joint story sells to cat owners at all: digestive health leads cat supplement demand (46% of cat parents look to food for gut benefits, Cargill 2024) and feline claims are usually substantiated with dog studies <a href=\"https://www.petfoodindustry.com/pet-supplements-pro/pet-supplements-and-treats-digest/article/15835586/top-10-trends-shaping-cat-supplement-product-development\" target=\"_blank\" rel=\"noopener\">Petfood Industry, 2 Oct 2026<\/a>.<\/p>"}, "lastChange": "Add to R5-4 uncertainties that cat supplement demand is digestive-led and feline evidence borrows from dogs (accepted 2026-10-07)", "name": "Equine and feline extensions of the joint story", "other": [], "rank": 4, "shortName": "Horses and cats as next joint markets", "soWhat": "Cats take 21% of US supplement sales and are under-served; horses are an owner-paid joint market. We suggest no spend until the dog opportunity is resolved.", "threshold": null, "updatedAt": "2026-10-07", "verdict": "Hold"}, {"area": "R5", "arena": "Animal and vet health", "cell": "", "fields": {"tension": "<p>No pet-specific supply-shock signal was found beyond the trade issues already covered in E5; livestock (calf, piglet) and aquaculture collagen use produced no credible public signal in this scan. Suggest keeping dormant.<\/p>\n<p>Across all five, the differences from human health are consistent: the claim is a feed claim with no EFSA-style health-claim prize <a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02009R0767-20181226\" target=\"_blank\" rel=\"noopener\" title=\"Source 44\">44<\/a><a class=\"cite\" href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02020R0354-20250422\" target=\"_blank\" rel=\"noopener\" title=\"Source 43\">43<\/a>; the veterinarian, not the consumer, is the recommender that makes a brand <a class=\"cite\" href=\"https://www.dasuquin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 36\">36<\/a><a class=\"cite\" href=\"https://www.cosequin.com/\" target=\"_blank\" rel=\"noopener\" title=\"Source 38\">38<\/a>; dose is weight-based and, at 240 mg/kg in the one published trial <a class=\"cite\" href=\"https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0308378\" target=\"_blank\" rel=\"noopener\" title=\"Source 16\">16<\/a>, roughly 15 times the per-kilo intake of a 1 g human dose (about 3 times that of a 5 g dose; Limineer calculation); the format is a chew or kibble inclusion, not a capsule or shot <a class=\"cite\" href=\"https://www.petfoodprocessing.net/articles/20546-nasc-conference-report-trends-fueling-pet-supplement-growth\" target=\"_blank\" rel=\"noopener\" title=\"Source 25\">25<\/a>; and the US regime is about to change shape <a class=\"cite\" href=\"https://www.nutraingredients.com/Article/2026/06/08/nasc-pushes-animal-health-supplement-act-to-modernize-oversight/\" target=\"_blank\" rel=\"noopener\" title=\"Source 39\">39<\/a>.<\/p>"}, "name": "Animal and vet health x Volatile shock-prone world", "other": [], "rank": 5, "shortName": "Supply shocks in animal collagen", "soWhat": "No pet-specific supply shock was found, and livestock and fish farming collagen showed no credible signal. Suggest keeping dormant.", "threshold": "Stable inputs to Volatile world", "updatedAt": "2026-10-01", "verdict": "Park"}], "sources": [{"n": 1, "text": "Rousselot's collagen peptides target GLP-1 boosters and companion products, Nutrition Insight, 2026, https://www.nutritioninsight.com/news/rousselot-collagen-peptides-glp1-companion-products.html (confirmed no pet content)", "url": "https://www.nutritioninsight.com/news/rousselot-collagen-peptides-glp1-companion-products.html"}, {"n": 2, "text": "Peptan collagen peptides, Rousselot (Darling Ingredients), accessed 1 Oct 2026, https://www.darlingii.com/rousselot/brands/peptan", "url": "https://www.darlingii.com/rousselot/brands/peptan"}, {"n": 3, "text": "Colartix for joint health, Rousselot (Darling Ingredients), accessed 1 Oct 2026, https://www.darlingii.com/rousselot/brands/colartix", "url": "https://www.darlingii.com/rousselot/brands/colartix"}, {"n": 4, "text": "Peptan for mobility, peptan.com, accessed 1 Oct 2026, https://peptan.com/keep-mobile", "url": "https://peptan.com/keep-mobile"}, {"n": 5, "text": "Rousselot secures global patents for joint health ingredient Colartix, Nutrition Insight, 2 Sep 2025, https://www.nutritioninsight.com/news/rousselot-joint-health-patents-granted.html", "url": "https://www.nutritioninsight.com/news/rousselot-joint-health-patents-granted.html"}, {"n": 6, "text": "Darling Ingredients Inc., Form 10-K for the fiscal year ended 3 January 2026, https://d18rn0p25nwr6d.cloudfront.net/CIK-0000916540/97f259dc-d3c0-40b5-bb65-98f842f835e7.pdf", "url": "https://d18rn0p25nwr6d.cloudfront.net/CIK-0000916540/97f259dc-d3c0-40b5-bb65-98f842f835e7.pdf"}, {"n": 7, "text": "Darling Ingredients and Tessenderlo Group agree to form new company, Darling Ingredients, 12 May 2025, https
